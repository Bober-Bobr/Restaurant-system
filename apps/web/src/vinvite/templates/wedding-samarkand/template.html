<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation</title>
<!--__CONFIG__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,200;0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   SAMARKAND — an Eastern wedding by lantern light
   --------------------------------------------------------------------------
   Identity : palace night — plum and burgundy, ruby and terracotta, lantern
              amber, ivory and gold. A khatam (eight-point star) signs every
              seam and draws itself as it arrives.
   Motion   : the page opens in darkness and is LIT OUTWARD from the flame ·
              the hero film hands the eye to the title, which lands letter by
              letter · silk curtains part over each plate · the date plaque's
              two ornate shutters swing back · a sticky, scroll-driven descent
              carries the guest through six garden scenes · a lantern rail
              catches light as they go · petals, gold dust and ribbon drift.
   Contract : window.__CONFIG__ / __LANGS__ / __ORIGIN__ / __CONTACTS__ arrive
              in <head>; live edits by postMessage; RSVP posts to the parent.
   Assets   : bundled in apps/web/public/samarkand/ and addressed through
              __ORIGIN__ — the page runs on the opaque about:srcdoc origin and
              cannot resolve a relative URL.
   ========================================================================== */
:root{
  --night:#120A10;
  --night-2:#1C0F18;
  --plum:#2A1622;
  --burgundy:#6B1B2A;
  --ruby:#A32335;
  --terracotta:#C2643F;
  --amber:#E39A3B;
  --ivory:#F2E4CE;
  --ivory-dim:rgba(242,228,206,.62);
  --gold:#C9A227;
  --gold-lt:#E8CE8A;

  --display:"Amiri","Palatino Linotype",Palatino,serif;
  --body:"Spectral",Georgia,serif;
  --util:"Jost","Futura",-apple-system,"Segoe UI",sans-serif;

  --gutter:clamp(20px,5vw,80px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--night);color:var(--ivory);
  font-family:var(--body);font-weight:300;
  font-size:clamp(16px,1vw + 13px,19px);line-height:1.78;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body.is-locked{overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-lt);outline-offset:4px}

h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;margin:0}
p{margin:0 0 1em}

/* Switched off in the builder, or empty of content. */
.opt-off,.card-off,.hidden{display:none !important}

.eyebrow{
  font-family:var(--util);font-weight:400;
  font-size:clamp(10px,.32vw + 9px,12px);
  letter-spacing:.46em;text-transform:uppercase;color:var(--gold);margin:0 0 1.5em;
}
.wrap{max-width:1180px;margin:0 auto;padding-inline:var(--gutter)}
.center{text-align:center}
.pad{padding-block:clamp(90px,14vw,190px)}
section{position:relative}

/* ============================================================
   KHATAM — the eight-point star, this page's signature
   ============================================================ */
.khatam{display:block;width:clamp(46px,6vw,74px);height:auto;margin:0 auto;color:var(--gold)}
.khatam path,.khatam circle{fill:none;stroke:currentColor;stroke-width:1.1;vector-effect:non-scaling-stroke}
/* The pattern draws itself when it enters view. Without a measurable path
   length the dashes are dropped and it simply appears drawn — see
   measureOrnament(). */
.khatam--draw path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  transition:stroke-dashoffset 2.4s var(--ease)}
.khatam--draw.in path{stroke-dashoffset:0}

.hairline{width:min(100%,300px);height:1px;margin:2.4rem auto;
  background:linear-gradient(90deg,transparent,var(--gold) 26%,var(--gold) 74%,transparent);opacity:.5}

#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* Lifted over the reply modal for the burst that answers a yes, which would
   otherwise be drawn behind its backdrop. */
#dust.on-top{z-index:160}

/* ============================================================
   LANTERN RAIL — scroll progress as lanterns catching light
   ============================================================ */
.rail{
  position:fixed;top:50%;right:clamp(10px,2vw,26px);transform:translateY(-50%);
  z-index:70;display:flex;flex-direction:column;gap:clamp(12px,2.2vh,22px);
  opacity:0;transition:opacity 1s var(--ease-soft);
}
.rail.on{opacity:1}
.rail__lamp{
  width:12px;height:18px;position:relative;color:rgba(242,228,206,.16);
  transition:color .7s var(--ease-soft);cursor:pointer;
  background:none;padding:0;display:block;
}
.rail__lamp svg{width:100%;height:100%;display:block}
.rail__lamp path{fill:none;stroke:currentColor;stroke-width:1.3}
.rail__lamp::after{
  content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;
  transform:translate(-50%,-50%) scale(.4);border-radius:50%;
  background:radial-gradient(circle,rgba(227,154,59,.55),transparent 68%);
  opacity:0;transition:opacity .8s var(--ease-soft),transform .8s var(--ease);pointer-events:none;
}
.rail__lamp.lit{color:var(--gold-lt)}
.rail__lamp.lit::after{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:720px){.rail{display:none}}

/* ============================================================
   1 · THE LANTERN OPENING
   ============================================================ */
.open{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:#000;display:grid;place-items:center}
.open__media{position:absolute;inset:0}
.open__media video,.open__media img{width:100%;height:100%;object-fit:cover}
.open__poster{position:absolute;inset:0;transition:opacity 1.4s var(--ease-soft)}
.open.video-ready .open__poster{opacity:0}
/* With no film — reduced motion, or a metered connection — the still breathes
   instead, so the opening is never a frozen frame. */
.open.still .open__poster{animation:breathe 22s var(--ease-soft) forwards}
@keyframes breathe{from{transform:scale(1.1)}to{transform:scale(1)}}

/* the page begins in darkness and is illuminated outward from the flame */
.open__dark{
  position:absolute;inset:0;z-index:2;background:#000;
  clip-path:circle(120% at 50% 50%);
  transition:clip-path 3.4s var(--ease-soft),opacity 2s var(--ease-soft);
}
.open.lighting .open__dark{clip-path:circle(0% at 50% 46%);opacity:0}
.open__vig{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(115% 88% at 50% 46%,transparent 12%,rgba(18,10,16,.42) 52%,rgba(18,10,16,.93) 100%)}
.open__glow{
  position:absolute;left:50%;top:46%;width:64vmax;height:64vmax;z-index:3;
  transform:translate(-50%,-50%) scale(.25);
  background:radial-gradient(circle,rgba(227,154,59,.5),rgba(227,154,59,.1) 40%,transparent 66%);
  opacity:0;mix-blend-mode:screen;pointer-events:none;
  transition:opacity 2.6s var(--ease-soft),transform 5s var(--ease);
}
.open.arrived .open__glow{opacity:1;transform:translate(-50%,-50%) scale(1)}

.open__inner{position:relative;z-index:4;text-align:center;padding-inline:var(--gutter);width:100%}
.open__kicker{
  font-family:var(--util);font-size:clamp(10px,.4vw + 9px,12px);
  letter-spacing:.56em;text-transform:uppercase;color:var(--gold);
  margin:0 0 clamp(20px,3.4vw,34px);opacity:0;transform:translateY(12px);
  transition:opacity 1.4s var(--ease-soft),transform 1.4s var(--ease);
}
/* The floor was above the vw term on every phone, which stopped the clamp
   scaling exactly where it was needed and broke a long name across two lines. */
.open__names{font-family:var(--display);font-size:clamp(34px,11vw,140px);line-height:1;margin:0;color:var(--ivory)}
.open__names .amp{
  display:block;font-family:var(--display);font-style:italic;
  font-size:clamp(19px,3vw,38px);color:var(--gold-lt);margin:clamp(8px,1.4vw,18px) 0;
}
.open__names .ch{
  display:inline-block;opacity:0;transform:translateY(30px);filter:blur(12px);
  transition:opacity 1.2s var(--ease-soft),transform 1.3s var(--ease),filter 1.2s var(--ease-soft);
}
.open__meta{
  margin:clamp(26px,4vw,44px) 0 0;font-family:var(--util);font-weight:300;
  font-size:clamp(11px,.45vw + 10px,13px);letter-spacing:.4em;text-transform:uppercase;
  color:var(--ivory-dim);opacity:0;transform:translateY(12px);
  transition:opacity 1.4s var(--ease-soft),transform 1.4s var(--ease);
}
.open.arrived .open__kicker,.open.arrived .open__meta{opacity:1;transform:none}
.open.arrived .open__names .ch{opacity:1;transform:none;filter:blur(0)}
.open__hem{position:absolute;left:0;right:0;bottom:-1px;height:clamp(80px,13vh,170px);z-index:5;
  background:linear-gradient(transparent,var(--night));pointer-events:none}
.skip{
  position:absolute;right:var(--gutter);top:clamp(18px,3vh,32px);z-index:6;
  font-family:var(--util);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ivory-dim);padding:9px 15px;border:1px solid rgba(201,162,39,.4);border-radius:2px;
  transition:.4s var(--ease-soft);
}
.skip:hover{color:var(--ivory);border-color:var(--gold-lt)}
.open.arrived .skip{opacity:0;pointer-events:none}
@media (max-width:640px){.open__media video,.open__media img{object-position:50% 44%}}

/* ============================================================
   SILK CURTAIN REVEAL — plates part like hung fabric
   ============================================================ */
.silk{position:relative;overflow:hidden}
.silk__panel{position:absolute;top:0;bottom:0;width:51%;z-index:6;pointer-events:none;
  transition:transform 1.7s var(--ease)}
.silk__panel--l{left:0;background:linear-gradient(100deg,var(--burgundy),var(--plum) 70%)}
.silk__panel--r{right:0;background:linear-gradient(260deg,var(--burgundy),var(--plum) 70%)}
.silk__panel::after{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(94deg,rgba(0,0,0,.28) 0 14px,rgba(232,206,138,.08) 14px 30px)}
.silk.in .silk__panel--l{transform:translateX(-101%)}
.silk.in .silk__panel--r{transform:translateX(101%)}

.reveal{opacity:0;transform:translateY(30px);transition:opacity 1.2s var(--ease-soft),transform 1.3s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ============================================================
   2 · THRESHOLD
   ============================================================ */
.thresh{height:clamp(440px,84vh,880px);height:clamp(440px,84svh,880px);overflow:hidden;background:var(--night)}
.thresh__bg{position:absolute;inset:-8%;will-change:transform}
.thresh__bg img{width:100%;height:100%;object-fit:cover;object-position:50% 46%}
.thresh__top{position:absolute;left:0;right:0;top:-1px;height:34%;z-index:2;
  background:linear-gradient(var(--night),transparent);pointer-events:none}
.thresh__hem{position:absolute;left:0;right:0;bottom:-1px;height:40%;z-index:2;
  background:linear-gradient(transparent,var(--night));pointer-events:none}
.thresh__cap{position:absolute;left:0;right:0;bottom:clamp(50px,11vh,110px);z-index:3;text-align:center;
  padding-inline:var(--gutter);font-family:var(--display);font-style:italic;
  font-size:clamp(20px,2.6vw,34px);color:var(--ivory)}

/* ============================================================
   3 · INVITATION
   ============================================================ */
.invite{text-align:center;overflow:hidden}
.invite__bg{position:absolute;inset:-8%;z-index:0;opacity:.30;will-change:transform}
.invite__bg img{width:100%;height:100%;object-fit:cover}
.invite__wash{position:absolute;inset:0;z-index:1;
  background:radial-gradient(80% 70% at 50% 46%,rgba(18,10,16,.66),var(--night) 78%)}
.invite__in{position:relative;z-index:2}
.invite__title{font-size:clamp(32px,5.2vw,70px);margin-bottom:.5em;color:var(--ivory)}
.invite__title .names{display:block;margin-top:.2em}
.invite__lede{font-family:var(--body);font-style:italic;font-weight:200;
  font-size:clamp(18px,1.4vw + 13px,26px);color:var(--ivory-dim);max-width:32ch;margin:0 auto 2em;line-height:1.68}
.invite__date{font-family:var(--util);font-weight:300;font-size:clamp(11px,.5vw + 10px,14px);
  letter-spacing:.44em;text-transform:uppercase;color:var(--gold)}

/* ============================================================
   4 · THE COUPLE — silk-layered plates, alternating
   ============================================================ */
.couple{background:var(--night-2)}
.couple__row{display:grid;grid-template-columns:1fr;gap:clamp(26px,4vw,64px);align-items:center;
  margin-top:clamp(46px,7vw,104px)}
@media (min-width:920px){
  .couple__row{grid-template-columns:1.05fr .95fr}
  .couple__row:nth-of-type(even) .couple__plate{order:2}
}
.couple__plate{position:relative;overflow:hidden;aspect-ratio:4/3;margin:0;
  box-shadow:0 40px 90px -50px #000}
.couple__plate img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;will-change:transform}
.couple__plate::after{content:"";position:absolute;inset:10px;z-index:7;pointer-events:none;
  border:1px solid rgba(201,162,39,.42)}
.couple__copy h3{font-size:clamp(25px,3.2vw,42px);margin-bottom:.55em;color:var(--ivory)}
.couple__copy p{color:var(--ivory-dim);max-width:42ch}

/* ============================================================
   5 · THE DATE PLAQUE — ceremonial panels, not a calendar
   ============================================================ */
.date{background:var(--night);overflow:hidden}
.plaque{
  position:relative;max-width:600px;margin:clamp(40px,6vw,70px) auto 0;
  aspect-ratio:4/5;perspective:1600px;
}
.plaque__face{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  background:
    radial-gradient(70% 60% at 50% 40%,rgba(107,27,42,.5),transparent 70%),
    linear-gradient(var(--plum),var(--night-2));
  border:1px solid rgba(201,162,39,.45);
  padding:clamp(24px,5vw,52px);
}
.plaque__face::before{
  content:"";position:absolute;inset:11px;border:1px solid rgba(201,162,39,.24);pointer-events:none;
}
.plaque__day{font-family:var(--display);font-size:clamp(72px,17vw,168px);line-height:.9;color:var(--gold-lt);
  opacity:0;transform:scale(.72);transition:opacity 1s var(--ease-soft) .75s,transform 1.3s var(--ease) .75s}
.plaque__mon{font-family:var(--display);font-size:clamp(22px,3.2vw,38px);color:var(--ivory);
  margin-top:.25em;opacity:0;transform:translateY(14px);
  transition:opacity 1s var(--ease-soft) .95s,transform 1s var(--ease) .95s}
.plaque__yr{font-family:var(--util);font-weight:300;font-size:clamp(10px,.4vw + 9px,12px);
  letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin-top:1.5em;
  opacity:0;transition:opacity 1.1s var(--ease-soft) 1.15s}
.plaque__sub{font-family:var(--body);font-style:italic;font-weight:200;color:var(--ivory-dim);
  margin-top:1.4em;font-size:clamp(15px,1vw + 12px,19px);
  opacity:0;transition:opacity 1.1s var(--ease-soft) 1.35s}
.plaque.open .plaque__day,.plaque.open .plaque__mon{opacity:1;transform:none}
.plaque.open .plaque__yr,.plaque.open .plaque__sub{opacity:1}

/* the two ornate shutters that swing back */
.plaque__leaf{
  position:absolute;top:0;bottom:0;width:50.4%;z-index:4;
  background:linear-gradient(var(--burgundy),#4A1220);
  transition:transform 1.9s var(--ease),opacity 1.6s var(--ease-soft);
  backface-visibility:hidden;
}
.plaque__leaf svg{position:absolute;inset:0;width:100%;height:100%;color:var(--gold-lt);opacity:.6}
.plaque__leaf svg path,.plaque__leaf svg circle{fill:none;stroke:currentColor;stroke-width:1}
.plaque__leaf--l{left:0;transform-origin:left center}
.plaque__leaf--r{right:0;transform-origin:right center}
.plaque__leaf--r svg{transform:scaleX(-1)}
.plaque.open .plaque__leaf--l{transform:rotateY(-104deg)}
.plaque.open .plaque__leaf--r{transform:rotateY(104deg)}
.plaque__seam{position:absolute;left:50%;top:0;bottom:0;width:1px;z-index:5;
  background:linear-gradient(transparent,var(--gold-lt),transparent);opacity:.85;
  transition:opacity .6s var(--ease-soft)}
.plaque.open .plaque__seam{opacity:0}

/* ============================================================
   6 · DETAILS — mosaic panels
   ============================================================ */
.det{background:var(--night-2);overflow:hidden}
.det__grid{display:grid;grid-template-columns:1fr;gap:1px;margin-top:clamp(40px,6vw,72px);
  background:rgba(201,162,39,.22);border:1px solid rgba(201,162,39,.22)}
@media (min-width:700px){.det__grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.det__grid{grid-template-columns:repeat(3,1fr)}}
.det__cell{
  position:relative;background:var(--night);padding:clamp(26px,3.4vw,44px);
  transition:background .6s var(--ease-soft);overflow:hidden;
}
.det__cell::before{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease-soft);
  background:radial-gradient(90% 80% at 50% 0%,rgba(107,27,42,.5),transparent 72%);
}
.det__cell:hover::before{opacity:1}
.det__cell dt{font-family:var(--util);font-size:clamp(9px,.35vw + 8px,11px);letter-spacing:.4em;
  text-transform:uppercase;color:var(--gold);margin-bottom:1em}
.det__cell dd{margin:0;font-family:var(--display);font-size:clamp(19px,1.2vw + 14px,25px);
  line-height:1.4;color:var(--ivory)}
.det__cell dd small{display:block;font-family:var(--body);font-weight:300;font-size:14px;
  color:var(--ivory-dim);margin-top:.75em;line-height:1.7}
.det__star{position:absolute;right:14px;top:14px;width:22px;color:var(--gold);opacity:.28}
.det__star path{fill:none;stroke:currentColor;stroke-width:1.2}

.prog{margin-top:clamp(44px,6vw,80px);border-top:1px solid rgba(201,162,39,.24);padding-top:clamp(30px,4vw,52px)}
.prog__row{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,36px);align-items:baseline;
  padding:1em 0;border-bottom:1px solid rgba(201,162,39,.12)}
.prog__row:last-child{border-bottom:0}
.prog__t{font-family:var(--util);font-size:13px;letter-spacing:.2em;color:var(--gold);white-space:nowrap}
.prog__w{font-size:clamp(16px,1vw + 12px,19px);color:var(--ivory)}

/* ============================================================
   7 · GARDEN JOURNEY — sticky, scroll-driven descent
   ============================================================ */
.journey{position:relative;background:var(--night)}
.journey__sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.journey__scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.journey__scene img{width:100%;height:100%;object-fit:cover}
.journey__scene::after{content:"";position:absolute;inset:0;
  background:radial-gradient(105% 80% at 50% 50%,transparent 20%,rgba(18,10,16,.5) 62%,rgba(18,10,16,.92) 100%)}
.journey__cap{
  position:absolute;left:0;right:0;bottom:clamp(70px,16vh,150px);z-index:5;text-align:center;
  padding-inline:var(--gutter);pointer-events:none;
}
.journey__cap p{
  font-family:var(--display);font-size:clamp(22px,3.4vw,46px);color:var(--ivory);
  margin:0;opacity:0;transform:translateY(16px);
  transition:opacity .8s var(--ease-soft),transform .9s var(--ease);
  text-shadow:0 2px 40px rgba(18,10,16,.9);
}
.journey__cap p.on{opacity:1;transform:none}
.journey__hint{
  position:absolute;left:50%;bottom:clamp(24px,5vh,50px);transform:translateX(-50%);z-index:6;
  font-family:var(--util);font-size:10px;letter-spacing:.36em;text-transform:uppercase;
  color:rgba(242,228,206,.42);
}

/* ============================================================
   8 · FINAL PALACE
   ============================================================ */
.final{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden;text-align:center}
.final__bg{position:absolute;inset:-8%;will-change:transform}
.final__bg img{width:100%;height:100%;object-fit:cover}
.final__wash{position:absolute;inset:0;
  background:radial-gradient(100% 80% at 50% 60%,rgba(18,10,16,.42),rgba(18,10,16,.86))}
.final__in{position:relative;z-index:3;padding:clamp(70px,12vh,130px) var(--gutter)}
.final h2{font-size:clamp(30px,5vw,68px);margin-bottom:.5em;color:var(--ivory)}
.final__msg{font-style:italic;font-weight:200;font-size:clamp(18px,1.4vw + 13px,26px);
  max-width:28ch;margin:0 auto 2em;color:var(--ivory-dim)}
.final__date{font-family:var(--util);font-weight:300;font-size:clamp(11px,.45vw + 9px,13px);
  letter-spacing:.44em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:2.6em}
.rsvp-btn{
  position:relative;display:inline-block;padding:clamp(16px,2vw,22px) clamp(38px,5.5vw,70px);
  font-family:var(--util);font-size:clamp(11px,.4vw + 10px,13px);letter-spacing:.38em;
  text-transform:uppercase;color:var(--ivory);border:1px solid var(--gold);overflow:hidden;
  transition:color .6s var(--ease-soft);
}
.rsvp-btn span{position:relative;z-index:2}
.rsvp-btn::before{content:"";position:absolute;inset:0;background:var(--gold);
  transform:scaleY(0);transform-origin:bottom;transition:transform .6s var(--ease)}
.rsvp-btn:hover{color:var(--night)}
.rsvp-btn:hover::before{transform:scaleY(1)}

/* ============================================================
   RSVP — light opens from a single point, like the lantern
   ============================================================ */
/* Above the language bar and the music button (z 130), both fixed, which would
   otherwise float over the reply card. */
.modal{position:fixed;inset:0;z-index:150;display:none}
.modal.open{display:block}
.modal__bg{position:absolute;inset:0;background:rgba(9,5,8,.94);opacity:0;
  transition:opacity .8s var(--ease-soft);backdrop-filter:blur(6px)}
.modal.shown .modal__bg{opacity:1}
.modal__iris{
  position:absolute;inset:0;z-index:2;background:#000;
  clip-path:circle(0% at 50% 50%);transition:clip-path 1.2s var(--ease)}
.modal.shown .modal__iris{clip-path:circle(150% at 50% 50%);background:transparent}
.modal__panel{
  position:relative;z-index:3;height:100%;overflow-y:auto;
  /* `safe` matters on a phone: once the keyboard is up the card is taller than
     the panel, and plain centring pushes its top edge above the scrollable
     area, where it can never be reached. */
  display:grid;place-items:center;place-content:safe center;
  overscroll-behavior:contain;
  padding:clamp(28px,6vw,60px) var(--gutter);
}
.modal__card{
  width:min(540px,100%);position:relative;padding:clamp(30px,5vw,56px);
  background:linear-gradient(var(--plum),var(--night-2));
  border:1px solid rgba(201,162,39,.45);
  opacity:0;transform:scale(.94);transition:opacity .9s var(--ease-soft) .45s,transform 1s var(--ease) .45s;
}
.modal.shown .modal__card{opacity:1;transform:none}
.modal__card::after{content:"";position:absolute;inset:10px;border:1px solid rgba(201,162,39,.2);pointer-events:none}
.modal__card h3{font-size:clamp(25px,3.2vw,38px);text-align:center;margin-bottom:.4em;color:var(--ivory)}
.modal__card .sub{text-align:center;font-style:italic;font-weight:200;color:var(--ivory-dim);margin-bottom:2em}
.field{margin-bottom:1.5rem;position:relative;z-index:2}
.field label,.field .lbl{display:block;font-family:var(--util);font-size:10px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--gold);margin-bottom:.75em}
.field input,.field select,.field textarea{
  width:100%;padding:.85em .2em;font:inherit;font-size:16px;color:var(--ivory);
  background:transparent;border:0;border-bottom:1px solid rgba(201,162,39,.45);border-radius:0;
  transition:border-color .4s var(--ease-soft);
}
.field select option{background:var(--plum);color:var(--ivory)}
.field textarea{resize:vertical;min-height:72px}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-bottom-color:var(--gold-lt)}
.field.invalid input{border-bottom-color:var(--ruby)}
.field .row{display:flex;gap:12px;flex-wrap:wrap}
.chip{flex:1 1 0;min-width:126px;padding:.85em 1em;text-align:center;
  border:1px solid rgba(201,162,39,.45);font-family:var(--util);font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;transition:.4s var(--ease-soft)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--night)}
.submit{width:100%;margin-top:.6rem;padding:1.15em;background:var(--burgundy);color:var(--ivory);
  font-family:var(--util);font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  border:1px solid rgba(201,162,39,.4);transition:.45s var(--ease-soft)}
.submit:hover{background:var(--ruby)}
.submit[disabled]{opacity:.6}
.err{display:none;margin:.9rem 0 0;text-align:center;font-size:14px;color:var(--ruby)}
.err.show{display:block}
.modal__close{position:absolute;top:clamp(16px,3vh,28px);right:var(--gutter);z-index:5;
  width:44px;height:44px;color:var(--ivory);border:1px solid rgba(201,162,39,.4);
  display:grid;place-items:center;font-size:20px;line-height:1;opacity:0;
  transition:opacity .6s var(--ease-soft) .8s}
.modal.shown .modal__close{opacity:1}
.thanks{text-align:center;display:none}
.thanks.on{display:block}
.modal__card form.gone{display:none}

footer.sign{background:#0C060A;color:rgba(242,228,206,.5);text-align:center;padding:clamp(50px,7vw,84px) var(--gutter)}
footer.sign .khatam{margin-bottom:1.6rem;opacity:.7}
footer.sign p{font-family:var(--util);font-weight:300;font-size:11px;letter-spacing:.34em;text-transform:uppercase;margin:0}

/* ── Shared chrome: language bar, music, platform credit ── */
#langbar{position:fixed;top:14px;left:14px;z-index:130;display:flex;gap:6px}
#langbar button{
  padding:6px 11px;border-radius:2px;
  font-family:var(--util);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ivory-dim);background:rgba(18,10,16,.6);
  border:1px solid rgba(201,162,39,.34);backdrop-filter:blur(6px);
  transition:.35s var(--ease-soft);
}
#langbar button.active{color:var(--night);background:var(--gold-lt);border-color:var(--gold-lt)}

#music-btn{
  position:fixed;right:14px;bottom:14px;z-index:130;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(18,10,16,.62);border:1px solid rgba(201,162,39,.4);backdrop-filter:blur(6px);
}
#music-btn .bars{display:flex;align-items:flex-end;gap:3px;height:15px}
#music-btn .bars span{width:2px;height:5px;background:var(--gold-lt);border-radius:1px}
#music-btn[aria-pressed="true"] .bars span{animation:bar .9s var(--ease-soft) infinite alternate}
#music-btn[aria-pressed="true"] .bars span:nth-child(2){animation-delay:.18s}
#music-btn[aria-pressed="true"] .bars span:nth-child(3){animation-delay:.36s}
@keyframes bar{from{height:4px}to{height:15px}}

#vconnect{
  background:#080409;color:rgba(242,228,206,.5);text-align:center;
  padding:1.6rem var(--gutter) 2rem;
  font-family:var(--util);font-weight:300;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
}
#vconnect img{width:34px;height:auto;margin:0 auto .6rem;opacity:.9}
#vcContacts{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:.9rem}
#vcContacts a{display:inline-flex;align-items:center;gap:.35rem;color:var(--gold-lt);text-decoration:none;letter-spacing:.08em;text-transform:none;font-size:12px}
#vcContacts svg{width:14px;height:14px}

/* ============================================================
   NARROW SCREENS
   ------------------------------------------------------------
   The tracked uppercase lines are the problem on a phone: at .46em a
   twenty-character eyebrow is wider than a 360px screen and wraps into a
   ragged block that reads as broken rather than as spacing.
   ============================================================ */
@media (max-width:560px){
  .eyebrow{letter-spacing:.26em}
  .open__kicker{letter-spacing:.28em}
  .open__meta,.final__date,.invite__date{letter-spacing:.22em}
  .skip,.journey__hint{letter-spacing:.22em}
  .det__cell dt{letter-spacing:.24em}
  .plaque__yr{letter-spacing:.3em}
  .rsvp-btn{letter-spacing:.22em;padding-inline:clamp(28px,9vw,48px)}
  .field label,.field .lbl,.chip,.submit{letter-spacing:.18em}
  footer.sign p,#vconnect{letter-spacing:.2em}
  .modal__card{padding:clamp(24px,6vw,34px)}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-iteration-count:1 !important}
  .reveal{opacity:1 !important;transform:none !important}
  .open__names .ch{opacity:1 !important;transform:none !important;filter:none !important}
  .open__kicker,.open__meta{opacity:1 !important;transform:none !important}
  .open__dark{opacity:0 !important;clip-path:circle(0%) !important}
  .silk__panel--l{transform:translateX(-101%) !important}
  .silk__panel--r{transform:translateX(101%) !important}
  .plaque__leaf--l{transform:rotateY(-104deg) !important}
  .plaque__leaf--r{transform:rotateY(104deg) !important}
  .plaque__day,.plaque__mon,.plaque__yr,.plaque__sub{opacity:1 !important;transform:none !important}
  .khatam--draw path{stroke-dashoffset:0 !important}
  .journey__cap p{opacity:1 !important;transform:none !important}
  #dust{display:none}
}
</style>
</head>
<body>

<canvas id="dust" aria-hidden="true"></canvas>

<div id="langbar" class="hidden" aria-label="Language"></div>

<!-- lantern rail: scroll progress as lamps catching light -->
<nav class="rail" id="rail" aria-label="Sections"></nav>

<!-- ============================================================
     1 · THE LANTERN OPENING
     ============================================================ -->
<header class="open" id="hero">
  <div class="open__media">
    <video id="film" muted playsinline preload="metadata"></video>
    <img class="open__poster" id="heroPoster" alt="" data-art>
  </div>
  <div class="open__dark" aria-hidden="true"></div>
  <div class="open__glow" aria-hidden="true"></div>
  <div class="open__vig" aria-hidden="true"></div>

  <button class="skip" id="skip" type="button" data-t="enter"></button>

  <div class="open__inner">
    <p class="open__kicker" data-bind="kicker"></p>
    <h1 class="open__names">
      <span class="split" data-name="bride"></span>
      <span class="amp" data-bind="amp"></span>
      <span class="split" data-name="groom"></span>
    </h1>
    <p class="open__meta" data-bind="heroMeta"></p>
  </div>
  <div class="open__hem" aria-hidden="true"></div>
</header>

<main>

<!-- ============================================================
     2 · THRESHOLD — the courtyard emerges from the lantern light
     ============================================================ -->
<section class="thresh" id="threshold" data-opt="threshold" aria-label="The courtyard">
  <div class="thresh__bg" data-depth="0.10">
    <img loading="eager" decoding="async" data-art data-asset="courtyard.jpg" alt="">
  </div>
  <div class="thresh__top" aria-hidden="true"></div>
  <div class="thresh__hem" aria-hidden="true"></div>
  <p class="thresh__cap reveal" data-bind="thresholdCap"></p>
</section>

<!-- ============================================================
     3 · THE INVITATION
     ============================================================ -->
<section class="invite pad" id="invite" aria-labelledby="inv-h">
  <div class="invite__bg" data-depth="0.06" aria-hidden="true">
    <img loading="lazy" decoding="async" data-art data-asset="arch.jpg" alt="">
  </div>
  <div class="invite__wash" aria-hidden="true"></div>

  <div class="wrap invite__in">
    <svg class="khatam khatam--draw" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 4 L61 28 L86 17 L75 41 L96 50 L75 59 L86 83 L61 72 L50 96 L39 72 L14 83 L25 59 L4 50 L25 41 L14 17 L39 28 Z"/>
      <path d="M50 18 L58 34 L75 26 L67 42 L82 50 L67 58 L75 74 L58 66 L50 82 L42 66 L25 74 L33 58 L18 50 L33 42 L25 26 L42 34 Z"/>
      <circle cx="50" cy="50" r="10"/>
    </svg>

    <p class="eyebrow reveal" style="margin-top:2.2rem" data-t="theInvitation"></p>
    <h2 class="invite__title reveal" id="inv-h">
      <span data-t="marriageOf"></span>
      <span class="names" data-bind="coupleFull"></span>
    </h2>
    <p class="invite__lede reveal" data-bind="inviteLede"></p>
    <div class="hairline reveal" aria-hidden="true"></div>
    <p class="invite__date reveal" data-bind="inviteDate"></p>
  </div>
</section>

<!-- ============================================================
     4 · THE COUPLE — plates behind parting silk
     ============================================================ -->
<section class="couple pad" id="couple" data-opt="couple" aria-labelledby="cpl-h">
  <div class="wrap center">
    <p class="eyebrow reveal" data-bind="storyEyebrow"></p>
    <h2 class="reveal" id="cpl-h" style="font-size:clamp(29px,4.2vw,56px)" data-bind="storyTitle"></h2>
  </div>

  <div class="wrap" id="coupleRows">
    <div class="couple__row" data-hide-empty>
      <figure class="couple__plate silk">
        <img data-depth="0.09" data-art data-asset="corridor.jpg" loading="lazy" decoding="async" alt="">
        <span class="silk__panel silk__panel--l" aria-hidden="true"></span>
        <span class="silk__panel silk__panel--r" aria-hidden="true"></span>
      </figure>
      <div class="couple__copy">
        <h3 class="reveal" data-bind="oneTitle"></h3>
        <p class="reveal" data-bind="oneText"></p>
      </div>
    </div>

    <div class="couple__row" data-hide-empty>
      <figure class="couple__plate silk">
        <img data-depth="0.09" data-art data-asset="suzani.jpg" loading="lazy" decoding="async" alt="">
        <span class="silk__panel silk__panel--l" aria-hidden="true"></span>
        <span class="silk__panel silk__panel--r" aria-hidden="true"></span>
      </figure>
      <div class="couple__copy">
        <h3 class="reveal" data-bind="twoTitle"></h3>
        <p class="reveal" data-bind="twoText"></p>
      </div>
    </div>

    <div class="couple__row" data-hide-empty>
      <figure class="couple__plate silk">
        <img data-depth="0.09" data-art data-asset="rooftop.jpg" loading="lazy" decoding="async" alt="">
        <span class="silk__panel silk__panel--l" aria-hidden="true"></span>
        <span class="silk__panel silk__panel--r" aria-hidden="true"></span>
      </figure>
      <div class="couple__copy">
        <h3 class="reveal" data-bind="threeTitle"></h3>
        <p class="reveal" data-bind="threeText"></p>
      </div>
    </div>
  </div>
</section>

<!-- ============================================================
     5 · THE DATE PLAQUE
     ============================================================ -->
<section class="date pad" id="date" data-opt="date" aria-labelledby="date-h">
  <div class="wrap center">
    <p class="eyebrow reveal" data-t="theDate"></p>
    <h2 class="reveal" id="date-h" style="font-size:clamp(29px,4.2vw,56px)" data-bind="dateTitle"></h2>
  </div>

  <div class="wrap">
    <div class="plaque" id="plaque">
      <div class="plaque__face">
        <div>
          <p class="plaque__day" id="plaqueDay"></p>
          <p class="plaque__mon" id="plaqueMon"></p>
          <p class="plaque__yr" id="plaqueYr"></p>
          <p class="plaque__sub" data-bind="dateNote"></p>
        </div>
      </div>

      <div class="plaque__leaf plaque__leaf--l" aria-hidden="true">
        <svg viewBox="0 0 150 380" preserveAspectRatio="none">
          <path d="M12 12 H138 V368 H12 Z"/>
          <path d="M26 26 H124 V354 H26 Z"/>
          <path d="M75 60 L91 96 L127 80 L111 116 L145 132 L111 148 L127 184 L91 168 L75 204 L59 168 L23 184 L39 148 L5 132 L39 116 L23 80 L59 96 Z"/>
          <circle cx="75" cy="132" r="16"/>
          <path d="M75 230 L88 258 L116 246 L104 274 L130 286 L104 298 L116 326 L88 314 L75 342 L62 314 L34 326 L46 298 L20 286 L46 274 L34 246 L62 258 Z"/>
          <circle cx="75" cy="286" r="12"/>
        </svg>
      </div>
      <div class="plaque__leaf plaque__leaf--r" aria-hidden="true">
        <svg viewBox="0 0 150 380" preserveAspectRatio="none">
          <path d="M12 12 H138 V368 H12 Z"/>
          <path d="M26 26 H124 V354 H26 Z"/>
          <path d="M75 60 L91 96 L127 80 L111 116 L145 132 L111 148 L127 184 L91 168 L75 204 L59 168 L23 184 L39 148 L5 132 L39 116 L23 80 L59 96 Z"/>
          <circle cx="75" cy="132" r="16"/>
          <path d="M75 230 L88 258 L116 246 L104 274 L130 286 L104 298 L116 326 L88 314 L75 342 L62 314 L34 326 L46 298 L20 286 L46 274 L34 246 L62 258 Z"/>
          <circle cx="75" cy="286" r="12"/>
        </svg>
      </div>
      <span class="plaque__seam" aria-hidden="true"></span>
    </div>
  </div>
</section>

<!-- ============================================================
     6 · DETAILS — mosaic panels
     ============================================================ -->
<section class="det pad" id="details" data-opt="details" aria-labelledby="det-h">
  <div class="wrap center">
    <p class="eyebrow reveal" data-t="theDetails"></p>
    <h2 class="reveal" id="det-h" style="font-size:clamp(29px,4.2vw,56px)" data-t="whatToKnow"></h2>
  </div>

  <div class="wrap">
    <dl class="det__grid reveal" id="detailList">
      <div class="det__cell" data-hide-empty>
        <svg class="det__star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L61 29 L86 18 L75 42 L96 50 L75 58 L86 82 L61 71 L50 94 L39 71 L14 82 L25 58 L4 50 L25 42 L14 18 L39 29 Z"/></svg>
        <dt data-t="dDate"></dt>
        <dd><span data-bind="dDate"></span><small data-bind="dDateNote"></small></dd>
      </div>
      <div class="det__cell" data-hide-empty>
        <svg class="det__star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L61 29 L86 18 L75 42 L96 50 L75 58 L86 82 L61 71 L50 94 L39 71 L14 82 L25 58 L4 50 L25 42 L14 18 L39 29 Z"/></svg>
        <dt data-t="dCeremony"></dt>
        <dd><span data-bind="dCeremony"></span><small data-bind="dCeremonyNote"></small></dd>
      </div>
      <div class="det__cell" data-hide-empty>
        <svg class="det__star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L61 29 L86 18 L75 42 L96 50 L75 58 L86 82 L61 71 L50 94 L39 71 L14 82 L25 58 L4 50 L25 42 L14 18 L39 29 Z"/></svg>
        <dt data-t="dReception"></dt>
        <dd><span data-bind="dReception"></span><small data-bind="dReceptionNote"></small></dd>
      </div>
      <div class="det__cell" data-hide-empty>
        <svg class="det__star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L61 29 L86 18 L75 42 L96 50 L75 58 L86 82 L61 71 L50 94 L39 71 L14 82 L25 58 L4 50 L25 42 L14 18 L39 29 Z"/></svg>
        <dt data-t="dDress"></dt>
        <dd><span data-bind="dDress"></span><small data-bind="dDressNote"></small></dd>
      </div>
      <div class="det__cell" data-hide-empty>
        <svg class="det__star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L61 29 L86 18 L75 42 L96 50 L75 58 L86 82 L61 71 L50 94 L39 71 L14 82 L25 58 L4 50 L25 42 L14 18 L39 29 Z"/></svg>
        <dt data-t="dTravel"></dt>
        <dd><span data-bind="dTravel"></span><small data-bind="dTravelNote"></small></dd>
      </div>
      <div class="det__cell" data-hide-empty>
        <svg class="det__star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L61 29 L86 18 L75 42 L96 50 L75 58 L86 82 L61 71 L50 94 L39 71 L14 82 L25 58 L4 50 L25 42 L14 18 L39 29 Z"/></svg>
        <dt data-t="dStay"></dt>
        <dd><span data-bind="dStay"></span><small data-bind="dStayNote"></small></dd>
      </div>
    </dl>

    <div class="prog reveal" id="prog" data-opt="program">
      <p class="eyebrow center" data-t="orderOfTheEvening"></p>
      <div id="progList"></div>
    </div>
  </div>
</section>

<!-- ============================================================
     7 · GARDEN JOURNEY — sticky, scroll-driven descent
     ============================================================ -->
<section class="journey" id="journey" data-opt="journey" aria-label="A walk into the garden">
  <div class="journey__sticky">
    <div class="journey__scene" data-scene="0">
      <img data-art data-asset="portal.jpg" loading="lazy" decoding="async" alt="">
    </div>
    <div class="journey__scene" data-scene="1">
      <img data-art data-asset="fountain.jpg" loading="lazy" decoding="async" alt="">
    </div>
    <div class="journey__scene" data-scene="2">
      <img data-art data-asset="garden.jpg" loading="lazy" decoding="async" alt="">
    </div>
    <div class="journey__scene" data-scene="3">
      <img data-art data-asset="vault.jpg" loading="lazy" decoding="async" alt="">
    </div>
    <div class="journey__scene" data-scene="4">
      <img data-art data-asset="table.jpg" loading="lazy" decoding="async" alt="">
    </div>
    <div class="journey__scene" data-scene="5">
      <img data-art data-asset="dancing.jpg" loading="lazy" decoding="async" alt="">
    </div>

    <div class="journey__cap" id="journeyCap"><p></p></div>
    <p class="journey__hint" aria-hidden="true" data-t="keepScrolling"></p>
  </div>
</section>

<!-- ============================================================
     8 · FINAL PALACE
     ============================================================ -->
<section class="final" id="final" aria-labelledby="fin-h">
  <div class="final__bg" data-depth="0.10">
    <img loading="lazy" decoding="async" data-art data-asset="palace.jpg" alt="">
  </div>
  <div class="final__wash" aria-hidden="true"></div>
  <div class="final__in">
    <svg class="khatam khatam--draw" viewBox="0 0 100 100" style="color:var(--gold-lt)" aria-hidden="true">
      <path d="M50 4 L61 28 L86 17 L75 41 L96 50 L75 59 L86 83 L61 72 L50 96 L39 72 L14 83 L25 59 L4 50 L25 41 L14 17 L39 28 Z"/>
      <path d="M50 18 L58 34 L75 26 L67 42 L82 50 L67 58 L75 74 L58 66 L50 82 L42 66 L25 74 L33 58 L18 50 L33 42 L25 26 L42 34 Z"/>
      <circle cx="50" cy="50" r="10"/>
    </svg>
    <h2 class="reveal" id="fin-h" style="margin-top:1.6rem" data-bind="finaleTitle"></h2>
    <p class="final__msg reveal" data-bind="finaleMsg"></p>
    <p class="final__date reveal" data-bind="finaleDate"></p>
    <div class="reveal" data-opt="rsvp"><button class="rsvp-btn" id="rsvpOpen" type="button"><span data-t="sendYourAnswer"></span></button></div>
  </div>
</section>

</main>

<footer class="sign">
  <svg class="khatam" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 4 L61 28 L86 17 L75 41 L96 50 L75 59 L86 83 L61 72 L50 96 L39 72 L14 83 L25 59 L4 50 L25 41 L14 17 L39 28 Z"/>
    <circle cx="50" cy="50" r="10"/>
  </svg>
  <p data-bind="footerLine"></p>
</footer>

<footer id="vconnect">
  <img id="vconnectLogo" alt="v-invite" width="34" height="40">
  <span data-t="developedBy"></span>
  <div id="vcContacts"></div>
</footer>

<!-- ============================================================
     RSVP — light opens from a point, as the lantern did
     ============================================================ -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="rsvp-h">
  <div class="modal__bg" aria-hidden="true"></div>
  <div class="modal__iris" aria-hidden="true"></div>

  <button class="modal__close" id="modalClose" type="button" data-t-aria="close" aria-label="Close">&#10005;</button>

  <div class="modal__panel">
    <div class="modal__card">
      <form id="rsvpForm" novalidate>
        <h3 id="rsvp-h" data-t="reply"></h3>
        <p class="sub" data-bind="rsvpLede"></p>

        <div class="field">
          <label for="rsvpName" data-t="fullName"></label>
          <input id="rsvpName" name="name" type="text" autocomplete="name">
        </div>
        <div class="field">
          <span class="lbl" data-t="willYouAttend"></span>
          <div class="row" id="attendRow" role="group">
            <button type="button" class="chip" data-attend="yes" aria-pressed="true" data-t="accept"></button>
            <button type="button" class="chip" data-attend="no" aria-pressed="false" data-t="decline"></button>
          </div>

      var mid = (window.innerHeight || 800) * 0.55;
      lamps.forEach(function (l) {
        var r = l.target.getBoundingClientRect ? l.target.getBoundingClientRect() : null;
        if (r) l.btn.classList.toggle('lit', r.top <= mid);
      });
      el.classList.toggle('on', window.scrollY > (window.innerHeight || 800) * 0.6);
    }
  };
}

/* ── Programme ───────────────────────────────────────────────────────────── */
function renderProgramme() {
  var host = $('#progList'), section = $('#prog');
  if (!host) return;
  var raw = cfg('schedule', []);
  var items = Array.isArray(raw) ? raw.filter(function (s) {
    return s && ((s.time && String(s.time).trim()) || (loc(s.label) || '').trim());
  }) : [];
  host.innerHTML = '';
  if (section) section.classList.toggle('card-off', items.length === 0);
  items.forEach(function (item) {
    var row = document.createElement('div');
    row.className = 'prog__row';
    var time = document.createElement('span');
    time.className = 'prog__t';
    time.textContent = (item.time || '').trim();
    var what = document.createElement('span');
    what.className = 'prog__w';
    what.textContent = loc(item.label) || '';
    row.appendChild(time); row.appendChild(what);
    host.appendChild(row);
  });
}

/* ── Petals, gold dust and silk ribbon ───────────────────────────────────── */
var PETAL = ['#A32335', '#6B1B2A', '#C2643F', '#F2E4CE', '#E39A3B'];
var GOLD = ['#C9A227', '#E8CE8A', '#E39A3B'];
var ctx = null, W = 0, H = 0, amb = [], bursts = [], mx = -9999, my = -9999, windForce = 0;

function burst(x, y, n, power, goldy) {
  if (!ctx || reduced) return;
  n = n || 160; power = power || 11;
  var g = [];
  for (var i = 0; i < n; i++) {
    var ang = Math.random() * Math.PI * 2, sp = power * (0.35 + Math.random() * 0.85);
    var roll = Math.random();
    var kind = goldy ? (roll < 0.6 ? 'gold' : roll < 0.82 ? 'ribbon' : 'petal')
                     : (roll < 0.24 ? 'gold' : roll < 0.42 ? 'ribbon' : 'petal');
    g.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2.4,
      r: kind === 'gold' ? 1 + Math.random() * 2.2 : 3 + Math.random() * 6.5,
      rot: Math.random() * Math.PI * 2, vr: (-1 + Math.random() * 2) * 0.12,
      a: 1, fade: 0.006 + Math.random() * 0.009,
      kind: kind,
      c: kind === 'gold' ? GOLD[Math.floor(Math.random() * GOLD.length)]
                        : PETAL[Math.floor(Math.random() * PETAL.length)]
    });
  }
  bursts.push(g);
  if (bursts.length > 4) bursts.shift();
}

function initDust() {
  var cv = $('#dust');
  ctx = (cv && cv.getContext) ? cv.getContext('2d') : null;
  if (!ctx || reduced) { ctx = null; return; }

  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function makeAmb(top) {
    var isGold = Math.random() < 0.55;
    return {
      x: Math.random() * W, y: top ? -20 - Math.random() * H * 0.4 : Math.random() * H,
      r: isGold ? 0.8 + Math.random() * 1.7 : 3 + Math.random() * 4.5,
      vy: isGold ? 0.12 + Math.random() * 0.22 : 0.18 + Math.random() * 0.3,
      vx: -0.16 + Math.random() * 0.32,
      rot: Math.random() * Math.PI * 2, vr: (-0.4 + Math.random() * 0.8) * 0.012,
      a: isGold ? 0.3 + Math.random() * 0.5 : 0.22 + Math.random() * 0.3,
      gold: isGold,
      c: isGold ? GOLD[Math.floor(Math.random() * GOLD.length)]
                : PETAL[Math.floor(Math.random() * PETAL.length)]
    };
  }
  function petal(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.a); ctx.fillStyle = p.c;
    if (p.gold) {
      /* gold dust reads as a soft mote, not a petal */
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(0, -p.r);
      ctx.bezierCurveTo(p.r * 0.9, -p.r * 0.5, p.r * 0.64, p.r * 0.8, 0, p.r);
      ctx.bezierCurveTo(-p.r * 0.64, p.r * 0.8, -p.r * 0.9, -p.r * 0.5, 0, -p.r);
      ctx.fill();
    }
    ctx.restore();
  }

  size();
  window.addEventListener('resize', size, { passive: true });
  var n = (window.innerWidth < 720) ? 22 : 44;
  for (var i = 0; i < n; i++) amb.push(makeAmb(false));

  window.addEventListener('pointermove', function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
  window.addEventListener('pointerleave', function () { mx = my = -9999; }, { passive: true });

  var running = true;
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) requestAnimationFrame(loop);
  });

  function loop() {
    if (!running || !ctx) return;
    ctx.clearRect(0, 0, W, H);
    windForce *= 0.92;   /* the scroll gust settles */

    for (var i = 0; i < amb.length; i++) {
      var p = amb[i];
      var dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
      if (d2 < 15000) {                      // the cursor nudges, very gently
        var f = (1 - d2 / 15000) * 0.55, d = Math.sqrt(d2) || 1;
        p.x += (dx / d) * f; p.y += (dy / d) * f * 0.5;
      }
      p.x += p.vx + Math.sin((p.y + p.rot * 60) * 0.006) * 0.3;
      p.y += p.vy + windForce;
      p.rot += p.vr;
      if (p.y > H + 30 || p.y < -H * 0.5 || p.x < -40 || p.x > W + 40) { amb[i] = makeAmb(true); continue; }
      petal(p);
    }

    for (var b = bursts.length - 1; b >= 0; b--) {
      var g = bursts[b], alive = 0;
      for (var j = 0; j < g.length; j++) {
        var q = g[j];
        if (q.a <= 0) continue;
        alive++;
        q.vy += q.kind === 'gold' ? 0.09 : 0.2;   /* gold hangs in the air longer */
        q.vx *= 0.988; q.vy *= 0.99;
        q.x += q.vx; q.y += q.vy; q.rot += q.vr; q.a -= q.fade;
        if (q.y > H + 60) { q.a = 0; continue; }

        ctx.save();
        ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.globalAlpha = Math.max(0, q.a); ctx.fillStyle = q.c;
        if (q.kind === 'ribbon') ctx.fillRect(-q.r * 0.3, -q.r * 2.2, q.r * 0.6, q.r * 4.4);
        else if (q.kind === 'gold') { ctx.beginPath(); ctx.arc(0, 0, q.r, 0, Math.PI * 2); ctx.fill(); }
        else {
          ctx.beginPath(); ctx.moveTo(0, -q.r);
          ctx.bezierCurveTo(q.r * 0.9, -q.r * 0.5, q.r * 0.64, q.r * 0.8, 0, q.r);
          ctx.bezierCurveTo(-q.r * 0.64, q.r * 0.8, -q.r * 0.9, -q.r * 0.5, 0, -q.r);
          ctx.fill();
        }
        ctx.restore();
      }
      if (!alive) bursts.splice(b, 1);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* The celebration fires on the dancing scene, at the end of the garden walk.
   Opacity is what really decides which scene is on screen, so it is checked on
   scroll rather than trusted from an intersection alone. */
var celebrated = false;
function celebrateIfDancing() {
  if (celebrated || reduced || !ctx) return;
  var last = $('.journey__scene[data-scene="5"]');
  if (!last || parseFloat(last.style.opacity || 0) < 0.75) return;
  celebrated = true;
  var w = window.innerWidth || 400, h = window.innerHeight || 800;
  burst(w / 2, h * 0.52, 220, 13);
  setTimeout(function () { burst(w * 0.26, h * 0.44, 90, 10); }, 200);
  setTimeout(function () { burst(w * 0.74, h * 0.44, 90, 10); }, 360);
}

/* ── Visibility ──────────────────────────────────────────────────────────── */
function applyVisibility() {
  var hid = cfg('hidden', {}) || {};
  $$('[data-opt]').forEach(function (el) {
    el.classList.toggle('opt-off', hid[el.getAttribute('data-opt')] === true);
  });

  /* A tile whose value and note are both empty is a labelled empty box. */
  var shown = 0;
  $$('#detailList .det__cell').forEach(function (cell) {
    var filled = $$('[data-bind]', cell).some(function (el) { return el.textContent.trim(); });
    cell.classList.toggle('card-off', !filled);
    if (filled) shown++;
  });
  var details = $('#details');
  if (details && hid.details !== true) details.classList.toggle('card-off', shown === 0);

  /* Each act hides itself once its heading and its passage are both empty — a
     silk-curtained plate with no words beside it reads as a loading failure. */
  var acts = 0;
  $$('#coupleRows .couple__row').forEach(function (row) {
    var filled = $$('[data-bind]', row).some(function (el) { return el.textContent.trim(); });
    row.classList.toggle('card-off', !filled);
    if (filled) acts++;
  });
  var couple = $('#couple');
  if (couple && hid.couple !== true) couple.classList.toggle('card-off', acts === 0);
}

/* ── Music ───────────────────────────────────────────────────────────────── */
var audio = $('#audio'), musicBtn = $('#music-btn'), musicRetry = false;
var RETRY_EVENTS = ['pointerdown', 'touchstart', 'keydown', 'scroll'];

function startMusic() {
  if (!audio || !audio.getAttribute('src') || !audio.paused) return;
  var p = audio.play ? audio.play() : null;
  if (p && p.catch) p.catch(armMusicRetry);
  if (musicBtn) musicBtn.setAttribute('aria-pressed', 'true');
}
function armMusicRetry() {
  if (musicRetry) return;
  musicRetry = true;
  var retry = function () {
    var p = audio.play();
    var stop = function () { RETRY_EVENTS.forEach(function (ev) { window.removeEventListener(ev, retry); }); };
    if (p && p.then) p.then(stop); else stop();
  };
  RETRY_EVENTS.forEach(function (ev) { window.addEventListener(ev, retry); });
}
function renderMusic() {
  if (!audio || !musicBtn) return;
  var url = cfg('music.url', '');
  var hid = cfg('hidden', {}) || {};
  if (!url || hid.music === true) {
    audio.removeAttribute('src');
    musicBtn.classList.add('hidden');
    return;
  }
  if (audio.getAttribute('src') !== url) audio.setAttribute('src', url);
  musicBtn.classList.remove('hidden');
}

/* ── RSVP ────────────────────────────────────────────────────────────────── */
var attending = true;
var rsvpPending = null;

function initRsvp() {
  var modal = $('#modal'), form = $('#rsvpForm');
  var openBtn = $('#rsvpOpen'), closeBtn = $('#modalClose'), thanksClose = $('#thanksClose');
  var success = $('#rsvpSuccess'), guestField = $('#guestField');
  var lastFocus = null;

  $$('#attendRow .chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      $$('#attendRow .chip').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      chip.setAttribute('aria-pressed', 'true');
      attending = chip.getAttribute('data-attend') === 'yes';
      if (guestField) guestField.style.display = attending ? '' : 'none';
    });
  });

  function open() {
    if (!modal) return;
    lastFocus = document.activeElement;
    modal.classList.add('open');
    document.body.classList.add('is-locked');
    startMusic();                       // the tap is the gesture autoplay needs
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { modal.classList.add('shown'); });
    });
    setTimeout(function () { var n = $('#rsvpName'); if (n && n.focus) n.focus(); }, reduced ? 0 : 1200);
  }
  function close() {
    if (!modal) return;
    modal.classList.remove('shown');
    var canvas = $('#dust');
    if (canvas) canvas.classList.remove('on-top');
    setTimeout(function () {
      modal.classList.remove('open');
      document.body.classList.remove('is-locked');
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }, reduced ? 0 : 900);
  }

  if (openBtn) openBtn.addEventListener('click', open);
  if (closeBtn) closeBtn.addEventListener('click', close);
  if (thanksClose) thanksClose.addEventListener('click', close);
  var bg = modal ? modal.querySelector('.modal__bg') : null;
  if (bg) bg.addEventListener('click', close);

  document.addEventListener('keydown', function (e) {
    if (!modal || !modal.classList.contains('open')) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key !== 'Tab') return;
    var list = $$('button,input,select,textarea', modal).filter(function (n) { return n.offsetParent !== null; });
    if (!list.length) return;
    var first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  if (!form) return;
  form.addEventListener('submit', function (e) {
    if (e.preventDefault) e.preventDefault();
    var nameInput = $('#rsvpName');
    var field = (nameInput && nameInput.closest) ? nameInput.closest('.field') : null;
    var name = ((nameInput && nameInput.value) || '').trim();
    if (!name) {
      if (field) field.classList.add('invalid');
      if (nameInput && nameInput.focus) nameInput.focus();
      return;
    }
    if (field) field.classList.remove('invalid');
    var err = $('#rsvpErr');
    if (err) err.classList.remove('show');

    var guestsInput = $('#rsvpGuests'), msgInput = $('#rsvpMsg');
    var payload = {
      name: name,
      attending: attending,
      guests: attending ? (parseInt(guestsInput && guestsInput.value, 10) || 1) : 0,
      message: ((msgInput && msgInput.value) || '').trim() || undefined
    };

    var btn = $('#rsvpSubmit'), label = btn ? btn.querySelector('span') : null;
    if (btn) btn.disabled = true;
    if (label) label.textContent = t('sending');

    new Promise(function (resolve, reject) {
      /* If no parent answers within 2.5s (the editor preview does not), treat it
         as saved rather than showing the guest a failure. */
      var timer = setTimeout(function () { rsvpPending = null; resolve(); }, 2500);
      rsvpPending = { resolve: resolve, reject: reject, timer: timer };
      window.parent.postMessage({ type: 'vinvite:rsvp', payload: payload }, '*');
    }).then(function () {
      var text = $('#successText');
      if (text) text.textContent = attending ? t('savedYes') : t('savedNo');
      form.classList.add('gone');
      if (success) success.classList.add('on');
      if (attending) {
        var canvas = $('#dust');
        if (canvas) canvas.classList.add('on-top');
        var w = window.innerWidth || 400, h = window.innerHeight || 800;
        burst(w / 2, h * 0.5, 210, 13, true);
        setTimeout(function () { burst(w * 0.3, h * 0.44, 90, 10); }, 220);
        setTimeout(function () { burst(w * 0.7, h * 0.44, 90, 10); }, 380);
      }
    }, function () {
      if (err) err.classList.add('show');
    }).then(function () {
      if (btn) btn.disabled = false;
      if (label) label.textContent = t('send');
    });
  });
}

/* ── Platform credit ─────────────────────────────────────────────────────── */
var SVG_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.1 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6A2 2 0 0 1 22 16.9z"/></svg>';
var SVG_TG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.8 18.6l.3-4.2 7.7-6.9c.3-.3-.1-.5-.5-.2L7.7 13.2 3.6 11.9c-.9-.3-.9-.9.2-1.3l16-6.2c.7-.3 1.4.2 1.1 1.3l-2.7 12.8c-.2.9-.7 1.1-1.5.7l-4.1-3-2 2c-.2.2-.4.4-.8.4z"/></svg>';
var SVG_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>';

function renderPlatformContacts() {
  var host = $('#vcContacts');
  if (!host) return;
  var c = window.__CONTACTS__ || {};
  host.innerHTML = '';
  function link(href, label, svg) {
    var a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = svg + '<span>' + label + '</span>';
    host.appendChild(a);
  }
  var phone = (c.phone || '').trim(), tg = (c.telegram || '').trim(), ig = (c.instagram || '').trim();
  if (phone) link('tel:' + phone.replace(/[^\d+]/g, ''), phone, SVG_PHONE);
  if (tg) link(tg.indexOf('http') === 0 ? tg : 'https://t.me/' + tg.replace(/^@/, ''),
    tg.replace(/^https?:\/\/t\.me\//, '@').replace(/^@?/, '@'), SVG_TG);
  if (ig) link(ig.indexOf('http') === 0 ? ig : 'https://instagram.com/' + ig.replace(/^@/, ''),
    ig.replace(/^https?:\/\/(www\.)?instagram\.com\//, '@').replace(/^@?/, '@'), SVG_IG);

  var logo = $('#vconnectLogo');
  if (logo && !logo.getAttribute('src')) logo.setAttribute('src', ORIGIN + '/v-invite-logo.png');
}

/* ── Language bar ────────────────────────────────────────────────────────── */
function renderLangbar() {
  var bar = $('#langbar');
  if (!bar) return;
  bar.innerHTML = '';
  if (LANGS.length < 2) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  LANGS.forEach(function (l) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(l).toUpperCase();
    b.className = (l === lang) ? 'active' : '';
    b.addEventListener('click', function () {
      if (lang === l) return;
      lang = l;
      renderAll();
    });
    bar.appendChild(b);
  });
}

/* ── Navigation ──────────────────────────────────────────────────────────── */
function initSkip() {
  var skip = $('#skip');
  if (!skip) return;
  skip.addEventListener('click', function () {
    arrive();
    var target = $('#threshold');
    if (!target || target.classList.contains('opt-off')) target = $('#invite');
    if (target && target.scrollIntoView) target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' });
  });
}

/* ── One scroll loop for parallax, the journey and the rail ──────────────── */
var queued = false, lastY = 0;
function onScroll() {
  var y = window.scrollY || 0;
  windForce = Math.max(-1.2, Math.min(1.2, (y - lastY) * 0.04));   /* scroll stirs the air */
  lastY = y;
  if (queued || reduced) return;
  queued = true;
  requestAnimationFrame(function () {
    paintParallax();
    if (journey) journey.paint();
    if (rail) rail.paint();
    celebrateIfDancing();
    queued = false;
  });
}

/* ── Host bridge ─────────────────────────────────────────────────────────── */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'vinvite:rsvp-ok' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.resolve(); rsvpPending = null; }
  if (d.type === 'vinvite:rsvp-err' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.reject(); rsvpPending = null; }
  if (d.type === 'vinvite:config') {
    if (d.contacts) window.__CONTACTS__ = d.contacts;
    CONFIG = d.config || CONFIG;
    if (d.languages && d.languages.length) {
      LANGS = d.languages;
      if (LANGS.indexOf(lang) === -1) lang = LANGS[0];
    }
    renderAll();
  }
  /* The editor jumped to a section being edited: every entrance must already
     have played, or the admin is looking at a blank page. */
  if (d.type === 'vinvite:focus') {
    arrive();
    revealEverything();
    if (journey) journey.still();
  }
});

/* ── Full render (initial + on config / language change) ─────────────────── */
function renderAll() {
  renderPlatformContacts();
  bindTexts();
  bindArtwork();
  renderProgramme();
  applyVisibility();
  renderMusic();
  renderLangbar();
  renderRail();
  collectLayers();
  if (!reduced) {
    paintParallax();
    if (journey) journey.paint();
    if (rail) rail.paint();
  }
}

/* ── Boot ────────────────────────────────────────────────────────────────── */
try {
  initJourney();
  renderAll();
  measureOrnament();
  initObserver();
  initPlaque();
  initDust();
  initRsvp();
  initSkip();
  initFilm();
  if (!reduced) {
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', function () {
      collectLayers();
      if (journey) { journey.measure(); journey.paint(); }
      paintParallax();
      if (rail) rail.paint();
    }, { passive: true });
  }
  if (reduced || ADMIN_EDIT) arrive();
} catch (err) {
  /* A half-booted page must still be readable: show everything, drop the film
     hold, and leave the page scrollable. */
  arrive();
  revealEverything();
  document.body.classList.remove('is-locked');
  if (window.console && console.error) console.error(err);
}
})();
</script>
