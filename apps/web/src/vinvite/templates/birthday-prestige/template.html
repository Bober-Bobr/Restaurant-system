<!DOCTYPE html>
<html lang="ru" class="held">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Invitation</title>
<!--__CONFIG__-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@200;300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   PRESTIGE EVENING — BIRTHDAY INVITATION
   Concept:  the page is a theatre. Heavy velvet drapes hold the screen until
             the guest presses ENTER; they part, warm light spills through, the
             camera advances into the room and the evening begins.
   Register: editorial. Left-aligned type, numbered chapters, hairline rules,
             one warm ivory paper panel as the only light surface in the house.
   Palette:  black · graphite · midnight · brass · bronze · champagne
   ========================================================================== */

/* --- 01 · TOKENS --------------------------------------------------------- */
:root{
  --black:      #08080A;
  --pitch:      #050506;
  --charcoal:   #131317;
  --graphite:   #1D1E23;
  --midnight:   #12161F;

  --brass:      #C6A25E;
  --brass-lt:   #E6CE9A;
  --brass-dk:   #8A6B33;
  --bronze:     #A8763F;
  --copper:     #B8734A;
  --champagne:  #E9DCC3;

  --ivory:      #F4EEE3;
  --beige:      #E4D9C6;
  --warm-white: #F7F3EC;
  --gray:       #8A8A93;
  --gray-dim:   #5C5C66;

  --hair:       rgba(198,162,94,.22);
  --hair-soft:  rgba(255,255,255,.08);

  --display: 'Playfair Display', 'Times New Roman', Didot, serif;
  --text:    'Manrope', 'Helvetica Neue', system-ui, sans-serif;
  --mono:    'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --drape:  cubic-bezier(.62,.02,.24,1);
  --glide:  cubic-bezier(.19,1,.22,1);
  --calm:   cubic-bezier(.4,.12,.2,1);

  --gutter: clamp(22px, 6.4vw, 56px);
  --chapter: clamp(96px, 20vw, 168px);
}

/* --- 02 · GROUND --------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html.held,html.held body{overflow:hidden;height:100%;touch-action:none}
body{
  background:var(--black);
  color:var(--champagne);
  font-family:var(--text);font-weight:300;line-height:1.65;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--brass);color:var(--pitch)}
a{color:inherit}

.tag{
  font-family:var(--mono);font-size:.62rem;font-weight:300;
  letter-spacing:.34em;text-transform:uppercase;color:var(--brass);
}
.num{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;color:var(--brass-dk)}
.rule{height:1px;background:linear-gradient(90deg,var(--brass),rgba(198,162,94,0));transform-origin:left}

/* --- 03 · ENTRANCE GRAMMARS ---------------------------------------------- */
.enter{
  opacity:0;
  transition:
    opacity 1.1s var(--calm) var(--w,0s),
    transform 1.4s var(--glide) var(--w,0s),
    filter 1.1s var(--calm) var(--w,0s),
    clip-path 1.5s var(--glide) var(--w,0s),
    letter-spacing 1.6s var(--glide) var(--w,0s);
}
.enter.on{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}
.e-veil  {clip-path:inset(0 0 100% 0)}
.e-part  {clip-path:inset(0 50% 0 50%)}
.e-lift  {transform:translateY(44px);filter:blur(9px)}
.e-track {letter-spacing:.5em;filter:blur(7px)}
.e-track.on{letter-spacing:normal}
.e-deep  {transform:perspective(1200px) translateZ(-120px) translateY(30px);filter:blur(8px)}
.e-swing {transform:perspective(1400px) rotateX(-84deg);transform-origin:50% 0;filter:blur(2px)}
[data-seq] > *{--w:calc(var(--n,0) * 130ms)}

/* ============================================================================
   04 · THE OVERTURE — velvet drapes, warm light, dust, camera
   ========================================================================== */
.overture{
  position:fixed;inset:0;z-index:90;
  overflow:hidden;background:var(--pitch);
  transition:opacity 1.4s var(--calm), visibility 1.4s;
}
.overture.struck{opacity:0;visibility:hidden;pointer-events:none}

.houselight{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:min(150vw,900px);aspect-ratio:1/1.35;
  background:
    radial-gradient(ellipse at 50% 46%, #FFF0CE 0%, rgba(232,186,110,.55) 22%, rgba(168,118,63,.22) 44%, rgba(8,8,10,0) 72%);
  opacity:.16;filter:blur(6px);
  transition:opacity 4.6s var(--calm), transform 5s var(--calm);
  will-change:opacity,transform;
}
.overture.parting .houselight{opacity:1;transform:scale(1.18)}

.seam{
  position:absolute;left:50%;top:0;bottom:0;width:3px;translate:-50% 0;z-index:6;
  background:linear-gradient(180deg,transparent,#FFE9BD 22%,#FFF3D8 50%,#FFE9BD 78%,transparent);
  opacity:.15;filter:blur(4px);
  animation:seamBreathe 7s var(--calm) infinite;
}
@keyframes seamBreathe{0%,100%{opacity:.12;transform:translateX(-50%) scaleY(.92)}50%{opacity:.32;transform:translateX(-50%) scaleY(1)}}
.overture.parting .seam{opacity:0;transition:opacity .8s var(--calm);animation:none}

.rod{
  position:absolute;left:-2%;right:-2%;top:0;height:clamp(26px,6vw,40px);z-index:6;
  background:linear-gradient(180deg,#2B2B31 0%,#141418 62%,#0A0A0C 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.7);
}
.rod::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--brass-dk) 12%,var(--brass-lt) 50%,var(--brass-dk) 88%,transparent);
  opacity:.75;
}

.drape{
  position:absolute;top:0;bottom:0;width:52%;z-index:5;overflow:hidden;
  background:linear-gradient(180deg,#17171C 0%,#101014 56%,#0A0A0D 100%);
  box-shadow:0 0 90px 30px rgba(0,0,0,.85);
  transition:transform 5.4s var(--drape), filter 5.4s var(--drape);
  will-change:transform;
}
.drape-l{left:0;transform-origin:0% 50%;--lit:100%}
.drape-r{right:0;transform-origin:100% 50%;--lit:0%}

.drape::before{
  content:"";position:absolute;inset:0;opacity:.65;
  background:repeating-linear-gradient(90deg,
    rgba(0,0,0,.32) 0px, rgba(0,0,0,0) 74px, rgba(0,0,0,.32) 148px);
}
.drape::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(255,238,210,.055) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,.5) 92%, rgba(0,0,0,.72) 100%),
    radial-gradient(130% 76% at var(--lit) 44%, rgba(255,220,168,.09), rgba(255,220,168,0) 62%);
}

.fold{
  position:absolute;top:0;bottom:0;
  transform-origin:50% 50%;
  transition:transform 5.4s var(--drape), opacity 4.4s var(--calm);
  will-change:transform;
}
.fold i{
  position:absolute;inset:-2% -6%;
  transform:skewX(var(--sk,0deg));
  background:linear-gradient(90deg,
    rgba(0,0,0,.72) 0%, rgba(0,0,0,.34) 22%, rgba(0,0,0,.06) 40%,
    rgba(255,230,190,.10) 50%,
    rgba(0,0,0,.08) 60%, rgba(0,0,0,.38) 78%, rgba(0,0,0,.72) 100%);
}
.hem{
  position:absolute;left:0;right:0;bottom:0;height:16%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));
}
.lip{
  position:absolute;top:0;bottom:0;width:14px;z-index:3;
  background:linear-gradient(90deg,rgba(255,231,186,.34),rgba(255,231,186,0));
  filter:blur(3px);
}
.drape-l .lip{right:0}
.drape-r .lip{left:0;transform:scaleX(-1)}

.overture.parting .drape-l{transform:translateX(-32%) scaleX(.5) skewY(.35deg)}
.overture.parting .drape-r{transform:translateX(32%)  scaleX(.5) skewY(-.35deg)}
.overture.parting .fold{transform:scaleX(1.18);opacity:1}
.overture.parting .lip{opacity:0;transition:opacity 2s var(--calm)}

.motes{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity 3s var(--calm) .6s;pointer-events:none}
.overture.parting .motes{opacity:1}
.mote{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#FFF4DC 0%,rgba(255,228,178,.5) 46%,rgba(255,228,178,0) 72%);
  animation:moteFloat var(--t,26s) linear var(--o,0s) infinite;
  will-change:transform,opacity;
}
@keyframes moteFloat{
  0%  {opacity:0;transform:translate3d(0,26px,0) scale(.6)}
  14% {opacity:var(--a,.7)}
  76% {opacity:var(--a,.7)}
  100%{opacity:0;transform:translate3d(var(--dx,30px),var(--dy,-260px),0) scale(1.2)}
}

.overture-ui{
  position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:7;
  width:min(88vw,420px);text-align:center;
  display:grid;justify-items:center;gap:clamp(20px,5vw,28px);
  transition:opacity 1.5s var(--calm), transform 1.8s var(--glide), filter 1.5s var(--calm);
}
.overture.parting .overture-ui{opacity:0;transform:translate(-50%,-64%) scale(.96);filter:blur(9px);pointer-events:none}
.crest{
  width:74px;height:74px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  border:1px solid var(--hair);
  animation:crestGlow 6s var(--calm) infinite;
}
.crest::after{
  content:"";position:absolute;inset:6px;border-radius:50%;
  border:1px solid rgba(198,162,94,.14);
}
.crest span{font-family:var(--display);font-size:1.4rem;letter-spacing:.06em;color:var(--brass-lt)}
@keyframes crestGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(198,162,94,0), inset 0 0 22px rgba(198,162,94,.05)}
  50%    {box-shadow:0 0 40px -6px rgba(198,162,94,.28), inset 0 0 26px rgba(198,162,94,.1)}
}
.overture-ui .lede{
  font-family:var(--display);font-weight:300;font-style:italic;
  font-size:clamp(1.5rem,6.6vw,2.05rem);line-height:1.35;color:var(--warm-white);
}
.overture-ui .sub{font-family:var(--mono);font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gray)}

.enter-btn{
  position:relative;isolation:isolate;overflow:hidden;
  margin-top:6px;padding:18px 46px;cursor:pointer;
  background:transparent;border:1px solid var(--brass-dk);border-radius:2px;
  font-family:var(--mono);font-size:.66rem;font-weight:400;
  letter-spacing:.42em;text-transform:uppercase;color:var(--brass-lt);
  transition:color .6s var(--calm), border-color .6s var(--calm), box-shadow .6s var(--calm), transform .5s var(--glide);
  -webkit-tap-highlight-color:transparent;
}
.enter-btn::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,var(--brass-lt),var(--brass) 46%,var(--brass-dk));
  transform:translateY(101%);transition:transform .8s var(--glide);
}
.enter-btn:hover{color:var(--pitch);border-color:var(--brass);box-shadow:0 18px 44px -18px rgba(198,162,94,.6)}
.enter-btn:hover::before{transform:translateY(0)}
.enter-btn:active{transform:scale(.98)}
.enter-btn:focus-visible{outline:1px solid var(--brass-lt);outline-offset:6px}

/* ============================================================================
   05 · THE ROOM
   ========================================================================== */
.room{
  position:relative;
  min-height:100vh;min-height:100svh;
  display:grid;grid-template-rows:1fr auto;
  padding:calc(env(safe-area-inset-top) + 30px) var(--gutter) calc(env(safe-area-inset-bottom) + 34px);
  overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#0A0A0D 0%,#101017 38%,#0C0D12 68%,#08080A 100%);
  transform:scale(1.14);opacity:.25;filter:blur(7px);
  transition:transform 5.6s var(--calm), opacity 3.4s var(--calm), filter 4s var(--calm);
}
.room.arrived{transform:none;opacity:1;filter:none}

.bays{position:absolute;left:0;right:0;top:6%;bottom:26%;display:flex;justify-content:center;gap:6.5vw;z-index:1}
.bay{
  position:relative;width:20vw;max-width:150px;border-radius:120px 120px 4px 4px;
  background:linear-gradient(180deg,rgba(255,222,170,.11) 0%,rgba(255,205,140,.05) 40%,rgba(0,0,0,0) 88%);
  border:1px solid rgba(198,162,94,.13);border-bottom:0;
}
.bay::after{
  content:"";position:absolute;left:-30%;right:-30%;bottom:-6%;height:36%;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,196,120,.22),rgba(255,196,120,0) 70%);
  filter:blur(6px);
}
.bay:nth-child(2){transform:translateY(-4%) scale(1.08)}

.pendants{position:absolute;left:0;right:0;top:0;height:46%;z-index:2;display:flex;justify-content:center;gap:22vw}
.pendant{position:relative;width:1px;background:linear-gradient(180deg,rgba(198,162,94,.5),rgba(198,162,94,.05));height:var(--drop,30%)}
.pendant span{
  position:absolute;left:50%;bottom:-7px;translate:-50% 0;
  width:9px;height:9px;border-radius:50%;background:#FFEDC8;
  box-shadow:0 0 14px 4px rgba(255,214,150,.7), 0 0 46px 16px rgba(255,190,110,.28);
  animation:filament var(--sp,6s) var(--calm) var(--od,0s) infinite;
}
@keyframes filament{0%,100%{opacity:.82;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.14)}}

.console{position:absolute;left:50%;translate:-50% 0;bottom:24%;display:flex;align-items:flex-end;gap:clamp(14px,4.4vw,26px);z-index:3}
.candle{position:relative;width:6px;height:var(--h,42px);border-radius:3px 3px 1px 1px;
  background:linear-gradient(180deg,#F0E4CC,#B9AC92 60%,#6E6555)}
.flame{
  position:absolute;left:50%;bottom:100%;translate:-50% 0;
  width:8px;height:15px;border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 72%,#FFF6DC 0%,#FFD489 40%,rgba(255,160,60,.5) 72%,rgba(255,140,40,0) 100%);
  filter:blur(.4px);
  box-shadow:0 0 18px 7px rgba(255,182,96,.36);
  transform-origin:50% 100%;
  animation:flicker var(--fs,3.4s) var(--calm) var(--fo,0s) infinite;
}
@keyframes flicker{
  0%,100%{transform:translateX(-50%) scale(1,1) rotate(0deg);opacity:.94}
  22%    {transform:translateX(-50%) scale(.94,1.08) rotate(-2deg);opacity:1}
  48%    {transform:translateX(-50%) scale(1.05,.95) rotate(1.6deg);opacity:.88}
  71%    {transform:translateX(-50%) scale(.97,1.05) rotate(-1deg);opacity:1}
}

.floor{
  position:absolute;left:0;right:0;bottom:0;height:26%;z-index:4;
  background:linear-gradient(180deg,rgba(255,196,120,.09) 0%,rgba(10,10,14,.9) 46%,var(--black) 100%);
}
.floor::before{
  content:"";position:absolute;left:8%;right:8%;top:-2%;height:70%;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,206,146,.2),rgba(255,206,146,0) 68%);
  filter:blur(10px);
}
.floor::after{
  content:"";position:absolute;left:-40%;top:12%;width:60%;height:36%;
  background:linear-gradient(96deg,transparent,rgba(255,231,190,.1),transparent);
  filter:blur(14px);
  animation:sheenWalk 17s var(--calm) infinite;
}
@keyframes sheenWalk{0%{transform:translateX(0)}100%{transform:translateX(300%)}}

.room-inner{position:relative;z-index:6;display:grid;align-content:center;justify-items:start;gap:clamp(16px,4vw,22px);min-width:0}
.room-inner .tag{opacity:0;transform:translateY(14px);transition:all 1.2s var(--glide) .4s}
.monogram{
  position:relative;width:64px;height:64px;display:grid;place-items:center;
  opacity:0;transform:scale(.7) rotate(-12deg);transition:all 1.4s var(--glide) .55s;
}
.monogram svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.monogram circle{
  fill:none;stroke:var(--brass);stroke-width:.6;opacity:.55;
  stroke-dasharray:201;stroke-dashoffset:201;
  transition:stroke-dashoffset 2.4s var(--glide) 1s;
}
.room.arrived .monogram circle{stroke-dashoffset:0}
.monogram b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--brass-lt);letter-spacing:.04em}

.headline{
  font-family:var(--display);font-weight:300;
  font-size:clamp(2.6rem,13.5vw,5.6rem);line-height:.98;letter-spacing:-.01em;
  color:var(--warm-white);
  overflow-wrap:break-word;max-width:100%;
}
.headline .ln{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.headline .ln > span{
  display:block;transform:translateY(105%);
  transition:transform 1.5s var(--glide) var(--w,0s);
}
.headline em{font-style:italic;color:var(--brass-lt)}
.room-inner .meta{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gray);
  opacity:0;transform:translateY(16px);transition:all 1.2s var(--glide) 1.5s;
  display:grid;gap:7px;justify-items:start;
}
.room-inner .meta i{display:none}
@media (min-width:600px){
  .room-inner .meta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .room-inner .meta i{display:inline-block;width:16px;height:1px;background:var(--brass-dk)}
}

.room.arrived .room-inner .tag,
.room.arrived .room-inner .meta{opacity:1;transform:none}
.room.arrived .monogram{opacity:1;transform:none}
.room.arrived .headline .ln > span{transform:none}

.walk{
  position:relative;z-index:6;justify-self:center;
  display:grid;justify-items:center;gap:12px;
  font-family:var(--mono);font-size:.56rem;letter-spacing:.36em;text-transform:uppercase;color:var(--gray-dim);
  opacity:0;transition:opacity 1.4s var(--calm) 2.4s;
}
.room.arrived .walk{opacity:1}
.walk i{width:1px;height:44px;background:linear-gradient(180deg,var(--brass),transparent);animation:walkDrop 2.8s var(--calm) infinite}
@keyframes walkDrop{0%{transform:scaleY(0);transform-origin:top;opacity:0}30%{opacity:1}100%{transform:scaleY(1);transform-origin:top;opacity:0}}

/* ============================================================================
   06 · THE HOUSE
   ========================================================================== */
.house{position:relative;z-index:2;background:var(--black)}
.chapter{position:relative;padding:var(--chapter) var(--gutter)}
.hold{max-width:660px;margin-inline:auto}

.head{display:grid;gap:clamp(14px,3.6vw,20px);margin-bottom:clamp(44px,11vw,72px)}
.head .line{display:flex;align-items:center;gap:16px}
.head .line .rule{flex:1;height:1px}
.head h2{
  font-family:var(--display);font-weight:300;
  font-size:clamp(1.8rem,8vw,3.1rem);line-height:1.08;color:var(--warm-white);
  overflow-wrap:break-word;
}
.head h2 em{font-style:italic;color:var(--brass-lt)}
.head .dek{max-width:46ch;font-size:.94rem;color:var(--gray)}

.airborne{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 2.4s var(--calm)}
.airborne.lit{opacity:.5}

/* ---- WELCOME ---- */
.welcome{text-align:left}
.welcome .given{
  font-family:var(--display);font-weight:300;
  font-size:clamp(2.8rem,15vw,6.2rem);line-height:.94;color:var(--warm-white);
  margin:.1em 0 .16em;overflow-wrap:break-word;
}
.welcome .given em{font-style:italic;color:var(--brass-lt)}
.welcome .forty{
  display:flex;align-items:center;gap:18px;margin-bottom:clamp(26px,7vw,38px);
  font-family:var(--mono);font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:var(--brass);
}
.welcome .forty i{flex:1;max-width:120px;height:1px;background:linear-gradient(90deg,var(--brass-dk),transparent)}
.welcome .note{
  font-family:var(--display);font-style:italic;font-weight:300;
  font-size:clamp(1.15rem,5vw,1.45rem);line-height:1.62;color:var(--champagne);
  max-width:30ch;white-space:pre-line;
}
.welcome .sign{margin-top:26px;font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gray-dim)}
.welcome::before{
  content:"";position:absolute;right:-20%;top:-10%;width:80vw;max-width:520px;aspect-ratio:1;
  background:radial-gradient(circle,rgba(198,162,94,.11),rgba(198,162,94,0) 66%);
  pointer-events:none;
}

/* ---- DETAILS: an editorial ledger ---- */
.ledger{border-top:1px solid var(--hair-soft)}
.row{
  position:relative;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;
  padding:clamp(22px,5.6vw,30px) 0;border-bottom:1px solid var(--hair-soft);
  transition:background .7s var(--calm), padding-left .7s var(--glide);
}
.row .k{
  grid-column:1;font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--brass-dk);padding-top:.45em;min-width:74px;
}
.row .v{grid-column:2;font-family:var(--display);font-weight:300;font-size:1.32rem;line-height:1.34;color:var(--warm-white);min-width:0;overflow-wrap:break-word}
.row .v small{display:block;font-family:var(--text);font-size:.82rem;color:var(--gray);margin-top:7px;line-height:1.6}
.row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--brass-lt),var(--brass-dk));
  transform:scaleY(0);transform-origin:top;
  transition:transform 1s var(--glide) var(--w,0s);
}
.row.on::before{transform:scaleY(1)}
.row.on{padding-left:18px}
@media (hover:hover){
  .row:hover{background:linear-gradient(90deg,rgba(198,162,94,.06),transparent 62%)}
}
.map-link{
  display:inline-flex;align-items:center;gap:9px;margin-top:12px;text-decoration:none;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);
  border-bottom:1px solid rgba(198,162,94,.3);padding-bottom:4px;
  transition:gap .5s var(--glide),color .4s var(--calm),border-color .4s var(--calm);
}
.map-link:hover{gap:15px;color:var(--brass-lt);border-color:var(--brass)}
.map-link svg{width:12px;height:12px;fill:currentColor}

/* dress swatches sit inside their ledger row */
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.swatch{
  width:22px;height:22px;border-radius:50%;
  box-shadow:0 2px 8px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.18);
}

/* gift card + contacts */
.giftcard{margin-top:14px;padding:16px 18px;border:1px solid var(--hair);background:rgba(198,162,94,.05)}
.gc-number{font-family:var(--display);font-size:1.16rem;letter-spacing:.08em;color:var(--warm-white)}
.gc-holder{font-family:var(--mono);font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gray);margin-top:6px}
.gc-copy{
  margin-top:12px;padding:9px 18px;cursor:pointer;
  background:transparent;border:1px solid var(--brass-dk);border-radius:2px;
  font-family:var(--mono);font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-lt);
  transition:background .4s var(--calm),color .4s var(--calm);
}
.gc-copy:hover{background:rgba(198,162,94,.14)}
.contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.contact-item{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  padding:9px 15px;border:1px solid var(--hair-soft);border-radius:2px;
  font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--champagne);
  transition:border-color .4s var(--calm),background .4s var(--calm);
}
.contact-item:hover{border-color:var(--brass);background:rgba(198,162,94,.07)}
.contact-item svg{width:15px;height:15px;stroke:var(--brass);fill:none}

/* ---- ITINERARY ---- */
.itinerary{position:relative;padding-left:clamp(46px,13vw,74px);list-style:none}
.itinerary .thread{
  position:absolute;left:clamp(11px,3.4vw,21px);top:4px;bottom:4px;width:1px;background:var(--hair);
  transform:scaleY(0);transform-origin:top;transition:transform 2.2s var(--glide);
}
.itinerary.on .thread{transform:scaleY(1)}
.itinerary .usher{
  position:absolute;left:clamp(11px,3.4vw,21px);top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--brass-lt) 46%,transparent);
  background-size:100% 90px;background-repeat:no-repeat;background-position:0 -90px;
  opacity:0;filter:blur(1px);
}
.itinerary.on .usher{animation:usherWalk 4.6s var(--calm) .5s 1 both}
@keyframes usherWalk{
  0%  {opacity:0;background-position:0 -90px}
  16% {opacity:1}
  84% {opacity:1}
  100%{opacity:0;background-position:0 calc(100% + 90px)}
}
.stop{
  position:relative;padding-bottom:clamp(34px,8.5vw,48px);
  opacity:0;transform:translateY(26px);
  transition:opacity 1s var(--calm) var(--w), transform 1.1s var(--glide) var(--w);
}
.itinerary.on .stop{opacity:1;transform:none}
.stop:last-child{padding-bottom:0}
.stop .pip{
  position:absolute;left:calc(clamp(46px,13vw,74px) * -1);top:3px;
  width:calc(clamp(11px,3.4vw,21px) * 2 + 1px);display:grid;place-items:center;
}
.stop .pip b{
  width:9px;height:9px;background:var(--brass);rotate:45deg;
  box-shadow:0 0 0 4px var(--black), 0 0 20px 2px rgba(198,162,94,.45);
  transition:rotate 1.4s var(--glide) var(--w), background .5s var(--calm);
}
.itinerary.on .stop .pip b{rotate:225deg}
.stop .hour{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;color:var(--brass-dk)}
.stop h3{font-family:var(--display);font-weight:300;font-size:1.42rem;color:var(--warm-white);margin:6px 0 6px;overflow-wrap:break-word}

/* ---- GALLERY: asymmetric magazine spread ---- */
.spread{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(10px,3vw,18px);align-items:start}
.plate{position:relative;overflow:hidden;background:var(--graphite);cursor:pointer;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04)}
.plate .img{
  width:100%;height:100%;background:linear-gradient(160deg,#1D1E23,#0A0A0D);
  background-size:cover;background-position:center;
  transform:scale(1.14);transition:transform 2.4s var(--glide);
  animation:driftZoom var(--dz,26s) var(--calm) infinite;
}
.plate.on .img{transform:scale(1)}
@keyframes driftZoom{0%,100%{scale:1}50%{scale:1.07}}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(196deg,rgba(255,206,146,.14),transparent 42%,rgba(0,0,0,.5));
}
.plate figcaption{
  position:absolute;left:14px;bottom:12px;right:14px;z-index:2;
  font-family:var(--mono);font-size:.54rem;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(247,243,236,.82);text-shadow:0 2px 10px rgba(0,0,0,.8);
}
/* The spread lays out in a repeating 4-plate rhythm; extra photos continue it. */
.plate:nth-child(4n+1){grid-column:1/10;aspect-ratio:4/5}
.plate:nth-child(4n+2){grid-column:7/13;aspect-ratio:1;margin-top:-16%;z-index:2}
.plate:nth-child(4n+3){grid-column:1/8;aspect-ratio:5/4;margin-top:-6%}
.plate:nth-child(4n+4){grid-column:6/13;aspect-ratio:3/4;margin-top:-4%;z-index:2}
.plate:nth-child(4n+1){animation:hover1 15s var(--calm) infinite}
.plate:nth-child(4n+3){animation:hover1 18s var(--calm) -6s infinite}
.plate:nth-child(4n+2){animation:hover2 16s var(--calm) -3s infinite}
.plate:nth-child(4n+4){animation:hover2 19s var(--calm) -9s infinite}
@keyframes hover1{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes hover2{0%,100%{translate:0 0}50%{translate:0 9px}}

/* ---- THE LETTER ---- */
.letter-stage{perspective:1600px}
.letter{
  position:relative;transform-origin:50% 0;
  padding:clamp(30px,8vw,58px) clamp(22px,6vw,50px);
  background:linear-gradient(168deg,var(--ivory) 0%,var(--beige) 100%);
  color:#2A2620;
  box-shadow:0 60px 90px -40px rgba(0,0,0,.9), 0 0 0 1px rgba(198,162,94,.25);
}
.letter::before{
  content:"";position:absolute;left:0;right:0;top:44%;height:22px;
  background:linear-gradient(180deg,rgba(0,0,0,.055),rgba(255,255,255,.5));
  opacity:.55;pointer-events:none;
}
.letter .mark{
  font-family:var(--mono);font-size:.56rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--bronze);margin-bottom:22px;
}
.letter .body{
  font-family:var(--display);font-weight:300;
  font-size:clamp(1.04rem,4.4vw,1.24rem);line-height:1.78;color:#332C24;
  max-width:38ch;white-space:pre-line;
}
.letter .from{
  margin-top:clamp(26px,7vw,36px);padding-top:20px;border-top:1px solid rgba(42,38,32,.16);
  font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:#6B5F4E;
}

/* ---- COUNTDOWN ---- */
.clock{position:relative;text-align:center}
.clock::before{
  content:"";position:absolute;left:50%;top:44%;translate:-50% -50%;
  width:min(110vw,640px);aspect-ratio:2/1;pointer-events:none;
  background:radial-gradient(ellipse,rgba(198,162,94,.14),rgba(198,162,94,0) 68%);
  animation:bloom 12s var(--calm) infinite;
}
@keyframes bloom{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
.dials{display:grid;grid-template-columns:repeat(4,1fr);position:relative;z-index:2}
.dial{position:relative;display:grid;justify-items:center;gap:12px;padding:0 2px;min-width:0}
.dial + .dial::before{content:"";position:absolute;left:0;top:6%;bottom:34%;width:1px;background:var(--hair-soft)}
.digits{
  position:relative;height:1.32em;width:100%;overflow:hidden;
  font-family:var(--display);font-weight:300;font-size:clamp(1.9rem,11vw,3.8rem);line-height:1.32;
}
.digits .d{
  position:absolute;inset:0;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(170deg,var(--warm-white) 0%,var(--brass-lt) 52%,var(--brass-dk) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dial .cap{font-family:var(--mono);font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gray-dim);text-align:center}
.clock .when{
  margin-top:clamp(32px,8vw,44px);font-family:var(--display);font-style:italic;
  font-size:1.02rem;color:var(--champagne);position:relative;z-index:2;
}
.ics-btn{
  margin-top:22px;padding:13px 26px;cursor:pointer;position:relative;z-index:2;
  background:transparent;border:1px solid var(--brass-dk);border-radius:2px;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--brass-lt);
  transition:background .4s var(--calm),color .4s var(--calm);
}
.ics-btn:hover{background:rgba(198,162,94,.14)}

/* ---- RSVP ------------------------------------------------------------------
   The floating-label rules below are scoped to DIRECT children on purpose.
   An unscoped `.field label` would also capture any label nested deeper inside
   a field (an option chip, a checkbox), drag it out of flow via position:
   absolute and kill its clicks via pointer-events:none — with equal specificity
   the nested rule could not win back the properties it does not itself declare.
   -------------------------------------------------------------------------- */
.reply{
  position:relative;
  border:1px solid var(--hair-soft);
  background:linear-gradient(168deg,rgba(29,30,35,.9) 0%,rgba(10,10,13,.9) 100%);
  padding:clamp(26px,6.5vw,44px) clamp(20px,5.5vw,40px);
}
.reply::before{
  content:"";position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--brass) 22%,var(--brass-lt) 50%,var(--brass) 78%,transparent);
  opacity:.6;
}
.field{position:relative;margin-bottom:30px}
.field > input,.field > textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair-soft);
  padding:16px 2px 12px;font-size:1.02rem;font-weight:300;color:var(--warm-white);
  transition:border-color .5s var(--calm);
}
.field > textarea{resize:none;min-height:76px;line-height:1.6}
.field > input:focus,.field > textarea:focus{outline:none}
.field > label{
  position:absolute;left:2px;top:16px;pointer-events:none;color:var(--gray);
  font-size:1rem;font-weight:300;transition:all .45s var(--glide);
}
.field > input:focus + label,.field > textarea:focus + label,
.field > input:not(:placeholder-shown) + label,.field > textarea:not(:placeholder-shown) + label{
  top:-10px;font-family:var(--mono);font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);
}
.field > .glow{
  position:absolute;left:0;bottom:0;height:1px;width:100%;
  background:linear-gradient(90deg,var(--brass-lt),var(--brass),transparent);
  transform:scaleX(0);transform-origin:left;transition:transform .7s var(--glide);
}
.field > input:focus ~ .glow,.field > textarea:focus ~ .glow{transform:scaleX(1)}
.field.invalid > input{border-bottom-color:var(--copper)}
.field.invalid > label{color:var(--copper)}

.ask{font-family:var(--mono);font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:14px}
.choice{display:grid;gap:10px;margin-bottom:30px}
/* Buttons, not nested labels — nothing here can inherit the field rules. */
.opt{
  position:relative;text-align:left;cursor:pointer;
  padding:18px 46px 18px 20px;min-height:60px;width:100%;
  background:transparent;border:1px solid var(--hair-soft);border-radius:3px;
  font-size:.94rem;color:var(--champagne);
  transition:border-color .5s var(--calm), background .5s var(--calm), transform .4s var(--glide), color .4s var(--calm);
  -webkit-tap-highlight-color:transparent;
}
.opt small{display:block;font-family:var(--mono);font-size:.54rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray-dim);margin-top:5px}
.opt::after{
  content:"";position:absolute;right:18px;top:50%;translate:0 -50%;
  width:8px;height:8px;rotate:45deg;border:1px solid var(--hair);
  transition:all .5s var(--glide);
}
.opt:active{transform:scale(.99)}
.opt.picked{border-color:rgba(198,162,94,.55);background:rgba(198,162,94,.07);color:var(--warm-white)}
.opt.picked::after{background:var(--brass);border-color:var(--brass);rotate:225deg;box-shadow:0 0 14px rgba(198,162,94,.6)}
.opt:focus-visible{outline:1px solid var(--brass-lt);outline-offset:3px}

.counter{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:32px;
  padding:14px 6px;border-bottom:1px solid var(--hair-soft);flex-wrap:wrap}
.counter .lab{font-family:var(--mono);font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:var(--brass)}
.counter .set{display:flex;align-items:center;gap:18px;margin-left:auto}
.step{
  width:44px;height:44px;border-radius:50%;cursor:pointer;flex-shrink:0;
  background:transparent;border:1px solid var(--hair-soft);color:var(--champagne);
  font-size:1.1rem;line-height:1;
  transition:all .45s var(--glide);-webkit-tap-highlight-color:transparent;
}
.step:hover{border-color:var(--brass);color:var(--brass-lt);box-shadow:0 0 26px -8px rgba(198,162,94,.7)}
.step:active{transform:scale(.92)}
.counter .val{font-family:var(--display);font-size:1.7rem;min-width:1.6ch;text-align:center;color:var(--warm-white)}

.send{
  position:relative;overflow:hidden;isolation:isolate;
  width:100%;min-height:60px;cursor:pointer;
  background:transparent;border:1px solid var(--brass-dk);border-radius:3px;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.4em;text-transform:uppercase;color:var(--brass-lt);
  transition:color .6s var(--calm), border-color .6s var(--calm), box-shadow .6s var(--calm), transform .4s var(--glide);
  -webkit-tap-highlight-color:transparent;
}
.send::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,var(--brass-lt),var(--brass) 48%,var(--brass-dk));
  transform:translateY(101%);transition:transform .85s var(--glide);
}
.send:hover{color:var(--pitch);border-color:var(--brass);box-shadow:0 20px 50px -20px rgba(198,162,94,.65)}
.send:hover::before{transform:translateY(0)}
.send:active{transform:scale(.99)}
.send:disabled{opacity:.55;cursor:default}
.fineprint{margin-top:18px;font-family:var(--mono);font-size:.54rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gray-dim);text-align:center}
.reply-err{margin-top:14px;text-align:center;font-size:.8rem;color:var(--copper);display:none}
.reply-err.show{display:block}

.sealed{display:none;text-align:center;padding:20px 0}
.sealed.show{display:grid;justify-items:center;gap:16px}
.sealed svg{width:62px;height:62px;fill:none;stroke:var(--brass);stroke-width:.9;stroke-linecap:round}
.sealed .ring{stroke-dasharray:182;stroke-dashoffset:182;animation:draw 1.5s var(--glide) .1s forwards}
.sealed .tick{stroke-dasharray:40;stroke-dashoffset:40;stroke-width:1.4;stroke:var(--brass-lt);animation:draw .7s var(--glide) 1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sealed h3{font-family:var(--display);font-weight:300;font-size:1.7rem;color:var(--warm-white)}
.sealed p{font-size:.9rem;color:var(--gray);max-width:26ch}

/* ---- FOOTER ---- */
.close{
  position:relative;overflow:hidden;text-align:center;
  padding:clamp(90px,22vw,150px) var(--gutter) clamp(60px,14vw,90px);
  background:linear-gradient(180deg,var(--black) 0%,#0C0B0E 46%,#070708 100%);
}
.close::before{
  content:"";position:absolute;left:50%;bottom:-30%;translate:-50% 0;
  width:min(150vw,900px);aspect-ratio:2.4/1;
  background:radial-gradient(ellipse at 50% 100%,rgba(198,162,94,.16),rgba(198,162,94,0) 68%);
  animation:bloom 15s var(--calm) infinite;
}
.close .hold{position:relative;z-index:2;display:grid;justify-items:center;gap:20px}
.close .thanks{font-family:var(--display);font-weight:300;font-style:italic;font-size:clamp(1.7rem,7.5vw,2.6rem);color:var(--warm-white)}
.close .divider{display:flex;align-items:center;gap:14px;width:100%;max-width:230px}
.close .divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass-dk))}
.close .divider i:last-child{transform:scaleX(-1)}
.close .divider b{width:5px;height:5px;rotate:45deg;background:var(--brass);box-shadow:0 0 14px rgba(198,162,94,.6)}
.close p{font-size:.88rem;color:var(--gray);max-width:32ch;white-space:pre-line}
.close .stamp{margin-top:22px;font-family:var(--mono);font-size:.54rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gray-dim);line-height:2.2}
.close .stamp span{display:block;word-break:break-word}

/* --- 07 · THE USHER RAIL ------------------------------------------------- */
.rail{
  position:fixed;right:10px;top:50%;translate:0 -50%;z-index:40;
  width:1px;height:34vh;background:var(--hair-soft);
  opacity:0;transition:opacity 1s var(--calm);
}
.rail.lit{opacity:1}
.rail i{
  position:absolute;left:0;top:0;width:100%;height:0;
  background:linear-gradient(180deg,var(--brass-lt),var(--brass-dk));
  box-shadow:0 0 10px rgba(198,162,94,.5);
}

/* --- 08 · BUILDER CHROME — langbar · music · attribution · lightbox ------ */
.hidden{display:none !important}
.opt-off{display:none !important}

#langbar{
  position:fixed;top:12px;left:12px;z-index:95;
  display:flex;gap:4px;padding:4px;border-radius:2px;
  background:rgba(8,8,10,.72);border:1px solid var(--hair-soft);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#langbar button{
  min-width:34px;padding:6px 9px;border:none;border-radius:2px;
  background:transparent;color:var(--gray);
  font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;cursor:pointer;
  transition:background .4s var(--calm),color .4s var(--calm);
}
#langbar button.active{background:linear-gradient(180deg,var(--brass-lt),var(--brass));color:var(--pitch)}

#music-btn{
  position:fixed;bottom:16px;left:16px;z-index:95;
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:1px solid var(--brass-dk);
  background:rgba(8,8,10,.72);color:var(--brass-lt);cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .4s var(--glide),box-shadow .4s var(--calm);
}
#music-btn:hover{transform:scale(1.06);box-shadow:0 0 24px -6px rgba(198,162,94,.6)}
#music-btn .bars{display:flex;gap:3px;align-items:flex-end;height:18px}
#music-btn .bars > span{
  width:3px;height:100%;background:currentColor;border-radius:1px;
  transform-origin:bottom;animation:eq 1s var(--calm) infinite alternate;
}
#music-btn .bars > span:nth-child(2){animation-delay:-.3s}
#music-btn .bars > span:nth-child(3){animation-delay:-.6s}
#music-btn:not(.playing) .bars > span{animation-play-state:paused}
@keyframes eq{from{transform:scaleY(.4)}to{transform:scaleY(1)}}

#vconnect{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:.6rem;
  padding:2rem 1.3rem calc(env(safe-area-inset-bottom) + 2.4rem);
  text-align:center;background:#050506;
}
#vconnect img{width:44px;height:auto;opacity:.9}
#vconnect span{
  font-family:var(--mono);font-size:.52rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--gray-dim);
}

#lightbox{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
  padding:24px;background:rgba(3,3,4,.94);backdrop-filter:blur(6px);
}
#lightbox.open{display:flex;animation:lbIn .35s var(--glide) both}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:100%;max-height:78vh;box-shadow:0 40px 80px rgba(0,0,0,.8)}
#lbCap{font-family:var(--mono);font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--champagne)}
#lbClose{
  position:absolute;top:16px;right:16px;width:42px;height:42px;
  border:1px solid var(--hair-soft);background:rgba(8,8,10,.7);
  color:var(--champagne);font-size:20px;line-height:1;cursor:pointer;
}

/* --- 09 · DESKTOP -------------------------------------------------------- */
@media (min-width:860px){
  .hold{max-width:900px}
  .headline{font-size:clamp(4.4rem,8vw,6.6rem)}
  .ledger{display:grid;grid-template-columns:1fr 1fr;column-gap:52px;border-top:0}
  .row{border-top:1px solid var(--hair-soft);border-bottom:0}
  .row.full{grid-column:1/-1}
  .itinerary{padding-left:120px}
  .itinerary .thread,.itinerary .usher{left:44px}
  .stop .pip{left:-120px;width:89px}
  .letter{padding:74px 68px}
  .letter .body{font-size:1.3rem}
  .spread{gap:24px}
  .plate:nth-child(4n+1){grid-column:1/8}
  .plate:nth-child(4n+2){grid-column:8/13;margin-top:8%}
  .plate:nth-child(4n+3){grid-column:1/6;margin-top:-2%}
  .plate:nth-child(4n+4){grid-column:6/13;margin-top:-14%}
  .choice{grid-template-columns:1fr 1fr}
  .rail{right:26px;height:40vh}
}
@media (min-width:1280px){
  .hold{max-width:1020px}
  .chapter{padding-inline:clamp(56px,7vw,110px)}
}

/* --- 10 · NARROW SCREENS ------------------------------------------------
   The room is built from viewport-sized furniture, so it needs explicit
   restraint on small phones or the bays/pendants crowd the headline. */
@media (max-width:560px){
  .bays{gap:5vw;top:8%;bottom:32%}
  .bay{width:24vw}
  .pendants{gap:26vw;height:40%}
  .console{bottom:27%;gap:12px}
  .candle{width:5px}
  .room-inner{gap:14px}
  .monogram{width:54px;height:54px}
  .rail{display:none}                 /* the page is short enough to feel */
  .row{grid-template-columns:1fr;gap:4px}
  .row .k{grid-column:1}
  .row .v{grid-column:1;font-size:1.2rem}
  .dial .cap{font-size:.46rem;letter-spacing:.16em}
  .counter{gap:10px}
  .counter .set{gap:14px}
}
@media (max-width:380px){
  .overture-ui{width:92vw}
  .crest{width:62px;height:62px}
  .enter-btn{padding:16px 30px;letter-spacing:.3em}
  .headline{font-size:2.35rem}
  .welcome .given{font-size:2.5rem}
  .digits{font-size:1.65rem}
  .dial{padding:0}
  .step{width:40px;height:40px}
  #langbar{top:8px;left:8px}
  #music-btn{bottom:12px;left:12px;width:42px;height:42px}
}

/* --- 11 · REDUCED MOTION ------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.2s !important;scroll-behavior:auto !important;
  }
  .enter{opacity:1;transform:none;filter:none;clip-path:none;letter-spacing:normal}
  .stop,.itinerary .thread{opacity:1;transform:none}
  .headline .ln > span{transform:none}
  .room{transform:none;opacity:1;filter:none}
}
</style>

<noscript><style>
  html.held,html.held body{overflow:auto;height:auto;touch-action:auto}
  .overture{display:none}
  .room{transform:none;opacity:1;filter:none}
  .room-inner .tag,.room-inner .meta,.monogram,.walk{opacity:1;transform:none}
  .headline .ln > span{transform:none}
  .enter{opacity:1;transform:none;filter:none;clip-path:none;letter-spacing:normal}
  .stop{opacity:1;transform:none}
  .itinerary .thread{transform:scaleY(1)}
</style></noscript>
</head>

<body>

<div class="airborne" id="airborne" aria-hidden="true"></div>
<div class="rail" id="rail" aria-hidden="true"><i></i></div>
<div id="langbar" class="hidden"></div>

<!-- ======================================================== OVERTURE ==== -->
<div class="overture" id="overture">
  <div class="houselight" aria-hidden="true"></div>
  <div class="motes" id="motes" aria-hidden="true"></div>
  <span class="seam" aria-hidden="true"></span>

  <div class="drape drape-l" id="drapeL" aria-hidden="true">
    <span class="hem"></span><span class="lip"></span>
  </div>
  <div class="drape drape-r" id="drapeR" aria-hidden="true">
    <span class="hem"></span><span class="lip"></span>
  </div>

  <div class="rod" aria-hidden="true"></div>

  <div class="overture-ui">
    <span class="crest" aria-hidden="true"><span data-mono></span></span>
    <span class="sub" data-t="byInvitation"></span>
    <p class="lede" data-t="anEveningAwaits"></p>
    <button class="enter-btn" id="btnEnter" type="button" data-t="enterLabel"></button>
  </div>
</div>

<!-- ============================================================ ROOM ==== -->
<header class="room" id="room">
  <div class="bays" aria-hidden="true"><span class="bay"></span><span class="bay"></span><span class="bay"></span></div>
  <div class="pendants" aria-hidden="true">
    <span class="pendant" style="--drop:44%"><span style="--sp:6.4s;--od:0s"></span></span>
    <span class="pendant" style="--drop:62%"><span style="--sp:7.8s;--od:-2.2s"></span></span>
    <span class="pendant" style="--drop:38%"><span style="--sp:5.6s;--od:-4s"></span></span>
  </div>
  <div class="console" aria-hidden="true">
    <span class="candle" style="--h:34px"><i class="flame" style="--fs:3.1s;--fo:-.4s"></i></span>
    <span class="candle" style="--h:52px"><i class="flame" style="--fs:3.9s;--fo:-1.7s"></i></span>
    <span class="candle" style="--h:42px"><i class="flame" style="--fs:3.4s;--fo:-2.6s"></i></span>
    <span class="candle" style="--h:60px"><i class="flame" style="--fs:4.3s;--fo:-.9s"></i></span>
    <span class="candle" style="--h:38px"><i class="flame" style="--fs:3.6s;--fo:-3.3s"></i></span>
  </div>
  <div class="floor" aria-hidden="true"></div>

  <div class="room-inner">
    <span class="monogram">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32"/></svg>
      <b data-mono></b>
    </span>
    <span class="tag" data-bind="venueTag"></span>
    <h1 class="headline">
      <span class="ln"><span style="--w:.75s" data-bind="honoreeName"></span></span>
      <span class="ln"><span style="--w:.92s"><em data-opt="age" data-bind="ageLabel"></em></span></span>
    </h1>
    <p class="meta">
      <span data-bind="dateLong"></span><i></i><span data-bind="timeShort"></span><i data-opt="dress"></i><span data-opt="dress" data-bind="dressTitle"></span>
    </p>
  </div>

  <div class="walk"><i></i><span data-t="pleaseContinue"></span></div>
</header>

<!-- =========================================================== HOUSE ==== -->
<main class="house">

  <!-- ---- 01 · WELCOME ---- -->
  <section class="chapter welcome" id="welcome">
    <div class="hold">
      <span class="tag enter e-lift" data-t="theInvitation"></span>
      <h2 class="given enter e-track" data-bind="honoreeName"></h2>
      <p class="forty enter e-veil" data-opt="age"><span data-bind="ageLabel"></span><i></i></p>
      <p class="note enter e-lift" style="--w:.15s" data-opt="message" data-bind="inviteText"></p>
      <p class="sign enter e-lift" style="--w:.3s" data-bind="signLine"></p>
    </div>
  </section>

  <!-- ---- 02 · DETAILS ---- -->
  <section class="chapter" id="details" data-opt="details">
    <div class="hold">
      <div class="head">
        <div class="line enter e-part"><span class="num">02</span><span class="rule"></span></div>
        <h2 class="enter e-lift" data-t="particulars"></h2>
        <p class="dek enter e-lift" style="--w:.12s" data-t="everythingYouNeed"></p>
      </div>

      <div class="ledger" data-seq>
        <div class="row full">
          <span class="k" data-t="dateLbl"></span>
          <span class="v"><span data-bind="dateLong"></span><small data-bind="dateNote"></small></span>
        </div>
        <div class="row">
          <span class="k" data-t="timeLbl"></span>
          <span class="v"><span data-bind="timeShort"></span><small data-bind="timeNote"></small></span>
        </div>
        <div class="row" id="dressRow" data-opt="dress">
          <span class="k" data-t="dressLbl"></span>
          <span class="v"><span data-bind="dressTitle"></span><small data-bind="dressNote"></small>
            <span class="swatches" id="swatches"></span>
          </span>
        </div>
        <div class="row full" id="venueRow" data-opt="venue">
          <span class="k" data-t="venueLbl"></span>
          <span class="v"><span data-bind="venueName"></span>
            <small data-bind="venueAddress"></small>
            <a class="map-link" id="mapBtn" href="#" target="_blank" rel="noopener">
              <span data-t="directions"></span>
              <svg viewBox="0 0 24 24"><path d="M5 12h12.2l-4.6-4.6L14 6l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>
            </a>
          </span>
        </div>
        <div class="row full" id="giftsRow" data-opt="gifts">
          <span class="k" data-t="giftsLbl"></span>
          <span class="v"><span data-bind="giftsTitle"></span>
            <span class="giftcard" id="giftcard">
              <span class="gc-number" id="gcNumber"></span>
              <span class="gc-holder" id="gcHolder"></span>
              <button class="gc-copy" id="gcCopy" type="button"><span id="gcCopyLabel"></span></button>
            </span>
          </span>
        </div>
        <div class="row full" id="contactsRow" data-opt="contacts">
          <span class="k" data-t="contactsLbl"></span>
          <span class="v"><span data-t="anyQuestions"></span>
            <span class="contact-row" id="contactRow"></span>
          </span>
        </div>
      </div>
    </div>
  </section>

  <!-- ---- 03 · ITINERARY ---- -->
  <section class="chapter" id="evening" data-opt="program">
    <div class="hold">
      <div class="head">
        <div class="line enter e-part"><span class="num">03</span><span class="rule"></span></div>
        <h2 class="enter e-lift" data-t="orderOfEvening"></h2>
      </div>

      <ol class="itinerary" id="itinerary">
        <span class="thread" aria-hidden="true"></span>
        <span class="usher" aria-hidden="true"></span>
      </ol>
    </div>
  </section>

  <!-- ---- 04 · GALLERY ---- -->
  <section class="chapter" id="gallery" data-opt="gallery">
    <div class="hold">
      <div class="head">
        <div class="line enter e-part"><span class="num">04</span><span class="rule"></span></div>
        <h2 class="enter e-lift" data-t="theHouse"></h2>
        <p class="dek enter e-lift" style="--w:.12s" data-t="aFewFrames"></p>
      </div>
      <div class="spread" id="spread"></div>
    </div>
  </section>

  <!-- ---- 05 · THE LETTER ---- -->
  <section class="chapter" id="letter" data-opt="letter">
    <div class="hold">
      <div class="head">
        <div class="line enter e-part"><span class="num">05</span><span class="rule"></span></div>
        <h2 class="enter e-lift" data-t="aWordBefore"></h2>
      </div>

      <div class="letter-stage">
        <article class="letter enter e-swing">
          <p class="mark" data-bind="letterFrom"></p>
          <p class="body" data-bind="letterText"></p>
          <p class="from" data-bind="signLine"></p>
        </article>
      </div>
    </div>
  </section>

  <!-- ---- 06 · COUNTDOWN ---- -->
  <section class="chapter clock" id="clock" data-opt="countdown">
    <div class="hold">
      <div class="head" style="justify-items:center;text-align:center">
        <div class="line enter e-part" style="width:100%"><span class="num">06</span><span class="rule"></span></div>
        <h2 class="enter e-lift" data-t="untilDoorsOpen"></h2>
      </div>

      <div class="dials enter e-lift" role="timer">
        <div class="dial"><div class="digits" data-t-cd="d"><span class="d">00</span></div><span class="cap" data-t="days"></span></div>
        <div class="dial"><div class="digits" data-t-cd="h"><span class="d">00</span></div><span class="cap" data-t="hours"></span></div>
        <div class="dial"><div class="digits" data-t-cd="m"><span class="d">00</span></div><span class="cap" data-t="minutes"></span></div>
        <div class="dial"><div class="digits" data-t-cd="s"><span class="d">00</span></div><span class="cap" data-t="seconds"></span></div>
      </div>

      <p class="when enter e-lift" style="--w:.2s" data-bind="whenLine"></p>
      <button class="ics-btn enter e-lift" id="icsBtn" type="button" data-t="addToCalendar"></button>
    </div>
  </section>

  <!-- ---- 07 · RSVP ---- -->
  <section class="chapter" id="rsvp" data-opt="rsvp">
    <div class="hold">
      <div class="head">
        <div class="line enter e-part"><span class="num">07</span><span class="rule"></span></div>
        <h2 class="enter e-lift" data-t="kindlyReply"></h2>
        <p class="dek enter e-lift" style="--w:.12s" data-t="seatingByHand"></p>
      </div>

      <div class="reply enter e-deep">
        <form id="rsvpForm" novalidate>
          <div class="field">
            <input type="text" id="rsvpName" placeholder=" " autocomplete="name">
            <label for="rsvpName" data-t="fullName"></label><span class="glow"></span>
          </div>

          <span class="ask" data-t="willYouJoin"></span>
          <div class="choice" id="attendRow">
            <button type="button" class="opt picked" data-v="yes" aria-pressed="true">
              <span data-t="accept"></span><small data-t="countMeIn"></small>
            </button>
            <button type="button" class="opt" data-v="no" aria-pressed="false">
              <span data-t="decline"></span><small data-t="withApologies"></small>
            </button>
          </div>

          <div class="counter" id="guestField">
            <span class="lab" data-t="seatsLbl"></span>
            <span class="set">
              <button type="button" class="step" id="minus" data-t-aria="oneFewer">&minus;</button>
              <span class="val" id="seatVal">1</span>
              <button type="button" class="step" id="plus" data-t-aria="oneMore">&plus;</button>
            </span>
          </div>

          <div class="field">
            <textarea id="rsvpMsg" placeholder=" " rows="3"></textarea>
            <label for="rsvpMsg" data-t="anythingToKnow"></label><span class="glow"></span>
          </div>

          <button class="send" id="rsvpSubmit" type="submit"><span data-t="sendReply"></span></button>
          <p class="fineprint" id="fineprint" data-t="confirmationFollows"></p>
          <p class="reply-err" id="rsvpErr" data-t="sendFailed"></p>
        </form>

        <div class="sealed" id="rsvpSuccess">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="ring" cx="32" cy="32" r="29"/>
            <path class="tick" d="M20 33.5l8.5 8.5L45 24"/>
          </svg>
          <h3 data-t="receivedWithPleasure"></h3>
          <p id="successText"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ========================================================== CLOSING ==== -->
<footer class="close" id="close" data-opt="final">
  <div class="hold">
    <p class="thanks" data-t="thankYouForComing"></p>
    <span class="divider" aria-hidden="true"><i></i><b></b><i></i></span>
    <p data-bind="finalMsg"></p>
    <p class="stamp">
      <span data-bind="stampLine1"></span>
      <span data-bind="stampLine2"></span>
    </p>
  </div>
</footer>

<footer id="vconnect">
  <img id="vconnectLogo" alt="v-invite" width="44" height="52">
  <span data-t="developedBy"></span>
</footer>

<button id="music-btn" class="hidden" data-opt="music" aria-pressed="false" data-t-aria="musicAria">
  <span class="bars"><span></span><span></span><span></span></span>
</button>
<audio id="audio" loop preload="none"></audio>

<div id="lightbox" role="dialog" aria-modal="true">
  <button id="lbClose" type="button" aria-label="Close">×</button>
  <img id="lbImg" alt="">
  <div id="lbCap"></div>
</div>

var one = function(s,c){ return (c||document).querySelector(s); };

var between = function(a,b){ return a + Math.random()*(b-a); };

/* Every .animate() call in this file is decoration. Route them through here so
   a browser without the Web Animations API — or reduced-motion — degrades to a
   plain swap instead of throwing and killing the rest of the script. */
function anim(el, frames, opts){
  if (STILL || !el || typeof el.animate !== 'function') return null;
  try { return el.animate(frames, opts); } catch (e) { return null; }
}

function t(key){ return (UI[lang] && UI[lang][key]) || UI.ru[key] || key; }

}
function cfg(path, dflt){
  var cur = CONFIG, parts = path.split('.');
  for (var i = 0; i < parts.length; i++) {
    if (cur == null || typeof cur !== 'object') return dflt;
    cur = cur[parts[i]];
  }
  return cur == null ? dflt : cur;
}
function hiddenKey(k){ var h = cfg('hidden', {}) || {}; return h[k] === true; }

function intlLocale(){ return lang === 'uz' ? 'uz-Latn-UZ' : (lang === 'en' ? 'en-GB' : 'ru-RU'); }
function fmtDateLong(){

  catch (e) { return eventDate().toDateString(); }
}

/* ========================================================================
   01 · THE DRAPES — folds generated so the fabric never repeats
   ==================================================================== */
function hangFabric(panel, inward){
  var COUNT = 6, OVERLAP = 2.2, raw = [], i;
  for (i = 0; i < COUNT; i++) raw.push(between(0.72, 1.34));
  var total = raw.reduce(function(a,b){ return a+b; }, 0);
  var span = 100 + OVERLAP * (COUNT - 1);
  var x = 0;
  raw.forEach(function(r, i){
    var w = (r / total) * span;
    var k = inward ? i / (COUNT - 1) : 1 - i / (COUNT - 1);
    var fold = document.createElement('span');
    fold.className = 'fold';
    fold.style.left = x.toFixed(2) + '%';
    fold.style.width = w.toFixed(2) + '%';
    fold.style.opacity = (0.55 + k * 0.45).toFixed(2);
    fold.style.transitionDelay = ((inward ? COUNT - 1 - i : i) * 0.075).toFixed(3) + 's';
    fold.innerHTML = '<i style="--sk:' + between(-1.4, 1.4).toFixed(2) + 'deg"></i>';
    panel.appendChild(fold);
    x += w - OVERLAP;
  });
}
hangFabric(one('#drapeL'), false);
hangFabric(one('#drapeR'), true);

function suspend(host, count, opts){
  var o = opts || {};
  var frag = document.createDocumentFragment();
  for (var i = 0; i < count; i++) {
    var m = document.createElement('span');
    var size = between(o.min || 2, o.max || 5);
    m.className = 'mote';
    m.style.cssText =
      'left:' + between(2,98) + '%;top:' + between(20,104) + '%;' +
      'width:' + size + 'px;height:' + size + 'px;' +
      '--t:' + between(o.slow || 18, o.fast || 34) + 's;--o:' + -between(0,30) + 's;' +
      '--dx:' + between(-60,60) + 'px;--dy:' + -between(160,460) + 'px;' +
      '--a:' + between(0.25, o.bright || 0.8).toFixed(2);
    frag.appendChild(m);
  }
  host.appendChild(frag);
}
suspend(one('#motes'),    STILL ? 12 : 46, { bright: 0.9 });
suspend(one('#airborne'), STILL ?  8 : 26, { min: 1.5, max: 3.5, slow: 30, fast: 60, bright: 0.35 });

/* ========================================================================
   04 · THE CLOCK — digits dissolve rather than flip
   ==================================================================== */
var dials = { d: one('[data-t-cd="d"]'), h: one('[data-t-cd="h"]'), m: one('[data-t-cd="m"]'), s: one('[data-t-cd="s"]') };
var two = function(n){ return String(Math.max(0,n)).padStart(2,'0'); };

function settle(dial, value){
  var now = dial.querySelector('.d');
  if (!now || now.textContent === value) return;
  var next = document.createElement('span');
  next.className = 'd';
  next.textContent = value;
  dial.appendChild(next);
  var curve = 'cubic-bezier(.19,1,.22,1)';
  var out = anim(now,
    [{ opacity:1, filter:'blur(0px)', transform:'translateY(0) scale(1)' },
     { opacity:0, filter:'blur(6px)', transform:'translateY(-24%) scale(.96)' }],
    { duration:620, easing:curve, fill:'forwards' });
  /* Without an animation the outgoing digit has to go immediately, or both
     numerals would sit stacked in the same box. */
  if (out) out.onfinish = function(){ now.remove(); }; else now.remove();
  anim(next,
    [{ opacity:0, filter:'blur(6px)', transform:'translateY(22%) scale(1.04)' },
     { opacity:1, filter:'blur(0px)', transform:'translateY(0) scale(1)' }],
    { duration:700, easing:curve });
}

function strike(){
  var left = eventDate().getTime() - Date.now();
  if (left <= 0) {
    Object.keys(dials).forEach(function(k){ settle(dials[k], '00'); });
    return;
  }
  var s = Math.floor(left / 1000);
  settle(dials.d, two(Math.floor(s / 86400)));
  settle(dials.h, two(Math.floor(s / 3600) % 24));
  settle(dials.m, two(Math.floor(s / 60) % 60));
  settle(dials.s, two(s % 60));
}
strike();

    { duration:460, easing:'cubic-bezier(.19,1,.22,1)' });

var rsvpPending = null;

  if (!d || typeof d !== 'object') return;
  if (d.type === 'vinvite:rsvp-ok' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.resolve(); rsvpPending = null; }
  if (d.type === 'vinvite:rsvp-err' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.reject(); rsvpPending = null; }
  if (d.type === 'vinvite:config') {
    CONFIG = d.config || CONFIG;
    if (d.languages && d.languages.length) {
      LANGS = d.languages;

    var timer = setTimeout(function(){ rsvpPending = null; resolve(); }, 2500);
    rsvpPending = { resolve: resolve, reject: reject, timer: timer };

  }).then(function(){
    one('#successText').textContent = isYes ? t('savedYes') : t('savedNo');
    one('#rsvpForm').style.display = 'none';

/* ========================================================================
   06 · MUSIC
   ==================================================================== */
var audio = one('#audio'), musicBtn = one('#music-btn');
var musicWired = false, musicRetry = false;
var RETRY_EVENTS = ['pointerdown','touchstart','keydown','scroll'];

function startMusic(){
  if (!audio || !audio.getAttribute('src') || !audio.paused) return;
  var p = audio.play();
  if (p && p.catch) p.catch(armMusicRetry);
}
function armMusicRetry(){
  if (musicRetry) return; musicRetry = true;
  var stop = function(){ RETRY_EVENTS.forEach(function(ev){ window.removeEventListener(ev, retry); }); };
  var retry = function(){
    var p = audio.play();
    if (p && p.then) p.then(stop); else stop();
  };
  RETRY_EVENTS.forEach(function(ev){ window.addEventListener(ev, retry, { passive: true }); });
}
function renderMusic(){
  var url = cfg('music.url','');
  if (!url) { musicBtn.classList.add('hidden'); audio.removeAttribute('src'); return; }
  musicBtn.classList.remove('hidden');
  if (audio.getAttribute('src') !== url) { audio.setAttribute('src', url); audio.preload = 'auto'; }
  if (musicWired) return;
  musicWired = true;
  musicBtn.addEventListener('click', function(){
    if (audio.paused) audio.play().catch(function(){}); else audio.pause();
  });
  audio.addEventListener('play', function(){ musicBtn.classList.add('playing'); musicBtn.setAttribute('aria-pressed','true'); });
  audio.addEventListener('pause', function(){ musicBtn.classList.remove('playing'); musicBtn.setAttribute('aria-pressed','false'); });
}

/* ── Language switcher ── */
function renderLangbar(){
  var bar = one('#langbar');
  bar.innerHTML = '';
  if (LANGS.length < 2) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  LANGS.forEach(function(l){
    var b = document.createElement('button');
    b.textContent = l.toUpperCase();
    b.className = l === lang ? 'active' : '';
    b.addEventListener('click', function(){
      if (lang === l) return;
      lang = l;
      renderAll();
    });
    bar.appendChild(b);
  });
}

/* ========================================================================
   07 · THE RAIL — progress, on one throttled frame loop
   ==================================================================== */
var railFill = one('#rail i');
var queued = false;
window.addEventListener('scroll', function(){
  if (queued) return;
  queued = true;
  requestAnimationFrame(function(){
    var y = window.scrollY;
    var span = document.documentElement.scrollHeight - window.innerHeight;
    railFill.style.height = (span > 0 ? (y / span) * 100 : 0) + '%';
    if (y < window.innerHeight * 1.3) {
      var k = y / window.innerHeight;
      room.style.transform = 'translate3d(0,' + (y * 0.18) + 'px,0) scale(' + (1 - k * 0.04) + ')';
      room.style.opacity = String(Math.max(0, 1 - k * 1.05));
    }
    queued = false;
  });
}, { passive: true });

/* ========================================================================
   FULL RENDER (initial + on config/language change)
   ==================================================================== */
function renderAll(){
  bindTexts();
  applyVisibility();
  renderLedger();
  renderItinerary();
  renderGallery();
  renderMusic();
  renderLangbar();
  var logo = one('#vconnectLogo');
  if (logo && !logo.getAttribute('src')) logo.setAttribute('src', ORIGIN + '/v-invite-logo.png');
  observeEnters();
}

renderAll();
</script>
