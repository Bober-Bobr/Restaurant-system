<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation</title>
<!--__CONFIG__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Instrument Serif sets the display type; Playfair Display is named second
     in the stack because INSTRUMENT SERIF HAS NO CYRILLIC — see the note at the
     head of the stylesheet. Inter Tight carries every label and does have it. -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   WEDDING IN ZERMATT — a Swiss-typographic invitation
   ----------------------------------------------------------------------------
   The design is a Swiss editorial system rather than a romantic one: a strict
   twelve-column grid, numbered sections, labels set small / tracked / upper
   case, metadata in the margins (an altitude, a figure number), and the order
   of the day printed as a railway departure board. The warmth comes from the
   photographs and from one high-contrast serif; everything else is ivory,
   forest, slate and stone.

   THREE RULES ABOUT THE ARTWORK, carried over from the design before this one
   and measured again here. Every bundled plate is 1600x893 (16:9), the two
   stills are 1200x1490 (4:5) and the phone plates are 1080x1935 (9:16).

   1. A FRAME THAT NEED NOT FILL THE SCREEN TAKES THE ART'S OWN RATIO.
      `object-fit: cover` discards whatever does not fit its box, so a box
      whose proportions differ from the picture's IS a crop. The design this
      was drawn from asked for 21/9 strips and dropped landscape plates into
      4/5 boxes on a phone: that is 77% and 45% of the photograph respectively.
      Every editorial frame here is 16/9, 4/5 or 4/3 to match what is in it,
      and a phone never re-proportions a plate — it only makes it narrower.

   2. WHERE A SECTION MUST FILL THE VIEWPORT, THE PHOTOGRAPH TURNS WITH IT.
      The hero, the two interludes and the finale are viewport-tall, which on a
      phone is a 9:16 hole that a 16:9 picture cannot fill without throwing
      away two thirds of itself. So each of those carries a PORTRAIT plate as
      well, chosen by `<picture>` on the aspect ratio of the screen rather than
      its width — the thing that actually decides the crop — and the opening
      film has a portrait cut for the same reason. Nothing is scaled up on top
      of that; the subject is placed with `object-position`.

   3. THE PARALLAX OVERSHOOT IS THE CROP, SO THE TRAVEL IS DERIVED FROM IT.
      A layer that moves must be larger than its frame, and that extra is
      permanently invisible. `--bleed` is the single number; the rig computes
      its travel from it rather than from a pixels-per-scroll factor, so no
      viewport size can expose an edge. See the rig at the foot of the script.

   AND ONE TYPOGRAPHIC TRAP. Instrument Serif ships latin and latin-ext only —
   no Cyrillic. Google's css2 declares a `unicode-range` per subset, so a face
   with no Cyrillic does not fail: the Russian text silently comes from the
   system serif, which is a different design on every machine. A stack takes
   each glyph from the first family that has it, so Playfair Display is named
   second and is the face Russian guests actually read — the closest Didone
   with a real Cyrillic ITALIC, which this design needs, since its ampersand
   and its one-line announcement are both italic.
   ========================================================================== */

:root{
  --ivory:#F5F2EC;
  --ivory-2:#ECE8DF;
  --mist:#DADDDB;
  --forest:#1F3328;
  --slate:#3D5464;
  --stone:#A69F94;
  --ink:#1B1D1C;
  --ink-soft:#5A5F5B;
  --line:rgba(27,29,28,.16);
  --champagne:#A88F5F;

  --serif:"Instrument Serif","Playfair Display","Iowan Old Style",Georgia,serif;
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;

  --gutter:clamp(18px,5vw,88px);
  --maxw:1320px;
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  /* The parallax overshoot: the smallest that hides a moving layer's edge.
     4%, not the 11% these rigs usually carry, because every layer that moves
     here is in a VIEWPORT-FILLING frame, where the overshoot is the most
     expensive crop on the page — it is taken off a picture that is already
     being cropped to the shape of the screen. Measured at 1440x900: 6% showed
     71% of the plate, 4% shows 77%. The rig's travel is computed from this
     number, so changing it changes both. */
  --bleed:4%;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--ivory);color:var(--ink);
  font-family:var(--sans);font-weight:400;
  font-size:clamp(15px,.25vw + 14px,17px);line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  font-variant-numeric:lining-nums;
}
/* The seal, which is put on from SCRIPT and never in the markup: a dead script
   must leave a scrollable page rather than a frozen one. */
body.is-sealed{overflow:hidden;height:100svh}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
p{margin:0 0 1em}
h1,h2,h3{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--slate);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.opt-off,.card-off,.hidden{display:none !important}

/* Swiss labels: small, tracked, uppercase, on a strict baseline */
.lbl{
  font-family:var(--sans);font-weight:500;
  font-size:clamp(10px,.15vw + 9.5px,11.5px);
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
}
/* Marginal metadata — an altitude, a figure number. Tabular, so a column of
   them lines up. */
.alt{
  font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.12em;
  color:var(--stone);font-variant-numeric:tabular-nums;
}
.serif{font-family:var(--serif)}
.wrap{
  max-width:var(--maxw);margin:0 auto;
  padding-left:calc(var(--gutter) + var(--safe-l));
  padding-right:calc(var(--gutter) + var(--safe-r));
}
.sect{padding-block:clamp(84px,12vw,180px)}
/* The masthead is fixed, so an anchor lands its section UNDER it — measured
   from a nav press: the venue label and the countdown's own heading were both
   behind the bar. Every target of the menu gets the bar's height back. */
section[id],div[id]{scroll-margin-top:clamp(62px,8vh,78px)}

/* The twelve-column grid, the backbone of every layout below */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(12px,2vw,28px)}

/* Section heads: number, trilingual label, title — identical every time */
.shead{
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  column-gap:clamp(12px,2vw,28px);align-items:end;
  border-top:1px solid var(--ink);padding-top:14px;margin-bottom:clamp(36px,5vw,72px);
}
.shead .no{
  grid-column:1 / span 2;font-family:var(--sans);font-weight:500;font-size:12px;
  letter-spacing:.14em;font-variant-numeric:tabular-nums;
}
.shead .tri{grid-column:3 / span 4}
.shead h2{
  grid-column:7 / -1;font-family:var(--serif);
  font-size:clamp(34px,4.6vw,72px);line-height:.98;letter-spacing:-.01em;
}
@media (max-width:760px){
  .shead{grid-template-columns:1fr auto;row-gap:14px}
  .shead .no{grid-column:2;grid-row:1;justify-self:end}
  .shead .tri{grid-column:1;grid-row:1}
  .shead h2{grid-column:1 / -1;grid-row:2}
}

/* ============================================================
   PHOTOGRAPHS
   Every plate carries its own focal point (--fx/--fy), so a crop
   is a decision about that picture rather than a blanket "center".
   ============================================================ */
.ph{position:relative;overflow:hidden;background:var(--mist)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:var(--fx,50%) var(--fy,50%)}
.ph picture{display:contents}
/* An uploaded photograph cannot inherit the art direction of the plate it
   replaces — a frame pulled to 62% for a mountain ridge loses somebody else's
   subject entirely. So a replaced plate goes back to centre. */
.ph img.is-custom{object-position:50% 50% !important}

/* Reveal: the mist lifts — a clip opening from the top edge down */
.lift{clip-path:inset(0 0 100% 0);transition:clip-path 1.5s var(--ease)}
.lift img{transform:scale(1.06);transition:transform 2.2s var(--ease)}
.lift.in{clip-path:inset(0 0 0 0)}
.lift.in img{transform:none}
/* Reveal: a grid wipe from the centre out, for the wide plates */
.wipe{clip-path:inset(0 50% 0 50%);transition:clip-path 1.6s var(--ease)}
.wipe img{transform:scale(1.04);transition:transform 2.2s var(--ease)}
.wipe.in{clip-path:inset(0 0 0 0)}
.wipe.in img{transform:none}

.up{opacity:0;transform:translateY(18px);transition:opacity 1s var(--ease-io),transform 1.2s var(--ease)}
.up.in{opacity:1;transform:none}

/* Type rising line by line out of a mask */
.mask{display:block;overflow:hidden;padding-bottom:.06em}
.mask>span{display:block;transform:translateY(110%);transition:transform 1.3s var(--ease)}
.mask.in>span,.in .mask>span{transform:none}

.cap{display:flex;gap:.8em;margin-top:.8em;font-size:12px;color:var(--ink-soft);line-height:1.45}
.cap b{flex:none;font-weight:600;letter-spacing:.08em;color:var(--ink)}
.cap span{min-width:0}

/* ============================================================
   CHROME — language bar, music, platform credit
   ============================================================ */
#langbar{position:fixed;left:14px;bottom:14px;z-index:130;display:flex;gap:6px}
#langbar button{
  padding:7px 11px;border-radius:999px;
  font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,242,236,.86);background:rgba(27,29,28,.6);
  border:1px solid rgba(245,242,236,.28);backdrop-filter:blur(6px);
  transition:.35s var(--ease-io);
}
#langbar button.active{color:var(--ivory);background:var(--forest);border-color:var(--forest)}

#music-btn{
  position:fixed;right:14px;bottom:14px;z-index:130;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(27,29,28,.6);border:1px solid rgba(245,242,236,.28);backdrop-filter:blur(6px);
}
#music-btn .bars{display:flex;align-items:flex-end;gap:3px;height:15px}
#music-btn .bars span{width:2px;height:5px;background:var(--ivory);border-radius:1px}
#music-btn[aria-pressed="true"] .bars span{animation:bar .9s var(--ease-io) infinite alternate}
#music-btn[aria-pressed="true"] .bars span:nth-child(2){animation-delay:.18s}
#music-btn[aria-pressed="true"] .bars span:nth-child(3){animation-delay:.36s}
@keyframes bar{from{height:4px}to{height:15px}}

#vconnect{
  background:#141815;color:rgba(245,242,236,.5);text-align:center;
  padding:1.6rem var(--gutter) 2rem;
  font-family:var(--sans);font-weight:300;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
}
#vconnect img{width:34px;height:auto;margin:0 auto .6rem;opacity:.9}
#vcContacts{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:.9rem}
#vcContacts a{
  display:inline-flex;align-items:center;gap:.35rem;color:var(--champagne);
  text-decoration:none;letter-spacing:.08em;text-transform:none;font-size:12px;
}
#vcContacts svg{width:14px;height:14px}

/* ============================================================
   A SECOND BRIDE AND GROOM — a double wedding
   Hidden until a name has actually been typed. `revert` rather than a value
   per site: these clusters are an <h1>, a <p> and a <span> in a running line,
   and each has to go back to ITS OWN default.
   ============================================================ */
.duo{display:none}
html.has-duo .duo{display:revert}
/* Neither couple is a footnote at their own wedding: the second pair is set in
   the same type as the first, so the display clamp comes down a step instead. */
html.has-duo .ouv__names{font-size:clamp(34px,4.2vw,68px)}
/* The second pair's cluster states its own display rather than reverting to a
   span's `inline`: inline, it joined the first pair's last name on one line and
   four names read as one list of four people — which is the whole thing the
   middot convention exists to prevent. (Talbon's portrait grid does the same
   for the same reason.) */
html.has-duo .ouv__pair2{display:block}
html.has-duo .ann__names{font-size:clamp(30px,4.4vw,72px)}

/* ============================================================
   A · THE OPENING — the film, and the seal over it
   ============================================================ */
.ouv{
  position:relative;height:100svh;min-height:520px;overflow:hidden;
  background:#cfd5d4;color:var(--ivory);isolation:isolate;
}
/* The one crop that cannot be avoided: a hero has to fill the viewport. What
   it does not do is add to it — nothing is scaled up, the portrait cut is used
   on a portrait screen, and the frame is held above centre because that is
   where the horizon and the couple sit in the shot. */
.ouv__v,.ouv__poster{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 46%;
}
.ouv__poster{transition:opacity 1.2s var(--ease-io)}
.ouv.is-playing .ouv__poster{opacity:0}
/* Reading light only where the type sits — the left edge and the top, never
   across the middle of the picture. */
.ouv__shade{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(18,24,22,.58) 0%,rgba(18,24,22,.28) 30%,rgba(18,24,22,0) 46%),
    linear-gradient(0deg,rgba(18,24,22,.42) 0%,rgba(18,24,22,0) 34%);
}
.ouv__in{
  position:absolute;inset:0;display:grid;
  grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;
  padding:calc(clamp(18px,3vh,32px) + var(--safe-t)) calc(var(--gutter) + var(--safe-r))
          calc(clamp(22px,5vh,56px) + var(--safe-b)) calc(var(--gutter) + var(--safe-l));
}
.ouv__top{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:1em}
.ouv__top .lbl,.ouv__top .alt{color:rgba(245,242,236,.86)}
/* The title block takes the left third only, so the couple in the photograph
   stays clear of it. */
.ouv__title{grid-column:1;grid-row:3;align-self:end;max-width:min(32vw,460px)}
.ouv__kicker{display:block;margin-bottom:14px;color:rgba(245,242,236,.86)}
.ouv__names{font-family:var(--serif);font-size:clamp(44px,5.6vw,96px);line-height:.92;letter-spacing:-.01em}
.ouv__names .amp{
  display:block;font-style:italic;font-size:.5em;line-height:1.1;
  color:rgba(245,242,236,.8);margin:.06em 0;
}
.ouv__pair2{margin-top:.5em;font-size:.56em;line-height:1}
.ouv__date{
  margin:18px 0 26px;font-weight:500;font-size:13px;letter-spacing:.14em;
  font-variant-numeric:tabular-nums;color:rgba(245,242,236,.92);
}
.ouv__side{
  grid-column:2;grid-row:3;align-self:end;justify-self:end;
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;
}
.ouv__side .lbl{color:rgba(245,242,236,.8)}
.ctl{
  min-height:44px;display:inline-flex;align-items:center;gap:.6em;padding:0 2px;
  font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(245,242,236,.9);border-bottom:1px solid rgba(245,242,236,.4);
  transition:color .3s,border-color .3s;
}
.ctl:hover{color:#fff;border-color:#fff}
/* `display:inline-flex` OVERRIDES the hidden attribute's own `display:none`, so
   without this both film controls are on screen at once — which is what the
   first screenshot showed: "pause" and "play" side by side over the cover. */
.ctl[hidden]{display:none}

.btn-open{
  display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:0 26px;
  background:var(--ivory);color:var(--ink);
  font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;transition:background .4s var(--ease-io),color .4s var(--ease-io);
}
.btn-open:hover{background:var(--forest);color:var(--ivory)}
.btn-open i{
  display:inline-block;width:18px;height:1px;background:currentColor;
  position:relative;transition:width .5s var(--ease);
}
.btn-open i::after{
  content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;
  border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(-45deg);
}
.btn-open:hover i{width:26px}

/* The opening type arrives as the camera comes to rest, a beat apart */
.ouv .st{opacity:0;transform:translateY(14px);transition:opacity 1.2s var(--ease-io),transform 1.4s var(--ease)}
.ouv.is-cover .st{opacity:1;transform:none}
.ouv.is-cover .st:nth-child(2){transition-delay:.15s}
.ouv.is-cover .st:nth-child(3){transition-delay:.3s}
.ouv.is-cover .st:nth-child(4){transition-delay:.45s}
.ouv.is-cover .st:nth-child(5){transition-delay:.6s}
/* Once the invitation has been opened the type steps back and the film is left
   alone — it is the last thing a guest scrolls past, not a title card. */
.ouv.is-opened .ouv__title,.ouv.is-opened .ouv__side .lbl{
  opacity:0;transform:translateY(-10px);
  transition:opacity .8s var(--ease-io),transform 1s var(--ease);
}

/* PHONES, by ASPECT RATIO rather than width: the title moves into the sky at
   the top so the couple below it stays visible, and the film controls sit
   under the button rather than over the photograph. */
@media (max-aspect-ratio: 4/5){
  .ouv__shade{
    background:
      linear-gradient(180deg,rgba(18,24,22,.6) 0%,rgba(18,24,22,.3) 26%,rgba(18,24,22,0) 42%),
      linear-gradient(0deg,rgba(18,24,22,.35) 0%,rgba(18,24,22,0) 16%);
  }
  .ouv__v,.ouv__poster{object-position:50% 50%}
  .ouv__in{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  .ouv__title{
    grid-column:1;grid-row:2;align-self:start;max-width:none;text-align:center;
    margin-top:clamp(10px,3vh,26px);
  }
  .ouv__names{font-size:clamp(38px,11vw,62px)}
  .ouv__names .amp{display:inline;font-size:.6em;margin:0 .14em}
  .ouv__date{margin:10px 0 16px}
  .ouv__side{
    grid-column:1;grid-row:3;align-self:start;justify-self:center;
    align-items:center;flex-direction:row;gap:22px;margin-top:4px;
  }
  .ouv__side .lbl{display:none}
  .ouv__top .alt{display:none}
  html.has-duo .ouv__names{font-size:clamp(30px,8.4vw,48px)}
}
@media (max-aspect-ratio: 4/5) and (max-height:620px){
  .ouv__names{font-size:clamp(32px,9vw,46px)}
  .ouv__kicker{margin-bottom:8px}
  .btn-open{min-height:46px}
}

/* ============================================================
   NAVIGATION
   ============================================================ */
.nav{
  position:fixed;left:0;right:0;top:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;gap:1em;
  padding:calc(6px + var(--safe-t)) calc(var(--gutter) + var(--safe-r)) 6px calc(var(--gutter) + var(--safe-l));
  background:rgba(245,242,236,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  transform:translateY(-102%);transition:transform .6s var(--ease);
}
.nav.on{transform:none}
.nav__brand{
  font-family:var(--serif);font-size:20px;line-height:1;text-decoration:none;
  min-height:44px;display:inline-flex;align-items:center;
}
.nav__links{display:flex;gap:clamp(16px,2.4vw,36px);list-style:none;margin:0;padding:0}
.nav__links a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center;position:relative}
.nav__links a::after{
  content:"";position:absolute;left:0;right:0;bottom:10px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);
}
.nav__links a:hover::after,.nav__links a[aria-current="true"]::after{transform:scaleX(1)}
.nav__menu{display:none;min-height:44px;min-width:44px}
@media (max-width:860px){
  .nav__links{
    position:fixed;inset:0;z-index:-1;flex-direction:column;justify-content:center;align-items:center;gap:6px;
    background:var(--ivory);
    padding:calc(70px + var(--safe-t)) var(--gutter) calc(30px + var(--safe-b));
    opacity:0;visibility:hidden;transition:opacity .4s var(--ease-io),visibility 0s .4s;
  }
  .nav__links a{
    font-family:var(--serif);font-size:clamp(28px,8vw,42px);
    letter-spacing:0;text-transform:none;color:var(--ink);min-height:56px;
  }
  .nav.menu-open .nav__links{opacity:1;visibility:visible;transition:opacity .4s var(--ease-io)}
  .nav__menu{display:inline-flex;align-items:center;justify-content:flex-end}
}

/* ============================================================
   B · THE ANNOUNCEMENT
   ============================================================ */
.ann__langs{
  list-style:none;margin:0 0 28px;padding:0;
  display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:baseline;
}
.ann__langs dt{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--stone)}
.ann__langs dd{margin:0;font-family:var(--serif);font-size:clamp(20px,1.8vw,28px);line-height:1.15}
.ann__langs dd.own{font-style:italic}
/* The announcement carries the FORMAL names, where the cover carried the short
   ones — so the clamp is a third smaller than a design setting "Anna & Lukas"
   would want. Measured at 1440 in Russian: at the original 150px ceiling
   "Лукас Бруннер / Анна Келлер" ran to four 465px lines and pushed the lede and
   the plate off the screen. */
.ann__names{
  font-family:var(--serif);font-size:clamp(36px,5.6vw,92px);line-height:.92;letter-spacing:-.015em;
  margin:clamp(26px,4vw,56px) 0 clamp(22px,3vw,40px);
}
.ann__names .amp{font-style:italic;font-size:.55em;color:var(--stone);margin:0 .06em;vertical-align:.2em}
.ann__names .dot{display:block;font-size:.3em;color:var(--stone);margin:.3em 0}
.ann__lede{font-size:clamp(17px,1.2vw,20px);line-height:1.6;max-width:36ch}
.ann__fig{margin:0}
/* 16/9 — the plate's own proportions. The design this came from asked for
   16/11 here and 2/3 on a phone; both throw a fifth of the picture away. */
.ann__photo{aspect-ratio:16/9}
@media (min-width:961px){
  .ann .grid{align-items:end}
  .ann__text{grid-column:1 / span 5}
  .ann__fig{grid-column:7 / -1}
}
@media (max-width:960px){
  .ann__text,.ann__fig{grid-column:1 / -1}
  .ann__fig{margin-top:40px}
}
@media (min-width:600px) and (max-width:960px){
  .ann__fig{max-width:620px;margin-left:auto;margin-right:auto}
}

/* ============================================================
   C · THE STORY
   ============================================================ */
.bleed{position:relative;overflow:hidden;background:var(--mist)}
.bleed--full{height:100svh;min-height:540px}
.bleed .ph{position:absolute;inset:0}
.bleed .ph img{object-position:var(--fx,50%) var(--fy,52%)}
/* A moving layer is taller than its frame by exactly the overshoot, split
   between the two edges — and the rig's travel is computed from the same
   number, so the edge can never come into view. */
.bleed .ph img[data-depth]{
  position:absolute;left:0;top:calc(var(--bleed) * -1);
  width:100%;height:calc(100% + var(--bleed) * 2);
  will-change:translate;
}
.bleed__copy{
  position:absolute;z-index:2;left:calc(var(--gutter) + var(--safe-l));
  top:clamp(70px,12vh,130px);width:min(32vw,440px);color:var(--ivory);
}
.bleed__copy .lbl{color:rgba(245,242,236,.86)}
.bleed__copy h2{font-family:var(--serif);font-size:clamp(32px,3.6vw,58px);line-height:1;margin:12px 0 16px}
.bleed__copy p{color:rgba(245,242,236,.92);font-size:15px}
.bleed__shade{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(18,24,22,.5) 0%,rgba(18,24,22,.18) 30%,rgba(18,24,22,0) 44%);
}
.bleed__alt{
  position:absolute;z-index:2;right:calc(var(--gutter) + var(--safe-r));bottom:24px;
  color:rgba(245,242,236,.86);
}
/* PHONES: the portrait plate fills the screen and the words go over the sky at
   the top, so neither the photograph nor the copy is sacrificed. */
@media (max-aspect-ratio: 4/5){
  .bleed__copy{width:auto;right:calc(var(--gutter) + var(--safe-r));top:clamp(76px,14vh,140px)}
  .bleed__shade{
    background:linear-gradient(180deg,rgba(18,24,22,.62) 0%,rgba(18,24,22,.26) 34%,rgba(18,24,22,0) 54%),
               linear-gradient(0deg,rgba(18,24,22,.3) 0%,rgba(18,24,22,0) 18%);
  }
}

.pair{margin-top:clamp(70px,10vw,150px);row-gap:28px}
.pair__a{grid-column:1 / span 7}
.pair__b{grid-column:9 / span 4;margin-top:clamp(80px,12vw,200px)}
.pair__a .ph{aspect-ratio:16/9}
.pair__b .ph{aspect-ratio:4/5}      /* the plate in it IS 4:5 */
.pair__t{grid-column:2 / span 5;margin-top:clamp(30px,4vw,60px)}
.pair__t p{font-family:var(--serif);font-size:clamp(22px,2vw,32px);line-height:1.25}
@media (max-width:760px){
  .pair__a,.pair__b,.pair__t{grid-column:1 / -1;margin-top:0}
  .pair__b{width:78%;justify-self:end}
}
.lake{margin-top:clamp(70px,10vw,150px)}
/* Full-width, which is what made the 21/9 strip in the original attractive —
   but at 16/9, which is the whole photograph rather than three quarters of it. */
.lake .ph{aspect-ratio:16/9}

/* ============================================================
   D · THE DETAILS — a departure board on forest green
   ============================================================ */
.det{background:var(--forest);color:var(--ivory)}
.det .shead{border-color:var(--ivory)}
.det .lbl{color:rgba(245,242,236,.66)}
.det .alt{color:rgba(245,242,236,.6)}
.det__date{margin-bottom:clamp(44px,6vw,80px)}
.det__day{
  font-family:var(--serif);font-size:clamp(56px,9vw,150px);line-height:.85;
  letter-spacing:-.02em;font-variant-numeric:lining-nums;margin:10px 0 0;
}
.det__weekdays{
  margin:18px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;
  font-size:14px;color:rgba(245,242,236,.8);
}
.det__weekdays span+span::before{content:"·";margin-right:14px;color:rgba(245,242,236,.4)}
@media (max-width:620px){
  .det__weekdays{flex-direction:column;gap:2px}
  .det__weekdays span+span::before{content:none}
}

/* The countdown, on the same green band — a section of its own so a couple can
   switch it off without losing the date above it. */
.count{padding-block:0 clamp(60px,8vw,110px)}
.count__row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(245,242,236,.3)}
.count__unit{padding:14px 0 0 12px;border-left:1px solid rgba(245,242,236,.18)}
.count__unit:first-child{border-left:0;padding-left:0}
.count__num{
  display:block;font-family:var(--sans);font-weight:300;
  font-size:clamp(30px,4vw,58px);line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.count__lbl{
  display:block;margin-top:8px;font-family:var(--sans);font-weight:500;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,242,236,.62);
}
/* The block holds at zero rather than vanishing or counting backwards: an
   invitation is opened on the morning of the day and the week after, and a
   section that removes itself reads as a broken page on the one day it matters
   most. */
.count__over{display:none;font-family:var(--serif);font-size:clamp(24px,3vw,40px);margin:22px 0 0}
.count.is-over .count__row{display:none}
.count.is-over .count__over{display:block}

.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board caption{text-align:left;padding-bottom:12px}
.board th{
  text-align:left;font-family:var(--sans);font-weight:500;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(245,242,236,.6);
  padding:0 12px 10px 0;border-bottom:1px solid rgba(245,242,236,.4);
}
.board td{padding:16px 12px 16px 0;border-bottom:1px solid rgba(245,242,236,.16);vertical-align:baseline}
.board td.t{font-weight:500;font-size:clamp(20px,2vw,28px);letter-spacing:-.01em;width:6.5em;white-space:nowrap}
.board td.w{font-family:var(--serif);font-size:clamp(20px,2vw,30px);line-height:1.15}
/* The rows flap down like a split-flap board — gated on the table reaching the
   screen, never on load. TBODY only: the header row is not animated, so an
   unscoped `opacity: 0` here leaves "Time / Programme" invisible for ever. */
.board tbody tr{opacity:0}
.board.in tbody tr{animation:flap .7s var(--ease) forwards}
@keyframes flap{
  from{opacity:0;transform:perspective(600px) rotateX(-80deg);transform-origin:top}
  to{opacity:1;transform:none}
}
@media (max-width:620px){
  .board thead{display:none}
  .board caption{display:block;width:auto;padding-bottom:6px;border-bottom:1px solid rgba(245,242,236,.4)}
  .board,.board tbody,.board tr,.board td{display:block;width:auto}
  .board tbody tr{
    display:grid;grid-template-columns:auto 1fr;column-gap:16px;
    padding:14px 0;border-bottom:1px solid rgba(245,242,236,.16);
  }
  .board td{border:0;padding:0}
  .board td.t{width:auto;font-size:22px}
}

/* ============================================================
   D2 · WHERE — the venue, and the one link into a map app
   ============================================================ */
.place{background:var(--forest);color:var(--ivory);padding-bottom:clamp(84px,12vw,170px)}
.place .lbl{color:rgba(245,242,236,.66)}
.place__card{margin:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);
  column-gap:clamp(16px,3vw,44px);align-items:center}
.place__shot .ph{aspect-ratio:16/9;background:rgba(245,242,236,.12)}
.place__title{font-family:var(--serif);font-size:clamp(28px,3.4vw,52px);line-height:1.04;letter-spacing:0}
.place__addr{margin:14px 0 22px;color:rgba(245,242,236,.78);font-size:15px}
@media (max-width:860px){
  .place__card{grid-template-columns:1fr;row-gap:26px}
}
.btn-line{
  display:inline-flex;align-items:center;gap:12px;min-height:48px;padding:0 20px;
  border:1px solid currentColor;font-family:var(--sans);font-weight:500;font-size:11.5px;
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
  transition:background .35s,color .35s;
}
.place .btn-line:hover{background:var(--ivory);color:var(--forest)}
.btn-line[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* ============================================================
   E · THE CEREMONY
   ============================================================ */
.cer__photo{aspect-ratio:16/9}
.cer__body{margin-top:clamp(40px,5vw,80px);row-gap:36px}
.cer__lede{grid-column:1 / span 6;font-family:var(--serif);font-size:clamp(25px,2.6vw,42px);line-height:1.15}
.cer__facts{grid-column:8 / -1;margin:0}
.cer__facts div{display:grid;grid-template-columns:9em 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.cer__facts div:last-child{border-bottom:1px solid var(--line)}
.cer__facts dt{
  font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);padding-top:.25em;
}
.cer__facts dd{margin:0;font-size:16px}
.cer__still{grid-column:8 / span 4;margin:10px 0 0}
.cer__still .ph{aspect-ratio:4/5}   /* the still in it IS 4:5 */
@media (max-width:860px){
  .cer__lede,.cer__facts{grid-column:1 / -1}
  .cer__still{grid-column:1 / -1;width:72%}
  .cer__facts div{grid-template-columns:1fr;gap:2px}
}

/* ============================================================
   F · THE CELEBRATION
   ============================================================ */
.cel{background:var(--ivory-2)}
.cel__a{grid-column:1 / span 8}
.cel__a .ph{aspect-ratio:16/9}
.cel__t{grid-column:9 / -1;align-self:end}
.cel__t h3{font-family:var(--serif);font-size:clamp(26px,2.8vw,44px);line-height:1.05;margin-bottom:16px}
.cel__t p{color:var(--ink-soft)}
.cel__b{grid-column:4 / span 9;margin-top:clamp(60px,8vw,120px)}
.cel__b .ph{aspect-ratio:16/9}
.cel__c{grid-column:1 / span 3;align-self:end}
@media (max-width:860px){
  .cel .grid{row-gap:32px}
  .cel__a,.cel__t,.cel__b,.cel__c{grid-column:1 / -1;margin-top:0}
}

/* ============================================================
   G · THE REPLY
   ============================================================ */
.rsvp .grid{row-gap:40px}
.rsvp__intro{grid-column:1 / span 4}
.rsvp__intro p{color:var(--ink-soft)}
.rsvp__form{grid-column:6 / -1}
@media (max-width:860px){.rsvp__intro,.rsvp__form{grid-column:1 / -1}}
.f{margin-bottom:26px}
.f label,.f .label{
  display:block;font-family:var(--sans);font-weight:500;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;
}
.f input[type=text],.f select,.f textarea{
  width:100%;font:inherit;font-size:17px;color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid rgba(27,29,28,.35);border-radius:0;padding:10px 0;
  transition:border-color .3s;
}
.f input[type=text],.f select{height:48px}
.f select{
  appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%231B1D1C' stroke-width='1.2'/></svg>") no-repeat right 2px center;
}
.f textarea{min-height:96px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-bottom-color:var(--forest)}
.f.invalid input{border-bottom-color:#8A2E2E}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media (max-width:560px){.f2{grid-template-columns:1fr}}

/* Attendance: two large, unmistakable choices rather than a dropdown */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.chip{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;
  border:1px solid rgba(27,29,28,.3);text-align:left;
  font-family:var(--sans);font-size:16px;color:var(--ink);
  transition:border-color .3s,background .3s;
}
.chip:hover{border-color:var(--forest)}
.chip::before{
  content:"";flex:none;width:18px;height:18px;border-radius:50%;
  border:1px solid var(--ink);background:
    radial-gradient(circle,var(--forest) 0 46%,transparent 47%) no-repeat center/0 0;
  transition:background-size .35s var(--ease);
}
.chip[aria-pressed="true"]{border-color:var(--forest);background:rgba(31,51,40,.06)}
.chip[aria-pressed="true"]::before{background-size:100% 100%}
@media (max-width:400px){.choice{grid-template-columns:1fr}}

.send{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 30px;
  background:var(--forest);color:var(--ivory);
  font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  transition:background .35s;
}
.send:hover{background:var(--ink)}
.send[disabled]{opacity:.6;cursor:progress}
@media (max-width:560px){.send{width:100%}}
.rsvp__err{margin-top:16px;font-size:14px;color:#8A2E2E;opacity:0;transition:opacity .3s}
.rsvp__err.show{opacity:1}

.done{display:none}
.done.on{display:block}
.done svg{width:64px;height:64px;color:var(--forest);margin-bottom:20px}
.done circle,.done path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.done circle{stroke-dasharray:176;stroke-dashoffset:176;animation:draw 1s var(--ease) forwards}
.done path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s var(--ease) .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h3{font-family:var(--serif);font-size:clamp(30px,3.6vw,52px);line-height:1;margin-bottom:12px}
.done p{color:var(--ink-soft);max-width:44ch}
form.gone{display:none}

/* ============================================================
   H · THE LAST SCENE, AND THE COLOPHON
   ============================================================ */
.final .bleed__copy h2{font-size:clamp(38px,4.4vw,76px)}
footer.colophon{
  padding:clamp(40px,6vw,70px) 0 calc(clamp(40px,6vw,70px) + var(--safe-b));
  border-top:1px solid var(--line);
}
.colophon .inner{
  max-width:var(--maxw);margin:0 auto;
  padding-left:calc(var(--gutter) + var(--safe-l));padding-right:calc(var(--gutter) + var(--safe-r));
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 30px;align-items:baseline;
}
.colophon .serif{font-size:clamp(22px,2.4vw,34px)}

/* ============================================================
   MOTION PREFERENCES
   ------------------------------------------------------------
   Everything below the fold starts hidden, so this block has to leave the page
   VISIBLE rather than merely still. Durations are collapsed instead of
   animations being removed: across these designs the visible state is the END
   of the motion, over a base style of opacity 0, so `animation: none` renders
   blank sections.
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    transition-duration:.01ms !important;
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }
  .lift,.wipe{clip-path:none !important}
  .lift img,.wipe img{transform:none !important}
  .up{opacity:1 !important;transform:none !important}
  .mask>span{transform:none !important}
  .ouv .st{opacity:1 !important;transform:none !important}
  .board tr{opacity:1 !important}
  .done circle,.done path{stroke-dashoffset:0 !important}
}
</style>
</head>
<body>

<div id="langbar" class="hidden" aria-label="Language"></div>

<!-- ============================================================
     NAVIGATION — built from the sections actually on the page
     ============================================================ -->
<header class="nav" id="nav">
  <a class="nav__brand" href="#announce" id="navBrand" data-bind="monogram"></a>
  <button type="button" class="nav__menu lbl" id="menuBtn" aria-expanded="false" aria-controls="navLinks" data-t="menu"></button>
  <ul class="nav__links lbl" id="navLinks"></ul>
</header>

<!-- ============================================================
     A · THE OPENING FILM
     ============================================================ -->
<section class="ouv" id="hero" aria-label="Opening film">
  <picture>
    <source id="posterTall" media="(max-aspect-ratio: 1/1)" data-asset="poster-tall.jpg">
    <img class="ouv__poster" id="heroPoster" alt="" fetchpriority="high" data-asset="poster.jpg">
  </picture>
  <video class="ouv__v" id="film" muted playsinline preload="none" aria-hidden="true"></video>
  <div class="ouv__shade" aria-hidden="true"></div>

  <div class="ouv__in">
    <div class="ouv__top">
      <span class="lbl" data-bind="heroPlace"></span>
      <span class="alt" data-bind="heroAlt"></span>
    </div>

    <div class="ouv__title">
      <span class="ouv__kicker lbl st" data-bind="kicker"></span>
      <h1 class="ouv__names st" id="heroNames">
        <span data-bind="groom"></span><span class="amp" data-bind="amp"></span><span data-bind="bride"></span>
        <span class="ouv__pair2 duo">
          <span data-bind="groom2"></span><span class="amp" data-bind="amp2"></span><span data-bind="bride2"></span>
        </span>
      </h1>
      <p class="ouv__date st" data-bind="heroDate"></p>
      <div class="st">
        <a class="btn-open" id="openBtn" href="#announce">
          <span data-t="openInvitation"></span><i aria-hidden="true"></i>
        </a>
      </div>
    </div>

    <div class="ouv__side">
      <span class="lbl" data-bind="heroWhere"></span>
      <button type="button" class="ctl" id="pauseBtn" hidden data-t="pauseFilm"></button>
      <button type="button" class="ctl" id="playBtn" hidden data-t="playFilm"></button>
    </div>
  </div>
</section>

<main id="main">

<!-- ============================================================
     B · THE ANNOUNCEMENT
     ============================================================ -->
<section class="sect ann" id="announce" aria-labelledby="annTitle">
  <div class="wrap">
    <div class="shead">
      <span class="no">01</span>
      <span class="tri lbl" data-t="triAnnounce"></span>
      <h2 class="mask"><span data-t="theAnnouncement"></span></h2>
    </div>

    <div class="grid">
      <div class="ann__text">
        <dl class="ann__langs up">
          <dt>DE</dt><dd data-t="weDe"></dd>
          <dt>FR</dt><dd data-t="weFr"></dd>
          <dt>IT</dt><dd data-t="weIt"></dd>
          <dt data-t="ownLang"></dt><dd class="own" data-t="weOwn"></dd>
        </dl>
        <p class="ann__names" id="annTitle">
          <span class="mask"><span data-bind="groomFull"></span></span>
          <span class="mask"><span><span class="amp" data-bind="amp"></span><span data-bind="brideFull"></span></span></span>
          <span class="duo"><span class="dot" aria-hidden="true">·</span></span>
          <span class="mask duo"><span data-bind="groomFull2"></span></span>
          <span class="mask duo"><span><span class="amp" data-bind="amp2"></span><span data-bind="brideFull2"></span></span></span>
        </p>
        <p class="ann__lede up" data-bind="annLede" data-hide-empty></p>
      </div>

      <figure class="ann__fig">
        <div class="ph lift ann__photo">
          <!-- No portrait source here: this frame is 16/9 at every width, so
               the tall plate would be a 9:16 picture in a 16:9 box — measured
               at 390px, 31% of the photograph. The tall plates are for the
               sections that FILL the screen, below. -->
          <img loading="lazy" decoding="async" data-asset="terrace.jpg" alt="" style="--fy:56%">
        </div>
        <figcaption class="cap"><b data-t="fig01"></b><span data-t="fig01cap"></span></figcaption>
      </figure>
    </div>
  </div>
</section>

<!-- ============================================================
     C · THE STORY
     ============================================================ -->
<section id="story" data-opt="story" aria-labelledby="storyTitle">
  <div class="bleed bleed--full">
    <div class="ph">
      <picture>
        <source media="(max-aspect-ratio: 1/1)" data-asset="meadow-tall.jpg">
        <img loading="lazy" decoding="async" data-asset="meadow.jpg" data-depth="0.04" alt="" style="--fy:54%">
      </picture>
    </div>
    <div class="bleed__shade" aria-hidden="true"></div>
    <div class="bleed__copy">
      <span class="lbl" data-t="triStory"></span>
      <h2 id="storyTitle" class="mask"><span data-bind="storyTitle"></span></h2>
      <p class="up" data-bind="storyBody" data-hide-empty></p>
    </div>
    <span class="bleed__alt alt" data-bind="storyAlt"></span>
  </div>

  <div class="wrap">
    <div class="grid pair">
      <figure class="pair__a" style="margin:0">
        <div class="ph lift">
          <img loading="lazy" decoding="async" data-asset="path.jpg" alt="" style="--fy:54%">
        </div>
        <figcaption class="cap"><b data-t="fig02"></b><span data-t="fig02cap"></span></figcaption>
      </figure>
      <figure class="pair__b" style="margin:0">
        <div class="ph lift">
          <img loading="lazy" decoding="async" data-asset="veil.jpg" alt="">
        </div>
        <figcaption class="cap"><b data-t="fig03"></b><span data-t="fig03cap"></span></figcaption>
      </figure>
      <div class="pair__t up" data-hide-empty>
        <p data-bind="pairText"></p>
      </div>
    </div>

    <figure class="lake" style="margin-left:0;margin-right:0">
      <div class="ph wipe">
