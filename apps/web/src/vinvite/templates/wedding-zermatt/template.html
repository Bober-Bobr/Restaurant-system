  var bride = loc(cfg('couple.bride', ''));
  var groomFull = loc(cfg('couple.groomFull', '')) || groom;
  var brideFull = loc(cfg('couple.brideFull', '')) || bride;
  var couple = (groom && bride) ? (groom + ' & ' + bride) : (groom || bride);
  var coupleFull = (groomFull && brideFull) ? (groomFull + ' & ' + brideFull) : (groomFull || brideFull);

  /* A SECOND couple — a double wedding, two pairs married the same evening.
     Optional: with the fields empty `pair2` is '', nothing below adds a
     separator and `has-duo` is never set, so the page is exactly what it was.

     The pairs are joined by a MIDDOT and never by a second ampersand: the
     ampersand already means "these two are marrying each other", and used
     again it turns four names into one list of four people. */
  var groom2 = loc(cfg('couple.groom2', ''));
  var bride2 = loc(cfg('couple.bride2', ''));
  var groomFull2 = loc(cfg('couple.groomFull2', '')) || groom2;
  var brideFull2 = loc(cfg('couple.brideFull2', '')) || bride2;
  var pair2 = (groom2 && bride2) ? (groom2 + ' & ' + bride2) : (groom2 || bride2);
  var pairFull2 = (groomFull2 && brideFull2) ? (groomFull2 + ' & ' + brideFull2) : (groomFull2 || brideFull2);
  var bothPairs = couple + (pair2 ? '  ·  ' + pair2 : '');

  var town = loc(cfg('venue.town', ''));
  var region = loc(cfg('venue.region', ''));
  var venueName = loc(cfg('venue.name', ''));
  var initials = (groom ? groom.charAt(0) : '') + ' & ' + (bride ? bride.charAt(0) : '');

  var map = {
    monogram: initials.trim() === '&' ? '' : initials,

    /* One key per line, deliberately: the orphan sweep in
       `templatePhotoSlots.test.ts` reads this object line by line, so two keys
       sharing a line hide the second one from it. */
    groom: groom,
    bride: bride,
    groom2: groom2,
    bride2: bride2,
    groomFull: groomFull,
    brideFull: brideFull,
    groomFull2: groomFull2,
    brideFull2: brideFull2,
    amp: loc(cfg('invite.amp', '')) || '&',
    /* The second pair's connector, bound separately so a pair with only one
       name typed so far prints no dangling ampersand. */
    amp2: (groom2 && bride2) ? (loc(cfg('invite.amp', '')) || '&') : '',

    heroPlace: [town, region, loc(cfg('venue.country', ''))].filter(Boolean).join('  ·  '),
    heroAlt: loc(cfg('venue.altitude', '')),
    heroWhere: [town, region].filter(Boolean).join(', '),
    heroDate: fmtDots(),
    kicker: loc(cfg('invite.kicker', '')),

    dateDots: fmtDots(),
    annLede: loc(cfg('invite.lede', '')),

    storyTitle: loc(cfg('story.title', '')),
    storyBody: loc(cfg('story.body', '')),
    storyAlt: loc(cfg('story.altitude', '')),
    pairText: loc(cfg('story.quote', '')),

    venueName: venueName,
    venueAddress: loc(cfg('venue.address', '')),

    cerLede: loc(cfg('ceremony.lede', '')),

    eveningTitle: loc(cfg('evening.title', '')),

    celTitle: loc(cfg('celebration.title', '')),
    celBody: loc(cfg('celebration.body', '')),
    celAlt: loc(cfg('celebration.altitude', '')),

    rsvpLede: loc(cfg('rsvp.lede', '')),
    replyBy: loc(cfg('rsvp.by', '')),

    finaleTitle: loc(cfg('finale.title', '')),
    finaleMsg: loc(cfg('finale.message', '')),
    finaleAlt: loc(cfg('finale.altitude', '')),

    colophonL: bothPairs,
    colophonR: fmtDots() + (town ? '  ·  ' + town : '')
  };

  $$('[data-bind]').forEach(function (el) {
    var v = map[el.getAttribute('data-bind')];
    if (v != null) el.textContent = v;
  });
  $$('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
  $$('[data-t-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-t-aria'))); });

  var names = $('#heroNames');
  if (names) names.setAttribute('aria-label', bothPairs);

  /* One class reveals every `.duo` element on the page, rather than each site
     deciding for itself. add/remove rather than toggle(force) so it behaves
     identically in the build's DOM shim. */
  if (pair2) document.documentElement.classList.add('has-duo');
  else document.documentElement.classList.remove('has-duo');
  document.title = bothPairs || 'Invitation';
  document.documentElement.lang = lang;
}

/* ── Artwork ─────────────────────────────────────────────────────────────── */
/* Set from script rather than in the markup, because every URL depends on
   __ORIGIN__, which only exists once the bootstrap has run. The <source>
   elements are bound here too: a `<picture>` whose portrait source has no
   `srcset` would quietly fall back to the landscape plate on a phone, which is
   the crop this design is built to avoid. */
function bindArtwork() {
  $$('source[data-asset]').forEach(function (s) {
    var url = asset(s.getAttribute('data-asset'));
    if (s.getAttribute('srcset') !== url) s.setAttribute('srcset', url);
  });
  $$('img[data-asset]').forEach(function (img) {
    /* `data-photo` marks the bundled plate the honoree may replace — the venue,
       so a couple can show the chalet they are actually marrying at. It names a
       config path; when that holds a URL it wins, and when it is empty the
       bundled default stands, so an invitation nobody has touched is unchanged.

       The swap lives HERE rather than in renderPlace() because every image on
       the page is bound in this one pass, and a second place that also set
       `src` would race this one on every config push in the editor. */
    var custom = img.getAttribute('data-photo') ? String(cfg(img.getAttribute('data-photo'), '') || '').trim() : '';
    var url = custom || asset(img.getAttribute('data-asset'));
    if (img.getAttribute('src') !== url) img.setAttribute('src', url);
    /* An uploaded photograph cannot inherit this plate's art direction. */
    img.classList.toggle('is-custom', !!custom);
  });
}

/* ── The weekday, in Switzerland's languages and the reader's ────────────── */
function renderWeekdays() {
  var host = $('#weekdays');
  if (!host) return;
  host.innerHTML = '';
  /* Four readings of one date. The three Swiss ones are the design; the fourth
     is the reader's own, so whoever is holding the invitation can read it. */
  var set = [['de', 'de-CH'], ['fr', 'fr-CH'], ['it', 'it-CH'], [lang, intlLocale()]];
  var seen = {};
  set.forEach(function (pair) {
    if (seen[pair[0]]) return;
    seen[pair[0]] = true;
    var text = fmt({ weekday: 'long', day: 'numeric', month: 'long' }, pair[1]);
    if (!text) return;
    var span = document.createElement('span');
    span.setAttribute('lang', pair[0]);
    span.textContent = text;
    host.appendChild(span);
  });
}

/* ── The departure board ─────────────────────────────────────────────────── */
/* Two columns, not three. The builder's schedule editor holds a time and a
   label, so a "Where" column would be content nobody could change — and an
   uneditable column of invented places is worse than no column. */
function renderBoard() {
  var host = $('#boardBody');
  if (!host) return;
  host.innerHTML = '';
  var raw = cfg('schedule', []);
  var items = Array.isArray(raw) ? raw.filter(function (s) {
    return s && (String(s.time || '').trim() || loc(s.label));
  }) : [];
  items.forEach(function (item, i) {
    var tr = document.createElement('tr');
    /* The flap is staggered row by row. Set inline because the number of rows
       is the couple's own decision, so no stylesheet can know it. */
    tr.style.animationDelay = (i * 110) + 'ms';
    var td1 = document.createElement('td');
    td1.className = 't';
    td1.textContent = String(item.time || '').trim() || '·';
    var td2 = document.createElement('td');
    td2.className = 'w';
    td2.textContent = loc(item.label);
    tr.appendChild(td1); tr.appendChild(td2);
    host.appendChild(tr);
  });
  var board = $('#board');
  if (board) board.classList.toggle('card-off', items.length === 0);
}

/* ── The ceremony's particulars ──────────────────────────────────────────── */
/* A row with no value is a labelled empty line, so it is not written at all —
   which is also how a couple drops one: by clearing the field. */
function renderFacts() {
  var host = $('#cerFacts');
  if (!host) return;
  host.innerHTML = '';
  var rows = [
    [t('dTime'), fmtTime() + '  ·  ' + fmtDateLong()],
    [t('dDress'), loc(cfg('dress.title', ''))],
    [t('dWeather'), loc(cfg('ceremony.weather', ''))],
    [t('dTravel'), loc(cfg('travel.title', ''))],
    [t('dStay'), loc(cfg('stay.title', ''))]
  ];
  rows.forEach(function (r) {
    if (!String(r[1] || '').trim()) return;
    var row = document.createElement('div');
    var dt = document.createElement('dt'); dt.textContent = r[0];
    var dd = document.createElement('dd'); dd.textContent = r[1];
    row.appendChild(dt); row.appendChild(dd);
    host.appendChild(row);
  });
}

/* ── Where ───────────────────────────────────────────────────────────────── */
function renderPlace() {
  var btn = $('#mapBtn');
  if (!btn) return;
  var url = String(cfg('venue.mapUrl', '') || '').trim();
  if (!url) {
    /* Most couples will not paste a map link. Building a search out of the
       address is what makes the button work anyway — and a button that exists
       and does nothing is worse than no button. */
    var q = loc(cfg('venue.address', '')) || loc(cfg('venue.name', ''));
    url = q ? 'https://yandex.com/maps/?text=' + encodeURIComponent(q) : '';
  }
  if (url) { btn.setAttribute('href', url); btn.removeAttribute('aria-disabled'); }
  else { btn.removeAttribute('href'); btn.setAttribute('aria-disabled', 'true'); }
  /* Nothing to show and nowhere to go — hide the whole block rather than leave
     a titled empty card. `applyVisibility` handles the explicit switch; this is
     the "never filled in" case. */
  var sec = $('#place');
  if (sec && !loc(cfg('venue.name', '')) && !loc(cfg('venue.address', '')) && !url) {
    sec.classList.add('card-off');
  } else if (sec) {
    sec.classList.remove('card-off');
  }
}

/* ── The countdown ───────────────────────────────────────────────────────── */
var cdTimer = null;
function cdSet(sel, n) {
  var el = $(sel);
  if (!el) return;
  var str = pad2(n);
  /* Only when it CHANGES: four assignments a second re-lay-out the row, and
     the seconds column drags the other three with it. */
  if (el.textContent !== str) el.textContent = str;
}
function renderCountdown() {
  var sec = $('#countdown');
  if (!sec) return;
  var left = Math.floor((eventDate().getTime() - Date.now()) / 1000);
  sec.classList.toggle('is-over', left <= 0);
  if (left < 0) left = 0;
  cdSet('#cdDays', Math.floor(left / 86400));
  cdSet('#cdHours', Math.floor(left / 3600) % 24);
  cdSet('#cdMins', Math.floor(left / 60) % 60);
  cdSet('#cdSecs', left % 60);
}
function initCountdown() {
  if (!$('#countdown')) return;
  /* Cleared first so the interval can never be started twice — this is called
     from the boot, and a boot that is retried would otherwise leave two timers
     writing the same four numbers. */
  if (cdTimer) clearInterval(cdTimer);
  renderCountdown();
  cdTimer = setInterval(renderCountdown, 1000);
}

/* ── Navigation ──────────────────────────────────────────────────────────── */
/* Built from the sections that are actually on the page. A link to a section
   the couple switched off scrolls a guest to nothing, which is worse than a
   shorter menu — the same rule the lantern rail on another design follows. */
var NAV = [
  ['story', 'navStory'], ['details', 'navDetails'], ['place', 'navPlace'],
  ['ceremony', 'navCeremony'], ['celebration', 'navCelebration'], ['rsvp', 'navReply']
];
var navObs = null;
function renderNav() {
  var host = $('#navLinks');
  if (!host) return;
  host.innerHTML = '';
  var live = [];
  NAV.forEach(function (entry) {
    var sec = $('#' + entry[0]);
    if (!sec || sec.classList.contains('opt-off') || sec.classList.contains('card-off')) return;
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.setAttribute('href', '#' + entry[0]);
    a.textContent = t(entry[1]);
    li.appendChild(a);
    host.appendChild(li);
    live.push(sec);
  });
  if (navObs) { navObs.disconnect(); navObs = null; }
  if (!live.length || typeof IntersectionObserver === 'undefined') return;
  navObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      $$('#navLinks a').forEach(function (a) {
        a.setAttribute('aria-current', a.getAttribute('href') === '#' + e.target.id ? 'true' : 'false');
      });
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  live.forEach(function (s) { navObs.observe(s); });
}

function initNav() {
  var nav = $('#nav'), btn = $('#menuBtn'), host = $('#navLinks');
  if (!nav || !btn) return;
  function setMenu(open) {
    nav.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.textContent = open ? t('close') : t('menu');
    /* The seal owns `body.overflow` while the invitation is unopened, so the
       menu only ever touches it afterwards. */
    document.body.style.overflow = open ? 'hidden' : '';
  }
  btn.addEventListener('click', function () { setMenu(btn.getAttribute('aria-expanded') !== 'true'); });
  if (host) host.addEventListener('click', function (e) {
    if (e.target && e.target.closest && e.target.closest('a')) setMenu(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && nav.classList.contains('menu-open')) { setMenu(false); if (btn.focus) btn.focus(); }
  });
}

/* ── Reveal on scroll ────────────────────────────────────────────────────── */
/* Every entrance below the fold is gated on intersection — including the
   board's split-flap, which on load would have finished before anybody had
   scrolled to it. Without an observer, or inside the Design+ editor which must
   see every section at once, everything is revealed rather than left invisible. */
var revObs = null, frameObs = null;
function revealEverything() {
  $$('.up,.mask,.board,.lift,.wipe').forEach(function (el) { el.classList.add('in'); });
}
function initObserver() {
  if (ADMIN_EDIT || reduced || typeof IntersectionObserver === 'undefined') {
    revealEverything();
    return;
  }
  revObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      revObs.unobserve(e.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -5% 0px' });
  $$('.up,.mask,.board').forEach(function (el) { revObs.observe(el); });

  /* A clipped plate starts FULLY CLIPPED, and a fully clipped element never
     counts as visible to an IntersectionObserver — so watching the plate
     itself means it can never reveal. Watch its unclipped frame instead. */
  frameObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      (e.target.__reveals || []).forEach(function (el) { el.classList.add('in'); });
      frameObs.unobserve(e.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });
  $$('.lift,.wipe').forEach(function (el) {
    var host = (el.closest && el.closest('figure')) || el.parentElement || el;
    if (!host.__reveals) host.__reveals = [];
    host.__reveals.push(el);
    frameObs.observe(host);
  });
}

/* ── The film ────────────────────────────────────────────────────────────── */
/* The tracking shot onto the terrace is the whole opening beat, and it is also
   ~8 MB. It is not loaded at all when the guest has asked for less motion or
   is on a metered connection — the poster frame is the same shot, so the
   opening still reads.

   There are TWO cuts of it, landscape and portrait, and the portrait one is
   not a nicety: a 16:9 film in a 9:16 screen shows about a quarter of the
   frame. Which one is fetched is decided by the aspect ratio of the screen,
   and only one is ever downloaded. */
var hero = $('#hero'), film = $('#film');
var heroPoster = $('#heroPoster');
var arrived = false, filmWatch = 0, filmDead = false;

function arrive() {
  if (arrived) return;
  arrived = true;
  if (hero) hero.classList.add('is-cover');
}

function saveData() {
  var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  return !!(c && (c.saveData || /^([23]g|slow-2g)$/.test(c.effectiveType || '')));
}

/* ── How long the opening runs ────────────────────────────────────────────
   The film is 8 seconds, and for a guest that is 8 seconds of waiting before
   the invitation can be read — every time the link is opened, not only the
   first. So the opening is cut.

   It is cut by playing the film FASTER, not by trimming the file. The same mp4
   supplies the poster frame and the still that stands in under reduced motion
   and on a slow connection, and the camera move has to reach its end: the
   opening comes to rest on the final frame, so stopping early would leave it
   resting half way along the terrace.

   The moment the cover type lands stays a FRACTION of the film rather than a
   number of seconds, so it still falls on the same moment of the shot whatever
   the rate is — and the safety net below is derived from the rate for the same
   reason. Both are one-line adjustments; nothing else reads the film's length. */
var INTRO_RATE = 1.5;

/* ── WHETHER THIS BROWSER CAN DECODE THE FILM AT ALL ──────────────────────
   Both cuts are HEVC (`hvc1`), with no H.264 version — as is every other film
   in this product, which all came from the same generator. HEVC in MP4 is
   decoded by Safari and by Chrome where the PLATFORM provides it (Windows with
   the HEVC extension, most Android hardware); plain Chrome on Linux and
   Firefox cannot touch it. Verified in this Chrome: canPlayType for
   `video/mp4` is "maybe" and for `video/mp4; codecs="hvc1"` is "".

   Asked BEFORE the src is set, because the alternative is a guest downloading
   8 MB over mobile data and then being shown the poster anyway. The poster is
   a frame of the same shot, so nothing about the opening is lost but the move.

   The test is deliberately two-sided: a flat "" is only taken as a refusal
   when the browser also answers for plain mp4, so an engine with a useless
   `canPlayType` still gets to try. */
var FILM_TYPE = 'video/mp4; codecs="hvc1"';
function filmDecodable(el) {
  if (!el || !el.canPlayType) return true;
  if (el.canPlayType(FILM_TYPE)) return true;
  return !el.canPlayType('video/mp4');
}

function filmFile() { return portrait() ? 'film-tall.mp4' : 'film.mp4'; }

function showPoster() {
  /* No film, or none wanted: the poster is the same shot, so take the video
     element out entirely — an empty <video> is a black box in some engines. */
  if (film) film.classList.add('hidden');
  if (hero) hero.classList.remove('is-playing');
  var pause = $('#pauseBtn'), play = $('#playBtn');
  if (pause) pause.hidden = true;
  if (play) play.hidden = true;
  arrive();
}

function initFilm() {
  if (!film) { arrive(); return; }
  if (reduced || ADMIN_EDIT || saveData() || !filmDecodable(film)) { showPoster(); return; }

  var pause = $('#pauseBtn'), play = $('#playBtn');

  film.addEventListener('loadeddata', function () {
    /* The poster is opaque above the film until this fires, so there is nothing
       to un-hide — the video element is in the page from the start. It was
       `display:none` here at first, and a hidden video is not guaranteed to
       reach `loadeddata` at all, which left the hero on its poster for ever. */
    if (hero) hero.classList.add('is-playing');
    if (pause) pause.hidden = false;
  });
  film.addEventListener('error', function () { filmDead = true; showPoster(); });
  film.addEventListener('ended', function () {
    arrive();
    if (pause) pause.hidden = true;
    if (play) { play.hidden = false; play.textContent = t('replayFilm'); }
    /* Hold the final frame rather than looping back to the start of the move. */
    try { film.pause(); film.currentTime = Math.max(0, film.duration - 0.05); } catch (e) {}
  });

  /* Set in both places on purpose: some engines reset it across load(). */
  film.playbackRate = INTRO_RATE;
  film.addEventListener('loadedmetadata', function () { film.playbackRate = INTRO_RATE; });

  if (pause) pause.addEventListener('click', function () {
    try { film.pause(); } catch (e) {}
    pause.hidden = true;
    if (play) { play.hidden = false; play.textContent = t('playFilm'); }
  });
  if (play) play.addEventListener('click', function () {
    if (filmDead) return;
    if (film.ended) { try { film.currentTime = 0; } catch (e) {} }
    var r = film.play ? film.play() : null;
    if (r && r.then) r.then(function () {
      play.hidden = true;
      if (pause) pause.hidden = false;
    }, function () {});
  });

  loadFilm();

  /* Land the cover type as the camera comes to rest, not after a hard cut. */
  filmWatch = setInterval(function () {
    if (!film.duration) return;
    if (film.currentTime > film.duration * 0.6) { clearInterval(filmWatch); arrive(); }
  }, 120);
  setTimeout(arrive, Math.round(9000 / INTRO_RATE));   // safety net if the video never plays at all
}

function loadFilm() {
  if (!film) return;
  var url = asset(filmFile());
  if (film.getAttribute('src') === url) return;
  film.setAttribute('src', url);
  try { film.load(); } catch (e) {}
  /* The rate is NOT re-set here: `load()` is what resets it, and the
     `loadedmetadata` listener in initFilm is what puts it back. A third
     assignment on this line would be a second answer to the same question. */
  var p = film.play ? film.play() : null;
  if (p && p.catch) p.catch(function () {
    /* Autoplay refused — a muted film usually is not, but low-power mode does.
       Offer it instead of leaving a frozen first frame. */
    var play = $('#playBtn');
    if (play) { play.hidden = false; play.textContent = t('playFilm'); }
    arrive();
  });
}

/* A phone turned on its side changes which cut fits. Swapping keeps the
   position so the opening is not restarted under the reader. */
var wasPortrait = portrait();
function onOrientation() {
  if (filmDead || !film || film.classList.contains('hidden')) return;
  var now = portrait();
  if (now === wasPortrait) return;
  wasPortrait = now;
  var at = film.currentTime, playing = !film.paused;
  film.setAttribute('src', asset(filmFile()));
  film.addEventListener('loadedmetadata', function once() {
    film.removeEventListener('loadedmetadata', once);
    film.playbackRate = INTRO_RATE;
    try { film.currentTime = Math.min(at, (film.duration || at) - 0.1); } catch (e) {}
    if (playing && film.play) { var p = film.play(); if (p && p.catch) p.catch(function () {}); }
  });
  try { film.load(); } catch (e) {}
}

/* ── The seal ────────────────────────────────────────────────────────────── */
/* The page is held on the opening until the invitation is opened — but ANY
   scroll, swipe or key opens it, so nobody is ever trapped, and the lock is
   put on from script so a dead script leaves an ordinary scrollable page. */
var opened = false;
function openInvitation(e, targetId) {
  if (e && e.preventDefault) e.preventDefault();
  if (opened) return;
  opened = true;
  document.body.classList.remove('is-sealed');
  if (hero) hero.classList.add('is-opened');
  removeSealListeners();
  startMusic();                 // the gesture that opened it is the one autoplay needs
  var dest = $('#' + (targetId || 'announce')) || $('#announce');
  var nav = $('#nav');
  setTimeout(function () {
    if (dest && dest.scrollIntoView) dest.scrollIntoView({ behavior: (reduced || targetId) ? 'auto' : 'smooth' });
    if (nav) nav.classList.add('on');
  }, (reduced || targetId) ? 0 : 350);
}
var onWheel = function (e) { if (e.deltaY > 4) openInvitation(); };
var touchY = null;
var onTouchStart = function (e) { touchY = e.touches && e.touches[0] ? e.touches[0].clientY : null; };
var onTouchMove = function (e) {
  if (touchY === null || !e.touches || !e.touches[0]) return;
  if (touchY - e.touches[0].clientY > 24) openInvitation();
};
var onKey = function (e) {
  if (['ArrowDown', 'PageDown', ' ', 'End'].indexOf(e.key) !== -1 && document.activeElement === document.body) {
    openInvitation(e);
  }
};
function removeSealListeners() {
  window.removeEventListener('wheel', onWheel);
  window.removeEventListener('touchstart', onTouchStart);
  window.removeEventListener('touchmove', onTouchMove);
  window.removeEventListener('keydown', onKey);
}
function initSeal() {
  var btn = $('#openBtn');
  if (btn) btn.addEventListener('click', function (e) { openInvitation(e); });
  /* The editor must never be sealed: it scrolls the page itself. */
  if (ADMIN_EDIT) { opened = true; var nav = $('#nav'); if (nav) nav.classList.add('on'); return; }
  document.body.classList.add('is-sealed');
  window.addEventListener('wheel', onWheel, { passive: true });
  window.addEventListener('touchstart', onTouchStart, { passive: true });
  window.addEventListener('touchmove', onTouchMove, { passive: true });
  window.addEventListener('keydown', onKey);
}

/* ── Visibility ──────────────────────────────────────────────────────────── */
function applyVisibility() {
  var hid = cfg('hidden', {}) || {};
  $$('[data-opt]').forEach(function (el) {
    el.classList.toggle('opt-off', hid[el.getAttribute('data-opt')] === true);
  });
}

/* ── Music ───────────────────────────────────────────────────────────────── */
var audio = $('#audio'), musicBtn = $('#music-btn'), musicRetry = false;
var RETRY_EVENTS = ['pointerdown', 'touchstart', 'keydown', 'scroll'];

/* `musicOff` is the guest's own decision, and it outranks every automatic
   start below. Without it, pressing pause and then scrolling would restart the
   track — the retry listeners are still armed, and a scroll is a gesture. */
var musicOff = false;

function startMusic() {
  if (musicOff) return;
  if (!audio || !audio.getAttribute('src') || !audio.paused) return;
  var p = audio.play ? audio.play() : null;
  if (p && p.then) p.then(setPressed, armMusicRetry); else setPressed();
}
function setPressed() {
  if (musicBtn) musicBtn.setAttribute('aria-pressed', 'true');
}
function armMusicRetry() {
  if (musicRetry) return;
  musicRetry = true;
  var retry = function () {
    if (musicOff) return;
    var p = audio.play();
    var stop = function () {
      setPressed();
      RETRY_EVENTS.forEach(function (ev) { window.removeEventListener(ev, retry); });
    };
    if (p && p.then) p.then(stop, function () {}); else stop();
  };
  RETRY_EVENTS.forEach(function (ev) { window.addEventListener(ev, retry); });
}
/* Autoplay is best-effort by necessity — every current browser refuses to
   start audible media without a user gesture — so this attempts it on load
   and, when that is refused, `armMusicRetry` starts the track on the guest's
   FIRST tap, key or scroll. */
function initMusic() {
  if (musicBtn) musicBtn.addEventListener('click', function () {
    if (!audio || !audio.getAttribute('src')) return;
    if (audio.paused) { musicOff = false; startMusic(); }
    else { musicOff = true; audio.pause(); musicBtn.setAttribute('aria-pressed', 'false'); }
  });
  startMusic();
}
function renderMusic() {
  if (!audio || !musicBtn) return;
  var url = cfg('music.url', '');
  var hid = cfg('hidden', {}) || {};
  if (!url || hid.music === true) {
    audio.removeAttribute('src');
    musicBtn.classList.add('hidden');
    return;
  }
  if (audio.getAttribute('src') !== url) audio.setAttribute('src', url);
  musicBtn.classList.remove('hidden');
}

/* ── Parallax — one rAF loop for every layer ─────────────────────────────── */
/* The independent `translate` property, never `transform`, so a moving layer
   never fights the reveal transitions, which animate `transform`.

   THE TRAVEL IS DERIVED FROM THE OVERSHOOT, and that is the whole reason the
   overshoot can be as small as 6%.

   The obvious way to write this — offset = (how far the section's centre is
   from the viewport's) x depth — measures the move against a box that has
   nothing to do with the size of the layer being moved, so the only safe
   overshoot is a guess, and the guess has to be generous. A generous overshoot
   is a permanent crop on every plate that moves.

   So the frame's own progress ACROSS THE VIEWPORT drives it — 0 as the frame
   comes up past the fold, 1 as it leaves the top — and the offset spans
   exactly the overshoot. `data-depth` is then a signed strength: ±0.04 is the
   full span, a smaller magnitude is a gentler move, and the sign is the
   direction. No viewport size can expose an edge. */
var BLEED = 0.04;            /* must match --bleed in the stylesheet */
var FULL_DEPTH = 0.04;       /* the depth that uses the whole overshoot */
var layers = [];
function collectLayers() {
  layers = [];
  $$('[data-depth]').forEach(function (el) {
    layers.push({
      el: el,
      d: parseFloat(el.getAttribute('data-depth')) || 0,
      /* THE FRAME IS `.ph`, NOT THE PARENT NODE. Every moving layer here is
         inside a `<picture>`, which is `display: contents` and therefore has no
         box at all — `getBoundingClientRect()` on it returns a height of 0, and
         the rig skips a zero-height frame, so with `parentElement` the parallax
         was simply dead on every one of these sections. Measured: peak travel
         0.0px at all four widths. */
      frame: (el.closest && el.closest('.ph')) || el.parentElement || el
    });
  });
}
function paint() {
  var vh = window.innerHeight || 800;
  for (var i = 0; i < layers.length; i++) {
    var L = layers[i];
    var r = L.frame.getBoundingClientRect ? L.frame.getBoundingClientRect() : null;
    if (!r || !r.height) continue;
    if (r.bottom < -200 || r.top > vh + 200) continue;
    var progress = (vh - r.top) / (vh + r.height);
    if (progress < 0) progress = 0; else if (progress > 1) progress = 1;
    /* 0.98, not the whole overshoot: at exactly the allowance the layer's edge
       lands exactly on the frame's, and sub-pixel rounding there shows a
       hairline of background along one side. */
    var allow = r.height * BLEED * 0.98;
    var off = (0.5 - progress) * 2 * allow * (L.d / FULL_DEPTH);
    if (off > allow) off = allow; else if (off < -allow) off = -allow;
    L.el.style.translate = '0 ' + off.toFixed(1) + 'px';
  }
}
var queuedPaint = false;
function onScroll() {
  var nav = $('#nav');
  if (nav && opened) nav.classList.toggle('on', (window.scrollY || 0) > (window.innerHeight || 800) * 0.6);
  if (queuedPaint) return;
  queuedPaint = true;
  requestAnimationFrame(function () { queuedPaint = false; paint(); });
}

/* ── RSVP ────────────────────────────────────────────────────────────────── */
var attending = true;
var rsvpPending = null;

function initRsvp() {
  var form = $('#rsvpForm');
  var success = $('#rsvpSuccess'), guestField = $('#guestField');

  $$('#attendRow .chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      $$('#attendRow .chip').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      chip.setAttribute('aria-pressed', 'true');
      attending = chip.getAttribute('data-attend') === 'yes';
      /* Nobody is asked how many people are not coming. */
      if (guestField) guestField.style.display = attending ? '' : 'none';
    });
  });

  if (!form) return;
  form.addEventListener('submit', function (e) {
    if (e.preventDefault) e.preventDefault();
    var nameInput = $('#rsvpName');
    var field = (nameInput && nameInput.closest) ? nameInput.closest('.f') : null;
    var name = ((nameInput && nameInput.value) || '').trim();
    if (!name) {
      if (field) field.classList.add('invalid');
      if (nameInput && nameInput.focus) nameInput.focus();
      return;
    }
    if (field) field.classList.remove('invalid');
    var err = $('#rsvpErr');
    if (err) err.classList.remove('show');

    var guestsInput = $('#rsvpGuests'), msgInput = $('#rsvpMsg');
    var payload = {
      name: name,
      attending: attending,
      guests: attending ? (parseInt(guestsInput && guestsInput.value, 10) || 1) : 0,
      message: ((msgInput && msgInput.value) || '').trim() || undefined
    };

    var btn = $('#rsvpSubmit'), label = btn ? btn.querySelector('span') : null;
    if (btn) btn.disabled = true;
    if (label) label.textContent = t('sending');

    new Promise(function (resolve, reject) {
      /* If no parent answers within 2.5s (the editor preview does not), treat
         it as saved rather than showing the guest a failure. */
      var timer = setTimeout(function () { rsvpPending = null; resolve(); }, 2500);
      rsvpPending = { resolve: resolve, reject: reject, timer: timer };
      window.parent.postMessage({ type: 'vinvite:rsvp', payload: payload }, '*');
    }).then(function () {
      var text = $('#successText');
      if (text) text.textContent = attending ? t('savedYes') : t('savedNo');
      form.classList.add('gone');
      if (success) {
        success.classList.add('on');
        if (success.focus) success.focus();
      }
    }, function () {
      if (err) err.classList.add('show');
    }).then(function () {
      if (btn) btn.disabled = false;
      if (label) label.textContent = t('send');
    });
  });
}

/* ── Platform credit ─────────────────────────────────────────────────────── */
var SVG_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.1 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6A2 2 0 0 1 22 16.9z"/></svg>';
var SVG_TG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.8 18.6l.3-4.2 7.7-6.9c.3-.3-.1-.5-.5-.2L7.7 13.2 3.6 11.9c-.9-.3-.9-.9.2-1.3l16-6.2c.7-.3 1.4.2 1.1 1.3l-2.7 12.8c-.2.9-.7 1.1-1.5.7l-4.1-3-2 2c-.2.2-.4.4-.8.4z"/></svg>';
var SVG_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>';

function renderPlatformContacts() {
  var host = $('#vcContacts');
  if (!host) return;
  var c = window.__CONTACTS__ || {};
  host.innerHTML = '';
  function link(href, label, svg) {
    var a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = svg + '<span>' + label + '</span>';
    host.appendChild(a);
  }
  var phone = (c.phone || '').trim(), tg = (c.telegram || '').trim(), ig = (c.instagram || '').trim();
  if (phone) link('tel:' + phone.replace(/[^\d+]/g, ''), phone, SVG_PHONE);
  if (tg) link(tg.indexOf('http') === 0 ? tg : 'https://t.me/' + tg.replace(/^@/, ''),
    tg.replace(/^https?:\/\/t\.me\//, '@').replace(/^@?/, '@'), SVG_TG);
  if (ig) link(ig.indexOf('http') === 0 ? ig : 'https://instagram.com/' + ig.replace(/^@/, ''),
    ig.replace(/^https?:\/\/(www\.)?instagram\.com\//, '@').replace(/^@?/, '@'), SVG_IG);

  var logo = $('#vconnectLogo');
  if (logo && !logo.getAttribute('src')) logo.setAttribute('src', ORIGIN + '/v-invite-logo.png');
}

/* ── Language bar ────────────────────────────────────────────────────────── */
function renderLangbar() {
  var bar = $('#langbar');
  if (!bar) return;
  bar.innerHTML = '';
  if (LANGS.length < 2) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  LANGS.forEach(function (l) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(l).toUpperCase();
    b.className = (l === lang) ? 'active' : '';
    b.addEventListener('click', function () {
      if (lang === l) return;
      lang = l;
      renderAll();
    });
    bar.appendChild(b);
  });
}

/* ── Host bridge ─────────────────────────────────────────────────────────── */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'vinvite:rsvp-ok' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.resolve(); rsvpPending = null; }
  if (d.type === 'vinvite:rsvp-err' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.reject(); rsvpPending = null; }
  if (d.type === 'vinvite:config') {
    if (d.contacts) window.__CONTACTS__ = d.contacts;
    CONFIG = d.config || CONFIG;
    if (d.languages && d.languages.length) {
      LANGS = d.languages;
      if (LANGS.indexOf(lang) === -1) lang = LANGS[0];
    }
    renderAll();
  }
  /* The editor jumped to a section being edited: every entrance must already
     have played, or the admin is looking at a blank page. */
  if (d.type === 'vinvite:focus') {
    arrive();
    revealEverything();
    opened = true;
    document.body.classList.remove('is-sealed');
  }
});

/* ── Full render (initial + on config / language change) ─────────────────── */
function renderAll() {
  renderPlatformContacts();
  bindTexts();
  bindArtwork();
  renderWeekdays();
  renderBoard();
  renderFacts();
  renderPlace();
  renderCountdown();
  applyVisibility();
  renderNav();
  renderMusic();
  renderLangbar();
  collectLayers();
  if (ADMIN_EDIT || reduced) revealEverything();
  if (!reduced) paint();
}

/* ── Boot ────────────────────────────────────────────────────────────────── */
try {
  renderAll();
  initMusic();
  initObserver();
  initNav();
  initRsvp();
  initSeal();
  initCountdown();
  initFilm();
  if (!reduced) {
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', function () { collectLayers(); onOrientation(); onScroll(); }, { passive: true });
  }
  if (reduced || ADMIN_EDIT) arrive();
  /* A deep link (…#rsvp) opens the invitation straight away rather than
     landing a guest on a sealed cover with their section out of reach. */
  if (window.location && location.hash && location.hash.length > 1 && location.hash !== '#hero') {
    openInvitation(null, decodeURIComponent(location.hash.slice(1)));
  }
} catch (err) {
  /* A half-booted page must still be readable: show everything, drop the film
     hold, and leave the page scrollable. */
  arrive();
  revealEverything();
  document.body.classList.remove('is-sealed');
  if (window.console && console.error) console.error(err);
}
})();
</script>
</body>
</html>
