<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation</title>
<!--__CONFIG__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   CHÂTEAU — a French country-house wedding
   --------------------------------------------------------------------------
   Identity : ivory and parchment, blush and sage, engraved gold. A gate motif
              recurs at every seam — it opens the film, it signs the sections,
              and it parts to reveal the reply form.
   Motion   : the hero film (the gates swing open) hands the eye to the title,
              which lands letter by letter as the doors finish · every section
              below the fold reveals on intersection · a parallax rig drives the
              estate, the plates and the finale · the calendar unfolds from its
              top edge and lights the day · vines draw themselves around the
              ceremony photograph · petals drift always and burst twice.
   Contract : window.__CONFIG__ / __LANGS__ / __ORIGIN__ / __CONTACTS__ arrive
              in <head>; live edits by postMessage; RSVP posts to the parent.
   Assets   : bundled in apps/web/public/chateau/ and addressed through
              __ORIGIN__ — the page runs on the opaque about:srcdoc origin and
              cannot resolve a relative URL.
   ========================================================================== */

/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:#241F1B;
  --ink-soft:#5A5148;
  --ivory:#F7F2E8;
  --parchment:#EFE6D5;
  --blush:#D9A6A0;
  --sage:#8B9A80;
  --gold:#B8924E;
  --gold-lt:#DFC48A;
  --green-deep:#2F3A2E;

  --display:"Italiana","Didot","Bodoni MT",Georgia,serif;
  --body:"EB Garamond","Iowan Old Style",Georgia,serif;
  --util:"Jost","Futura",-apple-system,"Segoe UI",sans-serif;

  --gutter:clamp(20px,5vw,72px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ivory);
  color:var(--ink);
  font-family:var(--body);
  font-size:clamp(16px,1.05vw + 13px,19px);
  line-height:1.7;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.is-locked{overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:2px}

h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1.08;margin:0}
p{margin:0 0 1em}

/* A section, tile or control switched off in the builder, or one with nothing
   in it. Both hide rather than collapse, so no layout gap is left behind. */
.opt-off,.card-off,.hidden{display:none !important}

.eyebrow{
  font-family:var(--util);
  font-weight:400;
  font-size:clamp(10px,.35vw + 9px,12px);
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0 0 1.4em;
}
.eyebrow--light{color:var(--gold-lt)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gutter)}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

section{position:relative}
.pad{padding-block:clamp(88px,13vw,180px)}

/* ============================================================
   ORNAMENT — the gate motif, the page's recurring signature
   ============================================================ */
.gatemark{display:block;width:clamp(120px,16vw,190px);height:auto;margin:0 auto;color:var(--gold);opacity:.85}
.gatemark path,.gatemark circle{vector-effect:non-scaling-stroke}
.rule{
  width:min(100%,340px);height:1px;margin:2.6rem auto;
  background:linear-gradient(90deg,transparent,var(--gold) 22%,var(--gold) 78%,transparent);
  opacity:.4;
}

/* ============================================================
   LANGUAGE BAR + MUSIC — platform chrome, not the design
   ============================================================ */
#langbar{
  position:fixed;top:14px;left:14px;z-index:130;display:flex;gap:6px;
}
#langbar button{
  padding:6px 11px;border-radius:999px;
  font-family:var(--util);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(247,242,232,.8);background:rgba(36,31,27,.5);
  border:1px solid rgba(223,196,138,.34);backdrop-filter:blur(6px);
  transition:.35s var(--ease-soft);
}
#langbar button.active{color:var(--ink);background:var(--gold-lt);border-color:var(--gold-lt)}

#music-btn{
  position:fixed;right:14px;bottom:14px;z-index:130;
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(36,31,27,.55);border:1px solid rgba(223,196,138,.4);
  backdrop-filter:blur(6px);
}
#music-btn .bars{display:flex;align-items:flex-end;gap:3px;height:15px}
#music-btn .bars span{width:2px;height:5px;background:var(--gold-lt);border-radius:1px}
#music-btn[aria-pressed="true"] .bars span{animation:bar .9s var(--ease-soft) infinite alternate}
#music-btn[aria-pressed="true"] .bars span:nth-child(2){animation-delay:.18s}
#music-btn[aria-pressed="true"] .bars span:nth-child(3){animation-delay:.36s}
@keyframes bar{from{height:4px}to{height:15px}}

/* ============================================================
   AMBIENT PETAL CANVAS
   ============================================================ */
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;height:100svh;min-height:560px;
  overflow:hidden;background:var(--green-deep);
  display:grid;place-items:center;
}
.hero__media{position:absolute;inset:0}
.hero__media video,.hero__media img{
  width:100%;height:100%;object-fit:cover;
}
.hero__poster{position:absolute;inset:0;transition:opacity 1.2s var(--ease-soft)}
.hero.video-ready .hero__poster{opacity:0}

/* darkening + warm haze that deepens as the gates finish opening */
.hero__scrim{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 62%,transparent 18%,rgba(36,31,27,.30) 62%,rgba(36,31,27,.78) 100%),
    linear-gradient(to bottom,rgba(36,31,27,.42),transparent 26%,transparent 58%,rgba(36,31,27,.66));
  opacity:.5;transition:opacity 2.6s var(--ease-soft);
}
.hero.arrived .hero__scrim{opacity:1}

/* light bloom through the opening gates */
.hero__bloom{
  position:absolute;left:50%;top:56%;width:70vmax;height:70vmax;
  transform:translate(-50%,-50%) scale(.35);
  background:radial-gradient(circle,rgba(223,196,138,.55),rgba(223,196,138,.12) 42%,transparent 68%);
  opacity:0;mix-blend-mode:screen;pointer-events:none;
  transition:opacity 2.4s var(--ease-soft),transform 4.2s var(--ease);
}
.hero.arrived .hero__bloom{opacity:.9;transform:translate(-50%,-50%) scale(1)}

.hero__inner{position:relative;z-index:3;text-align:center;color:var(--ivory);padding-inline:var(--gutter);width:100%}

.hero__kicker{
  font-family:var(--util);font-size:clamp(10px,.4vw + 9px,12px);
  letter-spacing:.5em;text-transform:uppercase;color:var(--gold-lt);
  margin:0 0 clamp(18px,3vw,30px);
  opacity:0;transform:translateY(14px);
  transition:opacity 1.3s var(--ease-soft),transform 1.3s var(--ease);
}
.hero__names{
  font-family:var(--display);
  font-size:clamp(46px,11.5vw,148px);
  line-height:.94;letter-spacing:.01em;
  margin:0;
}
.hero__names .amp{
  display:block;font-family:var(--body);font-style:italic;
  font-size:clamp(20px,3.4vw,42px);color:var(--gold-lt);
  letter-spacing:.06em;margin:clamp(6px,1.2vw,16px) 0;
}
.hero__names .ch{
  display:inline-block;opacity:0;
  transform:translateY(38px) scale(.97);
  filter:blur(9px);
  transition:opacity 1.05s var(--ease-soft),transform 1.15s var(--ease),filter 1.05s var(--ease-soft);
}
.hero__meta{
  margin:clamp(24px,4vw,40px) 0 0;
  font-family:var(--util);font-weight:300;
  font-size:clamp(11px,.5vw + 10px,14px);
  letter-spacing:.34em;text-transform:uppercase;color:rgba(247,242,232,.86);
  opacity:0;transform:translateY(14px);
  transition:opacity 1.3s var(--ease-soft),transform 1.3s var(--ease);
}
.hero.arrived .hero__kicker,
.hero.arrived .hero__meta{opacity:1;transform:none}
.hero.arrived .hero__names .ch{opacity:1;transform:none;filter:blur(0)}

.hero__scroll{
  position:absolute;left:50%;bottom:clamp(22px,4vh,44px);transform:translateX(-50%);
  z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;
  font-family:var(--util);font-size:10px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(247,242,232,.7);opacity:0;transition:opacity 1.4s var(--ease-soft) .5s;
}
.hero.arrived .hero__scroll{opacity:1}
.hero__scroll i{display:block;width:1px;height:44px;background:linear-gradient(var(--gold-lt),transparent);animation:drop 2.6s var(--ease-soft) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* the seam between film and page */
.hero__hem{
  position:absolute;left:0;right:0;bottom:-1px;height:clamp(90px,14vh,190px);z-index:5;
  background:linear-gradient(to bottom,transparent,rgba(247,242,232,.55) 55%,var(--ivory));
  pointer-events:none;
}

.skip{
  position:absolute;right:var(--gutter);top:clamp(18px,3vh,32px);z-index:6;
  font-family:var(--util);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(247,242,232,.72);padding:9px 15px;
  border:1px solid rgba(223,196,138,.4);border-radius:999px;
  backdrop-filter:blur(6px);transition:.4s var(--ease-soft);
}
.skip:hover{color:var(--ivory);border-color:var(--gold-lt);background:rgba(223,196,138,.12)}
.hero.arrived .skip{opacity:0;pointer-events:none}

/* ============================================================
   REVEAL SYSTEM
   ============================================================ */
.reveal{opacity:0;transform:translateY(34px);transition:opacity 1.1s var(--ease-soft),transform 1.2s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal--soft{transform:translateY(18px) scale(.985);filter:blur(6px);transition:opacity 1.2s var(--ease-soft),transform 1.3s var(--ease),filter 1.2s var(--ease-soft)}
.reveal--soft.in{filter:blur(0)}

/* ============================================================
   INVITATION
   ============================================================ */
.invite{background:var(--ivory);text-align:center;overflow:hidden}
.invite__title{font-size:clamp(34px,5.4vw,72px);margin-bottom:.5em}
.invite__title .names{display:block;margin-top:.2em}
.invite__lede{
  font-size:clamp(18px,1.5vw + 13px,26px);
  font-style:italic;color:var(--ink-soft);
  max-width:34ch;margin:0 auto 2em;line-height:1.6;
}
.invite__date{
  font-family:var(--util);font-weight:300;
  font-size:clamp(12px,.6vw + 10px,15px);
  letter-spacing:.4em;text-transform:uppercase;color:var(--gold);
}
.invite__sprig{position:absolute;width:clamp(120px,20vw,300px);opacity:0;transition:opacity 1.8s var(--ease-soft) .4s}
.invite__sprig.in{opacity:.5}
.invite__sprig--l{left:-2vw;top:12%}
.invite__sprig--r{right:-2vw;bottom:10%;transform:scaleX(-1)}
.invite__sprig path{stroke:var(--sage);fill:none;stroke-width:1.1}
.invite__sprig ellipse,.invite__sprig circle{fill:var(--blush);opacity:.75}

/* ============================================================
   PARALLAX ESTATE
   ============================================================ */
.estate{height:clamp(520px,100svh,900px);overflow:hidden;background:var(--green-deep)}
.estate__layer{position:absolute;inset:-8% 0;will-change:transform}
.estate__sky{background:linear-gradient(to bottom,#E8D3B4,#F0DCC0 34%,#E9CFAE 68%,#D9BB97)}
.estate__house img{width:100%;height:100%;object-fit:cover;object-position:50% 42%}
.estate__wash{background:linear-gradient(to bottom,rgba(240,220,192,.34),transparent 40%,rgba(47,58,46,.34))}
.estate__hedge,.estate__blooms{bottom:-12%;top:auto;height:52%}
.estate__hedge svg,.estate__blooms svg{position:absolute;bottom:0;left:0;width:100%;height:100%;display:block}
.estate__copy{
  position:absolute;left:0;right:0;bottom:clamp(64px,12vh,120px);z-index:6;
  text-align:center;color:var(--ivory);padding-inline:var(--gutter);
}
.estate__copy h2{font-size:clamp(28px,4.4vw,58px);text-shadow:0 2px 30px rgba(36,31,27,.5)}
.estate__copy p{
  font-family:var(--util);font-weight:300;font-size:clamp(11px,.5vw + 9px,13px);
  letter-spacing:.36em;text-transform:uppercase;color:var(--gold-lt);margin-top:1.2em;
}

/* ============================================================
   COUPLE REVEAL
   ============================================================ */
.couple{background:var(--parchment);overflow:hidden}
.couple__grid{display:grid;grid-template-columns:1fr;gap:clamp(34px,5vw,72px);align-items:center}
.couple__frame{
  position:relative;aspect-ratio:16/11;overflow:hidden;
  border-radius:2px;box-shadow:0 40px 90px -50px rgba(36,31,27,.7);
}
.couple__frame::after{
  content:"";position:absolute;inset:11px;border:1px solid rgba(223,196,138,.55);pointer-events:none;z-index:3;
}
.couple__frame img{position:absolute;inset:-14%;width:128%;height:128%;object-fit:cover;will-change:transform}
.couple__veil{
  position:absolute;inset:0;z-index:2;
  background:linear-gradient(115deg,rgba(239,230,213,.9),rgba(239,230,213,0) 62%);
  transform:translateX(0);transition:transform 1.6s var(--ease);
}
.couple__frame.in .couple__veil{transform:translateX(-104%)}
.couple__text h2{font-size:clamp(30px,4vw,52px);margin-bottom:.6em}
.couple__text p{color:var(--ink-soft);max-width:44ch}
@media (min-width:900px){
  .couple__grid{grid-template-columns:1.15fr .85fr;gap:clamp(48px,6vw,96px)}
}

/* ============================================================
   FLORAL REVEAL
   ============================================================ */
.floral{background:var(--ivory);overflow:hidden}
.floral__stage{position:relative;aspect-ratio:16/10;max-width:1080px;margin:0 auto;border-radius:2px;overflow:hidden}
.floral__img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  clip-path:inset(0 0 0 0 round 2px);
  transform:scale(1.12);transition:transform 2.6s var(--ease);
}
.floral__stage.in .floral__img{transform:scale(1)}
.floral__mask{position:absolute;inset:0;z-index:2;background:var(--ivory);transform-origin:center;
  clip-path:circle(78% at 50% 50%);transition:clip-path 2.2s var(--ease-soft)}
.floral__stage.in .floral__mask{clip-path:circle(0% at 50% 50%)}
.floral__vines{position:absolute;inset:0;z-index:3;pointer-events:none}
.floral__vines path{
  fill:none;stroke:var(--sage);stroke-width:1.6;stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  transition:stroke-dashoffset 3s var(--ease);
}
.floral__stage.in .floral__vines path{stroke-dashoffset:0}
.floral__vines .bud{fill:var(--blush);opacity:0;transition:opacity .9s var(--ease-soft)}
.floral__stage.in .floral__vines .bud{opacity:.9}
.floral__cap{margin-top:2.2rem;font-style:italic;color:var(--ink-soft);text-align:center}

/* ============================================================
   CALENDAR
   ============================================================ */
.cal{background:var(--green-deep);color:var(--ivory);overflow:hidden}
.cal h2{color:var(--ivory)}
.cal__card{
  position:relative;max-width:600px;margin:clamp(34px,5vw,58px) auto 0;
  background:var(--parchment);color:var(--ink);
  padding:clamp(26px,4.6vw,52px);border-radius:2px;
  box-shadow:0 60px 120px -60px rgba(0,0,0,.85);
  transform-origin:top center;perspective-origin:top;
  transform:rotateX(-82deg) translateY(-16px);opacity:0;
  transition:transform 1.5s var(--ease),opacity .8s var(--ease-soft);
}
.cal__stage{perspective:1400px}
.cal__card.in{transform:none;opacity:1}
.cal__card::after{content:"";position:absolute;inset:12px;border:1px solid rgba(184,146,78,.45);pointer-events:none}
.cal__month{
  font-family:var(--display);font-size:clamp(24px,3.2vw,38px);
  text-align:center;letter-spacing:.06em;
}
.cal__year{
  display:block;font-family:var(--util);font-weight:300;font-size:11px;
  letter-spacing:.46em;color:var(--gold);margin-top:.9em;
}
.cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(2px,.6vw,7px);margin-top:clamp(20px,3vw,32px)}
.cal__dow{
  font-family:var(--util);font-weight:400;font-size:clamp(8px,.5vw + 6px,10px);
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  text-align:center;padding-bottom:10px;opacity:.75;
}
.cal__day{
  aspect-ratio:1;display:grid;place-items:center;
  font-family:var(--body);font-size:clamp(13px,1.1vw,17px);color:var(--ink-soft);
  border-radius:50%;opacity:0;transform:translateY(9px);
  transition:opacity .5s var(--ease-soft),transform .5s var(--ease);
}
.cal__card.in .cal__day{opacity:1;transform:none}
.cal__day--empty{opacity:0 !important}
.cal__day--wed{
  position:relative;color:var(--ink);font-family:var(--display);
  font-size:clamp(18px,1.7vw,25px);
}
.cal__day--wed::before{
  content:"";position:absolute;inset:-6%;border-radius:50%;
  background:radial-gradient(circle,rgba(223,196,138,.85),rgba(217,166,160,.5) 58%,transparent 72%);
  transform:scale(0);transition:transform 1s var(--ease);
}
.cal__day--wed::after{
  content:"";position:absolute;inset:-6%;border-radius:50%;
  border:1px solid var(--gold);transform:scale(.4);opacity:0;
  transition:transform 1.1s var(--ease) .1s,opacity .9s var(--ease-soft) .1s;
}
.cal__card.lit .cal__day--wed::before{transform:scale(1)}
.cal__card.lit .cal__day--wed::after{transform:scale(1);opacity:.9}
.cal__day--wed span{position:relative;z-index:2}
.cal__note{
  text-align:center;margin-top:clamp(20px,3vw,30px);
  font-family:var(--util);font-weight:300;font-size:11px;
  letter-spacing:.32em;text-transform:uppercase;color:var(--gold);
  opacity:0;transition:opacity 1s var(--ease-soft) .6s;
}
.cal__card.lit .cal__note{opacity:1}
.cal__ribbon{
  position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  width:clamp(80px,12vw,120px);color:var(--blush);opacity:0;
  transition:opacity 1s var(--ease-soft) .3s;
}
.cal__card.in .cal__ribbon{opacity:.95}

/* ============================================================
   DETAILS — engraved stationery, not cards
   ============================================================ */
.details{background:var(--ivory)}
.details__sheet{
  position:relative;max-width:980px;margin:clamp(40px,6vw,72px) auto 0;
  border:1px solid rgba(184,146,78,.4);padding:clamp(28px,5vw,74px);
  background:
    linear-gradient(rgba(247,242,232,.9),rgba(247,242,232,.9)),
    radial-gradient(circle at 20% 15%,rgba(217,166,160,.16),transparent 45%),
    radial-gradient(circle at 82% 78%,rgba(139,154,128,.16),transparent 45%);
}
.details__sheet::before{content:"";position:absolute;inset:9px;border:1px solid rgba(184,146,78,.22);pointer-events:none}
.details__list{display:grid;gap:clamp(26px,4vw,46px);grid-template-columns:1fr}
@media (min-width:760px){.details__list{grid-template-columns:1fr 1fr}}
.detail{position:relative;padding-left:clamp(30px,4vw,46px)}
.detail::before{
  content:"";position:absolute;left:0;top:.55em;width:clamp(18px,3vw,30px);height:1px;background:var(--gold);opacity:.7;
}
.detail dt{
  font-family:var(--util);font-weight:400;font-size:clamp(9px,.4vw + 8px,11px);
  letter-spacing:.36em;text-transform:uppercase;color:var(--gold);margin-bottom:.85em;
}
.detail dd{margin:0;font-size:clamp(17px,1.1vw + 13px,21px);line-height:1.55}
.detail dd small{display:block;font-family:var(--util);font-weight:300;font-size:13px;letter-spacing:.05em;color:var(--ink-soft);margin-top:.5em;line-height:1.6}

.sched{margin-top:clamp(40px,6vw,72px);border-top:1px solid rgba(184,146,78,.3);padding-top:clamp(30px,4vw,50px)}
.sched__row{
  display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,34px);
  align-items:baseline;padding:.95em 0;border-bottom:1px solid rgba(184,146,78,.16);
}
.sched__row:last-child{border-bottom:0}
.sched__time{font-family:var(--util);font-weight:400;font-size:13px;letter-spacing:.18em;color:var(--gold);white-space:nowrap}
.sched__what{font-size:clamp(16px,1vw + 13px,19px)}

/* ============================================================
   GALLERY
   ============================================================ */
.gal{background:var(--green-deep);color:var(--ivory);overflow:hidden}
.gal h2{color:var(--ivory)}
.gal__hint{
  font-family:var(--util);font-weight:300;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(247,242,232,.55);margin-top:1.4em;
}
.gal__track{
  display:flex;gap:clamp(16px,2.6vw,38px);
  margin-top:clamp(36px,5vw,64px);
  padding-inline:var(--gutter);padding-bottom:22px;
  overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;cursor:grab;
}
.gal__track::-webkit-scrollbar{display:none}
.gal__track.dragging{cursor:grabbing;scroll-snap-type:none}
.gal__item{
  position:relative;flex:0 0 min(78vw,540px);aspect-ratio:16/11;
  scroll-snap-align:center;overflow:hidden;border-radius:2px;
  box-shadow:0 40px 80px -50px rgba(0,0,0,.9);margin:0;
}
.gal__item img{
  position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;
  transition:transform 1.1s var(--ease);will-change:transform;
}
.gal__item:hover img{transform:scale(1.05)}
.gal__item figcaption{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:clamp(18px,3vw,30px);
  background:linear-gradient(transparent,rgba(36,31,27,.82));
  font-family:var(--util);font-weight:300;font-size:11px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--gold-lt);
}
.gal__item figcaption:empty{display:none}
.gal__item::after{content:"";position:absolute;inset:10px;border:1px solid rgba(223,196,138,.3);z-index:3;pointer-events:none}

/* ============================================================
   FINALE + RSVP
   ============================================================ */
.finale{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;text-align:center;color:var(--ivory)}
.finale__bg{position:absolute;inset:-8%;will-change:transform}
.finale__bg img{width:100%;height:100%;object-fit:cover}
.finale__scrim{position:absolute;inset:0;background:linear-gradient(rgba(36,31,27,.5),rgba(36,31,27,.72))}
.finale__inner{position:relative;z-index:3;padding:clamp(70px,12vh,130px) var(--gutter)}
.finale h2{font-size:clamp(32px,5.6vw,74px);margin-bottom:.5em}
.finale__msg{font-style:italic;font-size:clamp(18px,1.4vw + 13px,25px);max-width:30ch;margin:0 auto 2em;color:rgba(247,242,232,.9)}
.finale__date{
  font-family:var(--util);font-weight:300;font-size:clamp(11px,.5vw + 9px,14px);
  letter-spacing:.42em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:2.6em;
}
.rsvp-btn{
  position:relative;display:inline-block;
  padding:clamp(16px,2vw,21px) clamp(38px,5.5vw,68px);
  font-family:var(--util);font-weight:400;font-size:clamp(11px,.45vw + 10px,13px);
  letter-spacing:.36em;text-transform:uppercase;color:var(--ivory);
  border:1px solid var(--gold-lt);border-radius:999px;overflow:hidden;
  transition:color .55s var(--ease-soft),border-color .55s var(--ease-soft);
}
.rsvp-btn span{position:relative;z-index:2}
.rsvp-btn::before{
  content:"";position:absolute;inset:0;background:var(--gold-lt);
  transform:scaleX(0);transform-origin:left;transition:transform .65s var(--ease);
}
.rsvp-btn:hover{color:var(--green-deep);border-color:var(--gold-lt)}
.rsvp-btn:hover::before{transform:scaleX(1)}

/* ============================================================
   RSVP — opens like the gates
   ============================================================ */
.modal{position:fixed;inset:0;z-index:120;display:none}
.modal.open{display:block}
.modal__bg{position:absolute;inset:0;background:rgba(24,20,17,.86);opacity:0;transition:opacity .7s var(--ease-soft);backdrop-filter:blur(5px)}
.modal.shown .modal__bg{opacity:1}
.gate{
  position:absolute;top:0;bottom:0;width:50.6%;z-index:2;
  background:linear-gradient(160deg,#3A342C,#241F1B 60%);
  transition:transform 1.15s var(--ease);
}
.gate svg{position:absolute;inset:0;width:100%;height:100%;color:var(--gold);opacity:.5}
.gate--l{left:0;transform:translateX(0)}
.gate--r{right:0;transform:translateX(0)}
.gate--r svg{transform:scaleX(-1)}
.modal.shown .gate--l{transform:translateX(-101%)}
.modal.shown .gate--r{transform:translateX(101%)}

.modal__panel{
  position:relative;z-index:3;height:100%;overflow-y:auto;
  display:grid;place-items:center;padding:clamp(28px,6vw,60px) var(--gutter);
}
.modal__card{
  width:min(560px,100%);background:var(--parchment);color:var(--ink);
  padding:clamp(30px,5vw,58px);border-radius:2px;position:relative;
  opacity:0;transform:translateY(26px);
  transition:opacity .9s var(--ease-soft) .5s,transform 1s var(--ease) .5s;
}
.modal.shown .modal__card{opacity:1;transform:none}
.modal__card::after{content:"";position:absolute;inset:11px;border:1px solid rgba(184,146,78,.45);pointer-events:none}
.modal__card h3{font-size:clamp(26px,3.4vw,40px);text-align:center;margin-bottom:.4em}
.modal__card .sub{text-align:center;font-style:italic;color:var(--ink-soft);margin-bottom:2em}
.field{margin-bottom:1.5rem;position:relative;z-index:2}
.field label,.field .label{
  display:block;font-family:var(--util);font-weight:400;font-size:10px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.7em;
}
.field input,.field select,.field textarea{
  width:100%;padding:.85em .2em;font:inherit;font-size:16px;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid rgba(184,146,78,.5);
  border-radius:0;transition:border-color .4s var(--ease-soft);
}
.field textarea{resize:vertical;min-height:74px}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-bottom-color:var(--gold)}
.field.invalid input{border-bottom-color:#B4453C}
.field .row{display:flex;gap:12px;flex-wrap:wrap}
.chip{
  flex:1 1 0;min-width:120px;padding:.85em 1em;text-align:center;
  border:1px solid rgba(184,146,78,.5);border-radius:999px;
  font-family:var(--util);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  transition:.4s var(--ease-soft);
}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ivory)}
.submit{
  width:100%;margin-top:.6rem;padding:1.15em;
  background:var(--green-deep);color:var(--ivory);
  font-family:var(--util);font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  border-radius:999px;transition:.45s var(--ease-soft);
}
.submit:hover{background:var(--ink)}
.submit[disabled]{opacity:.6;cursor:default}
.err{display:none;margin-top:1rem;text-align:center;color:#B4453C;font-size:.9rem}
.err.show{display:block}
.modal__close{
  position:absolute;top:clamp(16px,3vh,28px);right:var(--gutter);z-index:5;
  width:44px;height:44px;border-radius:50%;color:var(--ivory);
  border:1px solid rgba(223,196,138,.4);display:grid;place-items:center;
  opacity:0;transition:opacity .6s var(--ease-soft) .7s;font-size:20px;line-height:1;
}
.modal.shown .modal__close{opacity:1}
.thanks{text-align:center;display:none}
.thanks.on{display:block}
.thanks h3{margin-bottom:.5em}
.modal__card form.gone{display:none}

/* ============================================================
   FOOTER
   ============================================================ */
footer.sign{background:var(--ink);color:rgba(247,242,232,.55);text-align:center;padding:clamp(50px,7vw,84px) var(--gutter)}
footer.sign .gatemark{color:var(--gold);opacity:.6;margin-bottom:1.8rem}
footer.sign p{font-family:var(--util);font-weight:300;font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin:0}

#vconnect{
  background:#1B1815;color:rgba(247,242,232,.5);text-align:center;
  padding:1.6rem var(--gutter) 2rem;
  font-family:var(--util);font-weight:300;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
}
#vconnect img{width:34px;height:auto;margin:0 auto .6rem;opacity:.9}
#vcContacts{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:.9rem}
#vcContacts a{display:inline-flex;align-items:center;gap:.35rem;color:var(--gold-lt);text-decoration:none;letter-spacing:.08em;text-transform:none;font-size:12px}
#vcContacts svg{width:14px;height:14px}

/* ============================================================
   ARTWORK-BACKED SECTIONS
   ============================================================ */
.art-bg{position:absolute;inset:-8%;z-index:0;overflow:hidden}
.art-bg img{width:100%;height:100%;object-fit:cover;will-change:transform}
.art-veil{position:absolute;inset:0;z-index:1}
.art-veil--ivory{background:linear-gradient(rgba(247,242,232,.94),rgba(247,242,232,.86) 45%,rgba(247,242,232,.96))}
.art-veil--deep{background:linear-gradient(rgba(47,58,46,.86),rgba(36,31,27,.9))}
.invite > .wrap,.details > .wrap,.cal > .wrap{position:relative;z-index:2}
.invite,.details,.cal{isolation:isolate}

/* the arrival — the film's last frame melts into the first illustration */
.arrival{height:clamp(460px,86svh,860px);overflow:hidden;background:var(--green-deep)}
.arrival__bg{position:absolute;inset:-8%;will-change:transform}
.arrival__bg img{width:100%;height:100%;object-fit:cover;object-position:50% 46%}
.arrival__top{position:absolute;left:0;right:0;top:-1px;height:34%;z-index:2;
  background:linear-gradient(var(--ivory),rgba(247,242,232,.55) 42%,transparent);pointer-events:none}
.arrival__hem{position:absolute;left:0;right:0;bottom:-1px;height:40%;z-index:2;
  background:linear-gradient(transparent,rgba(247,242,232,.6) 52%,var(--ivory));pointer-events:none}
.arrival__cap{
  position:absolute;left:0;right:0;bottom:clamp(60px,13vh,120px);z-index:3;text-align:center;
  padding-inline:var(--gutter);color:var(--ink);
  font-family:var(--display);font-size:clamp(20px,2.8vw,36px);letter-spacing:.04em;
}

/* story — two illustrated plates, offset */
.story{background:var(--ivory);overflow:hidden}
.story__pair{display:grid;grid-template-columns:1fr;gap:clamp(26px,4vw,54px);margin-top:clamp(34px,5vw,64px)}
@media (min-width:820px){
  .story__pair{grid-template-columns:1fr 1fr;align-items:start}
  .story__plate:nth-child(2){margin-top:clamp(50px,8vw,120px)}
}
.story__plate{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:2px;margin:0;
  box-shadow:0 44px 90px -56px rgba(36,31,27,.75)}
.story__plate img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;will-change:transform}
.story__plate::after{content:"";position:absolute;inset:10px;border:1px solid rgba(223,196,138,.5);z-index:2;pointer-events:none}
.story__plate figcaption{
  position:absolute;left:0;right:0;bottom:0;z-index:3;padding:clamp(16px,2.6vw,26px);
  background:linear-gradient(transparent,rgba(36,31,27,.8));
  font-family:var(--util);font-weight:300;font-size:11px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold-lt);
}
.story__plate figcaption:empty{display:none}

/* a framed plate inside the details stationery */
.details__plate{position:relative;overflow:hidden;aspect-ratio:21/9;margin:0 0 clamp(30px,4.4vw,52px);border-radius:2px}
.details__plate img{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;object-position:50% 45%;will-change:transform}
.details__plate::after{content:"";position:absolute;inset:9px;border:1px solid rgba(223,196,138,.6);z-index:2;pointer-events:none}

/* ============================================================
   MOTION PREFERENCES
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-iteration-count:1 !important}
  .reveal,.reveal--soft{opacity:1 !important;transform:none !important;filter:none !important}
  .hero__names .ch{opacity:1 !important;transform:none !important;filter:none !important}
  .hero__kicker,.hero__meta,.hero__scroll{opacity:1 !important;transform:none !important}
  .cal__card{opacity:1 !important;transform:none !important}
  .couple__veil{transform:translateX(-104%) !important}
  .floral__mask{clip-path:circle(0% at 50% 50%) !important}
  .floral__vines path{stroke-dashoffset:0 !important}
  .invite__sprig{opacity:.5 !important}
  #petals{display:none}
}
</style>
</head>
<body>

<!-- ambient petals -->
<canvas id="petals" aria-hidden="true"></canvas>

<div id="langbar" class="hidden" aria-label="Language"></div>

<!-- ============================================================
     HERO — the gates
     ============================================================ -->
<header class="hero" id="hero">
  <div class="hero__media">
    <video id="film" muted playsinline preload="metadata"></video>
    <img class="hero__poster" id="heroPoster" alt="" data-art>
  </div>
  <div class="hero__bloom" aria-hidden="true"></div>
  <div class="hero__scrim" aria-hidden="true"></div>

  <button class="skip" id="skip" type="button" data-t="enterNow">Enter now</button>

  <div class="hero__inner">
    <p class="hero__kicker" data-bind="kicker"></p>
    <h1 class="hero__names">
      <span class="split" data-name="bride"></span>
      <span class="amp" data-t="and">and</span>
      <span class="split" data-name="groom"></span>
    </h1>
    <p class="hero__meta" data-bind="heroMeta"></p>
  </div>

  <div class="hero__scroll" aria-hidden="true"><span data-t="enter">Enter</span><i></i></div>
  <div class="hero__hem" aria-hidden="true"></div>
</header>

<main>

<!-- ============================================================
     ARRIVAL — the film's last frame becomes the first illustration
     ============================================================ -->
<section class="arrival" id="arrival" data-opt="arrival" aria-label="Arrival">
  <div class="arrival__bg" data-depth="0.10">
    <img loading="eager" decoding="async" data-art data-asset="drive.jpg" alt="">
  </div>
  <div class="arrival__top" aria-hidden="true"></div>
  <div class="arrival__hem" aria-hidden="true"></div>
  <p class="arrival__cap reveal" data-bind="arrivalCap"></p>
</section>

<!-- ============================================================
     INVITATION
     ============================================================ -->
<section class="invite pad" id="invite" aria-labelledby="inv-h">
  <div class="art-bg" data-depth="0.06" aria-hidden="true">
    <img loading="lazy" decoding="async" data-art data-asset="arch.jpg" alt="">
  </div>
  <div class="art-veil art-veil--ivory" aria-hidden="true"></div>
  <svg class="invite__sprig invite__sprig--l reveal" viewBox="0 0 200 400" aria-hidden="true">
    <path d="M100 400 C80 320 120 260 96 190 C78 130 110 70 100 0"/>
    <path d="M98 330 C60 320 46 292 40 264 C74 268 92 296 98 330Z"/>
    <path d="M100 268 C138 260 152 232 158 204 C124 208 106 236 100 268Z"/>
    <path d="M96 206 C58 198 44 170 38 142 C72 146 90 174 96 206Z"/>
    <ellipse cx="100" cy="112" rx="15" ry="19"/>
    <ellipse cx="76" cy="146" rx="11" ry="14"/>
    <ellipse cx="126" cy="166" rx="9" ry="12"/>
    <circle cx="100" cy="60" r="8"/>
  </svg>
  <svg class="invite__sprig invite__sprig--r reveal" viewBox="0 0 200 400" aria-hidden="true">
    <path d="M100 400 C80 320 120 260 96 190 C78 130 110 70 100 0"/>
    <path d="M98 330 C60 320 46 292 40 264 C74 268 92 296 98 330Z"/>
    <path d="M100 268 C138 260 152 232 158 204 C124 208 106 236 100 268Z"/>
    <path d="M96 206 C58 198 44 170 38 142 C72 146 90 174 96 206Z"/>
    <ellipse cx="100" cy="112" rx="15" ry="19"/>
    <ellipse cx="76" cy="146" rx="11" ry="14"/>
    <ellipse cx="126" cy="166" rx="9" ry="12"/>
    <circle cx="100" cy="60" r="8"/>
  </svg>

  <div class="wrap">
    <svg class="gatemark reveal" viewBox="0 0 240 60" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
      <path d="M8 52 H232"/>
      <path d="M120 52 V16"/>
      <path d="M120 16 C104 16 96 26 96 34 C96 44 106 50 120 52 C134 50 144 44 144 34 C144 26 136 16 120 16Z"/>
      <path d="M96 34 C74 30 60 38 52 52"/>
      <path d="M144 34 C166 30 180 38 188 52"/>
      <circle cx="120" cy="10" r="4"/>
      <path d="M52 52 C44 40 30 38 18 44"/>
      <path d="M188 52 C196 40 210 38 222 44"/>
    </svg>

    <p class="eyebrow reveal" style="margin-top:2.4rem" data-t="theInvitation"></p>
    <h2 class="invite__title reveal" id="inv-h">
      <span data-t="marriageOf"></span>
      <span class="names" data-bind="coupleFull"></span>
    </h2>
    <p class="invite__lede reveal" data-bind="inviteLede"></p>
    <div class="rule reveal" aria-hidden="true"></div>
    <p class="invite__date reveal" data-bind="inviteDate"></p>
  </div>
</section>

<!-- ============================================================
     PARALLAX ESTATE
     ============================================================ -->
<section class="estate" id="estate" data-opt="estate" aria-label="The venue">
  <div class="estate__layer estate__sky" data-depth="0.04" aria-hidden="true"></div>
  <div class="estate__layer estate__house" data-depth="0.12">
    <img loading="lazy" decoding="async" data-asset="drive.jpg" alt="">
  </div>
  <div class="estate__layer estate__wash" data-depth="0.16" aria-hidden="true"></div>

  <div class="estate__layer estate__hedge" data-depth="0.30" aria-hidden="true">
    <svg viewBox="0 0 1440 300" preserveAspectRatio="none">
      <path fill="#3E4A3C" d="M0 300 V150 C60 118 96 150 150 138 C210 124 246 92 306 106 C366 120 396 152 456 142 C520 132 552 100 612 112 C676 124 706 156 768 146 C830 136 862 104 924 116 C986 128 1016 158 1078 148 C1140 138 1172 108 1234 120 C1296 132 1330 158 1390 146 L1440 138 V300Z"/>
    </svg>
  </div>

  <div class="estate__layer estate__blooms" data-depth="0.52" aria-hidden="true">
    <svg viewBox="0 0 1440 300" preserveAspectRatio="none">
      <path fill="#2F3A2E" d="M0 300 V214 C70 198 120 226 186 216 C252 206 292 178 358 190 C424 202 458 230 524 220 C590 210 624 182 690 194 C756 206 792 234 858 224 C924 214 956 186 1022 198 C1088 210 1124 236 1190 226 C1256 216 1300 190 1360 202 L1440 214 V300Z"/>
      <g fill="#D9A6A0" opacity=".82">
        <circle cx="120" cy="212" r="9"/><circle cx="146" cy="224" r="6"/>
        <circle cx="392" cy="192" r="10"/><circle cx="418" cy="206" r="6.5"/>
        <circle cx="676" cy="200" r="9"/><circle cx="700" cy="214" r="6"/>
        <circle cx="960" cy="196" r="10"/><circle cx="936" cy="210" r="6.5"/>
        <circle cx="1236" cy="222" r="9"/><circle cx="1262" cy="208" r="6"/>
      </g>
      <g fill="#F7F2E8" opacity=".9">
        <circle cx="248" cy="204" r="7"/><circle cx="540" cy="216" r="8"/>
        <circle cx="820" cy="208" r="7"/><circle cx="1108" cy="212" r="8"/>
      </g>
    </svg>
  </div>

  <div class="estate__copy" data-depth="0.10">
    <h2 class="reveal" data-bind="venueName"></h2>
    <p class="reveal" data-bind="venueRegion"></p>
  </div>
</section>

<!-- ============================================================
     COUPLE REVEAL
     ============================================================ -->
<section class="couple pad" id="couple" data-opt="couple" aria-labelledby="couple-h">
  <div class="wrap couple__grid">
    <figure class="couple__frame reveal" style="margin:0">
      <img data-depth="0.10" loading="lazy" decoding="async" data-art data-asset="couple.jpg" alt="">
      <span class="couple__veil" aria-hidden="true"></span>
    </figure>
    <div class="couple__text">
      <p class="eyebrow reveal" data-bind="storyEyebrow"></p>
      <h2 class="reveal" id="couple-h" data-bind="storyTitle"></h2>
      <p class="reveal" data-bind="storyOne"></p>
      <p class="reveal" data-bind="storyTwo"></p>
    </div>
  </div>
</section>

<!-- ============================================================
     THE DAY — two illustrated plates
     ============================================================ -->
<section class="story pad" id="story" data-opt="story" aria-labelledby="story-h">
  <div class="wrap center">
    <p class="eyebrow reveal" data-t="ourStory"></p>
    <h2 class="reveal" id="story-h" style="font-size:clamp(30px,4.4vw,58px)" data-bind="dayTitle"></h2>
  </div>
  <div class="wrap">
    <div class="story__pair">
      <figure class="story__plate reveal">
        <img data-depth="0.09" data-art data-asset="staircase.jpg" loading="lazy" decoding="async" alt="">
        <figcaption data-bind="plateOne"></figcaption>
      </figure>
      <figure class="story__plate reveal">
        <img data-depth="0.09" data-art data-asset="fountain.jpg" loading="lazy" decoding="async" alt="">
        <figcaption data-bind="plateTwo"></figcaption>
      </figure>
    </div>
  </div>
</section>

<!-- ============================================================
     THE CEREMONY — floral reveal
     ============================================================ -->
<section class="floral pad" id="ceremony" data-opt="ceremony" aria-labelledby="floral-h">
  <div class="wrap center">
    <p class="eyebrow reveal" data-t="theCeremony"></p>
    <h2 class="reveal" id="floral-h" style="font-size:clamp(30px,4.4vw,58px);margin-bottom:clamp(34px,5vw,58px)" data-bind="ceremonyTitle"></h2>
  </div>
  <div class="wrap">
    <figure class="floral__stage" style="margin:0">
      <img class="floral__img" loading="lazy" decoding="async" data-art data-asset="arch.jpg" alt="">
      <span class="floral__mask" aria-hidden="true"></span>
      <svg class="floral__vines" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 620 C90 540 60 440 130 372 C196 308 176 214 244 150 C298 100 300 44 292 0"/>
        <path d="M1000 620 C910 540 940 440 870 372 C804 308 824 214 756 150 C702 100 700 44 708 0"/>
        <path d="M130 372 C80 350 44 356 6 380"/>
        <path d="M244 150 C296 132 330 142 366 168"/>
        <path d="M870 372 C920 350 956 356 994 380"/>
        <path d="M756 150 C704 132 670 142 634 168"/>
        <g class="bud">
          <circle cx="130" cy="372" r="11"/><circle cx="244" cy="150" r="13"/><circle cx="292" cy="8" r="9"/>
          <circle cx="870" cy="372" r="11"/><circle cx="756" cy="150" r="13"/><circle cx="708" cy="8" r="9"/>
          <circle cx="366" cy="168" r="8"/><circle cx="634" cy="168" r="8"/>
          <circle cx="6" cy="380" r="8"/><circle cx="994" cy="380" r="8"/>
        </g>
      </svg>
    </figure>
    <p class="floral__cap reveal" data-bind="ceremonyCap"></p>
  </div>
</section>

<!-- ============================================================
     CALENDAR

var $ = function (s, c) { return (c || document).querySelector(s); };

function cfg(path, dflt) {

/* Bundled artwork lives at the web origin; the page itself runs on the opaque

/* ── Dates ───────────────────────────────────────────────────────────────── */
function eventDate() {
  var d = new Date(cfg('event.dateISO', '2026-09-12T17:00:00'));
  return isNaN(d.getTime()) ? new Date() : d;

function intlLocale() { return lang === 'uz' ? 'uz-Latn-UZ' : (lang === 'ru' ? 'ru-RU' : 'en-GB'); }

  catch (e) { return ''; }

  var d = eventDate(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function fmtNumeric() {
  var d = eventDate(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + ' · ' + p(d.getMonth() + 1) + ' · ' + d.getFullYear();

/* ── Text binding ────────────────────────────────────────────────────────── */
function bindTexts() {
  var bride = loc(cfg('couple.bride', ''));
  var groom = loc(cfg('couple.groom', ''));
  var brideFull = loc(cfg('couple.brideFull', '')) || bride;
  var groomFull = loc(cfg('couple.groomFull', '')) || groom;
  var couple = (bride && groom) ? (bride + ' & ' + groom) : (bride || groom);
  var coupleFull = (brideFull && groomFull) ? (brideFull + ' & ' + groomFull) : (brideFull || groomFull);
  var venueName = loc(cfg('venue.name', ''));
  var region = loc(cfg('venue.region', ''));

  var map = {
    kicker: loc(cfg('invite.kicker', '')),
    heroMeta: loc(cfg('invite.meta', '')) || fmtDateLong(),
    coupleFull: coupleFull,
    inviteLede: loc(cfg('invite.lede', '')),
    inviteDate: fmtNumeric() + (region ? '  —  ' + region : ''),

    storyTitle: loc(cfg('story.title', '')),
    storyOne: loc(cfg('story.one', '')),

    dReception: loc(cfg('details.reception', '')),
    dReceptionNote: loc(cfg('details.receptionNote', '')),
    dDress: loc(cfg('dress.title', '')),
    dDressNote: loc(cfg('dress.note', '')),
    dTravel: loc(cfg('travel.title', '')),

/* The hero title lands letter by letter, so each name is rebuilt as spans with
   a staggered delay. Rebuilt on every render: the names change under the
   editor's hands. */
function splitNames(bride, groom) {
  $$('.hero__names .split').forEach(function (el) {
    var text = el.getAttribute('data-name') === 'bride' ? bride : groom;
    el.setAttribute('aria-label', text || '');
    el.innerHTML = '';
    for (var i = 0; i < text.length; i++) {
      var span = document.createElement('span');
      span.className = 'ch';
      span.style.transitionDelay = (i * 70) + 'ms';
      span.textContent = text[i] === ' ' ? ' ' : text[i];

    }

function bindArtwork() {

    var url = asset(img.getAttribute('data-asset'));

  });

  if (poster && !poster.getAttribute('src')) poster.setAttribute('src', asset('gates.jpg'));

    img.onerror = function () { assetsFailed++; };

function arrive() {

  if (p && p.catch) p.catch(function () { arrive(); });

  /* Land the title as the gates finish opening, not after a hard cut. */
  filmWatch = setInterval(function () {
    if (!film.duration) return;
    if (film.currentTime > film.duration * 0.55) { clearInterval(filmWatch); arrive(); }
  }, 120);
  setTimeout(arrive, 9000);   // safety net if the video never plays at all
}

/* ── Reveal on scroll ────────────────────────────────────────────────────── */
/* Every entrance below the fold is gated on intersection. Without an observer,
   or inside the Design+ editor which must see every section at once, everything
   is revealed rather than left invisible. */
var revObs = null;
function initObserver() {
  var targets = $$('.reveal');
  var stages = $$('.couple__frame,.floral__stage');
  if (ADMIN_EDIT || reduced || typeof IntersectionObserver === 'undefined') {
    revealEverything();
    return;
  }
  revObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var el = e.target;
      var sibs = el.parentElement ? $$('.reveal', el.parentElement).filter(function (n) { return n.parentElement === el.parentElement; }) : [];
      var idx = sibs.indexOf(el);
      if (idx > 0) el.style.transitionDelay = (idx * 110) + 'ms';
      el.classList.add('in');
      revObs.unobserve(el);
    });
  }, { threshold: 0, rootMargin: '0px 0px -8% 0px' });
  targets.forEach(function (el) { revObs.observe(el); });

  var stageObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      stageObs.unobserve(e.target);
    });
  }, { threshold: 0.25 });
  stages.forEach(function (el) { stageObs.observe(el); });
}
function observe(el) {
  if (revObs) revObs.observe(el); else el.classList.add('in');
}
function revealEverything() {
  $$('.reveal,.couple__frame,.floral__stage').forEach(function (el) { el.classList.add('in'); });
  var card = $('#calCard');
  if (card) { card.classList.add('in'); card.classList.add('lit'); }
}

/* The vines draw themselves, which needs each path's length. linkedom (and any
   SVG implementation without geometry) has no getTotalLength, so the dash
   animation is simply dropped there rather than throwing — the vines are drawn
   solid, which is what the reduced-motion rule does too. */
function measureVines() {
  $$('.floral__vines path').forEach(function (p) {
    var len = 0;
    try { len = p.getTotalLength ? p.getTotalLength() : 0; } catch (e) { len = 0; }
    if (len) p.style.setProperty('--len', len);
    else p.style.strokeDasharray = 'none';
  });
}

/* ── Parallax — one rAF loop for every layer ─────────────────────────────── */
var layers = [], ticking = false;
function collectLayers() {
  layers = [];
  $$('[data-depth]').forEach(function (el) {
    var host = (el.closest ? el.closest('section') : null) || el.parentElement;
    if (host) layers.push({ el: el, depth: parseFloat(el.getAttribute('data-depth')) || 0, host: host });
  });
}
function paint() {
  var vh = window.innerHeight || 800;
  for (var i = 0; i < layers.length; i++) {
    var L = layers[i];
    var r = L.host.getBoundingClientRect ? L.host.getBoundingClientRect() : null;
    if (!r) continue;
    if (r.bottom < -200 || r.top > vh + 200) continue;
    var mid = r.top + r.height / 2;
    L.el.style.transform = 'translate3d(0,' + ((vh / 2 - mid) * L.depth).toFixed(2) + 'px,0)';
  }
  ticking = false;
}
function onScroll() {
  if (ticking || reduced) return;
  ticking = true;
  requestAnimationFrame(paint);
}

/* ── Calendar ────────────────────────────────────────────────────────────── */
/* Built from the event date, so moving the wedding moves the month, the
   weekday columns and the lit day together. */
function weekdayNames() {
  var out = [];
  for (var i = 0; i < 7; i++) {
    // 2024-01-01 was a Monday, which is where this grid starts.
    var d = new Date(Date.UTC(2024, 0, 1 + i));
    var label = '';
    try { label = new Intl.DateTimeFormat(intlLocale(), { weekday: 'short', timeZone: 'UTC' }).format(d); }
    catch (e) { label = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i]; }
    out.push(label);
  }
  return out;
}

function renderCalendar() {
  var grid = $('#calGrid'), card = $('#calCard');
  if (!grid || !card) return;
  var d = eventDate();
  var year = d.getFullYear(), month = d.getMonth(), day = d.getDate();

  var monthEl = $('#calMonth'), yearEl = $('#calYear');
  if (monthEl) monthEl.textContent = fmt({ month: 'long' }) || '';
  if (yearEl) yearEl.textContent = String(year);
  grid.setAttribute('aria-label', (monthEl ? monthEl.textContent : '') + ' ' + year);

  grid.innerHTML = '';
  weekdayNames().forEach(function (name) {
    var head = document.createElement('div');
    head.className = 'cal__dow';
    head.setAttribute('role', 'columnheader');
    head.textContent = name;
    grid.appendChild(head);
  });

  // getDay() is 0=Sunday; this grid starts on Monday.
  var lead = (new Date(year, month, 1).getDay() + 6) % 7;
  var days = new Date(year, month + 1, 0).getDate();
  for (var i = 0; i < lead; i++) {
    var blank = document.createElement('div');
    blank.className = 'cal__day cal__day--empty';
    blank.setAttribute('aria-hidden', 'true');
    grid.appendChild(blank);
  }
  for (var n = 1; n <= days; n++) {
    var cell = document.createElement('div');
    cell.className = 'cal__day' + (n === day ? ' cal__day--wed' : '');
    cell.setAttribute('role', 'gridcell');
    cell.style.transitionDelay = ((lead + n) * 26) + 'ms';
    var span = document.createElement('span');
    span.textContent = String(n);
    cell.appendChild(span);
    grid.appendChild(cell);
  }
}

var calLit = false;
function initCalendar() {
  var card = $('#calCard');
  if (!card) return;
  if (ADMIN_EDIT || reduced || typeof IntersectionObserver === 'undefined') {
    card.classList.add('in'); card.classList.add('lit');
    return;
  }
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting || calLit) return;
      calLit = true;
      card.classList.add('in');
      setTimeout(function () {
        card.classList.add('lit');
        var cell = card.querySelector('.cal__day--wed');
        var r = (cell && cell.getBoundingClientRect) ? cell.getBoundingClientRect() : null;
        if (r) burst(r.left + r.width / 2, r.top + r.height / 2, 46, 5.5);
      }, 1500);
      obs.unobserve(card);
    });
  }, { threshold: 0.35 });
  obs.observe(card);
}

/* ── Programme ───────────────────────────────────────────────────────────── */

/* ── Gallery ─────────────────────────────────────────────────────────────── */
/* The seven plates below are placeholders: they ship with the design so the
   album is never empty, and the moment the honoree uploads a single photo of
   their own, theirs replace the lot. Mixing the two would put a stranger's
   château in the middle of somebody's wedding album. */
var PLACEHOLDER_GALLERY = [
  { file: 'staircase.jpg', cap: 'gStaircase' },
  { file: 'table.jpg', cap: 'gTable' },
  { file: 'ballroom.jpg', cap: 'gBallroom' },
  { file: 'fountain.jpg', cap: 'gFountain' },
  { file: 'lace.jpg', cap: 'gLace' },
  { file: 'dusk.jpg', cap: 'gDusk' },
  { file: 'gates.jpg', cap: 'gGates' }
];

function galleryItems() {
  var raw = cfg('gallery', []);
  var own = Array.isArray(raw) ? raw.filter(function (g) { return g && g.image; }) : [];
  if (own.length) {
    return own.map(function (g) { return { src: g.image, caption: loc(g.caption) }; });
  }
  return PLACEHOLDER_GALLERY.map(function (p) { return { src: asset(p.file), caption: t(p.cap) }; });
}

function renderGallery() {
  var track = $('#galTrack');
  if (!track) return;
  track.innerHTML = '';
  galleryItems().forEach(function (item) {
    var fig = document.createElement('figure');
    fig.className = 'gal__item';
    var img = document.createElement('img');
    img.setAttribute('loading', 'lazy');
    img.setAttribute('decoding', 'async');
    img.alt = item.caption || '';
    img.src = item.src;
    var cap = document.createElement('figcaption');
    cap.textContent = item.caption || '';
    fig.appendChild(img); fig.appendChild(cap);
    track.appendChild(fig);
  });
  shiftGallery();
}

/* Each image slides against its frame as the track moves. */
function shiftGallery() {
  var track = $('#galTrack');
  if (!track || reduced || !track.getBoundingClientRect) return;
  var box = track.getBoundingClientRect();
  var mid = box.left + track.clientWidth / 2;
  $$('.gal__item img', track).forEach(function (img) {
    var r = img.parentElement.getBoundingClientRect();
    var delta = (r.left + r.width / 2 - mid) / (track.clientWidth || 1);
    img.style.transform = 'translate3d(' + (delta * -34).toFixed(2) + 'px,0,0)';
  });
}

function initGalleryDrag() {
  var track = $('#galTrack');
  if (!track) return;
  var down = false, startX = 0, startL = 0, queued = false;

  track.addEventListener('pointerdown', function (e) {
    down = true;
    startX = e.clientX; startL = track.scrollLeft;
    track.classList.add('dragging');
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
  });
  track.addEventListener('pointermove', function (e) {
    if (!down) return;
    track.scrollLeft = startL - (e.clientX - startX);
  });
  function release(e) {
    if (!down) return;
    down = false;
    track.classList.remove('dragging');
    try { track.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  track.addEventListener('pointerup', release);
  track.addEventListener('pointercancel', release);

  /* A vertical wheel pushes the album sideways, but only while it has somewhere
     left to go — otherwise the page would stop scrolling at the gallery. */
  track.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    var atStart = track.scrollLeft <= 0;
    var atEnd = track.scrollLeft >= track.scrollWidth - track.clientWidth - 1;
    if ((atStart && e.deltaY < 0) || (atEnd && e.deltaY > 0)) return;
    e.preventDefault();
    track.scrollLeft += e.deltaY;
  }, { passive: false });

  track.addEventListener('scroll', function () {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; shiftGallery(); });
  }, { passive: true });
}

/* ── Petals — ambient drift and celebratory burst, one canvas ────────────── */
var COLORS = ['#F7F2E8', '#EFE6D5', '#D9A6A0', '#DFC48A', '#B8924E', '#8B9A80'];
var ctx = null, W = 0, H = 0, drift = [], bursts = [], mx = -9999, my = -9999;

function burst(x, y, n, power) {
  if (!ctx || reduced) return;
  n = n || 150; power = power || 11;
  var group = [];
  for (var i = 0; i < n; i++) {
    var ang = Math.random() * Math.PI * 2;
    var sp = power * (0.35 + Math.random() * 0.85);
    group.push({
      x: x, y: y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2.6,
      r: 3 + Math.random() * 7,
      rot: Math.random() * Math.PI * 2, vr: (-1 + Math.random() * 2) * 0.11,
      a: 1, fade: 0.006 + Math.random() * 0.009,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
      ribbon: Math.random() < 0.18
    });
  }
  bursts.push(group);
  if (bursts.length > 4) bursts.shift();
}

function initPetals() {
  var cv = $('#petals');
  ctx = (cv && cv.getContext) ? cv.getContext('2d') : null;
  if (!ctx || reduced) { ctx = null; return; }

  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function makeDrifter(top) {
    return {
      x: Math.random() * W, y: top ? -20 - Math.random() * H * 0.4 : Math.random() * H,
      r: 3 + Math.random() * 5, vy: 0.16 + Math.random() * 0.34, vx: -0.18 + Math.random() * 0.36,
      rot: Math.random() * Math.PI * 2, vr: (-0.4 + Math.random() * 0.8) * 0.012,
      a: 0.2 + Math.random() * 0.32, c: COLORS[Math.floor(Math.random() * COLORS.length)]
    };
  }
  function petal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.a;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.moveTo(0, -p.r);
    ctx.bezierCurveTo(p.r * 0.92, -p.r * 0.5, p.r * 0.66, p.r * 0.78, 0, p.r);
    ctx.bezierCurveTo(-p.r * 0.66, p.r * 0.78, -p.r * 0.92, -p.r * 0.5, 0, -p.r);
    ctx.fill();
    ctx.restore();
  }

  size();
  window.addEventListener('resize', size, { passive: true });
  var n = (window.innerWidth < 720) ? 12 : 24;
  for (var i = 0; i < n; i++) drift.push(makeDrifter(false));

  window.addEventListener('pointermove', function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
  window.addEventListener('pointerleave', function () { mx = my = -9999; }, { passive: true });

  var running = true;
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) requestAnimationFrame(tick);
  });

  function tick(ts) {
    if (!running || !ctx) return;
    ctx.clearRect(0, 0, W, H);
    var s = (ts || 0) * 0.001;

    for (var i = 0; i < drift.length; i++) {
      var p = drift[i];
      var dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
      if (d2 < 16000) {                       // the cursor nudges, very gently
        var f = (1 - d2 / 16000) * 0.5;
        p.x += (dx / Math.sqrt(d2 || 1)) * f;
        p.y += (dy / Math.sqrt(d2 || 1)) * f * 0.5;
      }
      p.x += p.vx + Math.sin((p.y + p.rot * 60) * 0.006) * 0.32;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > H + 30 || p.x < -40 || p.x > W + 40) { drift[i] = makeDrifter(true); continue; }
      petal(p);
    }

    for (var b = bursts.length - 1; b >= 0; b--) {
      var g = bursts[b], alive = 0;
      for (var j = 0; j < g.length; j++) {
        var q = g[j];
        if (q.a <= 0) continue;
        alive++;
        q.vy += 0.2; q.vx *= 0.988; q.vy *= 0.99;
        q.x += q.vx; q.y += q.vy; q.rot += q.vr; q.a -= q.fade;
        if (q.y > H + 60) { q.a = 0; continue; }
        ctx.save();
        ctx.translate(q.x, q.y);
        ctx.rotate(q.rot);
        ctx.globalAlpha = Math.max(0, q.a);
        ctx.fillStyle = q.c;
        if (q.ribbon) ctx.fillRect(-q.r * 0.35, -q.r * 1.9, q.r * 0.7, q.r * 3.8);
        else {
          ctx.beginPath();
          ctx.moveTo(0, -q.r);
          ctx.bezierCurveTo(q.r * 0.92, -q.r * 0.5, q.r * 0.66, q.r * 0.78, 0, q.r);
          ctx.bezierCurveTo(-q.r * 0.66, q.r * 0.78, -q.r * 0.92, -q.r * 0.5, 0, -q.r);
          ctx.fill();
        }
        ctx.restore();
      }
      if (!alive) bursts.splice(b, 1);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* The announcement burst, once, when the invitation lands. */
function initAnnouncement() {
  var target = $('.invite__title');
  if (!target || reduced || ADMIN_EDIT || typeof IntersectionObserver === 'undefined') return;
  var fired = false;
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting || fired) return;
      fired = true;
      setTimeout(function () { burst((window.innerWidth || 400) / 2, (window.innerHeight || 800) * 0.44, 170, 12); }, 700);
      obs.unobserve(target);
    });
  }, { threshold: 0.6 });
  obs.observe(target);
}

/* ── Visibility ──────────────────────────────────────────────────────────── */
function applyVisibility() {
  var hid = cfg('hidden', {}) || {};
  $$('[data-opt]').forEach(function (el) {

/* ── Music ───────────────────────────────────────────────────────────────── */
var audio = $('#audio'), musicBtn = $('#music-btn'), musicRetry = false;
var RETRY_EVENTS = ['pointerdown', 'touchstart', 'keydown', 'scroll'];

function startMusic() {
  if (!audio || !audio.getAttribute('src') || !audio.paused) return;
  var p = audio.play ? audio.play() : null;
  if (p && p.catch) p.catch(armMusicRetry);
  if (musicBtn) musicBtn.setAttribute('aria-pressed', 'true');
}
function armMusicRetry() {
  if (musicRetry) return;
  musicRetry = true;
  var retry = function () {
    var p = audio.play();
    var stop = function () { RETRY_EVENTS.forEach(function (ev) { window.removeEventListener(ev, retry); }); };
    if (p && p.then) p.then(stop); else stop();
  };
  RETRY_EVENTS.forEach(function (ev) { window.addEventListener(ev, retry); });
}
function renderMusic() {
  if (!audio || !musicBtn) return;
  var url = cfg('music.url', '');
  var hid = cfg('hidden', {}) || {};
  if (!url || hid.music === true) {
    audio.removeAttribute('src');
    musicBtn.classList.add('hidden');
    return;
  }
  if (audio.getAttribute('src') !== url) audio.setAttribute('src', url);
  musicBtn.classList.remove('hidden');
}

/* ── RSVP ────────────────────────────────────────────────────────────────── */
var attending = true;
var rsvpPending = null;

function initRsvp() {
  var modal = $('#modal'), form = $('#rsvpForm');
  var openBtn = $('#rsvpOpen'), closeBtn = $('#modalClose'), thanksClose = $('#thanksClose');
  var success = $('#rsvpSuccess'), guestField = $('#guestField');
  var lastFocus = null;

  $$('#attendRow .chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      $$('#attendRow .chip').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      chip.setAttribute('aria-pressed', 'true');
      attending = chip.getAttribute('data-attend') === 'yes';
      if (guestField) guestField.style.display = attending ? '' : 'none';
    });
  });

  function open() {
    if (!modal) return;
    lastFocus = document.activeElement;
    modal.classList.add('open');
    document.body.classList.add('is-locked');
    startMusic();                       // the tap is the gesture autoplay needs
    // let the gates render closed for a frame, then part them
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { modal.classList.add('shown'); });
    });
    setTimeout(function () { var n = $('#rsvpName'); if (n && n.focus) n.focus(); }, reduced ? 0 : 1300);
  }
  function close() {
    if (!modal) return;
    modal.classList.remove('shown');
    setTimeout(function () {
      modal.classList.remove('open');
      document.body.classList.remove('is-locked');
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }, reduced ? 0 : 900);
  }

  if (openBtn) openBtn.addEventListener('click', open);
  if (closeBtn) closeBtn.addEventListener('click', close);
  if (thanksClose) thanksClose.addEventListener('click', close);
  var bg = modal ? modal.querySelector('.modal__bg') : null;
  if (bg) bg.addEventListener('click', close);

  document.addEventListener('keydown', function (e) {
    if (!modal || !modal.classList.contains('open')) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key !== 'Tab') return;
    var list = $$('button,input,select,textarea', modal).filter(function (n) { return n.offsetParent !== null; });
    if (!list.length) return;
    var first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  if (!form) return;
  form.addEventListener('submit', function (e) {
    if (e.preventDefault) e.preventDefault();
    var nameInput = $('#rsvpName');
    var field = (nameInput && nameInput.closest) ? nameInput.closest('.field') : null;
    var name = ((nameInput && nameInput.value) || '').trim();
    if (!name) {
      if (field) field.classList.add('invalid');
      if (nameInput && nameInput.focus) nameInput.focus();
      return;
    }
    if (field) field.classList.remove('invalid');
    var err = $('#rsvpErr');
    if (err) err.classList.remove('show');

    var guestsInput = $('#rsvpGuests'), msgInput = $('#rsvpMsg');
    var payload = {
      name: name,
      attending: attending,
      guests: attending ? (parseInt(guestsInput && guestsInput.value, 10) || 1) : 0,
      message: ((msgInput && msgInput.value) || '').trim() || undefined
    };

    var btn = $('#rsvpSubmit'), label = btn ? btn.querySelector('span') : null;
    if (btn) btn.disabled = true;
    if (label) label.textContent = t('sending');

    new Promise(function (resolve, reject) {
      /* If no parent answers within 2.5s (the editor preview does not), treat it
         as saved rather than showing the guest a failure. */
      var timer = setTimeout(function () { rsvpPending = null; resolve(); }, 2500);
      rsvpPending = { resolve: resolve, reject: reject, timer: timer };
      window.parent.postMessage({ type: 'vinvite:rsvp', payload: payload }, '*');
    }).then(function () {
      var text = $('#successText');
      if (text) text.textContent = attending ? t('savedYes') : t('savedNo');
      form.classList.add('gone');
      if (success) success.classList.add('on');
      if (attending) {
        burst((window.innerWidth || 400) / 2, (window.innerHeight || 800) * 0.5, 200, 13);
        setTimeout(function () { burst((window.innerWidth || 400) * 0.28, (window.innerHeight || 800) * 0.42, 90, 10); }, 220);
        setTimeout(function () { burst((window.innerWidth || 400) * 0.72, (window.innerHeight || 800) * 0.42, 90, 10); }, 380);
      }
    }, function () {
      if (err) err.classList.add('show');
    }).then(function () {
      if (btn) btn.disabled = false;
      if (label) label.textContent = t('send');
    });
  });
}

/* ── Platform credit ─────────────────────────────────────────────────────── */
var SVG_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.1 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6A2 2 0 0 1 22 16.9z"/></svg>';
var SVG_TG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.8 18.6l.3-4.2 7.7-6.9c.3-.3-.1-.5-.5-.2L7.7 13.2 3.6 11.9c-.9-.3-.9-.9.2-1.3l16-6.2c.7-.3 1.4.2 1.1 1.3l-2.7 12.8c-.2.9-.7 1.1-1.5.7l-4.1-3-2 2c-.2.2-.4.4-.8.4z"/></svg>';
var SVG_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>';

function renderPlatformContacts() {
  var host = $('#vcContacts');
  if (!host) return;
  var c = window.__CONTACTS__ || {};
  host.innerHTML = '';
  function link(href, label, svg) {
    var a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = svg + '<span>' + label + '</span>';
    host.appendChild(a);
  }
  var phone = (c.phone || '').trim(), tg = (c.telegram || '').trim(), ig = (c.instagram || '').trim();
  if (phone) link('tel:' + phone.replace(/[^\d+]/g, ''), phone, SVG_PHONE);
  if (tg) link(tg.indexOf('http') === 0 ? tg : 'https://t.me/' + tg.replace(/^@/, ''),
    tg.replace(/^https?:\/\/t\.me\//, '@').replace(/^@?/, '@'), SVG_TG);
  if (ig) link(ig.indexOf('http') === 0 ? ig : 'https://instagram.com/' + ig.replace(/^@/, ''),
    ig.replace(/^https?:\/\/(www\.)?instagram\.com\//, '@').replace(/^@?/, '@'), SVG_IG);

  var logo = $('#vconnectLogo');
  if (logo && !logo.getAttribute('src')) logo.setAttribute('src', ORIGIN + '/v-invite-logo.png');
}

/* ── Language bar ────────────────────────────────────────────────────────── */
function renderLangbar() {
  var bar = $('#langbar');
  if (!bar) return;
  bar.innerHTML = '';
  if (LANGS.length < 2) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  LANGS.forEach(function (l) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(l).toUpperCase();
    b.className = (l === lang) ? 'active' : '';
    b.addEventListener('click', function () {
      if (lang === l) return;
      lang = l;
      renderAll();
    });
    bar.appendChild(b);
  });
}

/* ── Navigation ──────────────────────────────────────────────────────────── */
function initSkip() {
  var skip = $('#skip');
  if (!skip) return;
  skip.addEventListener('click', function () {
    arrive();
    var target = $('#invite');
    if (target && target.scrollIntoView) target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' });
  });
}

/* ── Host bridge ─────────────────────────────────────────────────────────── */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'vinvite:rsvp-ok' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.resolve(); rsvpPending = null; }
  if (d.type === 'vinvite:rsvp-err' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.reject(); rsvpPending = null; }
  if (d.type === 'vinvite:config') {
    if (d.contacts) window.__CONTACTS__ = d.contacts;
    CONFIG = d.config || CONFIG;
    if (d.languages && d.languages.length) {
      LANGS = d.languages;
      if (LANGS.indexOf(lang) === -1) lang = LANGS[0];
    }
    renderAll();
  }
  /* The editor jumped to a section being edited: every entrance must already
     have played, or the admin is looking at a blank page. */
  if (d.type === 'vinvite:focus') {
    arrive();
    revealEverything();
  }
});

/* ── Full render (initial + on config / language change) ─────────────────── */
function renderAll() {
  renderPlatformContacts();
  bindTexts();
  bindArtwork();
  renderCalendar();
  renderSchedule();
  renderGallery();
  applyVisibility();
  renderMusic();
  renderLangbar();
  collectLayers();
  if (!reduced) paint();
}

/* ── Boot ────────────────────────────────────────────────────────────────── */
try {
  renderAll();
  measureVines();
  initObserver();
  initCalendar();
  initGalleryDrag();
  initPetals();
  initAnnouncement();
  initRsvp();
  initSkip();
  initFilm();
  if (!reduced) {
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', function () { onScroll(); shiftGallery(); }, { passive: true });
  }
  if (reduced || ADMIN_EDIT) arrive();
} catch (err) {
  /* A half-booted page must still be readable: show everything, drop the film
     hold, and leave the page scrollable. */
  arrive();
  revealEverything();
  document.body.classList.remove('is-locked');
  if (window.console && console.error) console.error(err);
}
})();
</script>
