<!DOCTYPE html>
<html lang="ru" class="is-locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A1E">
<title>Invitation</title>
<!--__CONFIG__-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&family=Parisienne&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   MIDNIGHT GOLD — LUXURY BIRTHDAY CELEBRATION
   Story: a wrapped gift sits alone in the dark. Opening it floods the page with
   golden light; every section that follows is another surprise from inside.
   Palette arc: midnight (hero) → warm ivory (the celebration) → midnight (farewell)
   ========================================================================== */

/* --- 1. DESIGN TOKENS ---------------------------------------------------- */
:root{
  --navy:        #070A1E;
  --navy-2:      #0E1436;
  --royal:       #23379B;
  --purple:      #4B2A8C;
  --champagne:   #F3E5CB;
  --warm-white:  #FBF7F0;

  --gold:        #D8B268;
  --gold-lt:     #F0D79B;
  --gold-dk:     #9C7734;
  --rose-gold:   #E3A896;
  --coral:       #FF8A6B;
  --sky:         #7FB8E8;

  --yellow:      #FFD166;
  --pink:        #FF6FA5;
  --emerald:     #2FB58C;
  --orange:      #F79E5C;

  --ink:         #171C3A;
  --ink-soft:    #4A5068;
  --ink-light:   rgba(251,247,240,.72);

  --ivory:       #FBF7F0;
  --ivory-2:     #F4EDE1;
  --line:        rgba(23,28,58,.12);

  --serif:  'Cormorant Garamond', 'Iowan Old Style', Garamond, Georgia, serif;
  --sans:   'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --script: 'Parisienne', 'Snell Roundhand', 'Segoe Script', cursive;

  --e:      cubic-bezier(.22,.68,.28,1);
  --e-out:  cubic-bezier(.16,1,.3,1);
  --e-soft: cubic-bezier(.4,.15,.2,1);

  --pad: clamp(20px, 6vw, 40px);
  --sec: clamp(84px, 17vw, 150px);
}

/* --- 2. BASE ------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.is-locked,html.is-locked body{overflow:hidden;height:100%;touch-action:none}
body{
  font-family:var(--sans);
  background:var(--navy);
  color:var(--ink);
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--gold);color:var(--navy)}

.eyebrow{
  font-family:var(--sans);font-size:.68rem;font-weight:400;
  letter-spacing:.42em;text-transform:uppercase;
}
.script{font-family:var(--script);font-weight:400;line-height:1.25}

.ornament{display:flex;align-items:center;justify-content:center;gap:14px}
.ornament i{display:block;width:min(64px,16vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament i:last-child{transform:scaleX(-1)}
.ornament svg{width:15px;height:15px;fill:var(--gold);opacity:.9}

/* --- 3. SCROLL REVEAL SYSTEM --------------------------------------------- */
.reveal{
  opacity:0;
  transition:
    opacity .95s var(--e) var(--d,0s),
    transform 1.15s var(--e-out) var(--d,0s),
    filter .95s var(--e) var(--d,0s),
    clip-path 1.25s var(--e-out) var(--d,0s);
}
.reveal.in{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}
.rv-rise    {transform:translateY(52px) scale(.975);filter:blur(12px)}
.rv-mask    {clip-path:inset(0 0 102% 0);transform:translateY(14px)}
.rv-depth   {transform:perspective(1000px) rotateX(16deg) translateY(46px) scale(.94);transform-origin:50% 100%;filter:blur(6px)}
.rv-develop {filter:blur(16px) saturate(.15) brightness(.55) contrast(1.2);transform:scale(1.08)}
.rv-pop     {transform:scale(.7);filter:blur(4px)}
[data-stagger] > *{--d:calc(var(--i,0) * 105ms)}

/* --- 4. AMBIENT DECOR LAYERS --------------------------------------------- */
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.spark{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,var(--gold-lt) 38%,rgba(216,178,104,0) 72%);
  opacity:0;
  animation:sparkDrift var(--dur,14s) linear var(--del,0s) infinite;
  will-change:transform,opacity;
}
@keyframes sparkDrift{
  0%  {opacity:0;transform:translate3d(0,20px,0) scale(.5)}
  12% {opacity:var(--op,.85)}
  78% {opacity:var(--op,.85)}
  100%{opacity:0;transform:translate3d(var(--dx,20px),calc(var(--rise,-180px)),0) scale(1.15)}
}

.bloom{
  position:absolute;left:50%;top:52%;translate:-50% -50%;
  width:min(120vw,760px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, rgba(75,42,140,.55) 0%, rgba(35,55,155,.28) 34%, rgba(7,10,30,0) 68%);
  filter:blur(10px);
  animation:breathe 9s var(--e-soft) infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.09);opacity:1}}

/* --- 5. HERO ------------------------------------------------------------- */
.hero{
  position:relative;
  min-height:100vh;min-height:100svh;
  display:grid;grid-template-rows:1fr auto;
  padding:calc(env(safe-area-inset-top) + 26px) var(--pad) calc(env(safe-area-inset-bottom) + 30px);
  background:
    radial-gradient(120% 82% at 50% 8%,  rgba(35,55,155,.42) 0%, rgba(7,10,30,0) 60%),
    radial-gradient(90% 60% at 50% 108%, rgba(75,42,140,.5) 0%, rgba(7,10,30,0) 62%),
    linear-gradient(180deg,#05071A 0%, #0B1030 46%, #070A1E 100%);
  isolation:isolate;
  overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(110% 78% at 50% 46%, transparent 42%, rgba(3,4,14,.72) 100%);
}

.hero-stage{position:relative;display:grid;place-items:center;z-index:2}
.hero-inner{position:relative;display:grid;justify-items:center;gap:clamp(28px,7vw,44px);width:100%}

.hero-kicker{
  display:grid;justify-items:center;gap:12px;text-align:center;
  color:var(--champagne);
  transition:opacity .8s var(--e), transform 1s var(--e), filter .8s var(--e);
}
.hero-kicker .eyebrow{color:rgba(243,229,203,.62)}
.hero-kicker h1{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(2.1rem,9.5vw,3.4rem);line-height:1.06;
  background:linear-gradient(96deg,var(--champagne) 8%,var(--gold-lt) 42%,#fff 56%,var(--gold) 82%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% 100%;
  animation:foilSweep 9s ease-in-out infinite;
}
@keyframes foilSweep{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero-kicker p{
  font-size:.86rem;font-weight:200;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(243,229,203,.5);
}

/* ---- 5a. THE GIFT BOX --------------------------------------------------- */
.gift-wrap{
  position:relative;width:min(78vw,290px);aspect-ratio:1/1.06;
  perspective:900px;perspective-origin:50% 38%;
  transform-style:preserve-3d;
  cursor:pointer;
  transition:transform 2.6s var(--e-out), filter 1.4s var(--e);
}
.gift{
  position:absolute;inset:0;transform-style:preserve-3d;
  animation:giftBreathe 4.6s var(--e-soft) infinite;
  will-change:transform;
}
@keyframes giftBreathe{
  0%,100%{transform:translateY(0) rotateZ(0deg) scale(1)}
  35%    {transform:translateY(-9px) rotateZ(-.7deg) scale(1.012)}
  70%    {transform:translateY(3px)  rotateZ(.5deg)  scale(.996)}
}

.gift-shadow{
  position:absolute;left:50%;bottom:-6%;translate:-50% 0;
  width:74%;height:9%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(3,5,20,.85),rgba(3,5,20,0) 70%);
  filter:blur(7px);
  animation:shadowBreathe 4.6s var(--e-soft) infinite;
}
@keyframes shadowBreathe{0%,100%{transform:scale(1);opacity:.75}35%{transform:scale(.86);opacity:.5}}

.box-body{
  position:absolute;left:6%;right:6%;bottom:0;height:63%;
  border-radius:10px 10px 13px 13px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 26%),
    linear-gradient(103deg, #1B2470 0%, #2C3AA6 30%, #3B2C8E 62%, #1A1E5E 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset -14px 0 26px rgba(3,5,25,.55),
    inset 14px 0 20px rgba(255,255,255,.05),
    0 26px 50px rgba(3,5,25,.6);
  overflow:hidden;
}
.box-body::before{
  content:"";position:absolute;inset:0;opacity:.16;
  background:
    repeating-linear-gradient(58deg, rgba(255,255,255,.5) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-58deg, rgba(255,255,255,.28) 0 1px, transparent 1px 9px);
}
.box-body::after{
  content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle,var(--gold-lt) 45%,transparent 46%);
  background-size:26px 26px;background-position:6px 8px;
  mask-image:radial-gradient(120% 90% at 50% 20%,#000 30%,transparent 78%);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 20%,#000 30%,transparent 78%);
}

.box-lid{
  position:absolute;left:0;right:0;top:26%;height:16%;
  border-radius:8px;
  transform-origin:50% 100%;
  background:
    linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 40%),
    linear-gradient(100deg, #212A80 0%, #3544BC 34%, #4634A0 68%, #1D226B 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.32),
    inset 0 -10px 18px rgba(3,5,25,.5),
    0 14px 26px rgba(3,5,25,.55);
  z-index:4;
  transition:transform 2.1s var(--e-out), opacity 1.2s var(--e) .9s, filter 1.4s var(--e);
}
.box-lid::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt) 35%,var(--gold) 62%,var(--gold-dk));
  box-shadow:0 0 12px rgba(216,178,104,.55);
  border-radius:0 0 8px 8px;
}

.ribbon-v{
  position:absolute;left:50%;translate:-50% 0;top:26%;bottom:0;width:17%;
  background:linear-gradient(90deg,var(--gold-dk) 0%,var(--gold-lt) 26%,#FFF3D6 46%,var(--gold) 70%,var(--gold-dk) 100%);
  box-shadow:0 0 18px rgba(216,178,104,.4), inset 0 0 12px rgba(255,255,255,.35);
  z-index:5;transform-origin:50% 0;
  transition:transform 1.05s var(--e-out), opacity .7s var(--e) .5s;
}
.ribbon-v::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,.75) 48%,transparent 100%);
  background-size:100% 46%;background-repeat:no-repeat;
  animation:silk 5.2s var(--e-soft) infinite;
  mix-blend-mode:screen;opacity:.6;
}
@keyframes silk{0%{background-position:0 -60%}55%,100%{background-position:0 150%}}

.ribbon-h{
  position:absolute;left:-1%;right:-1%;top:31.5%;height:6.6%;
  background:linear-gradient(180deg,var(--gold-dk) 0%,var(--gold-lt) 30%,#FFF3D6 50%,var(--gold) 74%,var(--gold-dk) 100%);
  box-shadow:0 0 18px rgba(216,178,104,.45), inset 0 0 10px rgba(255,255,255,.3);
  z-index:6;transform-origin:50% 50%;
  transition:transform 1.2s var(--e-out), opacity .7s var(--e) .45s;
}

.bow{
  position:absolute;left:50%;top:15%;translate:-50% 0;
  width:56%;aspect-ratio:2/1;z-index:7;
  transform-origin:50% 78%;
  animation:bowSway 6s var(--e-soft) infinite;
  transition:transform 1.4s var(--e-out), opacity .9s var(--e) .35s;
}
@keyframes bowSway{0%,100%{rotate:0deg}50%{rotate:-2.4deg}}
.loop{
  position:absolute;top:0;width:47%;height:100%;
  background:linear-gradient(150deg,var(--gold-lt) 0%,#FFF6E0 22%,var(--gold) 55%,var(--gold-dk) 100%);
  box-shadow:inset 0 0 14px rgba(255,255,255,.5), 0 6px 14px rgba(3,5,25,.4);
  transform-origin:100% 82%;
  transition:transform 1.5s var(--e-out), opacity .8s var(--e) .3s;
}
.loop-l{left:0;border-radius:70% 30% 44% 56% / 66% 62% 38% 34%;rotate:-9deg}
.loop-r{right:0;border-radius:30% 70% 56% 44% / 62% 66% 34% 38%;rotate:9deg;transform-origin:0% 82%}
.loop::after{
  content:"";position:absolute;inset:22% 18% 18% 22%;border-radius:inherit;
  background:linear-gradient(160deg,rgba(120,86,26,.55),rgba(255,255,255,.1));
  opacity:.55;
}
.tail{
  position:absolute;top:62%;width:16%;height:80%;
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold-lt) 45%,var(--gold-dk) 100%);
  transform-origin:50% 0;
  transition:transform 1.3s var(--e-out), opacity .8s var(--e) .3s;
}
.tail-l{left:30%;border-radius:30% 40% 60% 30%/8% 10% 46% 40%;rotate:15deg;animation:tailWave 5.4s var(--e-soft) infinite}
.tail-r{right:30%;border-radius:40% 30% 30% 60%/10% 8% 40% 46%;rotate:-15deg;animation:tailWave 5.4s var(--e-soft) -2.4s infinite}
@keyframes tailWave{0%,100%{skew:0deg 0deg}50%{skew:3deg 1deg}}
.knot{
  position:absolute;left:50%;top:58%;translate:-50% -50%;
  width:20%;aspect-ratio:1.15/1;border-radius:44% 44% 50% 50%/48%;
  background:radial-gradient(circle at 34% 30%,#FFF6E0,var(--gold) 58%,var(--gold-dk));
  box-shadow:0 4px 10px rgba(3,5,25,.45), inset 0 0 8px rgba(255,255,255,.5);
  z-index:2;
}

.inner-light{
  position:absolute;left:14%;right:14%;top:30%;height:34%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 100%, #FFF4D2 0%, var(--yellow) 26%, rgba(216,178,104,0) 72%);
  opacity:0;filter:blur(10px);z-index:3;
  transition:opacity 1.1s var(--e), transform 1.8s var(--e-out);
  transform:scaleY(.3);
}
.rays{
  position:absolute;left:50%;top:30%;translate:-50% -50%;
  width:min(200vw,860px);aspect-ratio:1;
  background:conic-gradient(from 0deg,
    rgba(255,216,146,.42) 0deg 3deg, transparent 3deg 16deg,
    rgba(255,216,146,.28) 16deg 19deg, transparent 19deg 36deg,
    rgba(255,216,146,.38) 36deg 40deg, transparent 40deg 58deg,
    rgba(255,216,146,.22) 58deg 61deg, transparent 61deg 84deg,
    rgba(255,216,146,.36) 84deg 88deg, transparent 88deg 110deg,
    rgba(255,216,146,.26) 110deg 113deg, transparent 113deg 140deg,
    rgba(255,216,146,.4) 140deg 144deg, transparent 144deg 168deg,
    rgba(255,216,146,.24) 168deg 171deg, transparent 171deg 200deg,
    rgba(255,216,146,.34) 200deg 204deg, transparent 204deg 232deg,
    rgba(255,216,146,.28) 232deg 235deg, transparent 235deg 262deg,
    rgba(255,216,146,.38) 262deg 266deg, transparent 266deg 292deg,
    rgba(255,216,146,.22) 292deg 295deg, transparent 295deg 322deg,
    rgba(255,216,146,.36) 322deg 326deg, transparent 326deg 360deg);
  mask-image:radial-gradient(circle,rgba(0,0,0,.85) 4%,rgba(0,0,0,.4) 30%,transparent 66%);
  -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.85) 4%,rgba(0,0,0,.4) 30%,transparent 66%);
  filter:blur(7px);
  opacity:0;z-index:2;pointer-events:none;
  transition:opacity 1.6s var(--e);
  animation:raySpin 54s linear infinite;
}
@keyframes raySpin{to{rotate:360deg}}

.flash{
  position:absolute;left:50%;top:44%;translate:-50% -50%;
  width:min(150vw,620px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#FFFDF5 0%,rgba(255,229,166,.75) 22%,rgba(255,209,102,0) 62%);
  opacity:0;transform:scale(.2);z-index:8;pointer-events:none;
  mix-blend-mode:screen;
}
.flash.fire{animation:flashBurst 1.9s var(--e-out) forwards}
@keyframes flashBurst{
  0%{opacity:0;transform:scale(.18)}
  16%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.6)}
}

/* ---- 5b. OPENING STATES ------------------------------------------------- */
.hero.opening .gift{animation-play-state:paused}
.hero.opening .gift-shadow{animation:none;opacity:.28;transform:scale(1.25)}

.hero.s-lift .gift-wrap{transform:translateY(-16px) scale(1.03)}
.hero.s-lift .gift{transform:translateY(-10px)}

.hero.s-untie .loop-l{transform:rotate(-52deg) translate(-26px,26px) scale(.72);opacity:0}
.hero.s-untie .loop-r{transform:rotate(52deg)  translate(26px,26px)  scale(.72);opacity:0}
.hero.s-untie .tail-l{transform:rotate(-34deg) translateY(34px) scaleY(.5);opacity:0}
.hero.s-untie .tail-r{transform:rotate(34deg)  translateY(34px) scaleY(.5);opacity:0}
.hero.s-untie .bow{transform:translateY(18px) scale(.92) rotate(-4deg);opacity:0}
.hero.s-untie .ribbon-h{transform:scaleX(1.35);opacity:0}
.hero.s-untie .ribbon-v{transform:scaleY(0);opacity:0}

.hero.s-lid .box-lid{
  transform:translate3d(6%,-190%,90px) rotateX(-32deg) rotateZ(9deg) scale(1.04);
  opacity:0;filter:blur(3px);
}
.hero.s-lid .inner-light{opacity:1;transform:scaleY(1)}
.hero.s-lid .rays{opacity:.6}

.hero.s-zoom .gift-wrap{transform:translateY(-6%) scale(1.22);filter:brightness(1.06)}
.hero.s-zoom .hero-kicker{opacity:0;transform:translateY(-22px) scale(.97);filter:blur(6px)}
.hero.s-zoom .bloom{animation:none;transform:translate(-50%,-50%) scale(1.4);opacity:.5;transition:all 2s var(--e)}

.hero.s-card .gift-wrap{transform:translateY(6%) scale(1.06);filter:brightness(.9) saturate(.85)}
.hero.s-card .card-rise{opacity:1;transform:translate(-50%,-52%) rotateX(0deg) scale(1)}

.card-rise{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,18%) rotateX(46deg) scale(.72);
  transform-origin:50% 100%;
  width:min(80vw,320px);
  padding:clamp(30px,8vw,42px) clamp(22px,6vw,30px);
  text-align:center;
  border-radius:6px;
  background:linear-gradient(168deg,#FFFDF7 0%,var(--ivory-2) 100%);
  box-shadow:
    0 2px 0 rgba(255,255,255,.9) inset,
    0 30px 60px rgba(3,5,25,.55),
    0 0 0 1px rgba(216,178,104,.5),
    0 0 44px rgba(255,214,140,.35);
  opacity:0;z-index:9;
  transition:opacity 1.1s var(--e), transform 1.9s var(--e-out), filter 1s var(--e);
  will-change:transform,opacity;
}
.card-rise .eyebrow{color:var(--gold-dk);font-size:.6rem}
.card-rise .num{
  font-family:var(--serif);font-weight:300;font-size:clamp(3.6rem,20vw,5.4rem);
  line-height:.9;margin:.18em 0 .1em;
  background:linear-gradient(120deg,var(--gold-dk),var(--gold) 32%,#F6E4B8 52%,var(--gold-dk));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.card-rise .who{font-family:var(--script);font-size:clamp(1.7rem,7vw,2.1rem);color:var(--ink);margin-bottom:.35em}
.card-rise .cue{
  margin-top:22px;font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);
  display:grid;justify-items:center;gap:9px;
}
.card-rise .cue span{display:block;width:1px;height:26px;background:linear-gradient(var(--gold),transparent);animation:cueDrop 2.2s var(--e-soft) infinite}
@keyframes cueDrop{0%{transform:scaleY(.2);transform-origin:top;opacity:0}40%{opacity:1}100%{transform:scaleY(1);transform-origin:top;opacity:0}}

/* ---- 5c. OPEN BUTTON ---------------------------------------------------- */
.hero-cta{position:relative;z-index:3;display:grid;justify-items:center;gap:16px;text-align:center;
  transition:opacity .7s var(--e), transform .8s var(--e), filter .7s var(--e)}
.hero.opening .hero-cta{opacity:0;transform:translateY(20px);filter:blur(6px);pointer-events:none}

.btn-open{
  position:relative;isolation:isolate;
  padding:17px 38px;border:0;border-radius:100px;cursor:pointer;
  font-family:var(--sans);font-size:.76rem;font-weight:400;
  letter-spacing:.26em;text-transform:uppercase;color:#20180A;
  background:linear-gradient(100deg,var(--gold-dk) 0%,var(--gold) 24%,#FCEBC2 50%,var(--gold) 74%,var(--gold-dk) 100%);
  background-size:200% 100%;
  box-shadow:0 12px 30px rgba(216,178,104,.32), 0 2px 0 rgba(255,255,255,.5) inset;
  transition:transform .45s var(--e-out), box-shadow .45s var(--e), background-position 1.2s var(--e);
  -webkit-tap-highlight-color:transparent;
  animation:btnPulse 3.4s var(--e-soft) infinite;
}
@keyframes btnPulse{
  0%,100%{box-shadow:0 12px 30px rgba(216,178,104,.3), 0 0 0 0 rgba(240,215,155,.34), 0 2px 0 rgba(255,255,255,.5) inset}
  60%    {box-shadow:0 14px 36px rgba(216,178,104,.42), 0 0 0 18px rgba(240,215,155,0), 0 2px 0 rgba(255,255,255,.5) inset}
}
.btn-open:hover{background-position:100% 50%;transform:translateY(-3px);box-shadow:0 18px 40px rgba(216,178,104,.45)}
.btn-open:active{transform:translateY(1px) scale(.985)}
.btn-open:focus-visible{outline:2px solid var(--champagne);outline-offset:5px}
.hero-cta small{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(243,229,203,.4)}

/* ---- 5d. FLYING DECOR SPAWNED AT THE BURST ------------------------------ */
.burst-layer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}

.balloon{
  position:absolute;bottom:-24vh;left:var(--x);
  width:var(--w,44px);aspect-ratio:1/1.2;
  border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 34%),
    radial-gradient(circle at 70% 78%, rgba(0,0,0,.22) 0%, rgba(0,0,0,0) 46%),
    var(--c);
  box-shadow:0 10px 26px rgba(3,5,25,.22), inset -6px -10px 18px rgba(0,0,0,.14);
  opacity:0;
  animation:balloonRise var(--dur,15s) var(--e-soft) var(--del,0s) forwards;
  will-change:transform,opacity;
}
.balloon::before{
  content:"";position:absolute;left:50%;bottom:-5px;translate:-50% 0;
  width:0;height:0;border:5px solid transparent;border-top-color:var(--c);filter:brightness(.85);
}
.balloon::after{
  content:"";position:absolute;left:50%;top:100%;translate:-50% 0;
  width:14px;height:var(--string,62px);
  border-left:1px solid rgba(255,255,255,.42);
  border-radius:0 0 0 60% / 0 0 0 90%;
}
@keyframes balloonRise{
  0%  {opacity:0;transform:translate3d(0,10vh,0) scale(.6) rotate(0deg)}
  10% {opacity:1}
  50% {transform:translate3d(var(--sway,26px),-62vh,0) scale(1) rotate(var(--rot,6deg))}
  85% {opacity:1}
  100%{opacity:0;transform:translate3d(calc(var(--sway,26px) * -.7),-135vh,0) scale(1.04) rotate(calc(var(--rot,6deg) * -1))}
}

.confetti{
  position:absolute;top:var(--y,42%);left:var(--x);
  width:var(--w,7px);height:var(--h,12px);border-radius:1.5px;
  background:var(--c);opacity:0;
  animation:confettiFall var(--dur,7s) linear var(--del,0s) forwards;
  will-change:transform,opacity;
}
@keyframes confettiFall{
  0%  {opacity:0;transform:translate3d(0,0,0) rotate3d(1,1,.3,0deg) scale(.6)}
  8%  {opacity:1}
  100%{opacity:0;transform:translate3d(var(--dx,40px),110vh,0) rotate3d(1,1,.3,var(--spin,900deg)) scale(1)}
}

.streamer{position:absolute;left:50%;top:44%;width:2px;height:0;transform-origin:50% 0;opacity:0}
.streamer svg{position:absolute;left:-40px;top:0;width:80px;height:var(--len,220px);overflow:visible}
.streamer path{
  fill:none;stroke:var(--c,var(--gold));stroke-width:5;stroke-linecap:round;
  stroke-dasharray:var(--len,220) var(--len,220);stroke-dashoffset:var(--len,220);
  filter:drop-shadow(0 0 6px rgba(216,178,104,.5));
}
.streamer.go{animation:streamerOut 2.6s var(--e-out) forwards}
.streamer.go path{animation:streamerDraw 1.6s var(--e-out) forwards, streamerWave 3.4s var(--e-soft) 1.2s infinite}
@keyframes streamerOut{0%{opacity:0;transform:rotate(var(--a)) scale(.4)}20%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) scale(1.4) translateY(-30px)}}
@keyframes streamerDraw{to{stroke-dashoffset:0}}
@keyframes streamerWave{0%,100%{transform:skewX(0deg)}50%{transform:skewX(8deg)}}

/* --- 6. THE CELEBRATION (warm ivory world) ------------------------------- */
.celebration{
  position:relative;
  background:
    radial-gradient(90% 40% at 50% 0%, rgba(255,232,190,.85) 0%, rgba(251,247,240,0) 58%),
    linear-gradient(180deg,var(--ivory) 0%, var(--ivory-2) 42%, var(--ivory) 100%);
  z-index:2;
}
.light-seam{
  position:relative;overflow:hidden;height:clamp(90px,22vw,150px);margin-top:-1px;
  background:linear-gradient(180deg,#070A1E 0%, #2B2154 34%, #A9793C 72%, var(--ivory) 100%);
}
.light-seam::after{
  content:"";position:absolute;left:50%;top:6%;translate:-50% 0;
  width:min(140vw,720px);height:180%;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,240,205,.9) 0%, rgba(255,209,102,.32) 34%, rgba(255,209,102,0) 68%);
  filter:blur(4px);
}
.section{position:relative;padding:var(--sec) var(--pad)}
.wrap{max-width:640px;margin-inline:auto;position:relative}

.sec-head{text-align:center;display:grid;justify-items:center;gap:14px;margin-bottom:clamp(40px,10vw,64px)}
.sec-head .eyebrow{color:var(--gold-dk)}
.sec-head h2{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(1.9rem,8.2vw,2.9rem);line-height:1.1;color:var(--ink);
}
.sec-head p{max-width:44ch;font-size:.94rem;font-weight:300;color:var(--ink-soft)}

/* ---- 6a. WELCOME -------------------------------------------------------- */
.welcome{padding-top:clamp(40px,10vw,70px);text-align:center}
.welcome .greet{font-family:var(--script);font-size:clamp(1.5rem,6.4vw,2rem);color:var(--gold-dk);margin-bottom:.2em}
.name{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(3.4rem,19vw,6rem);line-height:.92;letter-spacing:.005em;
  color:var(--ink);margin:.06em 0 .22em;
  display:flex;justify-content:center;flex-wrap:wrap;
}
.name .ltr{
  display:inline-block;
  opacity:0;transform:translateY(48px) rotate(6deg) scale(.86);filter:blur(9px);
  transition:opacity .8s var(--e) var(--d), transform 1.1s var(--e-out) var(--d), filter .8s var(--e) var(--d);
}
.name.in .ltr{opacity:1;transform:none;filter:none}
.name .ltr.sp{width:.3em}
.welcome .age{
  display:inline-flex;align-items:center;gap:14px;
  font-size:.66rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-dk);
  margin-bottom:clamp(26px,7vw,36px);
}
.welcome .age::before,.welcome .age::after{content:"";width:34px;height:1px;background:var(--gold)}
.welcome .msg{
  font-family:var(--serif);font-size:clamp(1.08rem,4.6vw,1.32rem);font-weight:300;
  font-style:italic;line-height:1.7;color:var(--ink-soft);max-width:34ch;margin-inline:auto;
  white-space:pre-line;
}
.welcome::before{
  content:"";position:absolute;left:50%;top:14%;translate:-50% 0;
  width:min(90vw,460px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,102,.28) 0%,rgba(255,209,102,0) 66%);
  animation:breathe 11s var(--e-soft) infinite;pointer-events:none;
}

/* ---- 6b. INFORMATION CARDS --------------------------------------------- */
.info-grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.card{
  position:relative;overflow:hidden;
  padding:clamp(22px,6vw,28px) clamp(18px,5vw,24px);
  border-radius:16px;
  background:linear-gradient(165deg,#FFFDF8 0%,#F6EFE2 100%);
  border:1px solid rgba(216,178,104,.34);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 14px 30px rgba(23,28,58,.06);
  transition:transform .5s var(--e-out), box-shadow .5s var(--e), border-color .5s var(--e);
}
.card::after{
  content:"";position:absolute;inset:-40% -10%;
  background:linear-gradient(102deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);
  transform:translateX(-120%);opacity:0;pointer-events:none;
}
.card.in::after{animation:sheen 1.5s var(--e-out) calc(var(--d) + .25s) both}
@keyframes sheen{0%{transform:translateX(-120%);opacity:0}25%{opacity:.9}100%{transform:translateX(120%);opacity:0}}
.card:active{transform:translateY(-2px) scale(.99)}
@media (hover:hover){.card:hover{transform:translateY(-5px);box-shadow:0 22px 44px rgba(23,28,58,.12);border-color:rgba(216,178,104,.7)}}

.card .ico{width:26px;height:26px;fill:none;stroke:var(--gold-dk);stroke-width:1.3;margin-bottom:14px}
.card h3{font-size:.6rem;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:8px}
.card p{font-family:var(--serif);font-size:1.14rem;font-weight:400;line-height:1.4;color:var(--ink)}
.card p small{display:block;font-family:var(--sans);font-size:.76rem;font-weight:300;color:var(--ink-soft);margin-top:6px;line-height:1.55}
.card.wide{grid-column:1/-1}

.card.feature{
  grid-column:1/-1;text-align:center;padding:clamp(30px,8vw,42px) 22px;
  background:linear-gradient(160deg,#12173B 0%,#2A2160 52%,#141A46 100%);
  border-color:rgba(216,178,104,.45);
  box-shadow:0 20px 46px rgba(11,15,43,.32);
}
.card.feature h3{color:rgba(243,229,203,.55)}
.card.feature .big{
  font-family:var(--serif);font-weight:300;color:var(--champagne);
  font-size:clamp(1.6rem,7.4vw,2.2rem);line-height:1.15;
}
.card.feature .rule{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 14px}
.card.feature .rule i{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.card.feature .rule i:last-child{transform:scaleX(-1)}
.card.feature .rule b{font-family:var(--sans);font-size:.66rem;font-weight:300;letter-spacing:.3em;color:var(--gold-lt)}
.card.feature .hour{font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,229,203,.72)}
.card.feature::before{
  content:"";position:absolute;left:50%;top:-40%;translate:-50% 0;
  width:120%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,209,102,.2),transparent 62%);
}

.map-link{
  display:inline-flex;align-items:center;gap:9px;margin-top:12px;
  font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold-dk);text-decoration:none;border-bottom:1px solid rgba(216,178,104,.5);
  padding-bottom:3px;transition:gap .4s var(--e),color .3s var(--e)}
.map-link:hover{gap:14px;color:var(--ink)}
.map-link svg{width:13px;height:13px;fill:currentColor}

/* dress swatches */
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.swatch{
  width:26px;height:26px;border-radius:50%;
  box-shadow:0 3px 8px rgba(23,28,58,.2), inset 0 0 0 1px rgba(255,255,255,.5);
  animation:floatSwatch 4.6s var(--e-soft) infinite;
}
@keyframes floatSwatch{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* gift card */
.giftcard{
  grid-column:1/-1;position:relative;overflow:hidden;
  padding:clamp(22px,6vw,28px);border-radius:16px;
  background:linear-gradient(135deg,#1A1E5E 0%,#3B2C8E 55%,#12173B 100%);
  border:1px solid rgba(216,178,104,.45);
  box-shadow:0 18px 40px rgba(11,15,43,.3);
}
.giftcard h3{font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(243,229,203,.6);margin-bottom:12px}
.gc-number{
  font-family:var(--serif);font-size:clamp(1.2rem,5.6vw,1.6rem);letter-spacing:.1em;
  color:var(--champagne);
}
.gc-holder{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,229,203,.55);margin-top:8px}
.gc-copy{
  margin-top:16px;padding:10px 20px;border-radius:100px;cursor:pointer;
  border:1px solid rgba(216,178,104,.55);background:transparent;
  font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-lt);
  transition:background .35s var(--e),color .35s var(--e);
}
.gc-copy:hover{background:rgba(216,178,104,.16);color:#fff}

/* contacts */
.contact-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.contact-item{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);
  padding:9px 16px;border-radius:100px;border:1px solid rgba(216,178,104,.4);
  font-size:.74rem;transition:background .35s var(--e),border-color .35s var(--e);
}
.contact-item:hover{background:rgba(216,178,104,.14);border-color:var(--gold)}
.contact-item svg{width:17px;height:17px;stroke:var(--gold-dk)}

/* ---- 6c. TIMELINE ------------------------------------------------------- */
.timeline{position:relative;padding-left:52px;list-style:none}
.timeline .spine{
  position:absolute;left:17px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--gold),rgba(216,178,104,.25));
  transform:scaleY(0);transform-origin:top;
  transition:transform 1.9s var(--e-out);
}
.timeline.in .spine{transform:scaleY(1)}
.t-item{position:relative;padding-bottom:clamp(28px,7vw,38px);opacity:0;transform:translateX(24px);
  transition:opacity .8s var(--e) var(--d), transform .9s var(--e-out) var(--d)}
.timeline.in .t-item{opacity:1;transform:none}
.t-item:last-child{padding-bottom:0}
.t-node{
  position:absolute;left:-52px;top:-2px;
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#FFFDF8,#F1E7D5);
  border:1px solid rgba(216,178,104,.6);
  box-shadow:0 6px 16px rgba(23,28,58,.1);
}
.t-node svg{width:17px;height:17px;fill:none;stroke:var(--gold-dk);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.t-node::after{
  content:"";position:absolute;inset:-2px;border-radius:50%;
  border:1px solid rgba(216,178,104,.75);
  animation:nodePulse 3.6s var(--e-soft) calc(var(--i) * .42s) infinite;
}
@keyframes nodePulse{0%{transform:scale(1);opacity:.7}60%,100%{transform:scale(1.75);opacity:0}}
.t-time{font-size:.66rem;letter-spacing:.28em;color:var(--gold-dk);text-transform:uppercase}
.t-item h3{font-family:var(--serif);font-size:1.3rem;font-weight:400;color:var(--ink);margin:4px 0 4px}

/* ---- 6d. MEMORY GALLERY ------------------------------------------------- */
.gallery-scroll{
  display:flex;gap:clamp(16px,4.5vw,26px);
  padding:14px var(--pad) 34px;
  margin-inline:calc(var(--pad) * -1);
  overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.gallery-scroll::-webkit-scrollbar{display:none}
.polaroid{
  flex:0 0 auto;width:min(62vw,236px);scroll-snap-align:center;
  background:#FFFDF8;padding:11px 11px 46px;border-radius:4px;
  box-shadow:0 14px 30px rgba(23,28,58,.16), 0 2px 6px rgba(23,28,58,.08);
  rotate:var(--r,0deg);cursor:pointer;
  animation:floatCard var(--fd,7s) var(--e-soft) var(--fdel,0s) infinite;
  transition:transform .5s var(--e-out), box-shadow .5s var(--e), rotate .5s var(--e-out);
}
@media (hover:hover){.polaroid:hover{rotate:0deg;transform:translateY(-8px) scale(1.03);box-shadow:0 26px 50px rgba(23,28,58,.24)}}
.polaroid:active{transform:scale(.98)}
@keyframes floatCard{0%,100%{translate:0 0}50%{translate:0 -9px}}
.polaroid .shot{
  aspect-ratio:1/1.06;border-radius:2px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#2A2160,#12173B);
}
.polaroid .shot img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid .shot img.broken{display:none}
.polaroid .shot::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 60% at 76% 8%, rgba(255,222,170,.4), transparent 58%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
  mix-blend-mode:screen;
}
.polaroid figcaption{
  font-family:var(--script);font-size:1.12rem;color:var(--ink-soft);
  text-align:center;padding-top:11px;min-height:1.4em;
}
.gal-hint{text-align:center;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);opacity:.6}

/* ---- 6e. WISHES DECK ---------------------------------------------------- */
.deck{
  position:relative;height:clamp(290px,76vw,330px);
  perspective:1100px;margin-bottom:26px;
  touch-action:pan-y;
}
.wish{
  position:absolute;left:50%;top:0;width:min(84vw,330px);
  translate:-50% 0;
  padding:clamp(26px,7vw,34px) clamp(22px,6vw,30px);
  border-radius:14px;
  background:linear-gradient(158deg,#FFFDF8 0%,#F7F0E3 100%);
  border:1px solid rgba(216,178,104,.3);
  box-shadow:0 18px 40px rgba(23,28,58,.14);
  cursor:grab;user-select:none;
  transform-origin:50% 120%;
  transition:transform .85s var(--e-out), opacity .6s var(--e), box-shadow .6s var(--e);
  will-change:transform;
}
.wish::before{
  content:"";position:absolute;left:50%;top:-6px;translate:-50% 0;
  width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FFF6E0,var(--gold) 60%,var(--gold-dk));
  box-shadow:0 3px 7px rgba(23,28,58,.25);
}
.wish blockquote{
  font-family:var(--script);font-size:clamp(1.18rem,5vw,1.42rem);line-height:1.6;
  color:var(--ink);margin-bottom:18px;
}
.wish cite{
  display:block;font-family:var(--sans);font-style:normal;
  font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dk);
}
.wish .quote-mark{
  position:absolute;right:20px;bottom:12px;
  font-family:var(--serif);font-size:4.6rem;line-height:1;color:rgba(216,178,104,.18);
}
.deck-nav{display:flex;align-items:center;justify-content:center;gap:16px}
.dots{display:flex;gap:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(23,28,58,.18);transition:all .45s var(--e)}
.dots i.on{background:var(--gold-dk);width:20px;border-radius:3px}
.deck-hint{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);opacity:.65}

/* ---- 6f. COUNTDOWN (night band) ---------------------------------------- */
.countdown{
  position:relative;overflow:hidden;text-align:center;
  background:
    radial-gradient(80% 46% at 50% 34%, rgba(75,42,140,.5), transparent 66%),
    linear-gradient(180deg,
      var(--ivory) 0px, #2B2456 78px, #141A46 190px,
      #0C1130 calc(100% - 190px), #241E4E calc(100% - 78px), var(--ivory) 100%);
  color:var(--champagne);
}
.countdown .sec-head h2{color:var(--champagne)}
.countdown .sec-head p{color:rgba(243,229,203,.6)}
.countdown .sec-head .eyebrow{color:rgba(216,178,104,.85)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2.4vw,16px);max-width:460px;margin-inline:auto;position:relative;z-index:2}
.cd-unit{display:grid;justify-items:center;gap:10px}
.cd-num{
  font-family:var(--serif);font-weight:300;font-size:clamp(2.3rem,12vw,3.4rem);
  line-height:1.12;font-variant-numeric:tabular-nums;
  background:linear-gradient(150deg,var(--champagne),var(--gold) 46%,#FFF3D6 60%,var(--gold-dk));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cd-label{font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,229,203,.5)}
.cd-note{margin-top:clamp(30px,8vw,42px);font-family:var(--serif);font-style:italic;font-size:1.02rem;color:rgba(243,229,203,.72)}
.ics-btn{
  margin-top:22px;padding:12px 26px;border-radius:100px;cursor:pointer;
  border:1px solid rgba(216,178,104,.5);background:transparent;
  font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-lt);
  transition:background .35s var(--e),color .35s var(--e);
}
.ics-btn:hover{background:rgba(216,178,104,.18);color:#fff}

/* --- 7. RSVP ------------------------------------------------------------- */
.rsvp-card{
  position:relative;
  border-radius:20px;padding:clamp(28px,7vw,40px) clamp(22px,6vw,34px);
  background:linear-gradient(165deg,#FFFDF8 0%,#F6EFE2 100%);
  border:1px solid rgba(216,178,104,.4);
  box-shadow:0 26px 60px rgba(23,28,58,.1);
}
/* The floating-label rules are scoped to DIRECT children on purpose: the
   attend chips are <label>s nested inside a .field too, and an unscoped
   `.field label` would drag them out of flow (position:absolute) and make them
   unclickable (pointer-events:none) — same specificity, so their own rules
   could not win the properties they do not declare. */
.field{position:relative;margin-bottom:26px}
.field > input,.field > textarea{
  width:100%;padding:14px 2px 11px;border:0;background:transparent;
  border-bottom:1px solid var(--line);
  font-size:1rem;font-weight:300;color:var(--ink);
  transition:border-color .4s var(--e);
}
.field > textarea{resize:none;min-height:78px;line-height:1.6}
.field > label{
  position:absolute;left:2px;top:14px;pointer-events:none;
  font-size:.95rem;font-weight:300;color:var(--ink-soft);
  transition:all .38s var(--e-out);
}
.field > input:focus,.field > textarea:focus{outline:none}
.field > input:focus + label,.field > textarea:focus + label,
.field > input:not(:placeholder-shown) + label,.field > textarea:not(:placeholder-shown) + label{
  top:-9px;font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-dk);
}
.field > .underline{
  position:absolute;left:0;bottom:0;height:1.5px;width:100%;
  background:linear-gradient(90deg,var(--gold-dk),var(--gold),var(--gold-lt));
  transform:scaleX(0);transform-origin:left;
  transition:transform .55s var(--e-out);
}
.field > input:focus ~ .underline,.field > textarea:focus ~ .underline{transform:scaleX(1)}
.field.invalid > input{border-bottom-color:var(--coral)}
.field.invalid > label{color:var(--coral)}

.field-group > span.lbl{
  display:block;font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold-dk);margin-bottom:12px;
}
.attend-row{display:flex;gap:10px;flex-wrap:wrap}
.attend-row label{
  position:relative;flex:1 1 auto;min-width:130px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:13px 16px;border-radius:100px;text-align:center;
  border:1px solid rgba(216,178,104,.45);
  font-size:.78rem;line-height:1.35;color:var(--ink-soft);
  transition:background .38s var(--e-out),color .38s var(--e-out),
             border-color .38s var(--e-out),box-shadow .38s var(--e-out);
  -webkit-tap-highlight-color:transparent;
}
/* The radio itself is only a hit-target for assistive tech and the keyboard —
   the chip is the visible control, so focus has to be shown on the chip. */
.attend-row input{
  position:absolute;inset:0;width:100%;height:100%;
  margin:0;padding:0;border:0;opacity:0;cursor:pointer;
  appearance:none;-webkit-appearance:none;
}
.attend-row label:focus-within{outline:2px solid var(--gold-dk);outline-offset:3px}
.attend-row label.sel{
  background:linear-gradient(100deg,var(--gold-dk),var(--gold) 45%,#F3DFAE);
  color:#241A06;border-color:transparent;
  box-shadow:0 8px 20px rgba(216,178,104,.34);
}
@media (hover:hover){
  .attend-row label:not(.sel):hover{border-color:var(--gold);color:var(--ink)}
}

.btn-submit{
  position:relative;overflow:hidden;isolation:isolate;
  width:100%;min-height:56px;margin-top:8px;border:0;border-radius:100px;cursor:pointer;
  font-size:.72rem;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:#20180A;
  background:linear-gradient(100deg,var(--gold-dk) 0%,var(--gold) 26%,#FCEBC2 52%,var(--gold) 76%,var(--gold-dk) 100%);
  background-size:220% 100%;
  box-shadow:0 14px 30px rgba(216,178,104,.3);
  transition:background-position 1s var(--e), transform .4s var(--e-out), box-shadow .4s var(--e);
  -webkit-tap-highlight-color:transparent;
}
.btn-submit:hover{background-position:100% 50%;transform:translateY(-2px);box-shadow:0 20px 40px rgba(216,178,104,.42)}
.btn-submit:active{transform:translateY(1px) scale(.99)}
.btn-submit:disabled{opacity:.6;cursor:default}
.rsvp-note{margin-top:18px;text-align:center;font-size:.72rem;font-weight:300;color:var(--ink-soft)}
.rsvp-err{margin-top:14px;text-align:center;font-size:.76rem;color:var(--coral);display:none}
.rsvp-err.show{display:block}

.rsvp-success{display:none;text-align:center;padding:14px 0}
.rsvp-success.show{display:block;animation:successIn .8s var(--e-out) both}
@keyframes successIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.rsvp-success .seal{
  width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;
  background:radial-gradient(circle at 34% 30%,#FCEBC2,var(--gold) 55%,var(--gold-dk));
  box-shadow:0 12px 28px rgba(216,178,104,.4);
}
.rsvp-success .seal svg{width:26px;height:26px;fill:none;stroke:#3A2A0C;stroke-width:1.8}
.rsvp-success h3{font-family:var(--serif);font-size:1.7rem;font-weight:300;color:var(--ink);margin-bottom:8px}
.rsvp-success p{font-size:.88rem;font-weight:300;color:var(--ink-soft);max-width:26ch;margin-inline:auto}

/* --- 8. FOOTER (back to midnight) --------------------------------------- */
.footer{
  position:relative;overflow:hidden;text-align:center;
  padding:clamp(90px,20vw,140px) var(--pad) clamp(60px,14vw,90px);
  background:linear-gradient(180deg,var(--ivory) 0px, #2B2456 130px, #0F1438 300px, #05071A 100%);
  color:var(--champagne);
}
.footer .script{font-size:clamp(2rem,9vw,3rem);color:var(--champagne);margin-bottom:16px}
.footer p{font-size:.86rem;font-weight:200;color:rgba(243,229,203,.55);max-width:30ch;margin-inline:auto}
.footer .sig{
  margin-top:34px;font-size:.56rem;letter-spacing:.3em;line-height:2.1;
  text-transform:uppercase;color:rgba(243,229,203,.46);
}
.footer .sig span{display:block;white-space:nowrap}
.f-balloon{
  position:absolute;bottom:-90px;left:var(--x);
  width:var(--w,30px);aspect-ratio:1/1.2;
  border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6),rgba(255,255,255,0) 36%),var(--c);
  opacity:.3;filter:blur(var(--b,0px));
  animation:footerRise var(--dur,20s) linear var(--del,0s) infinite;
}
@keyframes footerRise{
  0%  {opacity:0;transform:translate3d(0,0,0)}
  14% {opacity:.34}
  80% {opacity:.24}
  100%{opacity:0;transform:translate3d(var(--sway,20px),-640px,0)}
}

/* --- 9. READING PROGRESS ------------------------------------------------- */
.progress{
  position:fixed;top:0;left:0;height:2px;width:0;z-index:60;
  background:linear-gradient(90deg,var(--gold-dk),var(--gold),var(--gold-lt));
  opacity:0;transition:opacity .6s var(--e);
}
.progress.on{opacity:1}

/* --- 10. BUILDER CHROME — langbar · music · attribution · lightbox ------- */
.hidden{display:none !important}
.opt-off{display:none !important}

#langbar{
  position:fixed;top:12px;right:12px;z-index:90;
  display:flex;gap:4px;padding:4px;border-radius:30px;
  background:rgba(7,10,30,.62);border:1px solid rgba(243,229,203,.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#langbar button{
  min-width:34px;padding:6px 9px;border:none;border-radius:24px;
  background:transparent;color:rgba(243,229,203,.7);
  font-family:var(--sans);font-size:.62rem;letter-spacing:.18em;cursor:pointer;
  transition:background .4s var(--e),color .4s var(--e);
}
#langbar button.active{
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));color:#20180A;
}

#music-btn{
  position:fixed;bottom:16px;right:16px;z-index:90;
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:1px solid rgba(216,178,104,.55);
  background:rgba(7,10,30,.62);color:var(--gold-lt);cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 22px -8px rgba(0,0,0,.7);
  transition:transform .4s var(--e),box-shadow .4s var(--e);
}
#music-btn:hover{transform:scale(1.06);box-shadow:0 0 22px rgba(216,178,104,.35)}
#music-btn .bars{display:flex;gap:3px;align-items:flex-end;height:18px}
#music-btn .bars > span{
  width:3px;height:100%;background:currentColor;border-radius:2px;
  transform-origin:bottom;animation:eq 1s var(--e-soft) infinite alternate;
}
#music-btn .bars > span:nth-child(2){animation-delay:-.3s}
#music-btn .bars > span:nth-child(3){animation-delay:-.6s}
#music-btn:not(.playing) .bars > span{animation-play-state:paused}
@keyframes eq{from{transform:scaleY(.4)}to{transform:scaleY(1)}}

#vconnect{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  padding:2rem 1.3rem calc(env(safe-area-inset-bottom) + 2.4rem);
  text-align:center;background:#05071A;
}
#vconnect img{width:46px;height:auto;opacity:.95}
#vconnect span{
  font-family:var(--sans);font-weight:300;font-size:.58rem;
  letter-spacing:.34em;text-transform:uppercase;color:rgba(243,229,203,.4);
}

#lightbox{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
  padding:24px;background:rgba(4,6,20,.92);backdrop-filter:blur(6px);
}
#lightbox.open{display:flex;animation:lbIn .35s var(--e-out) both}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:100%;max-height:78vh;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
#lbCap{font-family:var(--script);font-size:1.2rem;color:var(--champagne)}
#lbClose{
  position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(243,229,203,.3);background:rgba(7,10,30,.6);
  color:var(--champagne);font-size:20px;line-height:1;cursor:pointer;
}

/* --- 11. DESKTOP ENHANCEMENT -------------------------------------------- */
@media (min-width:820px){
  .hero-inner{gap:52px}
  .gift-wrap{width:330px}
  .info-grid{gap:18px}
  .timeline{padding-left:64px}
  .timeline .spine{left:21px}
  .t-node{left:-64px;width:44px;height:44px}
  .t-node svg{width:20px;height:20px}
  .gallery-scroll{justify-content:center;flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
  .polaroid{width:216px}
  .polaroid:nth-child(odd){margin-top:26px}
  .gal-hint{display:none}
  .wrap{max-width:720px}
}
@media (min-width:1180px){
  .wrap{max-width:820px}
  .card p{font-size:1.2rem}
}

/* --- 12. REDUCED MOTION -------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.18s !important;scroll-behavior:auto !important;
  }
  .reveal{opacity:1;transform:none;filter:none;clip-path:none}
  .name .ltr{opacity:1;transform:none;filter:none}
  .timeline .spine{transform:scaleY(1)}
  .t-item{opacity:1;transform:none}
}

/* Studio contact block, directly under the "developed by" credit. Global to the
   platform (SYSTEM_ADMIN-edited), so it is not part of any template's config. */
#vcContacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 0.3rem; }
#vcContacts a {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.45rem 0.85rem; border-radius: 999px; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.22);
  font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: inherit; opacity: 0.85;
  transition: opacity 0.3s ease, border-color 0.3s ease;
}
#vcContacts a:hover { opacity: 1; border-color: currentColor; }
#vcContacts svg { width: 13px; height: 13px; }
</style>

<noscript><style>
  html.is-locked,html.is-locked body{overflow:auto;height:auto;touch-action:auto}
  .reveal{opacity:1;transform:none;filter:none;clip-path:none}
  .name .ltr{opacity:1;transform:none;filter:none}
  .timeline .spine{transform:scaleY(1)}
  .t-item{opacity:1;transform:none}
  .hero-cta{display:none}
</style></noscript>
</head>

<body>

<div class="progress" id="progress" aria-hidden="true"></div>
<div id="langbar" class="hidden"></div>

<!-- ============================================================ HERO ===== -->
<header class="hero" id="hero">
  <div class="layer" aria-hidden="true">
    <div class="bloom"></div>
    <div id="sparkLayer"></div>
  </div>
  <div class="rays" aria-hidden="true"></div>

  <div class="hero-stage">
    <div class="hero-inner">

      <div class="hero-kicker">
        <span class="eyebrow" data-t="youAreInvited"></span>
        <h1 data-bind="heroTitle"></h1>
        <p data-t="somethingWaiting"></p>
      </div>

      <div class="gift-wrap" id="giftWrap" role="button" tabindex="0" data-t-aria="giftAria">
        <div class="gift">
          <div class="gift-shadow"></div>
          <div class="inner-light"></div>
          <div class="box-body"></div>
          <div class="box-lid"></div>
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
          <div class="bow">
            <span class="loop loop-l"></span>
            <span class="loop loop-r"></span>
            <span class="tail tail-l"></span>
            <span class="tail tail-r"></span>
            <span class="knot"></span>
          </div>
        </div>
        <div class="flash" id="flash" aria-hidden="true"></div>

        <div class="card-rise" id="cardRise" aria-hidden="true">
          <span class="eyebrow" data-t="theSurpriseIs"></span>
          <div class="who" data-bind="honoreeName"></div>
          <div class="num" data-opt="age" data-bind="ageShort"></div>
          <span class="eyebrow" data-t="birthdayEvening"></span>
          <div class="cue"><span></span><em data-t="scroll" style="font-style:normal"></em></div>
        </div>
      </div>

    </div>
  </div>

  <div class="hero-cta">
    <button class="btn-open" id="btnOpen" type="button" data-t="openSurprise"></button>
    <small data-t="tapToBegin"></small>
  </div>
</header>

<div class="light-seam" aria-hidden="true"></div>

<!-- ===================================================== CELEBRATION ===== -->
<main class="celebration" id="celebration">

  <!-- ---- WELCOME ---- -->
  <section class="section welcome" id="welcome">
    <div class="wrap">
      <p class="greet reveal rv-mask" data-t="happyBirthday"></p>
      <h1 class="name" id="welcomeName"></h1>
      <span class="age reveal rv-pop" data-opt="age" data-bind="ageLabel"></span>
      <p class="msg reveal rv-rise" data-opt="message" data-bind="inviteText"></p>
      <div class="ornament reveal rv-pop" style="margin-top:34px" aria-hidden="true">
        <i></i>
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>
        <i></i>
      </div>
    </div>
  </section>

  <!-- ---- INFORMATION ---- -->
  <section class="section" id="details" data-opt="details">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow reveal rv-mask" data-t="insideTheBox"></span>
        <h2 class="reveal rv-mask" data-t="eveningInDetail"></h2>
      </div>

      <div class="info-grid" data-stagger>
        <article class="card feature reveal rv-depth">
          <h3 data-t="saveTheEvening"></h3>
          <div class="big" data-bind="dateLong"></div>
          <div class="rule"><i></i><b data-bind="dateYear"></b><i></i></div>
          <div class="hour" data-bind="timeLine"></div>
        </article>

        <article class="card wide reveal rv-depth" id="venueCard" data-opt="venue">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <h3 data-t="venue"></h3>
          <p>
            <span data-bind="venueName"></span>
            <small><span data-bind="venueDesc"></span></small>
            <small><span data-bind="venueAddress"></span></small>
          </p>
          <a class="map-link" id="mapBtn" href="#" target="_blank" rel="noopener">
            <span data-t="openInMaps"></span>
            <svg viewBox="0 0 24 24"><path d="M5 12h12.2l-4.6-4.6L14 6l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>
          </a>
        </article>

        <article class="card reveal rv-depth" id="dressCard" data-opt="dress">
          <svg class="ico" viewBox="0 0 24 24"><path d="M7 4l2 3h6l2-3 3 4-3 2v10H7V10L4 8z"/></svg>
          <h3 data-t="dressCode"></h3>
          <p><span data-bind="dressTitle"></span><small><span data-bind="dressNote"></span></small></p>
          <div class="swatches" id="swatches"></div>
        </article>

        <article class="card reveal rv-depth" id="giftsCard" data-opt="gifts">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 9h16v11H4z"/><path d="M3 5.5h18V9H3z"/><path d="M12 5.5V20"/><path d="M12 5.5S10.4 2.6 8.4 3.2 7.4 6 9 5.5zM12 5.5s1.6-2.9 3.6-2.3S16.6 6 15 5.5z"/></svg>
          <h3 data-t="gifts"></h3>
          <p><span data-bind="giftsTitle"></span></p>
        </article>

        <article class="giftcard reveal rv-depth" id="giftcard" data-opt="gifts">
          <h3 data-t="giftCard"></h3>
          <div class="gc-number" id="gcNumber"></div>
          <div class="gc-holder" id="gcHolder"></div>
          <button class="gc-copy" id="gcCopy" type="button"><span id="gcCopyLabel"></span></button>
        </article>

        <article class="card wide reveal rv-depth" id="contactsCard" data-opt="contacts">
          <svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/><path d="M8.5 13.5l2.2 2.2 4.4-4.4"/></svg>
          <h3 data-t="questions"></h3>
          <div class="contact-row" id="contactRow"></div>
        </article>
      </div>
    </div>
  </section>

  <!-- ---- TIMELINE ---- -->
  <section class="section" id="programme" data-opt="program">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow reveal rv-mask" data-t="howNightUnfolds"></span>
        <h2 class="reveal rv-mask" data-t="theProgramme"></h2>
      </div>

      <ol class="timeline" id="timeline">
        <span class="spine" aria-hidden="true"></span>
      </ol>
    </div>
  </section>

  <!-- ---- MEMORY GALLERY ---- -->
  <section class="section" id="memories" data-opt="gallery">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow reveal rv-mask" data-t="fromTheAlbum"></span>
        <h2 class="reveal rv-mask" data-t="inPhotographs"></h2>
      </div>
    </div>

    <div class="gallery-scroll" id="gallery"></div>

    <div class="wrap"><p class="gal-hint reveal rv-pop" data-t="swipe"></p></div>
  </section>

  <!-- ---- WISHES ---- -->
  <section class="section" id="wishes" data-opt="wishes">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow reveal rv-mask" data-t="writtenByHand"></span>
        <h2 class="reveal rv-mask" data-t="wishesFor"></h2>
      </div>

      <div class="deck" id="deck" role="group" data-t-aria="deckAria"></div>

      <div class="deck-nav reveal rv-pop">
        <span class="dots" id="deckDots" aria-hidden="true"></span>
        <span class="deck-hint" data-t="tapCard"></span>
      </div>
    </div>
  </section>

  <!-- ---- COUNTDOWN ---- -->
  <section class="section countdown" id="countdown" data-opt="countdown">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow reveal rv-mask" data-t="theWaiting"></span>
        <h2 class="reveal rv-mask" data-t="untilCandlesLit"></h2>
      </div>

      <div class="cd reveal rv-rise" role="timer">
        <div class="cd-unit"><div class="cd-num" id="cd-days">00</div><span class="cd-label" data-t="days"></span></div>
        <div class="cd-unit"><div class="cd-num" id="cd-hours">00</div><span class="cd-label" data-t="hours"></span></div>
        <div class="cd-unit"><div class="cd-num" id="cd-mins">00</div><span class="cd-label" data-t="minutes"></span></div>
        <div class="cd-unit"><div class="cd-num" id="cd-secs">00</div><span class="cd-label" data-t="seconds"></span></div>
      </div>

      <p class="cd-note reveal rv-rise" data-bind="countWhen"></p>
      <button class="ics-btn reveal rv-pop" id="icsBtn" type="button" data-t="addToCalendar"></button>
    </div>
  </section>

  <!-- ---- RSVP ---- -->
  <section class="section" id="rsvp" data-opt="rsvp">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow reveal rv-mask" data-t="oneLastThing"></span>
        <h2 class="reveal rv-mask" data-t="willYouBeThere"></h2>
      </div>

      <div class="rsvp-card reveal rv-depth">
        <form id="rsvpForm" novalidate>
          <div class="field">
            <input type="text" id="rsvpName" placeholder=" " autocomplete="name">
            <label for="rsvpName" data-t="fullName"></label><span class="underline"></span>
          </div>

          <div class="field field-group">
            <span class="lbl" data-t="willYouAttend"></span>
            <div class="attend-row" id="attendRow">
              <label class="sel"><input type="radio" name="attend" value="yes" checked><span data-t="accept"></span></label>
              <label><input type="radio" name="attend" value="no"><span data-t="decline"></span></label>
            </div>
          </div>

          <div class="field" id="guestField">
            <input type="number" id="rsvpGuests" min="1" max="20" value="1" placeholder=" ">
            <label for="rsvpGuests" data-t="guestCount"></label><span class="underline"></span>
          </div>

          <div class="field" id="dietField">
            <input type="text" id="rsvpDiet" placeholder=" ">
            <label for="rsvpDiet" data-t="specialRequests"></label><span class="underline"></span>
          </div>

          <div class="field">
            <textarea id="rsvpMsg" placeholder=" " rows="3"></textarea>
            <label for="rsvpMsg" data-t="messageLabel"></label><span class="underline"></span>
          </div>

          <button class="btn-submit" id="rsvpSubmit" type="submit"><span data-t="send"></span></button>
          <p class="rsvp-note" data-t="rsvpNote"></p>
          <p class="rsvp-err" id="rsvpErr" data-t="sendFailed"></p>
        </form>

        <div class="rsvp-success" id="rsvpSuccess">
          <span class="seal" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </span>
          <h3 data-t="thankYou"></h3>
          <p id="successText"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ============================================================ FOOTER === -->
<footer class="footer" id="final" data-opt="final">

var $  = function(s,c){ return (c||document).querySelector(s); };
var $$ = function(s,c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); };

var rand = function(a,b){ return a + Math.random()*(b-a); };
var pick = function(arr){ return arr[Math.floor(Math.random()*arr.length)]; };

function t(key){ return (UI[lang] && UI[lang][key]) || UI.ru[key] || key; }
function loc(v){
  if (v == null) return '';
  if (typeof v === 'string') return v;
  return v[lang] || v.ru || v.en || v.uz || '';
}
function cfg(path, dflt){
  var cur = CONFIG, parts = path.split('.');
  for (var i = 0; i < parts.length; i++) {
    if (cur == null || typeof cur !== 'object') return dflt;
    cur = cur[parts[i]];
  }
  return cur == null ? dflt : cur;
}
function hiddenKey(k){ var h = cfg('hidden', {}) || {}; return h[k] === true; }

/* ── Derived date strings ── */
function eventDate(){ var d = new Date(cfg('event.dateISO','2026-09-12T19:00:00')); return isNaN(d.getTime()) ? new Date() : d; }
function intlLocale(){ return lang === 'uz' ? 'uz-Latn-UZ' : (lang === 'en' ? 'en-GB' : 'ru-RU'); }
function fmtDateLong(){
  try { return new Intl.DateTimeFormat(intlLocale(), { weekday:'long', day:'numeric', month:'long' }).format(eventDate()); }
  catch (e) { return eventDate().toDateString(); }
}
function fmtTimeShort(){
  var d = eventDate();
  return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
}
/* The age medallion on the hero card wants a bare number; the honoree writes a
   full label ("30 лет"), so lift the first number out of it. */
function ageShort(){
  var label = loc(cfg('honoree.ageLabel',''));
  var m = String(label).match(/\d+/);
  return m ? m[0] : '';
}

/* ── Text binding ── */
function bindTexts(){
  var honoree = loc(cfg('honoree.name',''));
  var timeNote = loc(cfg('event.timeNote',''));
  var map = {
    heroTitle: loc(cfg('invite.kicker','')),
    honoreeName: honoree,
    ageLabel: loc(cfg('honoree.ageLabel','')),
    ageShort: ageShort(),
    inviteText: loc(cfg('invite.text','')),
    dateLong: fmtDateLong(),
    dateYear: String(eventDate().getFullYear()),
    timeLine: timeNote || t('timeRange').replace('{time}', fmtTimeShort()),
    countWhen: fmtDateLong() + ' · ' + fmtTimeShort(),
    venueName: loc(cfg('venue.name','')),
    venueAddress: loc(cfg('venue.address','')),
    venueDesc: loc(cfg('venue.desc','')),
    dressTitle: loc(cfg('dress.title','')),
    dressNote: loc(cfg('dress.note','')),
    giftsTitle: loc(cfg('gifts.title','')),
    finalMsg: loc(cfg('final.message','')),
    sigLine1: honoree + (honoree ? ' · ' : '') + fmtDateLong(),
    sigLine2: loc(cfg('venue.name','')),
  };
  $$('[data-bind]').forEach(function(el){
    var v = map[el.getAttribute('data-bind')];
    if (v != null) el.textContent = v;
  });
  $$('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
  $$('[data-t-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.getAttribute('data-t-aria'))); });
  $('#gcCopyLabel').textContent = t('copyNumber');
  document.title = honoree || 'Invitation';
  document.documentElement.lang = lang;
  renderName(honoree);
}

/* The celebrant's name arrives letter by letter. */
function renderName(text){
  var nameEl = $('#welcomeName');
  nameEl.className = 'name';
  nameEl.innerHTML = '';
  String(text || '').split('').forEach(function(ch, i){
    var s = document.createElement('span');
    s.className = 'ltr' + (ch === ' ' ? ' sp' : '');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.setProperty('--d', (i * 85 + 120) + 'ms');
    nameEl.appendChild(s);
  });
  revObs.observe(nameEl);
}

/* Blocks switched off in the builder. */
function applyVisibility(){
  var hid = cfg('hidden', {}) || {};
  $$('[data-opt]').forEach(function(el){
    el.classList.toggle('opt-off', hid[el.getAttribute('data-opt')] === true);
  });
}

/* ── Reveal observer ── */
var revObs = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if (e.isIntersecting) { e.target.classList.add('in'); revObs.unobserve(e.target); }
  });
}, { threshold: .16, rootMargin: '0px 0px -8% 0px' });

function observeReveals(root){
  $$('.reveal', root || document).forEach(function(el){ if (!el.classList.contains('in')) revObs.observe(el); });
}

/* Stagger index for grouped children. */
$$('[data-stagger]').forEach(function(g){
  Array.prototype.slice.call(g.children).forEach(function(c, i){ c.style.setProperty('--i', i); });
});

/* ── Image loading with graceful fallback ── */
function loadImg(el, src, alt){
  el.alt = alt || '';
  el.onerror = function(){ el.classList.add('broken'); el.removeAttribute('src'); };
  if (src) { el.classList.remove('broken'); el.src = src; }
  else { el.classList.add('broken'); el.removeAttribute('src'); }
}
