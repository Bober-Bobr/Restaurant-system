(function seedSparkles(){
  var host = $('#sparkLayer');
  var frag = document.createDocumentFragment();
  var count = REDUCED ? 10 : 34;
  for (var i = 0; i < count; i++) {
    var s = document.createElement('span');
    var size = rand(2, 6);
    s.className = 'spark';
    s.style.cssText =
      'left:' + rand(4,96) + '%;top:' + rand(28,104) + '%;width:' + size + 'px;height:' + size + 'px;' +
      '--dur:' + rand(11,22) + 's;--del:' + (-rand(0,18)) + 's;--dx:' + rand(-46,46) + 'px;' +
      '--rise:' + (-rand(140,420)) + 'px;--op:' + rand(.35,.95);
    frag.appendChild(s);
  }
  host.appendChild(frag);
})();

/* ========================================================================
   THE GIFT OPENING
   ==================================================================== */
var hero = $('#hero'), burst = $('#burstLayer'), opened = false;

function releaseBalloons(n){
  var frag = document.createDocumentFragment();
  for (var i = 0; i < n; i++) {
    var b = document.createElement('span');
    b.className = 'balloon';
    b.style.cssText =
      '--x:' + rand(4,92) + '%;--w:' + rand(30,62) + 'px;--c:' + pick(FESTIVE) + ';' +
      '--dur:' + rand(11,19) + 's;--del:' + rand(0,3.2) + 's;--sway:' + rand(-70,70) + 'px;' +
      '--rot:' + rand(-12,12) + 'deg;--string:' + rand(46,84) + 'px';
    frag.appendChild(b);
  }
  burst.appendChild(frag);
}

function dropConfetti(n){
  var frag = document.createDocumentFragment();
  for (var i = 0; i < n; i++) {
    var c = document.createElement('span');
    c.className = 'confetti';
    c.style.cssText =
      '--x:' + rand(-2,100) + '%;--y:' + rand(24,52) + '%;--w:' + rand(5,9) + 'px;--h:' + rand(9,17) + 'px;' +
      '--c:' + pick(FESTIVE) + ';--dur:' + rand(6,12) + 's;--del:' + rand(0,2.6) + 's;' +
      '--dx:' + rand(-120,120) + 'px;--spin:' + rand(540,1500) + 'deg';
    frag.appendChild(c);
  }
  burst.appendChild(frag);
}

function flowStreamers(){
  var box = $('#giftWrap').getBoundingClientRect();
  var cx = box.left + box.width / 2;
  var cy = box.top + box.height * 0.42;
  [-64,-34,-12,12,34,64].forEach(function(a, i){
    var len = rand(190, 300);
    var s = document.createElement('span');
    s.className = 'streamer';
    s.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;--a:' + a + 'deg;--len:' + len + 'px;--c:' + (i % 2 ? 'var(--gold-lt)' : pick(FESTIVE));
    s.innerHTML =
      '<svg viewBox="0 0 80 ' + len + '" preserveAspectRatio="none">' +
      '<path d="M40 0 C 12 ' + (len*.26).toFixed(0) + ', 68 ' + (len*.52).toFixed(0) +
      ', 40 ' + len.toFixed(0) + '"/></svg>';
    burst.appendChild(s);
    setTimeout(function(){ s.classList.add('go'); }, i * 90);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 4200 + i * 90);
  });
}

function escapeMotes(n){
  var box = $('#giftWrap').getBoundingClientRect();
  var frag = document.createDocumentFragment();
  for (var i = 0; i < n; i++) {
    (function(){
      var s = document.createElement('span');
      var size = rand(3, 8);
      s.className = 'spark';
      s.style.cssText =
        'position:fixed;left:' + (box.left + rand(.18,.82)*box.width) + 'px;' +
        'top:' + (box.top + box.height*rand(.3,.48)) + 'px;width:' + size + 'px;height:' + size + 'px;' +
        '--dur:' + rand(3.4,7) + 's;--del:' + rand(0,1.4) + 's;--dx:' + rand(-160,160) + 'px;' +
        '--rise:' + (-rand(200,520)) + 'px;--op:1';
      s.style.animationIterationCount = '1';
      frag.appendChild(s);
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 9000);
    })();
  }
  burst.appendChild(frag);
}

function openGift(){
  if (opened) return;
  opened = true;
  hero.classList.add('opening');
  startMusic();                       // the tap is the gesture autoplay needs

  if (REDUCED) {
    hero.classList.add('s-lift','s-untie','s-lid','s-card');
    finish(300);
    return;
  }
  [
    [   0, function(){ hero.classList.add('s-lift'); }],
    [ 620, function(){ hero.classList.add('s-untie'); }],
    [1750, function(){ hero.classList.add('s-lid'); }],
    [1980, function(){ $('#flash').classList.add('fire'); escapeMotes(26); }],
    [2100, function(){ flowStreamers(); releaseBalloons(16); }],
    [2400, function(){ dropConfetti(46); }],
    [2600, function(){ hero.classList.add('s-zoom'); }],
    [3500, function(){ hero.classList.add('s-card'); }],
    [4600, function(){ finish(0); }]
  ].forEach(function(step){ setTimeout(step[1], step[0]); });
}

function finish(delay){
  setTimeout(function(){
    document.documentElement.classList.remove('is-locked');
    $('#progress').classList.add('on');
    setTimeout(function(){
      welcomeEl.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
    }, REDUCED ? 100 : 1400);
    setTimeout(function(){ burst.innerHTML = ''; }, 22000);
  }, delay);
}

var welcomeEl = $('#welcome');
$('#btnOpen').addEventListener('click', openGift);
$('#giftWrap').addEventListener('click', openGift);
$('#giftWrap').addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); }
});

/* ========================================================================
   COUNTDOWN
   ==================================================================== */
function tick(){
  var d = Math.max(0, eventDate().getTime() - Date.now());
  var day = Math.floor(d/86400000); d -= day*86400000;
  var hr = Math.floor(d/3600000); d -= hr*3600000;
  var mn = Math.floor(d/60000); d -= mn*60000;
  var sc = Math.floor(d/1000);
  var p = function(n){ return String(n).padStart(2,'0'); };
  $('#cd-days').textContent = p(day);
  $('#cd-hours').textContent = p(hr);
  $('#cd-mins').textContent = p(mn);
  $('#cd-secs').textContent = p(sc);
}
tick(); setInterval(tick, 1000);

/* ── Add to calendar (.ics) ── */
$('#icsBtn').addEventListener('click', function(){
  var start = eventDate();
  var end = new Date(start.getTime() + 5*3600000);
  var toICS = function(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z'; };
  var honoree = loc(cfg('honoree.name','')) || t('birthday');
  var ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//v-invite//EN','BEGIN:VEVENT',
    'UID:' + Date.now() + '@v-invite',
    'DTSTAMP:' + toICS(new Date()),
    'DTSTART:' + toICS(start),
    'DTEND:' + toICS(end),
    'SUMMARY:' + honoree + ' — ' + t('birthday'),
    'LOCATION:' + (loc(cfg('venue.name','')) + ', ' + loc(cfg('venue.address',''))).replace(/,\s*$/,''),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  var blob = new Blob([ics], { type: 'text/calendar' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'invitation.ics';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ========================================================================
   VENUE · DRESS · GIFT CARD · CONTACTS
   ==================================================================== */
function renderVenue(){
  var mapUrl = cfg('venue.mapUrl','');
  if (!mapUrl) {
    var q = loc(cfg('venue.address','')) || loc(cfg('venue.name',''));
    mapUrl = 'https://yandex.com/maps/?text=' + encodeURIComponent(q);
  }
  $('#mapBtn').href = mapUrl;
}

function renderDress(){
  var colors = cfg('dress.colors', []);
  if (!Array.isArray(colors)) colors = [];
  colors = colors.filter(function(c){ return typeof c === 'string' && c.trim(); });
  var host = $('#swatches');
  host.innerHTML = '';
  colors.forEach(function(hex, i){
    var el = document.createElement('span');
    el.className = 'swatch';
    el.style.background = hex;
    el.style.animationDelay = (1.1 + i * 0.24).toFixed(2) + 's';
    host.appendChild(el);
  });
}

function renderGiftcard(){
  var num = (cfg('gifts.cardNumber','') || '').replace(/\s+/g,'');
  var card = $('#giftcard');
  /* An empty card number hides the block — but never override a section the
     honoree switched off in the builder. */
  card.style.display = (num && !hiddenKey('gifts')) ? '' : 'none';
  if (!num) return;
  $('#gcNumber').textContent = num.replace(/(.{4})/g, '$1 ').trim();
  $('#gcHolder').textContent = cfg('gifts.cardHolder','') || '';
}
$('#gcCopy').addEventListener('click', function(){
  var num = (cfg('gifts.cardNumber','') || '').replace(/\s+/g,'');
  var done = function(){
    $('#gcCopyLabel').textContent = t('copied');
    setTimeout(function(){ $('#gcCopyLabel').textContent = t('copyNumber'); }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(num).then(done, function(){ fallbackCopy(num, done); });
  } else fallbackCopy(num, done);
});
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
  ta.remove();
}

function contactEntry(href, label, svg){
  var a = document.createElement('a');
  a.className = 'contact-item';
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = svg + '<span>' + label + '</span>';
  return a;
}
function renderContacts(){
  var row = $('#contactRow');
  row.innerHTML = '';
  var phone = cfg('contacts.phone',''), tg = cfg('contacts.telegram',''), ig = cfg('contacts.instagram','');
  if (phone) row.appendChild(contactEntry('tel:' + phone.replace(/[^\d+]/g,''), t('phone'),
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'));
  if (tg) row.appendChild(contactEntry(tg.indexOf('http') === 0 ? tg : 'https://t.me/' + tg.replace(/^@/,''), t('telegram'),
    '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.24 3.64 11.94c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3 10.55 18.28c-.24.24-.43.45-.85.45z"/></svg>'));
  if (ig) row.appendChild(contactEntry(ig.indexOf('http') === 0 ? ig : 'https://instagram.com/' + ig.replace(/^@/,''), t('instagram'),
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>'));
  $('#contactsCard').style.display = ((phone || tg || ig) && !hiddenKey('contacts')) ? '' : 'none';
}

/* ========================================================================
   PROGRAMME · GALLERY · WISHES
   ==================================================================== */
var NODE_ICONS = [
  '<path d="M7 4h10l-1 6a4 4 0 01-8 0z"/><path d="M12 14v5M9 20h6"/>',
  '<path d="M5 11h14a7 7 0 01-14 0z"/><path d="M12 4v3M4 20h16"/>',
  '<path d="M4 13h16v7H4z"/><path d="M5 13v-3h14v3"/><path d="M12 7V4M9 7V5M15 7V5"/>',
  '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
  '<path d="M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/>',
  '<path d="M12 20s-7-4.4-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.6-7 9-7 9z"/>'
];

function renderTimeline(){
  var tl = $('#timeline');
  tl.innerHTML = '<span class="spine" aria-hidden="true"></span>';
  var items = cfg('schedule', []);
  items = Array.isArray(items) ? items.filter(function(p){ return p && (p.time || loc(p.label)); }) : [];
  /* An empty programme hides the section — unless it is already switched off. */
  $('#programme').style.display = (items.length && !hiddenKey('program')) ? '' : 'none';
  items.forEach(function(p, i){
    var li = document.createElement('li');
    li.className = 't-item';
    li.style.setProperty('--d', (i * 130 + 320) + 'ms');
    li.style.setProperty('--i', i);
    li.innerHTML =
      '<span class="t-node"><svg viewBox="0 0 24 24">' + NODE_ICONS[i % NODE_ICONS.length] + '</svg></span>' +
      '<span class="t-time"></span><h3></h3>';
    li.querySelector('.t-time').textContent = p.time || '';
    li.querySelector('h3').textContent = loc(p.label);
    tl.appendChild(li);
  });
  if (items.length) tlObs.observe(tl);
}
var tlObs = new IntersectionObserver(function(es, ob){
  es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); ob.unobserve(e.target); } });
}, { threshold: .12 });

function renderGallery(){
  var host = $('#gallery');
  host.innerHTML = '';
  var items = cfg('gallery', []);
  items = Array.isArray(items) ? items.filter(function(g){ return g && g.image; }) : [];
  $('#memories').style.display = (items.length && !hiddenKey('gallery')) ? '' : 'none';
  items.forEach(function(g, i){
    var fig = document.createElement('figure');
    fig.className = 'polaroid reveal rv-develop';
    fig.style.setProperty('--r', (i % 2 ? 1 : -1) * (2 + (i % 3)) + 'deg');
    fig.style.setProperty('--fd', (6.8 + (i % 4) * 0.6).toFixed(1) + 's');
    fig.style.setProperty('--fdel', (-(i * 1.5)).toFixed(1) + 's');
    var shot = document.createElement('div'); shot.className = 'shot';
    var img = document.createElement('img');
    loadImg(img, g.image, loc(g.caption));
    shot.appendChild(img);
    var cap = document.createElement('figcaption');
    cap.textContent = loc(g.caption) || '';
    fig.appendChild(shot); fig.appendChild(cap);
    fig.addEventListener('click', function(){ openLightbox(g.image, loc(g.caption)); });
    host.appendChild(fig);
  });
  observeReveals(host);
}

/* ── Wishes deck ── */
var deck = $('#deck'), dotsEl = $('#deckDots'), wcards = [], topCard = 0;

function layoutDeck(animateTop){
  var n = wcards.length;
  if (!n) return;
  wcards.forEach(function(card, i){
    var pos = (i - topCard + n) % n;
    var depth = Math.min(pos, 3);
    card.style.zIndex = String(n - pos);
    card.style.opacity = pos > 3 ? '0' : '1';
    card.style.pointerEvents = pos === 0 ? 'auto' : 'none';
    card.style.transform =
      'translateY(' + (depth*16) + 'px) scale(' + (1 - depth*0.045) + ') rotate(' + ((i%2?1:-1) * depth * 1.6) + 'deg)';
    card.style.boxShadow = pos === 0
      ? '0 22px 46px rgba(23,28,58,.18)'
      : '0 10px 24px rgba(23,28,58,.10)';
  });
  $$('i', dotsEl).forEach(function(d, i){ d.classList.toggle('on', i === topCard); });

  if (animateTop && !REDUCED) {
    var prev = wcards[(topCard - 1 + n) % n];
    prev.animate(
      [
        { transform: prev.style.transform, opacity: 1, offset: 0 },
        { transform: 'translate(-58%, -34px) rotate(-11deg) scale(.94)', opacity: 0, offset: .45 },
        { transform: prev.style.transform, opacity: 1, offset: 1 }
      ],
      { duration: 880, easing: 'cubic-bezier(.16,1,.3,1)' }
    );
  }
}
function nextWish(){ if (wcards.length) { topCard = (topCard + 1) % wcards.length; layoutDeck(true); } }

function renderWishes(){
  deck.innerHTML = ''; dotsEl.innerHTML = ''; wcards = []; topCard = 0;
  var items = cfg('wishes', []);
  items = Array.isArray(items) ? items.filter(function(w){ return w && (loc(w.text) || w.author); }) : [];
  $('#wishes').style.display = (items.length && !hiddenKey('wishes')) ? '' : 'none';
  if (!items.length) return;
  items.forEach(function(w, i){
    var art = document.createElement('article');
    art.className = 'wish';
    var bq = document.createElement('blockquote');
    bq.textContent = loc(w.text) || '';
    var cite = document.createElement('cite');
    cite.textContent = w.author || '';
    var qm = document.createElement('span');
    qm.className = 'quote-mark'; qm.setAttribute('aria-hidden','true'); qm.textContent = '”';
    art.appendChild(bq); art.appendChild(cite); art.appendChild(qm);
    deck.appendChild(art);
    wcards.push(art);
    var dot = document.createElement('i');
    dotsEl.appendChild(dot);
  });
  layoutDeck(false);
}
deck.addEventListener('click', nextWish);
var wsx = 0, wsy = 0;
deck.addEventListener('touchstart', function(e){ wsx = e.touches[0].clientX; wsy = e.touches[0].clientY; }, { passive: true });
deck.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - wsx;
  var dy = e.changedTouches[0].clientY - wsy;
  if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) nextWish();
}, { passive: true });

/* ── Lightbox ── */
var lb = $('#lightbox'), lbImg = $('#lbImg'), lbCap = $('#lbCap');
function openLightbox(src, cap){
  if (!src) return;
  lbImg.src = src; lbImg.alt = cap || ''; lbCap.textContent = cap || '';
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){ lb.classList.remove('open'); document.body.style.overflow = ''; }
$('#lbClose').addEventListener('click', closeLightbox);
lb.addEventListener('click', function(e){ if (e.target === lb) closeLightbox(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && lb.classList.contains('open')) closeLightbox(); });

/* ========================================================================
   RSVP — postMessage to the builder / published page
   ==================================================================== */
var form = $('#rsvpForm'), success = $('#rsvpSuccess'), attendRow = $('#attendRow');
attendRow.addEventListener('change', function(e){
  $$('label', attendRow).forEach(function(l){ l.classList.remove('sel'); });
  var lbl = e.target.closest('label');
  if (lbl) lbl.classList.add('sel');
  var attending = form.attend.value === 'yes';
  $('#guestField').style.display = attending ? '' : 'none';
  $('#dietField').style.display = attending ? '' : 'none';
});

var rsvpPending = null;
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'vinvite:rsvp-ok' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.resolve(); rsvpPending = null; }
  if (d.type === 'vinvite:rsvp-err' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.reject(); rsvpPending = null; }
  if (d.type === 'vinvite:config') {
    if (d.contacts) window.__CONTACTS__ = d.contacts;
    CONFIG = d.config || CONFIG;
    if (d.languages && d.languages.length) {
      LANGS = d.languages;
      if (LANGS.indexOf(lang) === -1) lang = LANGS[0];
    }
    renderAll();
  }
});

form.addEventListener('submit', function(e){
  e.preventDefault();
  var nameField = $('#rsvpName').closest('.field');
  var name = $('#rsvpName').value.trim();
  if (!name) { nameField.classList.add('invalid'); $('#rsvpName').focus(); return; }
  nameField.classList.remove('invalid');
  $('#rsvpErr').classList.remove('show');

  var attending = form.attend.value === 'yes';
  var payload = {
    name: name,
    attending: attending,
    guests: attending ? parseInt($('#rsvpGuests').value, 10) || 1 : 0,
    dietary: $('#rsvpDiet').value.trim() || undefined,
    message: $('#rsvpMsg').value.trim() || undefined
  };

  var btn = $('#rsvpSubmit');
  btn.disabled = true;
  btn.querySelector('span').textContent = t('sending');

  new Promise(function(resolve, reject){
    /* If no parent answers within 2.5s (e.g. editor preview), treat as saved. */
    var timer = setTimeout(function(){ rsvpPending = null; resolve(); }, 2500);
    rsvpPending = { resolve: resolve, reject: reject, timer: timer };
    window.parent.postMessage({ type: 'vinvite:rsvp', payload: payload }, '*');
  }).then(function(){
    $('#successText').textContent = attending ? t('savedYes') : t('savedNo');
    form.style.display = 'none';
    success.classList.add('show');
    if (attending) rsvpConfetti();
  }, function(){
    $('#rsvpErr').classList.add('show');
  }).then(function(){
    btn.disabled = false;
    btn.querySelector('span').textContent = t('send');
  });
});

/* a private celebration for one guest */
function rsvpConfetti(){
  if (REDUCED) return;
  var r = success.getBoundingClientRect();
  for (var i = 0; i < 34; i++) {
    (function(){
      var c = document.createElement('span');
      c.className = 'confetti';
      c.style.cssText =
        'position:fixed;left:' + (r.left + rand(0, r.width)) + 'px;top:' + (r.top + r.height*.4) + 'px;' +
        '--w:' + rand(5,9) + 'px;--h:' + rand(9,16) + 'px;--c:' + pick(FESTIVE) + ';' +
        '--dur:' + rand(4,7) + 's;--del:' + rand(0,.5) + 's;--dx:' + rand(-140,140) + 'px;--spin:' + rand(500,1300) + 'deg';
      burst.appendChild(c);
      setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 9000);
    })();
  }
}

/* ========================================================================
   MUSIC
   ==================================================================== */
var audio = $('#audio'), musicBtn = $('#music-btn');
var musicWired = false, musicRetry = false;
var RETRY_EVENTS = ['pointerdown','touchstart','keydown','scroll'];

function startMusic(){
  if (!audio || !audio.getAttribute('src') || !audio.paused) return;
  var p = audio.play();
  if (p && p.catch) p.catch(armMusicRetry);
}
function armMusicRetry(){
  if (musicRetry) return; musicRetry = true;
  var stop = function(){ RETRY_EVENTS.forEach(function(ev){ window.removeEventListener(ev, retry); }); };
  var retry = function(){
    var p = audio.play();
    if (p && p.then) p.then(stop); else stop();
  };
  RETRY_EVENTS.forEach(function(ev){ window.addEventListener(ev, retry, { passive: true }); });
}
function renderMusic(){
  var url = cfg('music.url','');
  if (!url) { musicBtn.classList.add('hidden'); audio.removeAttribute('src'); return; }
  musicBtn.classList.remove('hidden');
  if (audio.getAttribute('src') !== url) { audio.setAttribute('src', url); audio.preload = 'auto'; }
  if (musicWired) return;
  musicWired = true;
  musicBtn.addEventListener('click', function(){
    if (audio.paused) audio.play().catch(function(){}); else audio.pause();
  });
  audio.addEventListener('play', function(){ musicBtn.classList.add('playing'); musicBtn.setAttribute('aria-pressed','true'); });
  audio.addEventListener('pause', function(){ musicBtn.classList.remove('playing'); musicBtn.setAttribute('aria-pressed','false'); });
}

/* ========================================================================
   LANGUAGE SWITCHER
   ==================================================================== */
function renderLangbar(){
  var bar = $('#langbar');
  bar.innerHTML = '';
  if (LANGS.length < 2) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  LANGS.forEach(function(l){
    var b = document.createElement('button');
    b.textContent = l.toUpperCase();
    b.className = l === lang ? 'active' : '';
    b.addEventListener('click', function(){
      if (lang === l) return;
      lang = l;
      renderAll();
    });
    bar.appendChild(b);
  });
}

/* ========================================================================
   FOOTER BALLOONS
   ==================================================================== */
(function seedFooter(){
  var host = $('#footerBalloons');
  var frag = document.createDocumentFragment();
  for (var i = 0; i < (REDUCED ? 4 : 12); i++) {
    var b = document.createElement('span');
    b.className = 'f-balloon';
    var x = i % 2 ? rand(66, 94) : rand(3, 30);
    b.style.cssText =
      '--x:' + x + '%;--w:' + rand(14,32) + 'px;--c:' + pick(FESTIVE) + ';' +
      '--dur:' + rand(18,32) + 's;--del:' + (-rand(0,26)) + 's;--sway:' + rand(-40,40) + 'px;' +
      '--b:' + rand(.4,3).toFixed(1) + 'px';
    frag.appendChild(b);
  }
  host.appendChild(frag);
})();

/* ========================================================================
   READING PROGRESS + hero parallax (single rAF loop)
   ==================================================================== */
var progress = $('#progress'), ticking = false;
window.addEventListener('scroll', function(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    var doc = document.documentElement;
    var y = window.scrollY;
    var max = doc.scrollHeight - doc.clientHeight;
    progress.style.width = (max > 0 ? (y / max * 100) : 0) + '%';
    if (y < window.innerHeight * 1.2) {
      hero.style.transform = 'translate3d(0,' + (y * 0.22) + 'px,0)';
      hero.style.opacity = String(Math.max(0, 1 - y / (window.innerHeight * 0.95)));
    }
    ticking = false;
  });
}, { passive: true });

/* ========================================================================
   FULL RENDER (initial + on config/language change)
   ==================================================================== */
/* ── Studio contacts (global, injected by the host) ── */
function renderPlatformContacts(){
  var c = (window.__CONTACTS__ || {});
  var host = document.getElementById('vcContacts');
  if (!host) return;
  host.innerHTML = '';
  var phone = (c.phone || '').trim();
  var tg = (c.telegram || '').trim();
  function link(href, label, svg){
    var a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = svg + '<span>' + label + '</span>';
    return a;
  }
  if (phone) host.appendChild(link('tel:' + phone.replace(/[^\d+]/g,''), phone,
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'));
  if (tg) host.appendChild(link(tg.indexOf('http') === 0 ? tg : 'https://t.me/' + tg.replace(/^@/,''),
    tg.replace(/^https?:\/\/t\.me\//,'@').replace(/^@?/,'@'),
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.24 3.64 11.94c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3 10.55 18.28c-.24.24-.43.45-.85.45z"/></svg>'));
}

function renderAll(){
  renderPlatformContacts();
  bindTexts();
  applyVisibility();
  renderVenue();
  renderDress();
  renderGiftcard();
  renderContacts();
  renderTimeline();
  renderGallery();
  renderWishes();
  renderMusic();
  renderLangbar();
  var logo = $('#vconnectLogo');
  if (logo && !logo.getAttribute('src')) logo.setAttribute('src', ORIGIN + '/v-invite-logo.png');
  observeReveals();
}

renderAll();
</script>
