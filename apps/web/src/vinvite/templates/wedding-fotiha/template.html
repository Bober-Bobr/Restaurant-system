<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Invitation</title>
<!--__CONFIG__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   OQ FOTIHA — Fotiha to'y (the Uzbek betrothal)
   --------------------------------------------------------------------------
   A fotiha to'y is not a wedding. Two families meet, the elders read the
   Fatiha over the match, and a round loaf is broken to seal it. So this
   design is not a countdown to a vow and not an evening party: it is an
   AFTERNOON, it names both FAMILIES rather than only the couple, and its one
   ceremonial object is the bread.

   Identity : daylight. Cream paper, indigo ink, madder red and saffron taken
              from suzani embroidery — deliberately the opposite of this
              product's two other Uzbek designs, which are both night (talbon's
              red satin, Samarkand's black and lantern gold). A fotiha is held
              in the afternoon with the curtains open.
   Mechanics: 1 · THE LOAF BREAKS. A stamped round non parts along its seam,
                  the two halves tilt and draw apart, and the names rise in
                  the gap. The ceremony's own gesture, and the reveal.
              2 · THE BLESSING DOES NOT MOVE. One section with no entrance of
                  any kind, in a page that has them everywhere.
              3 · THE DASTURXON LAYS ITSELF. Along the embroidered cloth the
                  dishes arrive one after another, as the table is laid before
                  anybody sits down.
   Fonts    : Marcellus (display) · Cormorant Garamond (prose) · Jost (UI)
   Build    : MOBILE-FIRST — the base styles ARE the 390px design.

   State classes are all `is-*`. A bare `.open` / `.shown` rule in a template
   whose components share those names lands on every one of them — see
   templateStateClass.test.ts for the plaque it broke in Lantern Night.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1 · TOKENS
   -------------------------------------------------------------------------- */
:root {
  /* Paper */
  --paper:      #f6efe2;
  --paper-2:    #efe5d3;
  --paper-3:    #e7dac3;
  --paper-warm: #faf5ea;

  /* Suzani ink and thread */
  --indigo:     #1f3350;
  --indigo-2:   #2c4666;
  --madder:     #a8332f;
  --madder-dk:  #7d2220;
  --saffron:    #d9932c;
  --saffron-lt: #e8b45c;
  --leaf:       #4f6b43;

  /* Type */
  --ink:        #23304a;
  --ink-soft:   rgba(35, 48, 74, .7);
  --ink-faint:  rgba(35, 48, 74, .45);

  --display: 'Marcellus', Georgia, serif;
  --body:    'Cormorant Garamond', Georgia, serif;
  --util:    'Jost', system-ui, sans-serif;

  --gutter: clamp(20px, 5.5vw, 76px);
  --ease:      cubic-bezier(.22, 1, .36, 1);
  --ease-soft: cubic-bezier(.4, 0, .2, 1);
}

*, ::before, ::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 400;
  font-size: 17px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* The lock is added by SCRIPT (`html.js`) and never in the markup, so a dead
   script leaves a scrollable page rather than a frozen one. */
html.js body { overflow: hidden; }
html.js body.is-entered { overflow: visible; overflow-x: hidden; }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; }
p { margin: 0; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: var(--gutter); }
.pad  { padding-block: clamp(76px, 12vw, 150px); }
.mid  { text-align: center; }

.eyebrow {
  font-family: var(--util); font-weight: 500;
  font-size: clamp(10px, .35vw + 9px, 12px);
  letter-spacing: .34em; text-transform: uppercase; color: var(--madder);
}
.lede {
  font-family: var(--body); font-style: italic; font-weight: 300;
  font-size: clamp(16px, 1vw + 13px, 21px); color: var(--ink-soft);
}
.rule {
  width: 1px; height: clamp(34px, 6vw, 62px); margin: clamp(18px, 3vw, 30px) auto;
  background: linear-gradient(var(--saffron), transparent);
}

/* Reveal-on-scroll. Base state is hidden, so the reveal is the ONLY path to
   visible and has to be fail-safe — the observer uses threshold 0, a missing
   observer reveals immediately, and `revealEverything()` is called on focus. */
.rv { opacity: 0; transform: translateY(18px); }
html:not(.js) .rv { opacity: 1; transform: none; }
.rv.is-in {
  opacity: 1; transform: none;
  transition: opacity 1s var(--ease-soft), transform 1.1s var(--ease);
}

/* --------------------------------------------------------------------------
   2 · THE GATE — a folded paper sheet with a wax seal
   -------------------------------------------------------------------------- */
.gate {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
  /* The track is declared. Left to `auto` it is sized to the card's MAX-CONTENT
     — the title and the two names on one unwrapped line — so the gate came out
     611px wide inside a 390px phone and put a horizontal scrollbar on the whole
     document, which `visibility:hidden` does not take away once dismissed.
     `minmax(0, 1fr)` is also what makes the card's own `min(420px, 100%)` mean
     anything: a percentage against an indefinite track resolves to auto. */
  grid-template-columns: minmax(0, 1fr);
  padding: var(--gutter);
  background:
    radial-gradient(120% 90% at 50% 0%, var(--paper-warm), var(--paper-2) 60%, var(--paper-3));
  transition: opacity 1s var(--ease-soft), visibility 1s;
}
.gate.is-gone { opacity: 0; visibility: hidden; pointer-events: none; }
.gate__card {
  position: relative; width: min(420px, 100%); text-align: center;
  padding: clamp(30px, 7vw, 54px) clamp(22px, 6vw, 44px);
  background: var(--paper-warm);
  border: 1px solid rgba(217, 147, 44, .4);
  box-shadow: 0 24px 60px rgba(31, 51, 80, .14);
}
.gate__card::before {
  content: ""; position: absolute; inset: 9px;
  border: 1px solid rgba(168, 51, 47, .18); pointer-events: none;
}
.gate__kicker { margin-bottom: 12px; }
.gate__title { font-size: clamp(27px, 6.4vw, 40px); color: var(--indigo); }
.gate__names { margin-top: 10px; font-family: var(--body); font-size: clamp(17px, 2vw, 22px); color: var(--madder); }
.gate__btn {
  margin-top: clamp(22px, 4vw, 32px); cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 26px; border: 0; border-radius: 999px;
  background: var(--madder); color: var(--paper-warm);
  font-family: var(--util); font-weight: 500; font-size: 13px;
  letter-spacing: .16em; text-transform: uppercase;
  box-shadow: 0 12px 26px rgba(168, 51, 47, .3);
  transition: transform .4s var(--ease), box-shadow .4s var(--ease);
}
.gate__btn:hover { transform: translateY(-2px); box-shadow: 0 16px 32px rgba(168, 51, 47, .36); }
.gate__seal { width: 62px; height: 62px; margin: 0 auto clamp(16px, 3vw, 24px); }
.gate__seal svg { width: 100%; height: 100%; }

/* --------------------------------------------------------------------------
   3 · HERO — the loaf breaks
   -------------------------------------------------------------------------- */
.hero {
  position: relative; min-height: 100svh; min-height: 100vh;
  display: grid; place-items: center; padding: clamp(80px, 14vw, 130px) var(--gutter);
  /* Clipped: the suzani wash below is deliberately wider than the section. */
  overflow: hidden;
}
.hero__wash {
  position: absolute; left: 50%; top: 50%; width: 150%; aspect-ratio: 1;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(217, 147, 44, .17), transparent 62%);
  pointer-events: none;
}
.hero__inner { position: relative; z-index: 2; width: 100%; max-width: 680px; text-align: center; }

/* The loaf. Two halves of one round; each is the full circle, clipped to its
   side, so the stamp pattern lines up across the seam exactly as it would on
   a real non. */
.loaf { position: relative; width: min(74vw, 340px); aspect-ratio: 1; margin: 0 auto; }
.loaf__half {
  position: absolute; inset: 0;
  transition: transform 1.7s var(--ease), opacity 1.6s var(--ease-soft);
}
.loaf__half svg { width: 100%; height: 100%; overflow: visible; }
.loaf__half--l { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
.loaf__half--r { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
.loaf.is-broken .loaf__half--l { transform: translateX(-32%) rotate(-7deg); }
.loaf.is-broken .loaf__half--r { transform: translateX(32%) rotate(7deg); }
.loaf__crust { fill: #d9a961; stroke: #a9762f; stroke-width: 2; }
.loaf__inner { fill: #e7c58c; }
.loaf__stamp { fill: none; stroke: #a9762f; stroke-width: 1.6; opacity: .75; }
.loaf__seed  { fill: #7c5220; opacity: .5; }

/* The crumbs, one puff at the moment of breaking. */
.crumb {
  position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%;
  background: #c8a163; opacity: 0; pointer-events: none;
}
.loaf.is-broken .crumb { animation: crumb 1.5s var(--ease) forwards; }
@keyframes crumb {
  0%   { opacity: .9; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--cx)), calc(-50% + var(--cy))) scale(.4); }
}

/* The names live in the gap the break opens. */
.hero__names {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 3; width: 100%; pointer-events: none;
}
.hero__name {
  font-family: var(--display); font-size: clamp(27px, 7.4vw, 54px);
  color: var(--indigo); line-height: 1.05;
  opacity: 0; transform: translateY(16px);
  transition: opacity 1.1s var(--ease-soft) .7s, transform 1.2s var(--ease) .7s;
}
.hero__amp {
  font-family: var(--body); font-style: italic; font-size: clamp(17px, 3vw, 26px);
  color: var(--madder); margin: 2px 0;
  opacity: 0; transition: opacity 1.1s var(--ease-soft) .9s;
}
.loaf.is-broken ~ .hero__names .hero__name,
.loaf.is-broken ~ .hero__names .hero__amp { opacity: 1; transform: none; }
.hero__occasion { margin-top: clamp(26px, 5vw, 42px); }
.hero__date {
  margin-top: 10px; font-family: var(--util); font-weight: 300;
  font-size: clamp(11px, .5vw + 10px, 14px); letter-spacing: .24em;
  text-transform: uppercase; color: var(--ink-soft);
}
.hero__loafwrap { position: relative; }

/* --------------------------------------------------------------------------
   4 · THE BLESSING — the one section that never moves
   -------------------------------------------------------------------------- */
/* No .rv here, and no entrance of any kind. The Fatiha is read once, quietly,
   and the page's stillness at this point is the design. */
.bless { background: var(--indigo); color: var(--paper-warm); position: relative; overflow: hidden; }
.bless__wash {
  position: absolute; left: 50%; top: -30%; width: 130%; aspect-ratio: 1;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(232, 180, 92, .16), transparent 60%);
  pointer-events: none;
}
.bless__inner { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; text-align: center; }
.bless .eyebrow { color: var(--saffron-lt); }
.bless__text {
  margin-top: clamp(18px, 3.5vw, 30px);
  font-family: var(--body); font-style: italic; font-weight: 300;
  font-size: clamp(19px, 2.2vw + 14px, 30px); line-height: 1.55;
  color: var(--paper-warm);
}
.bless__by { margin-top: clamp(16px, 3vw, 26px); color: rgba(246, 239, 226, .6); font-family: var(--util); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }

/* --------------------------------------------------------------------------
   5 · DETAILS — three plain facts
   -------------------------------------------------------------------------- */
.facts { display: grid; gap: clamp(14px, 2.4vw, 22px); margin-top: clamp(26px, 5vw, 44px); }
.fact {
  padding: clamp(18px, 3.4vw, 28px);
  background: var(--paper-warm); border: 1px solid rgba(31, 51, 80, .1);
}
.fact__k { font-family: var(--util); font-weight: 500; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--madder); }
.fact__v { margin-top: 8px; font-family: var(--display); font-size: clamp(19px, 2.4vw, 26px); color: var(--indigo); }
.fact__n { margin-top: 6px; font-size: 15px; color: var(--ink-soft); font-style: italic; }
@media (min-width: 760px) { .facts { grid-template-columns: repeat(3, 1fr); } }

/* --------------------------------------------------------------------------
   6 · THE TWO FAMILIES — what a fotiha actually joins
   -------------------------------------------------------------------------- */
.fams { display: grid; gap: clamp(22px, 4vw, 34px); margin-top: clamp(28px, 5vw, 46px); }
.fam { text-align: center; padding: clamp(20px, 3.6vw, 32px) clamp(16px, 3vw, 26px); position: relative; }
.fam::before {
  content: ""; position: absolute; left: 50%; top: 0; width: 46px; height: 1px;
  transform: translateX(-50%); background: var(--saffron);
}
.fam__side { font-family: var(--util); font-weight: 500; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--madder); }
.fam__name { margin-top: 10px; font-family: var(--display); font-size: clamp(21px, 2.8vw, 28px); color: var(--indigo); }
.fam__who { margin-top: 8px; font-size: 15.5px; color: var(--ink-soft); }
@media (min-width: 720px) { .fams { grid-template-columns: 1fr 1fr; } }

/* --------------------------------------------------------------------------
   7 · DASTURXON — the cloth, and the table laying itself
   -------------------------------------------------------------------------- */
.dast { background: var(--paper-2); position: relative; overflow: hidden; }
.cloth {
  position: relative; margin-top: clamp(26px, 5vw, 44px);
  padding: clamp(20px, 4vw, 36px) clamp(16px, 3vw, 30px);
  background: var(--paper-warm);
  border-top: 3px solid var(--madder); border-bottom: 3px solid var(--madder);
}
/* The embroidered band along the top and bottom of the cloth. */
.cloth::before, .cloth::after {
  content: ""; position: absolute; left: 0; right: 0; height: 7px;
  background:
    repeating-linear-gradient(90deg,
      var(--saffron) 0 7px, transparent 7px 14px,
      var(--leaf) 14px 21px, transparent 21px 28px);
  opacity: .6;
}
.cloth::before { top: 5px; }
.cloth::after { bottom: 5px; }
.dish { display: flex; align-items: baseline; gap: clamp(12px, 2.4vw, 20px); padding: 13px 0; border-bottom: 1px dashed rgba(31, 51, 80, .16); }
.dish:last-child { border-bottom: 0; }
.dish__t { font-family: var(--util); font-weight: 500; font-size: 13px; letter-spacing: .12em; color: var(--madder); min-width: 62px; }
.dish__l { font-family: var(--body); font-size: 17.5px; color: var(--ink); }
/* Laid one after another. The delay is set inline per row by the script, so a
   cloth with four dishes and one with nine both read as a sequence. */
.dish { opacity: 0; transform: translateX(-10px); }
html:not(.js) .dish { opacity: 1; transform: none; }
.cloth.is-laid .dish {
  opacity: 1; transform: none;
  transition: opacity .8s var(--ease-soft), transform .9s var(--ease);
}

/* --------------------------------------------------------------------------
   8 · GALLERY
   -------------------------------------------------------------------------- */
.gal { display: grid; gap: 10px; margin-top: clamp(26px, 5vw, 44px); grid-template-columns: 1fr 1fr; }
.gal__it { position: relative; margin: 0; overflow: hidden; background: var(--paper-3); aspect-ratio: 3/4; cursor: pointer; }
.gal__it img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.gal__it:hover img { transform: scale(1.04); }
.gal__cap {
  position: absolute; inset: auto 0 0 0; padding: 26px 12px 10px;
  background: linear-gradient(transparent, rgba(31, 51, 80, .75));
  color: #fff; font-size: 13px; font-style: italic;
}
@media (min-width: 720px) { .gal { grid-template-columns: repeat(3, 1fr); } }

.lightbox { position: fixed; inset: 0; z-index: 190; display: none; place-items: center; padding: 20px; background: rgba(31, 51, 80, .93); }
.lightbox.is-shown { display: grid; }
.lightbox img { max-width: 100%; max-height: 82vh; object-fit: contain; }
.lightbox__cap { margin-top: 12px; color: rgba(255,255,255,.8); font-size: 14px; font-style: italic; text-align: center; }
.lightbox__x { position: absolute; top: 16px; right: 18px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; cursor: pointer; font-size: 20px; }

/* --------------------------------------------------------------------------
   9 · VENUE
   -------------------------------------------------------------------------- */
.venue { background: var(--indigo-2); color: var(--paper-warm); }
.venue .eyebrow { color: var(--saffron-lt); }
.venue__card { max-width: 560px; margin: clamp(24px, 4vw, 40px) auto 0; text-align: center; padding: clamp(22px, 4vw, 36px); border: 1px solid rgba(232, 180, 92, .35); }
.venue__name { font-family: var(--display); font-size: clamp(22px, 3vw, 32px); }
.venue__addr { margin-top: 10px; color: rgba(246, 239, 226, .75); font-size: 16px; }
.venue__map {
  display: inline-flex; margin-top: clamp(18px, 3vw, 26px); padding: 13px 24px;
  border: 1px solid var(--saffron); border-radius: 999px; color: var(--saffron-lt);
  text-decoration: none; font-family: var(--util); font-size: 12px;
  letter-spacing: .18em; text-transform: uppercase;
  transition: background .4s var(--ease-soft), color .4s var(--ease-soft);
}
.venue__map:hover { background: var(--saffron); color: var(--indigo); }

/* --------------------------------------------------------------------------
   10 · RSVP
   -------------------------------------------------------------------------- */
.rsvp__form { max-width: 520px; margin: clamp(24px, 4vw, 40px) auto 0; display: grid; gap: 16px; }
.f { display: grid; gap: 7px; }
.f > label { font-family: var(--util); font-weight: 500; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }
.f input, .f textarea {
  font-family: var(--body); font-size: 16.5px; color: var(--ink);
  padding: 13px 15px; background: var(--paper-warm);
  border: 1px solid rgba(31, 51, 80, .18); border-radius: 0; width: 100%;
}
.f input:focus, .f textarea:focus { outline: none; border-color: var(--saffron); box-shadow: 0 0 0 3px rgba(217, 147, 44, .16); }
.f.is-invalid input { border-color: var(--madder); }
.f textarea { resize: vertical; min-height: 92px; }
.att { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.att label {
  position: relative;
  display: block; text-align: center; cursor: pointer; padding: 13px 10px;
  border: 1px solid rgba(31, 51, 80, .18); background: var(--paper-warm);
  font-family: var(--util); font-size: 12.5px; letter-spacing: .08em;
  transition: border-color .3s var(--ease-soft), background .3s var(--ease-soft);
}
.att label.is-sel { border-color: var(--madder); background: rgba(168, 51, 47, .07); color: var(--madder); }
/* The radio covers its label rather than being parked off to one side.
   `position: absolute` with no positioned ancestor resolves against the INITIAL
   containing block, and `.f input` above sets `width: 100%` — so each invisible
   radio was laid out a whole viewport wide at its static position and dragged
   the document's scrollWidth to 1966px on a 1280px screen. Measured: 700px of
   horizontal scroll on desktop and 221px on a phone, from two controls nobody
   can see. The label is positioned, the box is pinned to it, and covering the
   label also means the press lands on the control itself. */
.att input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  margin: 0; opacity: 0; cursor: pointer;
}
.submit {
  margin-top: 4px; padding: 15px 20px; border: 0; cursor: pointer;
  background: var(--madder); color: var(--paper-warm);
  font-family: var(--util); font-weight: 500; font-size: 13px;
  letter-spacing: .18em; text-transform: uppercase;
  transition: transform .4s var(--ease), opacity .3s;
}
.submit:hover { transform: translateY(-2px); }
.submit:disabled { opacity: .55; cursor: default; transform: none; }
.err { display: none; color: var(--madder); font-size: 14px; text-align: center; }
.err.is-shown { display: block; }
.ok { display: none; text-align: center; }
.ok.is-shown { display: block; }
.ok__t { font-family: var(--display); font-size: clamp(21px, 3vw, 28px); color: var(--indigo); }
.ok__s { margin-top: 10px; color: var(--ink-soft); font-style: italic; }

/* --------------------------------------------------------------------------
   11 · FINAL + CHROME
   -------------------------------------------------------------------------- */
.final { background: var(--paper-3); text-align: center; }
.final__names { font-family: var(--display); font-size: clamp(24px, 4.6vw, 40px); color: var(--indigo); }
.final__date { margin-top: 12px; font-family: var(--util); font-weight: 300; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-faint); }

.langbar { position: fixed; top: 14px; right: 14px; z-index: 130; display: flex; gap: 5px; }
.langbar button {
  padding: 6px 11px; cursor: pointer; border: 1px solid rgba(31, 51, 80, .2);
  background: rgba(250, 245, 234, .88); color: var(--ink-soft);
  font-family: var(--util); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
}
.langbar button.is-on { background: var(--indigo); border-color: var(--indigo); color: var(--paper-warm); }
.musicbtn {
  position: fixed; bottom: 16px; right: 16px; z-index: 130; width: 46px; height: 46px;
  border-radius: 50%; cursor: pointer; display: none; place-items: center;
  border: 1px solid rgba(31, 51, 80, .2); background: rgba(250, 245, 234, .9); color: var(--indigo);
}
.musicbtn.is-on { display: grid; }
.musicbtn svg { width: 19px; height: 19px; }

.credit { background: var(--indigo); color: rgba(246, 239, 226, .75); text-align: center; padding: 26px var(--gutter); font-family: var(--util); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; }
.credit__links { display: flex; justify-content: center; gap: 14px; margin-top: 12px; }
.credit__links a { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(232, 180, 92, .4); color: var(--saffron-lt); }
.credit__links svg { width: 15px; height: 15px; }

/* A section the honoree switched off. */
.opt-off { display: none !important; }

/* --------------------------------------------------------------------------
   12 · REDUCED MOTION
   -------------------------------------------------------------------------- */
/* Everything arrives, nothing travels. The entrances are FAST-FORWARDED, never
   removed: these elements' visible state is the END of a transition over a
   base of `opacity: 0`, so switching the transition off strands them invisible.
   Same rule, same reason, as `.fx-still` on the kiosk. */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
  .rv, .dish { opacity: 1 !important; transform: none !important; }
  .hero__name, .hero__amp { opacity: 1 !important; transform: none !important; }
  .loaf__half--l { transform: translateX(-32%) rotate(-7deg) !important; }
  .loaf__half--r { transform: translateX(32%) rotate(7deg) !important; }
  .crumb { display: none !important; }
}
</style>
</head>
<body>

<!-- ======================================================================
     THE GATE — a sealed sheet. Dismissed by a press, never automatically.
     ====================================================================== -->
<div class="gate" id="gate">
  <div class="gate__card">
    <div class="gate__seal" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="29" fill="#a8332f"/>
        <circle cx="32" cy="32" r="23" fill="none" stroke="#e8b45c" stroke-width="1.2" opacity=".8"/>
        <!-- An eight-pointed star (rub el hizb), the ornament this whole page
             is built on: two squares, one turned. -->
        <rect x="18" y="18" width="28" height="28" fill="none" stroke="#f6efe2" stroke-width="1.6"/>
        <rect x="18" y="18" width="28" height="28" fill="none" stroke="#f6efe2" stroke-width="1.6" transform="rotate(45 32 32)"/>
        <circle cx="32" cy="32" r="4.5" fill="#e8b45c"/>
      </svg>
    </div>
    <p class="eyebrow gate__kicker" data-t="gateKicker"></p>
    <h1 class="gate__title" data-bind="gateTitle"></h1>
    <p class="gate__names" id="gateNames"></p>
    <button type="button" class="gate__btn" id="gateBtn" data-t="openInvitation"></button>
  </div>
</div>

<div class="langbar" id="langbar" aria-label="Language"></div>
<button type="button" class="musicbtn" id="musicBtn" aria-label="Music">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </svg>
</button>

<main>

<!-- ======================================================================
     1 · HERO — the loaf breaks and the names rise in the gap
     ====================================================================== -->
<header class="hero" id="top">
  <div class="hero__wash" aria-hidden="true"></div>
  <div class="hero__inner">
    <p class="eyebrow rv" data-bind="occasion"></p>

    <div class="hero__loafwrap" style="margin-top:clamp(22px,4vw,38px)">
      <div class="loaf" id="loaf" aria-hidden="true">
        <!-- Each half is the WHOLE round, clipped to its side, so the stamped
             pattern meets itself across the seam as it would on a real non. -->
        <div class="loaf__half loaf__half--l">
          <svg viewBox="0 0 200 200">
            <circle class="loaf__crust" cx="100" cy="100" r="96"/>
            <circle class="loaf__inner" cx="100" cy="100" r="62"/>
            <circle class="loaf__stamp" cx="100" cy="100" r="62"/>
            <circle class="loaf__stamp" cx="100" cy="100" r="40"/>
            <circle class="loaf__stamp" cx="100" cy="100" r="18"/>
            <path class="loaf__stamp" d="M100 38 L100 162 M38 100 L162 100 M56 56 L144 144 M144 56 L56 144"/>
            <circle class="loaf__seed" cx="100" cy="72" r="3"/>
            <circle class="loaf__seed" cx="100" cy="128" r="3"/>
            <circle class="loaf__seed" cx="72" cy="100" r="3"/>
            <circle class="loaf__seed" cx="128" cy="100" r="3"/>
          </svg>
        </div>
        <div class="loaf__half loaf__half--r">
          <svg viewBox="0 0 200 200">
            <circle class="loaf__crust" cx="100" cy="100" r="96"/>
            <circle class="loaf__inner" cx="100" cy="100" r="62"/>
            <circle class="loaf__stamp" cx="100" cy="100" r="62"/>
            <circle class="loaf__stamp" cx="100" cy="100" r="40"/>
            <circle class="loaf__stamp" cx="100" cy="100" r="18"/>
            <path class="loaf__stamp" d="M100 38 L100 162 M38 100 L162 100 M56 56 L144 144 M144 56 L56 144"/>
            <circle class="loaf__seed" cx="100" cy="72" r="3"/>
            <circle class="loaf__seed" cx="100" cy="128" r="3"/>
            <circle class="loaf__seed" cx="72" cy="100" r="3"/>
            <circle class="loaf__seed" cx="128" cy="100" r="3"/>
          </svg>
        </div>
      </div>

      <div class="hero__names">
        <p class="hero__name" data-bind="groomName"></p>
        <p class="hero__amp" data-t="andWord"></p>
        <p class="hero__name" data-bind="brideName"></p>
      </div>
    </div>

    <p class="lede hero__occasion rv" data-bind="heroLede"></p>
    <p class="hero__date rv" id="heroDate"></p>
  </div>
</header>

<!-- ======================================================================
     2 · THE BLESSING — no entrance, on purpose
     ====================================================================== -->
<section class="bless pad" id="blessing" data-opt="blessing" aria-labelledby="bless-h">
  <div class="bless__wash" aria-hidden="true"></div>
  <div class="wrap bless__inner">
    <p class="eyebrow" id="bless-h" data-t="theBlessing"></p>
    <p class="bless__text" data-bind="blessing"></p>
    <p class="bless__by" data-bind="blessingBy"></p>
  </div>
</section>

<!-- ======================================================================
     3 · DETAILS
     ====================================================================== -->
<section class="pad" id="details" data-opt="details" aria-labelledby="det-h">
  <div class="wrap mid">
    <p class="eyebrow rv" id="det-h" data-t="information"></p>
    <h2 class="rv" style="font-size:clamp(26px,4vw,44px);color:var(--indigo);margin-top:10px" data-bind="detailsTitle"></h2>
    <div class="facts">
      <div class="fact rv">
        <p class="fact__k" data-t="theDate"></p>
        <p class="fact__v" id="factDate"></p>
        <p class="fact__n" id="factWeekday"></p>
      </div>
      <div class="fact rv">
        <p class="fact__k" data-t="theStart"></p>
        <p class="fact__v" id="factTime"></p>
        <p class="fact__n" data-bind="timeNote"></p>
      </div>
      <div class="fact rv" data-hide-empty>
        <p class="fact__k" data-t="theAttire"></p>
        <p class="fact__v" data-bind="dressTitle"></p>
        <p class="fact__n" data-bind="dressNote"></p>
      </div>
    </div>
  </div>
</section>

<!-- ======================================================================
     4 · THE TWO FAMILIES — what a fotiha joins
     ====================================================================== -->
<section class="pad" id="families" data-opt="families" style="background:var(--paper-2)" aria-labelledby="fam-h">
  <div class="wrap mid">
    <p class="eyebrow rv" id="fam-h" data-t="theFamilies"></p>
    <h2 class="rv" style="font-size:clamp(26px,4vw,44px);color:var(--indigo);margin-top:10px" data-bind="familiesTitle"></h2>
    <p class="lede rv" style="margin-top:14px" data-bind="familiesLede"></p>
    <div class="fams">
      <div class="fam rv">
        <p class="fam__side" data-t="groomSide"></p>
        <p class="fam__name" data-bind="groomFamily"></p>
        <p class="fam__who" data-bind="groomParents"></p>
      </div>
      <div class="fam rv">
        <p class="fam__side" data-t="brideSide"></p>
        <p class="fam__name" data-bind="brideFamily"></p>
        <p class="fam__who" data-bind="brideParents"></p>
      </div>
    </div>
  </div>
</section>

<!-- ======================================================================
     5 · DASTURXON — the cloth, laid dish by dish
     ====================================================================== -->
<section class="dast pad" id="dasturxon" data-opt="dasturxon" aria-labelledby="dast-h">
  <div class="wrap mid">
    <p class="eyebrow rv" id="dast-h" data-t="theTable"></p>
    <h2 class="rv" style="font-size:clamp(26px,4vw,44px);color:var(--indigo);margin-top:10px" data-bind="dasturxonTitle"></h2>
    <p class="lede rv" style="margin-top:14px" data-bind="dasturxonLede"></p>
    <div class="cloth" id="cloth" style="text-align:left"></div>
  </div>
</section>

<!-- ======================================================================
     6 · GALLERY
     ====================================================================== -->
<section class="pad" id="gallery" data-opt="gallery" aria-labelledby="gal-h">
  <div class="wrap mid">
    <p class="eyebrow rv" id="gal-h" data-t="memories"></p>
    <h2 class="rv" style="font-size:clamp(26px,4vw,44px);color:var(--indigo);margin-top:10px" data-bind="galleryTitle"></h2>
    <div class="gal" id="gal"></div>
  </div>
</section>

<!-- ======================================================================
     7 · VENUE
     ====================================================================== -->
<section class="venue pad" id="venue" data-opt="venue" aria-labelledby="ven-h">
  <div class="wrap mid">
    <p class="eyebrow rv" id="ven-h" data-t="findUs"></p>
    <div class="venue__card rv">
      <p class="venue__name" data-bind="venueName"></p>
      <p class="venue__addr" data-bind="venueAddress"></p>
      <a class="venue__map" id="mapLink" href="#" target="_blank" rel="noopener" data-t="openMap"></a>
    </div>
  </div>
</section>

<!-- ======================================================================
     8 · RSVP
     ====================================================================== -->
<section class="pad" id="rsvp" data-opt="rsvp" style="background:var(--paper-2)" aria-labelledby="rsvp-h">
  <div class="wrap mid">
    <p class="eyebrow rv" id="rsvp-h" data-t="confirmation"></p>
    <h2 class="rv" style="font-size:clamp(26px,4vw,44px);color:var(--indigo);margin-top:10px" data-bind="rsvpTitle"></h2>
    <p class="lede rv" style="margin-top:14px" data-bind="rsvpLede"></p>

    <form class="rsvp__form rv" id="rsvpForm" novalidate>
      <div class="f">
        <label for="rsvpName" data-t="fullName"></label>
        <input type="text" id="rsvpName" name="name" autocomplete="name">
      </div>
      <div class="f">
        <label data-t="willYouAttend"></label>
        <div class="att" id="attRow">
          <label class="is-sel"><input type="radio" name="attend" value="yes" checked><span data-t="accept"></span></label>
          <label><input type="radio" name="attend" value="no"><span data-t="decline"></span></label>
        </div>
      </div>
      <div class="f" id="guestField">
        <label for="rsvpGuests" data-t="guestCount"></label>
        <input type="number" id="rsvpGuests" name="guests" min="1" max="20" value="1">
      </div>
      <div class="f">
        <label for="rsvpMsg" data-t="messageLabel"></label>
        <textarea id="rsvpMsg" name="message" rows="3"></textarea>
      </div>
      <p class="err" id="rsvpErr" data-t="sendFailed"></p>
      <button type="submit" class="submit" id="rsvpSubmit"><span data-t="send"></span></button>
    </form>

    <div class="ok" id="rsvpOk">
      <p class="ok__t" data-t="thankYou"></p>
      <p class="ok__s" id="okText"></p>
    </div>
  </div>
</section>

<!-- ======================================================================
     9 · FINAL
     ====================================================================== -->
<footer class="final pad">
  <div class="wrap">
    <p class="eyebrow rv" data-t="gladToSeeYou"></p>
    <div class="rule" aria-hidden="true"></div>
    <p class="final__names rv" id="finalNames"></p>
    <p class="final__date rv" id="finalDate"></p>
    <p class="lede rv" style="margin-top:clamp(18px,3vw,28px)" data-bind="closing"></p>
  </div>
</footer>

</main>

<div class="credit">
  <span data-t="developedBy"></span>
  <div class="credit__links" id="creditLinks"></div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lightbox__x" id="lightboxX" aria-label="Close">&times;</button>
  <div>
    <img id="lightboxImg" alt="">
    <p class="lightbox__cap" id="lightboxCap"></p>
  </div>
</div>

</body>
<script>
(function () {
  'use strict';

  /* ── What the host injected ──────────────────────────────────────────────
     The page runs on the opaque `about:srcdoc` origin, so everything it needs
     about the outside world arrives through these globals. */
  var CONFIG = window.__CONFIG__ || {};
  var LANGS  = (window.__LANGS__ && window.__LANGS__.length) ? window.__LANGS__ : ['uz'];
  var ADMIN_EDIT = !!window.__ADMIN_EDIT__;
  var lang = LANGS[0];
  var rsvpPending = null;

  /* ── Fixed chrome strings ────────────────────────────────────────────────
     Kept HERE and per language, not in the builder's i18n.ts: that file holds
     the editor's labels, and a guest's page must not depend on it. Uzbek is
     first because this design is read in uz nine times out of ten; the uz
     strings avoid apostrophes, as every uz string in this product does. */
  var UI = {
    uz: {
      gateKicker: 'Taklifnoma', openInvitation: 'Taklifnomani ochish',
      andWord: 'va', theBlessing: 'Fotiha',
      information: 'Malumot', theDate: 'Sana', theStart: 'Boshlanishi', theAttire: 'Kiyim',
      theFamilies: 'Ikki xonadon', groomSide: 'Kuyov tomondan', brideSide: 'Kelin tomondan',
      theTable: 'Dasturxon', memories: 'Xotiralar',
      findUs: 'Manzil', openMap: 'Xaritada ochish',
      confirmation: 'Tasdiqlash', fullName: 'Ism familiya', willYouAttend: 'Keladigmisiz?',
      accept: 'Albatta boraman', decline: 'Afsus, bora olmayman',
      guestCount: 'Mehmonlar soni (siz bilan)', messageLabel: 'Tilaklaringiz',
      send: 'Yuborish', sending: 'Yuborilmoqda...',
      sendFailed: 'Yuborilmadi. Yana bir marta urinib koring.', thankYou: 'Rahmat!',
      savedYes: 'Javobingiz saqlandi. Sizni kutamiz.',
      savedNo: 'Xabar berganingiz uchun rahmat. Sizni yetishmaydi.',
      gladToSeeYou: 'Sizni kutib qolamiz', close: 'Yopish',
      developedBy: 'V-INVITE tomonidan mehr bilan yaratilgan'
    },
    ru: {
      gateKicker: 'Приглашение', openInvitation: 'Открыть приглашение',
      andWord: 'и', theBlessing: 'Фотиха',
      information: 'Информация', theDate: 'Дата', theStart: 'Начало', theAttire: 'Дресс-код',
      theFamilies: 'Две семьи', groomSide: 'Со стороны жениха', brideSide: 'Со стороны невесты',
      theTable: 'Дастурхан', memories: 'Воспоминания',
      findUs: 'Адрес', openMap: 'Открыть карту',
      confirmation: 'Подтверждение', fullName: 'Имя и фамилия', willYouAttend: 'Придёте?',
      accept: 'Обязательно приду', decline: 'К сожалению, не смогу',
      guestCount: 'Количество гостей (включая вас)', messageLabel: 'Ваши пожелания',
      send: 'Отправить', sending: 'Отправляем…',
      sendFailed: 'Не удалось отправить. Попробуйте ещё раз.', thankYou: 'Спасибо!',
      savedYes: 'Ваш ответ сохранён. Будем рады видеть вас.',
      savedNo: 'Спасибо, что сообщили. Нам будет вас не хватать.',
      gladToSeeYou: 'Будем рады видеть вас', close: 'Закрыть',
      developedBy: 'Сделано с любовью в V-INVITE'
    },
    en: {
      gateKicker: 'Invitation', openInvitation: 'Open the invitation',
      andWord: 'and', theBlessing: 'The blessing',
      information: 'Information', theDate: 'Date', theStart: 'Begins', theAttire: 'Attire',
      theFamilies: 'Two families', groomSide: 'The groom’s family', brideSide: 'The bride’s family',
      theTable: 'The table', memories: 'Memories',
      findUs: 'Find us', openMap: 'Open map',
      confirmation: 'Confirmation', fullName: 'Full name', willYouAttend: 'Will you attend?',
      accept: 'Joyfully accept', decline: 'Regretfully decline',
      guestCount: 'Number of guests (including you)', messageLabel: 'Your wishes',
      send: 'Send', sending: 'Sending…',
      sendFailed: 'Could not send. Please try again.', thankYou: 'Thank you!',
      savedYes: 'Your response has been saved. We look forward to seeing you.',
      savedNo: 'Thank you for letting us know. You will be missed.',
      gladToSeeYou: 'We would be glad to see you', close: 'Close',
      developedBy: 'Developed with love by V-INVITE'
    }
  };

  var $  = function (s, c) { return (c || document).querySelector(s); };
  var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function t(key) { return (UI[lang] && UI[lang][key]) || UI.uz[key] || key; }
  function loc(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    return v[lang] || v.uz || v.ru || v.en || '';
  }
  function cfg(path, dflt) {
    var cur = CONFIG, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) {
      if (cur == null || typeof cur !== 'object') return dflt;
      cur = cur[parts[i]];
    }
    return cur == null ? dflt : cur;
  }

  /* ── Dates ───────────────────────────────────────────────────────────── */
  function eventDate() {
    var d = new Date(cfg('event.dateISO', '2027-04-11T12:00:00'));
    return isNaN(d.getTime()) ? new Date() : d;
  }
  function intlLocale() { return lang === 'uz' ? 'uz-Latn-UZ' : (lang === 'en' ? 'en-GB' : 'ru-RU'); }

  /* Uzbek month and weekday names, written out.
     `Intl.DateTimeFormat('uz-Latn-UZ', { month: 'long' })` is not reliable: in
     the ICU build Chrome ships it renders 11 April 2027 as "2027 M04 11", which
     is not a date anybody reads — and uz is this design's FIRST language. ru and
     en are left to Intl, which handles both properly. */
  var UZ_MONTHS = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun',
    'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
  var UZ_DAYS = ['yakshanba', 'dushanba', 'seshanba', 'chorshanba',
    'payshanba', 'juma', 'shanba'];

  function fmtDateLong() {
    var d = eventDate();
    if (lang === 'uz') return d.getDate() + ' ' + UZ_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    try {
      return new Intl.DateTimeFormat(intlLocale(), { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
    } catch (e) { return d.toDateString(); }
  }
  function fmtWeekday() {
    var d = eventDate();
    if (lang === 'uz') return UZ_DAYS[d.getDay()];
    try { return new Intl.DateTimeFormat(intlLocale(), { weekday: 'long' }).format(d); }
    catch (e) { return ''; }
  }
  function fmtTime() {
    var d = eventDate(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ── Text ────────────────────────────────────────────────────────────── */
  function bindTexts() {
    var groom = loc(cfg('couple.groom', ''));
    var bride = loc(cfg('couple.bride', ''));
    /* The groom's name comes first — the convention in this product's market,
       and it has to read the same way here, in the markup order above and in
       the tab title, or the invitation contradicts itself between the hero and
       the browser tab. */
    /* The separator is built FIRST so the join itself is one concatenation of
       the two names — `groom + sep + bride`. Spelling it inline as
       `groom + ' ' + t('andWord') + ' ' + bride` says the same thing but hides
       the pair behind three operators, which is not the shape the rest of this
       family reads (see templateNameOrder.test.ts). */
    var sep = ' ' + t('andWord') + ' ';
    var couple = (groom && bride) ? (groom + sep + bride) : (groom || bride);

    var map = {
      gateTitle:      loc(cfg('invite.gateTitle', '')),
      groomName:      groom,
      brideName:      bride,
      occasion:       loc(cfg('invite.occasion', '')),
      heroLede:       loc(cfg('invite.lede', '')),
      blessing:       loc(cfg('blessing.text', '')),
      blessingBy:     loc(cfg('blessing.by', '')),
      detailsTitle:   loc(cfg('details.title', '')),
      timeNote:       loc(cfg('event.timeNote', '')),
      dressTitle:     loc(cfg('dress.title', '')),
      dressNote:      loc(cfg('dress.note', '')),
      familiesTitle:  loc(cfg('families.title', '')),
      familiesLede:   loc(cfg('families.lede', '')),
      groomFamily:    loc(cfg('families.groomName', '')),
      groomParents:   loc(cfg('families.groomParents', '')),
      brideFamily:    loc(cfg('families.brideName', '')),
      brideParents:   loc(cfg('families.brideParents', '')),
      dasturxonTitle: loc(cfg('dasturxon.title', '')),
      dasturxonLede:  loc(cfg('dasturxon.lede', '')),
      galleryTitle:   loc(cfg('gallery_title', '')),
      venueName:      loc(cfg('venue.name', '')),
      venueAddress:   loc(cfg('venue.address', '')),
      rsvpTitle:      loc(cfg('rsvp.title', '')),
      rsvpLede:       loc(cfg('rsvp.lede', '')),
      closing:        loc(cfg('invite.closing', ''))
    };
    /* Read the attribute off each element rather than composing a selector per
       key: one pass instead of twenty-five, and the MARKUP is then the only
       place that attribute is ever written out. A selector assembled by hand
       puts the same text in the script, where anything scanning the file for
       bindings counts it as one more — and finds nothing filling it. */
    $$('[data-bind]').forEach(function (el) {
      var key = el.getAttribute('data-bind');
      if (Object.prototype.hasOwnProperty.call(map, key)) el.textContent = map[key];
    });
    $$('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });

    var gn = $('#gateNames'); if (gn) gn.textContent = couple;
    var fn = $('#finalNames'); if (fn) fn.textContent = couple;
    var fd = $('#factDate'); if (fd) fd.textContent = fmtDateLong();
    var fw = $('#factWeekday'); if (fw) fw.textContent = fmtWeekday();
    var ft = $('#factTime'); if (ft) ft.textContent = loc(cfg('event.timeText', '')) || fmtTime();
    var hd = $('#heroDate'); if (hd) hd.textContent = fmtDateLong();
    var fdt = $('#finalDate'); if (fdt) fdt.textContent = fmtDateLong() + '  ·  ' + fmtTime();
    var okt = $('#okText'); if (okt) okt.textContent = t('savedYes');

    document.title = couple || 'Fotiha';
    document.documentElement.setAttribute('lang', lang);

    var mapLink = $('#mapLink');
    if (mapLink) {
      var url = cfg('venue.mapUrl', '');
      mapLink.href = url || '#';
      mapLink.style.display = url ? '' : 'none';
    }
  }

  /* ── The dasturxon lays itself ────────────────────────────────────────── */
  function dishes() {
    var list = cfg('dasturxon.items', []);
    return Array.isArray(list) ? list.filter(function (d) { return d && (d.time || loc(d.label)); }) : [];
  }
  function renderCloth() {
    var host = $('#cloth');
    if (!host) return;
    var list = dishes();
    host.innerHTML = '';
    if (!list.length) { host.style.display = 'none'; return; }
    host.style.display = '';
    list.forEach(function (d, i) {
      var row = document.createElement('div');
      row.className = 'dish';
      /* The stagger is set per ROW rather than by a fixed set of nth-child
         rules, so a cloth of four dishes and one of nine both read as a
         sequence rather than the first four moving and the rest appearing. */
      row.style.transitionDelay = (i * 110) + 'ms';
      var time = document.createElement('span');
      time.className = 'dish__t';
      time.textContent = d.time || '';
      var label = document.createElement('span');
      label.className = 'dish__l';
      label.textContent = loc(d.label);
      row.appendChild(time);
      row.appendChild(label);
      host.appendChild(row);
    });
  }

  /* ── Gallery ─────────────────────────────────────────────────────────── */
  function galleryItems() {
    var list = cfg('gallery', []);
    return Array.isArray(list) ? list.filter(function (g) { return g && g.image; }) : [];
  }
  function renderGallery() {
    var host = $('#gal');
    if (!host) return;
    var list = galleryItems();
    host.innerHTML = '';
    if (!list.length) { host.style.display = 'none'; return; }
    host.style.display = '';
    list.forEach(function (item) {
      var fig = document.createElement('figure');
      fig.className = 'gal__it rv';
      var img = document.createElement('img');
      img.src = item.image;
      img.alt = loc(item.caption) || '';
      img.loading = 'lazy';
      fig.appendChild(img);
      var cap = loc(item.caption);
      if (cap) {
        var c = document.createElement('figcaption');
        c.className = 'gal__cap';
        c.textContent = cap;
        fig.appendChild(c);
      }
      fig.addEventListener('click', function () { openLightbox(item.image, cap); });
      host.appendChild(fig);
      observe(fig);
    });
  }
  function openLightbox(src, cap) {
    var box = $('#lightbox'); if (!box) return;
    $('#lightboxImg').src = src;
    $('#lightboxCap').textContent = cap || '';
    box.classList.add('is-shown');
  }
  function closeLightbox() { var b = $('#lightbox'); if (b) b.classList.remove('is-shown'); }

  /* ── Visibility switches ─────────────────────────────────────────────── */
  function applyVisibility() {
    var hidden = cfg('hidden', {}) || {};
    $$('[data-opt]').forEach(function (el) {
      var key = el.getAttribute('data-opt');
      if (hidden[key] === true) el.classList.add('opt-off');
      else el.classList.remove('opt-off');
    });
    /* A labelled empty box is worse than no box, so a tile whose every bound
       field is blank takes itself off the page. Opt-in: a tile without the
       attribute is never hidden. */
    $$('[data-hide-empty]').forEach(function (el) {
      var bound = $$('[data-bind]', el);
      if (!bound.length) return;
      var any = bound.some(function (b) { return (b.textContent || '').trim() !== ''; });
      el.style.display = any ? '' : 'none';
    });
  }

  /* ── Reveal on scroll ────────────────────────────────────────────────── */
  var observer = null;
  function initObserver() {
    /* No observer (the smoke test's linkedom, a very old browser) reveals
       everything at once rather than leaving a page of invisible sections. */
    if (typeof IntersectionObserver === 'undefined') { revealEverything(); return; }
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('is-in');
        if (e.target.id === 'cloth') e.target.classList.add('is-laid');
        observer.unobserve(e.target);
      });
    }, { threshold: 0, rootMargin: '0px 0px -8% 0px' });
    $$('.rv').forEach(observe);
    var cloth = $('#cloth'); if (cloth) observer.observe(cloth);
    window.addEventListener('scroll', sweep, { passive: true });
    window.addEventListener('resize', sweep);
    setTimeout(sweep, 700);
  }
  function observe(el) { if (observer) observer.observe(el); else el.classList.add('is-in'); }

  /* The safety net. An IntersectionObserver reports the state at the moment it
     delivers, so a JUMP — an anchor link, End, a restored scroll position —
     lands past a section without ever recording that it was crossed, and every
     row of the dasturxon stays at opacity 0. Measured: scrolling to the foot of
     the page in one step left the cloth permanently blank.
     So anything already above the fold is revealed outright, on scroll and once
     shortly after boot. The base state is invisible, which makes the reveal the
     only path to visible and therefore the thing that has to be fail-safe. */
  function sweep() {
    var fold = window.innerHeight || 800;
    $$('.rv').forEach(function (el) {
      if (el.classList.contains('is-in')) return;
      if (el.getBoundingClientRect().top < fold) el.classList.add('is-in');
    });
    var cloth = $('#cloth');
    if (cloth && !cloth.classList.contains('is-laid')
      && cloth.getBoundingClientRect().top < fold) cloth.classList.add('is-laid');
  }
  function revealEverything() {
    $$('.rv').forEach(function (el) { el.classList.add('is-in'); });
    var cloth = $('#cloth'); if (cloth) cloth.classList.add('is-laid');
    breakLoaf();
  }

  /* ── The loaf ────────────────────────────────────────────────────────── */
  var loafBroken = false;
  function breakLoaf() {
    var loaf = $('#loaf');
    if (!loaf || loafBroken) return;
    loafBroken = true;
    /* The crumbs are built here rather than written into the markup: they carry
       no meaning to a screen reader, and their scatter is random per visit. */
    for (var i = 0; i < 14; i++) {
      var c = document.createElement('span');
      c.className = 'crumb';
      c.style.setProperty('--cx', (Math.random() * 120 - 60).toFixed(0) + 'px');
      c.style.setProperty('--cy', (Math.random() * 90 + 20).toFixed(0) + 'px');
      c.style.animationDelay = (Math.random() * 220).toFixed(0) + 'ms';
      loaf.appendChild(c);
    }
    loaf.classList.add('is-broken');
  }

  /* ── The gate ────────────────────────────────────────────────────────── */
  var gate = $('#gate');
  var entered = false;
  function enter() {
    if (entered) return;
    entered = true;
    document.body.classList.add('is-entered');
    if (gate) gate.classList.add('is-gone');
    /* The loaf breaks a beat AFTER the sheet clears, so the guest is watching
       when it happens rather than arriving to two halves already apart. */
    if (reduced) breakLoaf();
    else setTimeout(breakLoaf, 520);
    startMusic();
  }
  var gateBtn = $('#gateBtn');
  if (gateBtn) gateBtn.addEventListener('click', enter);

  /* ── Music ───────────────────────────────────────────────────────────── */
  var audio = null, musicOff = false;
  var RETRY_EVENTS = ['pointerdown', 'touchstart', 'keydown', 'scroll'];
  function renderMusic() {
    var url = cfg('music.url', '');
    var btn = $('#musicBtn');
    if (!url) { if (btn) btn.classList.remove('is-on'); if (audio) { audio.pause(); audio = null; } return; }
    if (!audio) {
      audio = new Audio(url);
      audio.loop = true;
      audio.volume = 0.5;
    } else if (audio.src !== url) {
      audio.src = url;
    }
    if (btn) btn.classList.add('is-on');
  }
  function startMusic() {
    /* A deliberate pause outranks every automatic start, the gesture retry
       below included — without the flag, pressing pause and then scrolling
       starts the track again, because a scroll is one of the gestures. */
    if (!audio || musicOff) return;
    var p = audio.play();
    if (p && p.catch) p.catch(function () { armMusicRetry(); });
  }
  function armMusicRetry() {
    if (musicOff) return;
    var retry = function () {
      if (musicOff || !audio) return;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    };
    RETRY_EVENTS.forEach(function (ev) { window.addEventListener(ev, retry, { once: true }); });
  }
  var musicBtn = $('#musicBtn');
  if (musicBtn) musicBtn.addEventListener('click', function () {
    if (!audio) return;
    if (audio.paused) { musicOff = false; startMusic(); }
    else { musicOff = true; audio.pause(); }
  });

  /* ── Language bar ────────────────────────────────────────────────────── */
  function renderLangbar() {
    var bar = $('#langbar');
    if (!bar) return;
    bar.innerHTML = '';
    if (LANGS.length < 2) { bar.style.display = 'none'; return; }
    bar.style.display = '';
    LANGS.forEach(function (code) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = code;
      if (code === lang) b.className = 'is-on';
      b.addEventListener('click', function () { lang = code; renderAll(); });
      bar.appendChild(b);
    });
  }

  /* ── Platform credit ─────────────────────────────────────────────────── */
  var SVG_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.1 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6A2 2 0 0 1 22 16.9z"/></svg>';
  var SVG_TG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.8 18.6l.3-4.2 7.7-6.9c.3-.3-.1-.5-.5-.2L7.7 13.2 3.6 11.9c-.9-.3-.9-.9.2-1.3l16-6.2c.7-.3 1.4.2 1.1 1.3l-2.7 12.8c-.2.9-.7 1.1-1.5.7l-4.1-3-2 2c-.2.2-.4.4-.8.4z"/></svg>';
  var SVG_IG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>';
  function renderPlatformContacts() {
    var host = $('#creditLinks');
    if (!host) return;
    var c = window.__CONTACTS__ || {};
    host.innerHTML = '';
    var add = function (href, svg, label) {
      if (!href) return;
      var a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.setAttribute('aria-label', label);
      a.innerHTML = svg;
      host.appendChild(a);
    };
    add(c.phone ? 'tel:' + String(c.phone).replace(/\s/g, '') : '', SVG_PHONE, 'Phone');
    add(c.telegram ? (/^https?:/.test(c.telegram) ? c.telegram : 'https://t.me/' + String(c.telegram).replace(/^@/, '')) : '', SVG_TG, 'Telegram');
    add(c.instagram ? (/^https?:/.test(c.instagram) ? c.instagram : 'https://instagram.com/' + String(c.instagram).replace(/^@/, '')) : '', SVG_IG, 'Instagram');
  }

  /* ── RSVP ────────────────────────────────────────────────────────────── */
  var form = $('#rsvpForm'), success = $('#rsvpOk'), attendRow = $('#attRow');
  function attending() {
    var checked = form ? form.querySelector('input[name="attend"]:checked') : null;
    return !checked || checked.value === 'yes';
  }
  if (attendRow) attendRow.addEventListener('change', function (e) {
    $$('label', attendRow).forEach(function (l) { l.classList.remove('is-sel'); });
    var label = e.target && e.target.closest ? e.target.closest('label') : null;
    if (label) label.classList.add('is-sel');
    var guestField = $('#guestField');
    if (guestField) guestField.style.display = attending() ? '' : 'none';
  });

  if (form) form.addEventListener('submit', function (e) {
    if (e.preventDefault) e.preventDefault();
    var nameInput = $('#rsvpName');
    var field = nameInput && nameInput.closest ? nameInput.closest('.f') : null;
    var name = ((nameInput && nameInput.value) || '').trim();
    if (!name) {
      if (field) field.classList.add('is-invalid');
      if (nameInput && nameInput.focus) nameInput.focus();
      return;
    }
    if (field) field.classList.remove('is-invalid');
    $('#rsvpErr').classList.remove('is-shown');

    var yes = attending();
    var guestsInput = $('#rsvpGuests'), msgInput = $('#rsvpMsg');
    var payload = {
      name: name,
      attending: yes,
      guests: yes ? (parseInt(guestsInput && guestsInput.value, 10) || 1) : 0,
      message: ((msgInput && msgInput.value) || '').trim() || undefined
    };

    var btn = $('#rsvpSubmit'), label = btn ? btn.querySelector('span') : null;
    if (btn) btn.disabled = true;
    if (label) label.textContent = t('sending');

    new Promise(function (resolve, reject) {
      /* Nothing answers in the editor preview, so a silence of 2.5s is read as
         saved rather than shown to the guest as a failure they cannot act on. */
      var timer = setTimeout(function () { rsvpPending = null; resolve(); }, 2500);
      rsvpPending = { resolve: resolve, reject: reject, timer: timer };
      window.parent.postMessage({ type: 'vinvite:rsvp', payload: payload }, '*');
    }).then(function () {
      $('#okText').textContent = yes ? t('savedYes') : t('savedNo');
      form.style.display = 'none';
      if (success) success.classList.add('is-shown');
    }, function () {
      $('#rsvpErr').classList.add('is-shown');
    }).then(function () {
      if (btn) btn.disabled = false;
      if (label) label.textContent = t('send');
    });
  });

  var lbX = $('#lightboxX'); if (lbX) lbX.addEventListener('click', closeLightbox);
  var lbEl = $('#lightbox'); if (lbEl) lbEl.addEventListener('click', function (e) { if (e.target === lbEl) closeLightbox(); });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });

  /* ── Host bridge ─────────────────────────────────────────────────────── */
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'vinvite:rsvp-ok' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.resolve(); rsvpPending = null; }
    if (d.type === 'vinvite:rsvp-err' && rsvpPending) { clearTimeout(rsvpPending.timer); rsvpPending.reject(); rsvpPending = null; }
    if (d.type === 'vinvite:config') {
      if (d.contacts) window.__CONTACTS__ = d.contacts;
      CONFIG = d.config || CONFIG;
      if (d.languages && d.languages.length) {
        LANGS = d.languages;
        if (LANGS.indexOf(lang) === -1) lang = LANGS[0];
      }
      renderAll();
    }
    /* The editor jumped to a section being edited: the sheet has to be out of
       the way and every entrance already played, or the admin is looking at a
       blank page behind a closed gate. */
    if (d.type === 'vinvite:focus') {
      enter();
      revealEverything();
      var target = d.section ? document.getElementById(d.section) : null;
      if (!target || target.classList.contains('opt-off')) target = $('#details');
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    }
  });

  /* ── Full render (initial, and on every config / language change) ────── */
  function renderAll() {
    renderPlatformContacts();
    bindTexts();
    renderCloth();
    renderGallery();
    applyVisibility();
    renderMusic();
    renderLangbar();
  }

  /* ── Boot ────────────────────────────────────────────────────────────── */
  /* `js` gates the scroll lock and every "hidden until revealed" rule, so it
     goes on first and comes back off if anything below throws — a half-booted
     page must still be readable and scrollable. */
  document.documentElement.classList.add('js');
  try {
    renderAll();
    initObserver();
    /* Nobody should have to press through a sheet in the editor, and a guest
       who asked for no motion should not either. */
    if (reduced || ADMIN_EDIT) enter();
  } catch (err) {
    document.documentElement.classList.remove('js');
    document.body.classList.add('is-entered');
    if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
    if (window.console && console.error) console.error(err);
  }
})();
</script>
</html>
